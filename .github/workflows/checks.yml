name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/check_example.py
      - run: uv run python scripts/inspect_example.py --operation o_tag_v1 --json > /dev/null
      - run: uv run python -m pytest -q
