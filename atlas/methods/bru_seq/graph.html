ull, "rationale": null}]}, {"target": "state_property:labeled_cells:bru", "verdict": "supported", "action": "accept", "rationale": "The modification is placed on bru_rna at the RNA chain, not on all cellular material or on DNA. Bromouridine incorporation is the supported selection feature.", "evidence": [{"source_id": "bru-seq::diagram:asset_56e6acef7155b345668e5ca6", "locator": "Left two chromatin cartoons: nascent purple RNA, then orange Br-UTP stars on growing RNA; caption Label with bromouridine", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, Introduction b00006", "basis": "text", "support": "reported", "quote": "Bromouridine sequencing (Bru-Seq) and bromouridine-chase sequencing (BruChase-Seq) are based on the metabolic pulse-chase labeling of nascent RNA with bromouridine.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, Introduction b00007", "basis": "text", "support": "reported", "quote": "Following labeling, Bru-containing RNA is specifically captured using anti-BrdU antibodies conjugated to magnetic beads.", "bbox": null, "rationale": null}]}, {"target": "state_property:labeled_cells:identity", "verdict": "supported", "action": "accept", "rationale": "Self identity refers to pulse-labeled cells as a whole, which persist until collection/lysis; the RNA constituent is separately identified.", "evidence": [{"source_id": "bru-seq::diagram:asset_56e6acef7155b345668e5ca6", "locator": "Left two chromatin cartoons: nascent purple RNA, then orange Br-UTP stars on growing RNA; caption Label with bromouridine", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.2, b00021: synthesis pulse preceding optional chase", "basis": "text", "support": "reported", "quote": "Add back BrU-containing media to plate and incubate at 37 °C for 30 min.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.2, b00021: collection after labeling", "basis": "text", "support": "reported", "quote": "To collect cells (pooling plates as necessary), either add Trizol directly to the plate to lyse cells", "bbox": null, "rationale": null}]}, {"target": "state_property:labeled_cells:in_cells", "verdict": "supported", "action": "accept", "rationale": "The contained_in association names the bru_rna component and whole cellular preparation as its partner. Cell exposure followed by collection/lysis supports containment without asserting molecular binding to a cell.", "evidence": [{"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.2, b00021: synthesis pulse preceding optional chase", "basis": "text", "support": "reported", "quote": "Add back BrU-containing media to plate and incubate at 37 °C for 30 min.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.2, b00021: collection after labeling", "basis": "text", "support": "reported", "quote": "To collect cells (pooling plates as necessary), either add Trizol directly to the plate to lyse cells", "bbox": null, "rationale": null}]}, {"target": "state_property:labeled_cells:pulse", "verdict": "supported", "action": "accept", "rationale": "The time_window attribution names incorporated bromouridine in RNA as the physical carrier. The pulse and immediate-label biological readout establish the association; the property does not assert that an exact synthesis time can be read from an individual residue.", "evidence": [{"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.2, b00021: synthesis pulse preceding optional chase", "basis": "text", "support": "reported", "quote": "Add back BrU-containing media to plate and incubate at 37 °C for 30 min.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, Introduction b00006", "basis": "text", "support": "reported", "quote": "Bromouridine sequencing (Bru-Seq) and bromouridine-chase sequencing (BruChase-Seq) are based on the metabolic pulse-chase labeling of nascent RNA with bromouridine.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, abstract b00002: Bru-Seq versus separate chase assay", "basis": "text", "support": "reported", "quote": "In Bru-Seq, recently labeled RNAs are sequenced to reveal spans of nascent transcription in the genome.", "bbox": null, "rationale": null}]}, {"target": "state_property:labeled_cells:rna_identity", "verdict": "supported", "action": "accept", "rationale": "The bru_rna component is newly synthesized RNA containing bromouridine. Both the orange-starred nascent strand and metabolic-labeling statement support its identity.", "evidence": [{"source_id": "bru-seq::diagram:asset_56e6acef7155b345668e5ca6", "locator": "Left two chromatin cartoons: nascent purple RNA, then orange Br-UTP stars on growing RNA; caption Label with bromouridine", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, Introduction b00006", "basis": "text", "support": "reported", "quote": "Bromouridine sequencing (Bru-Seq) and bromouridine-chase sequencing (BruChase-Seq) are based on the metabolic pulse-chase labeling of nascent RNA with bromouridine.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.2, b00021: synthesis pulse preceding optional chase", "basis": "text", "support": "reported", "quote": "Add back BrU-containing media to plate and incubate at 37 °C for 30 min.", "bbox": null, "rationale": null}]}, {"target": "state_property:total_rna:bru", "verdict": "supported", "action": "accept", "rationale": "The bromouridine modification belongs specifically to bru_rna inside the total preparation, consistent with later anti-BrdU enrichment. It is not incorrectly assigned to every total-RNA molecule.", "evidence": [{"source_id": "bru-seq::paper:23973811", "locator": "Full text, Introduction b00006", "basis": "text", "support": "reported", "quote": "Bromouridine sequencing (Bru-Seq) and bromouridine-chase sequencing (BruChase-Seq) are based on the metabolic pulse-chase labeling of nascent RNA with bromouridine.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, Introduction b00007", "basis": "text", "support": "reported", "quote": "Following labeling, Bru-containing RNA is specifically captured using anti-BrdU antibodies conjugated to magnetic beads.", "bbox": null, "rationale": null}]}, {"target": "state_property:total_rna:identity", "verdict": "supported", "action": "accept", "rationale": "Self is the extracted RNA preparation prior to Bru-specific capture. The isolation and subsequent addition of that RNA to beads establish this boundary as total RNA containing labeled transcripts.", "evidence": [{"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.3, b00026: extracted RNA before Bru-RNA isolation", "basis": "text", "support": "reported", "quote": "Store RNA at –80 °C unless immediately proceeding to isolation of Bru-RNA.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.5, b00034: previously isolated RNA added to prepared beads", "basis": "text", "support": "reported", "quote": "Remove 90% of the sample (180 μl) and add to prepared beads.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, Introduction b00007", "basis": "text", "support": "reported", "quote": "Following labeling, Bru-containing RNA is specifically captured using anti-BrdU antibodies conjugated to magnetic beads.", "bbox": null, "rationale": null}]}, {"target": "state_property:total_rna:preparation", "verdict": "supported", "action": "accept", "rationale": "The extraction context is before deliberate library fragmentation. The primary isolation/capture/elution sections precede Fragment mRNA in library preparation, so the property agrees with the corrected route rather than retaining the superseded diagram order.", "evidence": [{"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.3, b00026: extracted RNA before Bru-RNA isolation", "basis": "text", "support": "reported", "quote": "Store RNA at –80 °C unless immediately proceeding to isolation of Bru-RNA.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.5, b00034: previously isolated RNA added to prepared beads", "basis": "text", "support": "reported", "quote": "Remove 90% of the sample (180 μl) and add to prepared beads.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.5, b00036", "basis": "text", "support": "reported", "quote": "Resuspend the bead pellet in 40 μl DEPC-water and incubate for 10 min in a 95 °C heat block to elute Bru-RNA from the beads.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.6 opening, b00039-b00042: follows elution section 2.2.5", "basis": "text", "support": "reported", "quote": "[b00039] 2.2.6. cDNA library preparation\n\n[b00040] Start with at least 250 ng Bru-RNA\n\n[b00041] Unless otherwise stated, use a Thermomixer R (Eppendorf) for all incubations.\n\n[b00042] 2.2.6.1. Fragment mRNA", "bbox": null, "rationale": null}]}, {"target": "state_property:total_rna:rna_identity", "verdict": "supported", "action": "accept", "rationale": "The constituent identity is Bru-containing RNA within extracted RNA, consistent with selecting it from the isolated sample. No independent pure fraction is invented at this point.", "evidence": [{"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.3, b00026: extracted RNA before Bru-RNA isolation", "basis": "text", "support": "reported", "quote": "Store RNA at –80 °C unless immediately proceeding to isolation of Bru-RNA.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, Introduction b00007", "basis": "text", "support": "reported", "quote": "Following labeling, Bru-containing RNA is specifically captured using anti-BrdU antibodies conjugated to magnetic beads.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.5, b00034: previously isolated RNA added to prepared beads", "basis": "text", "support": "reported", "quote": "Remove 90% of the sample (180 μl) and add to prepared beads.", "bbox": null, "rationale": null}]}, {"target": "unknown:black_terminal_symbols", "verdict": "supported", "action": "accept", "rationale": "Black terminal squares are visible on nascent and pre-capture purple RNA, but neither attached image gives them an end-group legend. The neighboring GRO row mentions cap removal, which does not establish cap chemistry on this scoped Bru-Seq route. Retaining a targeted, nonblocking Unknown against total_rna is appropriate: neither antibody recognition of the incorporated label nor the primary-resolved post-elution library interface depends on assigning those squares. No guessed terminal group is introduced.", "evidence": [{"source_id": "bru-seq::diagram:asset_56e6acef7155b345668e5ca6", "locator": "Isolate and hydrolyze block before bead capture: mixed short purple strands, some with orange stars, one with a black terminal square", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "bru-seq::diagram:asset_56e6acef7155b345668e5ca6", "locator": "Left two chromatin cartoons: nascent purple RNA, then orange Br-UTP stars on growing RNA; caption Label with bromouridine", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "poster_b5ddc893d6ee38f5ee0b61cb::diagram:poster_crop_3e484c986803686f3f062881", "locator": "Complete middle row headed Bru-Seq, between the separate GRO-seq/BRIC-Seq and BruChase-Seq rows; chemical drawings are in the separate right margin", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, Introduction b00007", "basis": "text", "support": "reported", "quote": "Following labeling, Bru-containing RNA is specifically captured using anti-BrdU antibodies conjugated to magnetic beads.", "bbox": null, "rationale": null}, {"source_id": "bru-seq::paper:23973811", "locator": "Full text, section 2.2.6 opening, b00039-b00042: follows elution section 2.2.5", "basis": "text", "support": "reported", "quote": "[b00039] 2.2.6. cDNA library preparation\n\n[b00040] Start with at least 250 ng Bru-RNA\n\n[b00041] Unless otherwise stated, use a Thermomixer R (Eppendorf) for all incubations.\n\n[b00042] 2.2.6.1. Fragment mRNA", "bbox": null, "rationale": null}]}]}, "sources": {"bru-seq::card:bru-seq": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/bru-seq.html", "title": "Bru-Seq", "text_characters": 2150, "text_sha256": "29dca4d1bf9823ec3962cc3967d01109affb149b3cf0b9275dcc3b680b8cceb7"}, "bru-seq::collection:rna:page:32": {"kind": "text", "content_level": "catalogue", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102/sources_03/collection_pages/rna_032.txt", "sha256": "e91efa54e842cb3822c4d69065a1420b923297d7a51e4c9183cd0eb7f7f14a5a", "title": "Illumina RNA collection, PDF page 32", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/products/research_reviews/rna-sequencing-methods-review-web.pdf", "ass path": ["Transcriptome", "RNA Transcription"], "description_verbatim": "Bru-Seq maps nascent RNA transcripts using bromouridine tagging. Active RNAPII synthesizes RNA in the presence of Br-UTP. Tagged RNA transcripts are immunoseparated from total RNA using magnetic beads coated with anti-BrdU antibodies. The captured RNA transcripts are eluted and fragmented before synthesis of cDNA strands via RT and PCR amplification. The resultant cDNA strands are prepared for sequencing using an Illumina TruSeq RNA Library Prep Kit.", "advantages_verbatim": ["Maps sequences of nascent RNA transcripts and determines relative transcription rate", "Detects lncRNAs1", "Detects transcription anywhere on the genome"], "limitations_verbatim": ["Limited to cell cultures and other artificial systems, due to the requirement for incubation in the presence of labeled nucleotides"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "Bru-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "Bru-Seq maps nascent RNA transcripts using bromouridine tagging. Active RNAPII synthesizes RNA in the presence of Br-UTP. Tagged RNA transcripts are immunoseparated from total RNA using magnetic beads coated with anti-BrdU antibodies. The captured RNA transcripts are eluted and fragmented before synthesis of cDNA strands via RT and PCR amplification. The resultant cDNA strands are prepared for sequencing using an Illumina TruSeq RNA Library Prep Kit.\nPros:\nMaps sequences of nascent RNA transcripts and determines relative transcription rate\nDetects lncRNAs1\nDetects transcription anywhere on the genome\nCons:\nLimited to cell cultures and other artificial systems, due to the requirement for incubation in the presence of labeled nucleotides"}, {"source_locator": "jcr:content/par/text_2/text", "text": "Bru-Seq: Paulsen M. T., Veloso A., Prasad J., Bedi K., Ljungman E. A., et al. (2013) Coordinated regulati function renderRecord(r) {
