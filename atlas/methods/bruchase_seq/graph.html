′ cleavage, and antisense transcription is prevalent. Additionally, most promoters have an engaged polymerase upstream and in an orientation opposite to the annotated gene. This div", "bbox": null, "rationale": "The opening summary describes nuclear run-on GRO-seq. It does not describe the assigned living-cell BruChase-Seq implementation. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_22369889", "source_id": "poster_937ad8b14068a96178fa4059::paper:22369889", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:22369889", "locator": "[b00003] opening summary only (registered full text; no protocol claim made)", "basis": "text", "support": "reported", "quote": "Mammalian genomes produce huge numbers of noncoding RNAs (ncRNAs). However, the functions of most ncRNAs are unclear, and novel techniques that can distinguish functional ncRNAs are needed. Studies of mRNAs have revealed that the half-life of each mRNA is closely related to its physiological function, raising the possibility that the RNA stability of an ncRNA reflects its function. In this study, we first determined the half-lives of 11,052 mRNAs and 1418 ncRNAs in HeLa Tet-off (TO) cells by developing a novel genome-wide method, which we named 5′-bromo-uridine immunoprecipitation chase–deep sequencing analysis (BRIC-seq). This method involve", "bbox": null, "rationale": "The opening summary explicitly describes BRIC-seq, a separately named RNA-stability assay. Shared bromouridine use does not establish equivalence or membership in the assigned target. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_22986266", "source_id": "poster_937ad8b14068a96178fa4059::paper:22986266", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:22986266", "locator": "[b00002] opening summary only (registered full text; no protocol claim made)", "basis": "text", "support": "reported", "quote": "Recent years have witnessed a sea change in our understanding of transcription regulation: whereas traditional models focused solely on the events that brought RNA polymerase II (Pol II) to a gene promoter to initiate RNA synthesis, emerging evidence points to the pausing of Pol II during early elongation as a widespread regulatory mechanism in higher eukaryotes. Current data indicate that pausing is particularly enriched at genes in signal-responsive pathways. Here the evidence for pausing of Pol II from recent high-throughput studies will be discussed, as well as the potential interconnected functions of promoter-proximally paused Pol II.", "bbox": null, "rationale": "The inspected opening is a review of promoter-proximal pausing, not a BruChase-Seq protocol. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_25693130", "source_id": "poster_937ad8b14068a96178fa4059::paper:25693130", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:25693130", "locator": "Registered abstract only (no full-text evidence used)", "basis": "text", "support": "reported", "quote": "Abstract: Recent advances in sequencing techniques that measure nascent transcripts and that reveal the positioning of RNA polymerase II (Pol II) have shown that the pausing of Pol II in promoter-proximal regions and its release to initiate a phase of productive elongation are key steps in transcription regulation. Moreover, after the release of Pol II from the promoter-proximal region, elongation rates are highly dynamic throughout the transcription of a gene, and vary on a gene-by-gene basis. Interestingly, Pol II elongation rates affect co-transcriptional processes such as splicing, termination and genome stability. Increasing numbers of f", "bbox": null, "rationale": "The registered abstract reviews RNA polymerase II elongation; it does not establish the assigned pulse-chase workflow. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_26499213", "source_id": "poster_937ad8b14068a96178fa4059::paper:26499213", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:26499213", "locator": "Registered abstract only (no full-text evidence used)", "basis": "text", "support": "reported", "quote": "Abstract: The majority of the human genome consists of non-coding regions that have been called junk DNA. However, recent studies have unveiled that these regions contain cis-regulatory elements, such as promoters, enhancers, silencers, insulators, etc. These regulatory elements can play crucial roles in controlling gene expressions in specific cell types, conditions, and developmental stages. Disruption to these regions could contribute to phenotype changes. Precisely identifying regulatory elements is key to deciphering the mechanisms underlying transcriptional regulation. Cis-regulatory events are complex processes that involve chromatin a", "bbox": null, "rationale": "The registered abstract reviews machine learning for cis-regulatory element identification; it does not identify the assigned workflow. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_26751173", "source_id": "poster_937ad8b14068a96178fa4059::paper:26751173", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:26751173", "locator": "Registered abstract only (no full-text evidence used)", "basis": "text", "support": "reported", "quote": "Abstract: Systematic identification of noncoding regulatory elements has, to date, mainly relied on large-scale reporter assays that do not reproduce endogenous conditions. We present two distinct CRISPR-Cas9 genetic screens to identify and characterize functional enhancers in their native context. Our strategy is to target Cas9 to transcription factor binding sites in enhancer regions. We identified several functional enhancer elements and characterized the role of two of them in mediating p53 (TP53) and ERα (ESR1) gene regulation. Moreover, we show that a genomic CRISPR-Cas9 tiling screen can precisely map functional domains within enhancer", "bbox": null, "rationale": "The registered abstract describes CRISPR-Cas9 enhancer screens, outside the assigned assay. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_26751768", "source_id": "poster_937ad8b14068a96178fa4059::paper:26751768", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:26751768", "locator": "Registered abstract only (no full-text evidence used)", "basis": "text", "support": "reported", "quote": "Abstract: Despite intense investigation, human replication origins and termini remain elusive. Existing data have shown strong discrepancies. Here we sequenced highly purified Okazaki fragments from two cell types and, for the first time, quantitated replication fork directionality and delineated initiation and termination zones genome-wide. Replication initiates stochastically, primarily within non-transcribed, broad (up to 150 kb) zones that often abut transcribed genes, and terminates dispersively between them. Replication fork progression is significantly co-oriented with the transcription. Initiation and termination zones are frequently", "bbox": null, "rationale": "The registered abstract describes sequencing Okazaki fragments to map DNA replication, outside the assigned assay. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_26780995", "source_id": "poster_937ad8b14068a96178fa4059::paper:26780995", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:26780995", "locator": "Registered abstract only (no full-text evidence used)", "basis": "text", "support": "reported", "quote": "Abstract: Enhancers are distal cis-regulatory DNA elements that increase the expression of target genes. Various experimental and computational approaches including chromatin signature profiling have been developed to predict enhancers on a genome-wide scale, although each method has its advantages and disadvantages. Here we overview an emerging method to identify transcribed enhancers at exceedingly high nucleotide resolution based on enhancer RNA transcripts captured by Cap Analysis of Gene Expression (CAGE) technology. We further argue that disease-causative regulatory mutations at enhancers are increasingly recognized, emphasizing the imp", "bbox": null, "rationale": "The registered abstract discusses enhancer identification by CAGE, outside the assigned assay. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_26814966", "source_id": "poster_937ad8b14068a96178fa4059::paper:26814966", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:26814966", "locator": "Registered abstract only (no full-text evidence used)", "basis": "text", "support": "reported", "quote": "Abstract: ATP-dependent chromatin remodellers allow access to DNA for transcription factors and the general transcription machinery, but whether mammalian chromatin remodellers target specific nucleosomes to regulate transcription is unclear. Here we present genome-wide remodeller-nucleosome interaction profiles for the chromatin remodellers Chd1, Chd2, Chd4, Chd6, Chd8, Chd9, Brg1 and Ep400 in mouse embryonic stem (ES) cells. These remodellers bind one or both full nucleosomes that flank micrococcal nuclease (MNase)-defined nucleosome-free promoter regions (NFRs), where they separate divergent transcription. Surprisingly, large CpG-rich NFRs", "bbox": null, "rationale": "The registered abstract describes remodeller-nucleosome interaction profiles, without assigning this BruChase-Seq workflow. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_26844429", "source_id": "poster_937ad8b14068a96178fa4059::paper:26844429", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:26844429", "locator": "[b00002] opening summary only (registered full text; no protocol claim made)", "basis": "text", "support": "reported", "quote": "The transcription cycle of RNA polymerase II (Pol II) correlates with changes to the phosphorylation state of its large subunit C-terminal domain (CTD). We recently developed Native Elongation Transcript sequencing using mammalian cells (mNET-seq), which generates single-nucleotide–resolution genome-wide profiles of nascent RNA and co-transcriptional RNA processing that are associated with different CTD phosphorylation states. Here we provide a detailed protocol for mNET-seq. First, Pol II elongation complexes are isolated with specific phospho-CTD antibodies from chromatin solubilized by micrococcal nuclease digestion. Next, RNA derived from", "bbox": null, "rationale": "The inspected full-text opening summary describes mNET-seq and phospho-CTD antibody isolation of elongation complexes, not the assigned BruChase-Seq workflow. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_26873106", "source_id": "poster_937ad8b14068a96178fa4059::paper:26873106", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:26873106", "locator": "Registered abstract only (no full-text evidence used)", "basis": "text", "support": "reported", "quote": "Abstract: High-throughput, genome-wide translocation sequencing (HTGTS) studies of activated B cells have revealed that DNA double-strand breaks (DSBs) capable of translocating to defined bait DSBs are enriched around the transcription start sites (TSSs) of active genes. We used the HTGTS approach to investigate whether a similar phenomenon occurs in primary neural stem/progenitor cells (NSPCs). We report that breakpoint junctions indeed are enriched around TSSs that were determined to be active by global run-on sequencing analyses of NSPCs. Comparative analyses of transcription profiles in NSPCs and B cells revealed that the great majority o", "bbox": null, "rationale": "The registered abstract describes HTGTS and global run-on transcription analysis, without establishing this BruChase-Seq implementation. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_26878240", "source_id": "poster_937ad8b14068a96178fa4059::paper:26878240", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:26878240", "locator": "Registered abstract only (no full-text evidence used)", "basis": "text", "support": "reported", "quote": "Abstract: RNA functions at enhancers remain mysterious. Here we show that the 7SK small nuclear RNA (snRNA) inhibits enhancer transcription by modulating nucleosome position. 7SK occupies enhancers and super enhancers genome wide in mouse and human cells, and it is required to limit enhancer-RNA initiation and synthesis in a manner distinct from promoter pausing. Clustered elements at super enhancers uniquely require 7SK to prevent convergent transcription and DNA-damage signaling. 7SK physically interacts with the BAF chromatin-remodeling complex, recruits BAF to enhancers and inhibits enhancer transcription by modulating chromatin structure", "bbox": null, "rationale": "The registered abstract describes the 7SK-BAF axis at enhancers, without identifying this pulse-chase workflow. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_26914315", "source_id": "poster_937ad8b14068a96178fa4059::paper:26914315", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:26914315", "locator": "Registered abstract only (no full-text evidence used)", "basis": "text", "support": "reported", "quote": "Abstract: Mammalian cell nuclei contain three RNA polymerases (RNAP I, RNAP II and RNAP III), which transcribe different gene subsets, and whose active forms are contained in supramolecular complexes known as 'transcription factories.' These complexes are difficult to isolate because they are embedded in the 3D structure of the nucleus. Factories exchange components with the soluble nucleoplasmic pool over time as gene expression programs change during development or disease. Analysis of their content can provide information on the nascent transcriptome and its regulators. Here we describe a protocol for the isolation of large factory fragmen", "bbox": null, "rationale": "The registered abstract describes isolation of active transcription-factory complexes, outside the assigned assay. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_27010758", "source_id": "poster_937ad8b14068a96178fa4059::paper:27010758", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:27010758", "locator": "[b00002] opening summary only (registered full text; no protocol claim made)", "basis": "text", "support": "reported", "quote": "Many features of gene transcription in human cells remain unclear, mainly due to a lack of quantitative approaches to follow genome transcription with nucleotide precision in vivo. Here we present a robust genome-wide approach to study RNA polymerase (Pol) II-mediated transcription in human cells at single-nucleotide resolution by native elongating transcript sequencing (NET-seq). Elongating RNA polymerase and the associated nascent RNA is prepared by cell fractionation, avoiding immunoprecipitation or RNA labeling. The 3′-ends of nascent RNAs are captured through barcode linker ligation and converted into a DNA sequencing library. The identi", "bbox": null, "rationale": "The inspected full-text opening summary describes human NET-seq without RNA labeling; it is not a description of the assigned BruChase-Seq workflow. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_27245778", "source_id": "poster_937ad8b14068a96178fa4059::paper:27245778", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:27245778", "locator": "Registered abstract only (no full-text evidence used)", "basis": "text", "support": "reported", "quote": "BACKGROUND: IL-4-driven alternative macrophage activation and proliferation are characteristic features of both antihelminthic immune responses and wound healing in contrast to classical macrophage activation, which primarily occurs during inflammatory responses. The signaling pathways defining the genome-wide microRNA expression profile as well as the cellular functions controlled by microRNAs during alternative macrophage activation are largely unknown. Hence, in the current work we examined the regulation and function of IL-4-regulated microRNAs in human and mouse alternative macrophage activation.\n\nMETHODS: We utilized microarray-based mi", "bbox": null, "rationale": "The inspected abstract describes IL-4/STAT6 regulation investigated with microarrays, small RNA-seq and ChIP; it does not establish a BruChase-Seq member association. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": "poster_candidate_27259512", "source_id": "poster_937ad8b14068a96178fa4059::paper:27259512", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_937ad8b14068a96178fa4059::paper:27259512", "locator": "Registered abstract only (no full-text evidence used)", "basis": "text", "support": "reported", "quote": "BACKGROUND: For many genes, RNA polymerase II stably pauses before transitioning to productive elongation. Although polymerase II pausing has been shown to be a mechanism for regulating transcriptional activation, the extent to which it is involved in control of mammalian gene expression and its relationship to chromatin structure remain poorly understood.\n\nRESULTS: Here, we analyze 85 RNA polymerase II chromatin immunoprecipitation (ChIP)-sequencing experiments from 35 different murine and human samples, as well as related genome-wide datasets, to gain new insights into the relationship between polymerase II pausing and gene regulation. Acro", "bbox": null, "rationale": "The registered abstract describes a multi-dataset polymerase pausing analysis, without establishing the assigned implementation. This was an unverified poster-wide candidate lead; no new method scope or architecture is admitted from it."}]}, {"id": ote": "Bromouridine sequencing (Bru-Seq) and bromouridine-chase sequencing (BruChase-Seq) are based on the metabolic pulse-chase labeling of nascent RNA with bromouridine.", "bbox": null, "rationale": null}]}, {"target": "state_property:cdna_library:cohort_representation", "verdict": "supported", "action": "accept", "rationale": "The time-window attribution is correctly placed on the DNA library and identifies the actual carrier as RNA-derived sequence inserts with bulk sample provenance. The claim is representational: selection of labeled RNA precedes cDNA synthesis; it does not transfer the RNA bromouridine moiety to DNA. The original cohort is the pulse population surviving the chase.", "evidence": [{"source_id": "bruchase-seq::paper:23973811", "locator": "[b00002] registered primary full text", "basis": "text", "support": "reported", "quote": "In BruChase-Seq, cells are chased in uridine for different periods of time following Bru-labeling, allowing for the isolation of RNA populations of specific ages.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00007] registered primary full text", "basis": "text", "support": "reported", "quote": "Following labeling, Bru-containing RNA is specifically captured using anti-BrdU antibodies conjugated to magnetic beads. cDNA libraries are then produced from the isolated Bru-RNA and subjected to deep sequencing [14].", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::diagram:asset_23278f825e0f74bc17183bef", "locator": "Rightmost Single strand library prep arrow leads from red-starred RNA to blue lines labeled cDNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.88, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00007], [b00047], [b00059] in conjunction with the diagram’s RNA-to-cDNA transition", "basis": "text", "support": "inferred", "quote": "cDNA libraries are then produced from the isolated Bru-RNA and subjected to deep sequencing [14].", "bbox": null, "rationale": "The RNA is selected through its bromouridine, then serves as the source for cDNA synthesis. Together with the starred RNA and unstarred blue cDNA endpoint, this supports sequence and sample provenance in DNA rather than transfer of the RNA bromouridine moiety to the DNA reporter."}]}, {"target": "state_property:cdna_library:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity correctly identifies a cDNA library produced from captured and eluted aged-cohort RNA. Primary cDNA preparation and the drawn blue cDNA endpoint support this material identity.", "evidence": [{"source_id": "bruchase-seq::diagram:asset_23278f825e0f74bc17183bef", "locator": "Rightmost Single strand library prep arrow leads from red-starred RNA to blue lines labeled cDNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.88, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00007] registered primary full text", "basis": "text", "support": "reported", "quote": "Following labeling, Bru-containing RNA is specifically captured using anti-BrdU antibodies conjugated to magnetic beads. cDNA libraries are then produced from the isolated Bru-RNA and subjected to deep sequencing [14].", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00047] registered primary full text", "basis": "text", "support": "reported", "quote": "2.2.6.2. Synthesize first strand cDNA (for strand specificity)", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00036] registered primary full text", "basis": "text", "support": "reported", "quote": "Resuspend the bead pellet in 40 μl DEPC-water and incubate for 10 min in a 95 °C heat block to elute Bru-RNA from the beads.", "bbox": null, "rationale": null}]}, {"target": "state_property:cells:identity", "verdict": "supported", "action": "accept", "rationale": "The assertion belongs to self and accurately identifies cultured cells containing nascent RNA. The primary establishes cells as the labeling preparation; the figure establishes ongoing transcription.", "evidence": [{"source_id": "bruchase-seq::diagram:asset_23278f825e0f74bc17183bef", "locator": "Left overview labeled Nascent RNA and Bromouridine pulse-chase and sequencing (BruChase-Seq): RNA at a transcription complex", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 0.185, 1.0], "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00017] registered primary full text", "basis": "text", "support": "reported", "quote": "Cells are grown to approximately 80% confluency before the addition of bromouridine.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00006] registered primary full text", "basis": "text", "support": "reported", "quote": "Bromouridine sequencing (Bru-Seq) and bromouridine-chase sequencing (BruChase-Seq) are based on the metabolic pulse-chase labeling of nascent RNA with bromouridine.", "bbox": null, "rationale": null}]}, {"target": "state_property:chase_cells:age_cohort", "verdict": "supported", "action": "accept", "rationale": "The attribution belongs to surviving_rna, with that RNA as the carrier of prior pulse origin and later collection. The primary explicitly describes isolatable populations of specific ages after uridine chase.", "evidence": [{"source_id": "bruchase-seq::paper:23973811", "locator": "[b00002] registered primary full text", "basis": "text", "support": "reported", "quote": "In BruChase-Seq, cells are chased in uridine for different periods of time following Bru-labeling, allowing for the isolation of RNA populations of specific ages.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::diagram:asset_23278f825e0f74bc17183bef", "locator": "Pulse chase panel: UTP above the transcription complex, with pre-existing red stars retained along RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.375, 0.0, 0.555, 1.0], "rationale": null}]}, {"target": "state_property:chase_cells:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity correctly keeps the preparation cellular after chase and places surviving labeled RNA among other cellular RNA. It does not turn this boundary into an isolated selected fraction.", "evidence": [{"source_id": "bruchase-seq::paper:23973811", "locator": "[b00021] registered primary full text", "basis": "text", "support": "reported", "quote": "If doing a chase, after the 30 min incubation, rinse plate twice with PBS, then add back saved media containing 20 mM uridine and incubate for desired time period (6 h may be an appropriate time to start with).", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00002] registered primary full text", "basis": "text", "support": "reported", "quote": "In BruChase-Seq, cells are chased in uridine for different periods of time following Bru-labeling, allowing for the isolation of RNA populations of specific ages.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00026] registered primary full text", "basis": "text", "support": "reported", "quote": "Resuspend the pellet in 200 μl DEPC-water and incubate at 55 °C for 10 min to ensure RNA is fully dissolved. Store RNA at –80 °C unless immediately proceeding to isolation of Bru-RNA.", "bbox": null, "rationale": null}]}, {"target": "state_property:chase_cells:retained_bru", "verdict": "supported", "action": "accept", "rationale": "The modification is on surviving_rna residues, not on all material in the cells. Red stars persist in the chase icon and the primary follows aged Bru-labeled RNA for stability assessment, supporting retention on surviving molecules.", "evidence": [{"source_id": "bruchase-seq::diagram:asset_23278f825e0f74bc17183bef", "locator": "Pulse chase panel: UTP above the transcription complex, with pre-existing red stars retained along RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.375, 0.0, 0.555, 1.0], "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00002] registered primary full text", "basis": "text", "support": "reported", "quote": "In BruChase-Seq, cells are chased in uridine for different periods of time following Bru-labeling, allowing for the isolation of RNA populations of specific ages.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00188] registered primary full text", "basis": "text", "support": "reported", "quote": "By comparing the amount of exonic RNA reads present 6 h after Bru-labeling with the total amount of reads for the entire gene directly after Bru-labeling, an estimation of the relative stability of each transcript can be made.", "bbox": null, "rationale": null}]}, {"target": "state_property:eluted_rna:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity accurately describes released RNA before fragmentation. The primary elutes Bru-RNA and recovers supernatant before beginning cDNA-preparation fragmentation, matching both connected operations.", "evidence": [{"source_id": "bruchase-seq::paper:23973811", "locator": "[b00036] registered primary full text", "basis": "text", "support": "reported", "quote": "Resuspend the bead pellet in 40 μl DEPC-water and incubate for 10 min in a 95 °C heat block to elute Bru-RNA from the beads.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00038] registered primary full text", "basis": "text", "support": "reported", "quote": "Remove the supernatant to a clean 1.5 ml microfuge tube, quantitate Bru-RNA concentrations (Nanodrop, Thermo Scientific), and store at –80 °C if not using immediately for library preparation.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00040] registered primary full text", "basis": "text", "support": "reported", "quote": "Start with at least 250 ng Bru-RNA", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00042] registered primary full text", "basis": "text", "support": "reported", "quote": "2.2.6.1. Fragment mRNA", "bbox": null, "rationale": null}]}, {"target": "state_property:eluted_rna:label", "verdict": "supported", "action": "accept", "rationale": "The RNA-residue modification is appropriate for the eluted Bru-enriched RNA preparation. Red stars remain on the depicted released RNA and the primary calls the eluted material Bru-RNA; the mark is not asserted on the subsequent DNA product.", "evidence": [{"source_id": "bruchase-seq::diagram:asset_23278f825e0f74bc17183bef", "locator": "Arrow from bead to Elute panel: free purple RNA segments retaining red-star labels", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.825, 0.0, 0.912, 1.0], "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00036] registered primary full text", "basis": "text", "support": "reported", "quote": "Resuspend the bead pellet in 40 μl DEPC-water and incubate for 10 min in a 95 °C heat block to elute Bru-RNA from the beads.", "bbox": null, "rationale": null}]}, {"target": "state_property:pulse_cells:bru_residues", "verdict": "supported", "action": "accept", "rationale": "The modification belongs specifically to pulse_rna at RNA residues. The starred RNA and primary metabolic-labeling account support incorporation rather than attachment to the cell boundary or a DNA label.", "evidence": [{"source_id": "bruchase-seq::diagram:asset_23278f825e0f74bc17183bef", "locator": "Label with bromouridine panel: Br-UTP label and red stars incorporated along purple nascent RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.185, 0.0, 0.365, 1.0], "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00006] registered primary full text", "basis": "text", "support": "reported", "quote": "Bromouridine sequencing (Bru-Seq) and bromouridine-chase sequencing (BruChase-Seq) are based on the metabolic pulse-chase labeling of nascent RNA with bromouridine.", "bbox": null, "rationale": null}]}, {"target": "state_property:pulse_cells:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity correctly remains cells after a bromouridine pulse and identifies newly synthesized labeled RNA as a constituent. The primary supplies the cellular context and the diagram shows the incorporated mark.", "evidence": [{"source_id": "bruchase-seq::paper:23973811", "locator": "[b00021] registered primary full text", "basis": "text", "support": "reported", "quote": "Remove 3–4 ml of media from each plate of cells to a clean tube and add BrU to a final concentration of 2 mM.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00006] registered primary full text", "basis": "text", "support": "reported", "quote": "Bromouridine sequencing (Bru-Seq) and bromouridine-chase sequencing (BruChase-Seq) are based on the metabolic pulse-chase labeling of nascent RNA with bromouridine.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::diagram:asset_23278f825e0f74bc17183bef", "locator": "Label with bromouridine panel: Br-UTP label and red stars incorporated along purple nascent RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.185, 0.0, 0.365, 1.0], "rationale": null}]}, {"target": "state_property:pulse_cells:pulse_origin", "verdict": "supported", "action": "accept", "rationale": "The time-window attribution belongs to pulse_rna and identifies incorporated bromouridine as the carrier of the pulse interval. This is a bulk temporal cohort; it asserts no barcode or single-cell identity.", "evidence": [{"source_id": "bruchase-seq::diagram:asset_23278f825e0f74bc17183bef", "locator": "Label with bromouridine panel: Br-UTP label and red stars incorporated along purple nascent RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.185, 0.0, 0.365, 1.0], "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00006] registered primary full text", "basis": "text", "support": "reported", "quote": "Bromouridine sequencing (Bru-Seq) and bromouridine-chase sequencing (BruChase-Seq) are based on the metabolic pulse-chase labeling of nascent RNA with bromouridine.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00002] registered primary full text", "basis": "text", "support": "reported", "quote": "In BruChase-Seq, cells are chased in uridine for different periods of time following Bru-labeling, allowing for the isolation of RNA populations of specific ages.", "bbox": null, "rationale": null}]}, {"target": "state_property:total_rna:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity correctly describes the mixed total RNA preparation before enrichment and later fragmentation, implementing the corrected order. The primary proceeds from isolated RNA to capture and only then to library-preparation fragmentation.", "evidence": [{"source_id": "bruchase-seq::paper:23973811", "locator": "[b00026] registered primary full text", "basis": "text", "support": "reported", "quote": "Resuspend the pellet in 200 μl DEPC-water and incubate at 55 °C for 10 min to ensure RNA is fully dissolved. Store RNA at –80 °C unless immediately proceeding to isolation of Bru-RNA.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00034] registered primary full text", "basis": "text", "support": "reported", "quote": "Remove 90% of the sample (180 μl) and add to prepared beads. Flick tube to ensure sample is mixed well and place on rotator for 1 h at room temperature.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00036] registered primary full text", "basis": "text", "support": "reported", "quote": "Resuspend the bead pellet in 40 μl DEPC-water and incubate for 10 min in a 95 °C heat block to elute Bru-RNA from the beads.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00042] registered primary full text", "basis": "text", "support": "reported", "quote": "2.2.6.1. Fragment mRNA", "bbox": null, "rationale": null}]}, {"target": "state_property:total_rna:retained_bru", "verdict": "supported", "action": "accept", "rationale": "The bromouridine modification belongs to the bru_rna component of total RNA. The labeling history and subsequent selective isolation of Bru-containing RNA support a mixture without attributing the modification to all RNA.", "evidence": [{"source_id": "bruchase-seq::paper:23973811", "locator": "[b00006] registered primary full text", "basis": "text", "support": "reported", "quote": "Bromouridine sequencing (Bru-Seq) and bromouridine-chase sequencing (BruChase-Seq) are based on the metabolic pulse-chase labeling of nascent RNA with bromouridine.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00002] registered primary full text", "basis": "text", "support": "reported", "quote": "In BruChase-Seq, cells are chased in uridine for different periods of time following Bru-labeling, allowing for the isolation of RNA populations of specific ages.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00026] registered primary full text", "basis": "text", "support": "reported", "quote": "Resuspend the pellet in 200 μl DEPC-water and incubate at 55 °C for 10 min to ensure RNA is fully dissolved. Store RNA at –80 °C unless immediately proceeding to isolation of Bru-RNA.", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00007] registered primary full text", "basis": "text", "support": "reported", "quote": "Following labeling, Bru-containing RNA is specifically captured using anti-BrdU antibodies conjugated to magnetic beads. cDNA libraries are then produced from the isolated Bru-RNA and subjected to deep sequencing [14].", "bbox": null, "rationale": null}]}, {"target": "state_property:uridine:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity correctly names uridine supplied to labeled cells during the chase. It implements the primary-supported reagent correction and does not assert external UTP addition.", "evidence": [{"source_id": "bruchase-seq::paper:23973811", "locator": "[b00021] registered primary full text", "basis": "text", "support": "reported", "quote": "If doing a chase, after the 30 min incubation, rinse plate twice with PBS, then add back saved media containing 20 mM uridine and incubate for desired time period (6 h may be an appropriate time to start with).", "bbox": null, "rationale": null}, {"source_id": "bruchase-seq::paper:23973811", "locator": "[b00002] registered primary full text", "basis": "text", "support": "reported", "quote": "In BruChase-Seq, cells are chased in uridine for different periods of time following Bru-labeling, allowing for the isolation of RNA populations of specific ages.", "bbox": null, "rationale": null}]}]}, "sources": {"bruchase-seq::card:bruchase-seq": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/bruchase-seq.html", "title": "BruChase-Seq", "text_characters": 2539, "text_sha256": "dedec82aeb10434e2cacec75064dfcdf71779a370f34ad7cf8a1d112d8052037"}, "bruchase-seq::collection:rna:page:33": {"kind": "text", "content_level": "catalogue", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102 thod-explorer/kits-and-arrays/bruchase-seq.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/bruchase-seq.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA Transcription", "source_category_path": ["Transcriptome", "RNA Transcription"], "description_verbatim": "BruChase-Seq uses bromouridine tagging to map and quantify the relative stability of nascent RNA transcripts. RNAPII synthesizes RNA in the presence of Br-UTP. Untagged uridine is added to chase out bromouridine from RNAs with high turnover. Long-lived RNA transcripts will remain tagged. The tagged RNA transcripts are immunoseparated from total RNA using magnetic beads coated with anti-BrdU antibodies. The captured RNA transcripts are eluted and fragmented before synthesis of cDNA strands via RT and PCR amplification. The resultant cDNA strands are prepared for sequencing using an Illumina TruSeq RNA Library Prep Kit.", "advantages_verbatim": ["Determines RNA stability through pulse-chase with bromouridine", "Predicts nonsense and frameshift mutations1", "Detects transcription anywhere on the genome", "No prior knowledge of transcription sites is needed"], "limitations_verbatim": ["Limited to cell cultures and other artificial systems, due to the requirement for incubation in the presence of labeled nucleotides"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "BruChase-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "BruChase-Seq uses bromouridine tagging to map and quantify the relative stability of nascent RNA transcripts. RNAPII synthesizes RNA in the presence of Br-UTP. Untagged uridine is added to chase out bromouridine from RNAs with high turnover. Long   root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
