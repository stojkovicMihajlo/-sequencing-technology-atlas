y bead; adjacent chromatin has no separately routed output", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.29, 0.0, 0.46, 0.85], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00006, ChIPmentation implementation", "basis": "text", "support": "reported", "quote": "Here, we demonstrate tagmentation of immunoprecipitated chromatin in a robust one-step reaction performed directly on bead-bound chromatin.", "bbox": null, "rationale": null}]}, {"target": "state_properties:transposome", "verdict": "supported", "action": "accept", "rationale": "The self identity and adapter-component sequence_segment preserve the distinguishing enzyme-plus-adapter reagent architecture. They do not assert an exact oligonucleotide sequence, end chemistry or preparation recipe beyond the depiction and primary adapter statement.", "evidence": [{"source_id": "chipmentation::diagram:asset_20083ca733fbaa508edf5f27", "locator": "Tn5 Transposome addition arrow and Adapter insertion: blue complexes bearing pink/yellow stubs engage immunocaptured chromatin", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.47, 0.0, 0.7, 0.85], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00004, abstract", "basis": "text", "support": "reported", "quote": "ChIPmentation introduces sequencing-compatible adapters in a single-step reaction directly on bead-bound chromatin, which reduces time, cost, and input requirements, thus providing a convenient and broadly useful alternative to existing ChIP-seq protocols.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00005, tagmentation definition, read together with the ChIPmentation substrate in b00006", "basis": "text", "support": "reported", "quote": "The development of a hyperactive Tn5 transposase that enables simultaneous DNA fragmentation and adapter tagging (“tagmentation”) presents an opportunity for faster and more sensitive library preparation from purified DNA3.", "bbox": null, "rationale": null}]}, {"target": "state_properties:tagmented_chromatin", "verdict": "supported", "action": "accept", "rationale": "The properties jointly retain adapter tagging and bead attachment until downstream recovery. The association belongs to tagged chromatin in the capture preparation, not a claim that every isolated DNA fragment directly binds the bead. Generic colored ends are preserved without inventing polarity or terminal chemistry, and no corrected free purified-DNA state remains.", "evidence": [{"source_id": "chipmentation::diagram:asset_20083ca733fbaa508edf5f27", "locator": "Fragmented and primed: standalone blue DNA line with pink and yellow terminal segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.76, 0.18, 0.84, 0.94], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00006, ChIPmentation implementation", "basis": "text", "support": "reported", "quote": "Here, we demonstrate tagmentation of immunoprecipitated chromatin in a robust one-step reaction performed directly on bead-bound chromatin.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00022, Online Methods / ChIPmentation: recovery following on-bead tagmentation", "basis": "text", "support": "reported", "quote": "Afterward, the chosen ChIP protocol was resumed with the final bead wash, elution from beads, reverse-crosslinking, and DNA purification.", "bbox": null, "rationale": null}]}, {"target": "state_properties:dna_library", "verdict": "supported", "action": "accept", "rationale": "The library identity and flanking adapter sequence segments describe the actual physical DNA. The attribution names genomic insert DNA as the carrier of enriched-locus information; the original protein or histone modification is not claimed to remain on the reporter. These properties capture the consequential readout association without inventing sequencing data.", "evidence": [{"source_id": "poster_a2a8d92051f1d9edd09a8084::diagram:poster_crop_1e9ad4bf4601fb46e0c3f866", "locator": "Middle row Fragmented and primed, DNA purification / Amplification arrow, and final DNA line with colored end segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.71, 0.46, 0.92, 0.71], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00004, abstract", "basis": "text", "support": "reported", "quote": "ChIPmentation introduces sequencing-compatible adapters in a single-step reaction directly on bead-bound chromatin, which reduces time, cost, and input requirements, thus providing a convenient and broadly useful alternative to existing ChIP-seq protocols.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00008, downstream purification/amplification interface", "basis": "text", "support": "reported", "quote": "Furthermore, the ChIPmentation protocol is fast and convenient, does not give rise to sequencing adapter dimers, and requires only a single DNA purification step prior to library amplification.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00005, introduction: measurement target", "basis": "text", "support": "reported", "quote": "ChIP-seq combines chromatin immunoprecipitation with next generation sequencing in order to measure the genome-wide distribution of chromatin proteins and their posttranslational modifications1.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00022, Online Methods / ChIPmentation: recovery following on-bead tagmentation", "basis": "text", "support": "reported", "quote": "Afterward, the chosen ChIP protocol was resumed with the final bead wash, elution from beads, reverse-crosslinking, and DNA purification.", "bbox": null, "rationale": null}]}, {"target": "state_property:chromatin:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity is correctly placed on the starting preparation and describes DNA-protein chromatin fragments, supported by the nucleosome icons and b00011 fragmented-chromatin substrate statement.", "evidence": [{"source_id": "chipmentation::diagram:asset_20083ca733fbaa508edf5f27", "locator": "Chromatin label and two DNA-wrapped nucleosome icons before the first reaction arrow", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.18, 0.0, 0.29, 0.82], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00011, actual chromatin substrate", "basis": "text", "support": "reported", "quote": "Given that ChIPmentation involves tagmentation of fragmented chromatin instead of purified ChIP DNA, we also investigated whether the tagmentation patterns correlate with local chromatin structure as described for ATAC-seq4.", "bbox": null, "rationale": null}]}, {"target": "state_property:captured_chromatin:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity accurately describes antibody-enriched chromatin retained on beads before tagging, as shown by the capture icon and explicitly confirmed as the ChIPmentation substrate.", "evidence": [{"source_id": "chipmentation::diagram:asset_20083ca733fbaa508edf5f27", "locator": "First reaction arrow and Chromatin immunoprecipitation: pink antibody joins a chromatin icon to the gray bead; adjacent chromatin has no separately routed output", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.29, 0.0, 0.46, 0.85], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00006, ChIPmentation implementation", "basis": "text", "support": "reported", "quote": "Here, we demonstrate tagmentation of immunoprecipitated chromatin in a robust one-step reaction performed directly on bead-bound chromatin.", "bbox": null, "rationale": null}]}, {"target": "state_property:captured_chromatin:bead_context", "verdict": "supported", "action": "accept", "rationale": "physical_context is attached to the whole captured preparation and records its antibody-bearing bead organization. This is actual support attachment, not an inferred isolated fraction or mixing event.", "evidence": [{"source_id": "chipmentation::diagram:asset_20083ca733fbaa508edf5f27", "locator": "First reaction arrow and Chromatin immunoprecipitation: pink antibody joins a chromatin icon to the gray bead; adjacent chromatin has no separately routed output", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.29, 0.0, 0.46, 0.85], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00006, ChIPmentation implementation", "basis": "text", "support": "reported", "quote": "Here, we demonstrate tagmentation of immunoprecipitated chromatin in a robust one-step reaction performed directly on bead-bound chromatin.", "bbox": null, "rationale": null}]}, {"target": "state_property:captured_chromatin:capture_binding", "verdict": "supported", "action": "accept", "rationale": "The chromatin_complexes subject and capture_assembly partner are both defined constituents of this preparation. bound_to matches the antibody-mediated bead attachment; the candidate does not claim covalent bead-DNA linkage.", "evidence": [{"source_id": "chipmentation::diagram:asset_20083ca733fbaa508edf5f27", "locator": "First reaction arrow and Chromatin immunoprecipitation: pink antibody joins a chromatin icon to the gray bead; adjacent chromatin has no separately routed output", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.29, 0.0, 0.46, 0.85], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00006, ChIPmentation implementation", "basis": "text", "support": "reported", "quote": "Here, we demonstrate tagmentation of immunoprecipitated chromatin in a robust one-step reaction performed directly on bead-bound chromatin.", "bbox": null, "rationale": null}]}, {"target": "state_property:transposome:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity correctly names the Tn5 enzyme/adapter complex supplying sequencing-compatible tags to the reaction. The depiction names Tn5 and visibly carries the colored stubs; the primary defines coupled fragmentation/tagging and sequencing-compatible adapters.", "evidence": [{"source_id": "chipmentation::diagram:asset_20083ca733fbaa508edf5f27", "locator": "Tn5 Transposome addition arrow and Adapter insertion: blue complexes bearing pink/yellow stubs engage immunocaptured chromatin", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.47, 0.0, 0.7, 0.85], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00004, abstract", "basis": "text", "support": "reported", "quote": "ChIPmentation introduces sequencing-compatible adapters in a single-step reaction directly on bead-bound chromatin, which reduces time, cost, and input requirements, thus providing a convenient and broadly useful alternative to existing ChIP-seq protocols.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00005, tagmentation definition, read together with the ChIPmentation substrate in b00006", "basis": "text", "support": "reported", "quote": "The development of a hyperactive Tn5 transposase that enables simultaneous DNA fragmentation and adapter tagging (“tagmentation”) presents an opportunity for faster and more sensitive library preparation from purified DNA3.", "bbox": null, "rationale": null}]}, {"target": "state_property:transposome:adapter_segments", "verdict": "supported", "action": "accept", "rationale": "The sequence_segment assertion belongs to the adapters component, not the Tn5 protein. Adapter DNA is represented by the colored stubs and supported by primary sequencing-adapter tagging; no exact sequence or unsupported terminal chemistry is asserted.", "evidence": [{"source_id": "chipmentation::diagram:asset_20083ca733fbaa508edf5f27", "locator": "Tn5 Transposome addition arrow and Adapter insertion: blue complexes bearing pink/yellow stubs engage immunocaptured chromatin", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.47, 0.0, 0.7, 0.85], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00004, abstract", "basis": "text", "support": "reported", "quote": "ChIPmentation introduces sequencing-compatible adapters in a single-step reaction directly on bead-bound chromatin, which reduces time, cost, and input requirements, thus providing a convenient and broadly useful alternative to existing ChIP-seq protocols.", "bbox": null, "rationale": null}]}, {"target": "state_property:tagmented_chromatin:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity correctly retains the bead-bound chromatin substrate after Tn5 fragmentation/tagging and before elution/purification. This is the primary-supported interpretation of the simplified DNA-line boundary and agrees with its outgoing recovery route.", "evidence": [{"source_id": "chipmentation::diagram:asset_20083ca733fbaa508edf5f27", "locator": "Fragmented and primed: standalone blue DNA line with pink and yellow terminal segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.76, 0.18, 0.84, 0.94], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00005, tagmentation definition, read together with the ChIPmentation substrate in b00006", "basis": "text", "support": "reported", "quote": "The development of a hyperactive Tn5 transposase that enables simultaneous DNA fragmentation and adapter tagging (“tagmentation”) presents an opportunity for faster and more sensitive library preparation from purified DNA3.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00006, ChIPmentation implementation", "basis": "text", "support": "reported", "quote": "Here, we demonstrate tagmentation of immunoprecipitated chromatin in a robust one-step reaction performed directly on bead-bound chromatin.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00022, Online Methods / ChIPmentation: recovery following on-bead tagmentation", "basis": "text", "support": "reported", "quote": "Afterward, the chosen ChIP protocol was resumed with the final bead wash, elution from beads, reverse-crosslinking, and DNA purification.", "bbox": null, "rationale": null}]}, {"target": "state_property:tagmented_chromatin:bead_context", "verdict": "supported", "action": "accept", "rationale": "The whole preparation remains in the bead context through tagmentation. Assigning elution/reverse crosslinking to the subsequent block follows b00022 and is implemented by that operation, rather than merely stated in correction prose.", "evidence": [{"source_id": "primary:paper:26280331", "locator": "b00006, ChIPmentation implementation", "basis": "text", "support": "reported", "quote": "Here, we demonstrate tagmentation of immunoprecipitated chromatin in a robust one-step reaction performed directly on bead-bound chromatin.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00022, Online Methods / ChIPmentation: recovery following on-bead tagmentation", "basis": "text", "support": "reported", "quote": "Afterward, the chosen ChIP protocol was resumed with the final bead wash, elution from beads, reverse-crosslinking, and DNA purification.", "bbox": null, "rationale": null}]}, {"target": "state_property:tagmented_chromatin:adapter_tags", "verdict": "supported", "action": "accept", "rationale": "The sequence_segment assertion is placed on tagged_chromatin, whose label specifically identifies adapter-tagged DNA in captured chromatin. Pink/yellow segments occur at the depicted fragment ends; primary text supports sequencing-compatible adapter insertion. The assertion properly leaves polarity and exact end chemistry unspecified.", "evidence": [{"source_id": "chipmentation::diagram:asset_20083ca733fbaa508edf5f27", "locator": "Tn5 Transposome addition arrow and Adapter insertion: blue complexes bearing pink/yellow stubs engage immunocaptured chromatin", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.47, 0.0, 0.7, 0.85], "rationale": null}, {"source_id": "chipmentation::diagram:asset_20083ca733fbaa508edf5f27", "locator": "Fragmented and primed: standalone blue DNA line with pink and yellow terminal segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.76, 0.18, 0.84, 0.94], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00004, abstract", "basis": "text", "support": "reported", "quote": "ChIPmentation introduces sequencing-compatible adapters in a single-step reaction directly on bead-bound chromatin, which reduces time, cost, and input requirements, thus providing a convenient and broadly useful alternative to existing ChIP-seq protocols.", "bbox": null, "rationale": null}]}, {"target": "state_property:tagmented_chromatin:capture_binding", "verdict": "supported", "action": "accept", "rationale": "tagged_chromatin and capture_assembly are defined components. The bound_to association preserves the immunocaptured chromatin preparation after on-bead tagging, until subsequent bead elution; it does not assert a new covalent DNA-bead attachment. The primary recovery passage supports the retained context required by the correction.", "evidence": [{"source_id": "primary:paper:26280331", "locator": "b00006, ChIPmentation implementation", "basis": "text", "support": "reported", "quote": "Here, we demonstrate tagmentation of immunoprecipitated chromatin in a robust one-step reaction performed directly on bead-bound chromatin.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00022, Online Methods / ChIPmentation: recovery following on-bead tagmentation", "basis": "text", "support": "reported", "quote": "Afterward, the chosen ChIP protocol was resumed with the final bead wash, elution from beads, reverse-crosslinking, and DNA purification.", "bbox": null, "rationale": null}, {"source_id": "chipmentation::diagram:asset_20083ca733fbaa508edf5f27", "locator": "First reaction arrow and Chromatin immunoprecipitation: pink antibody joins a chromatin icon to the gray bead; adjacent chromatin has no separately routed output", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.29, 0.0, 0.46, 0.85], "rationale": null}]}, {"target": "state_property:dna_library:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity describes recovered, purified, amplified adapter-bearing library DNA. The final drawing supports the product and adapter segments; b00022 and b00008 establish recovery and purification before amplification.", "evidence": [{"source_id": "poster_a2a8d92051f1d9edd09a8084::diagram:poster_crop_1e9ad4bf4601fb46e0c3f866", "locator": "Middle row Fragmented and primed, DNA purification / Amplification arrow, and final DNA line with colored end segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.71, 0.46, 0.92, 0.71], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00004, abstract", "basis": "text", "support": "reported", "quote": "ChIPmentation introduces sequencing-compatible adapters in a single-step reaction directly on bead-bound chromatin, which reduces time, cost, and input requirements, thus providing a convenient and broadly useful alternative to existing ChIP-seq protocols.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00022, Online Methods / ChIPmentation: recovery following on-bead tagmentation", "basis": "text", "support": "reported", "quote": "Afterward, the chosen ChIP protocol was resumed with the final bead wash, elution from beads, reverse-crosslinking, and DNA purification.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00008, downstream purification/amplification interface", "basis": "text", "support": "reported", "quote": "Furthermore, the ChIPmentation protocol is fast and convenient, does not give rise to sequencing adapter dimers, and requires only a single DNA purification step prior to library amplification.", "bbox": null, "rationale": null}]}, {"target": "state_property:dna_library:adapter_segments", "verdict": "supported", "action": "accept", "rationale": "The self sequence_segment assertion locates sequencing-compatible sequences flanking the genomic insert, as represented by the colored ends. Adapter tagging and adapter-compatible amplification are supported without asserting an exact sequence, index design or end chemistry.", "evidence": [{"source_id": "poster_a2a8d92051f1d9edd09a8084::diagram:poster_crop_1e9ad4bf4601fb46e0c3f866", "locator": "Middle row Fragmented and primed, DNA purification / Amplification arrow, and final DNA line with colored end segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.71, 0.46, 0.92, 0.71], "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00004, abstract", "basis": "text", "support": "reported", "quote": "ChIPmentation introduces sequencing-compatible adapters in a single-step reaction directly on bead-bound chromatin, which reduces time, cost, and input requirements, thus providing a convenient and broadly useful alternative to existing ChIP-seq protocols.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00025-b00026, shared amplification subsection explicitly including ChIPmentation", "basis": "text", "support": "reported", "quote": "Library preparation was performed using custom Nextera primers as described for ATAC-seq4.", "bbox": null, "rationale": null}]}, {"target": "state_property:dna_library:target_correspondence", "verdict": "supported", "action": "accept", "rationale": "The attribution explicitly names genomic DNA insert sequences as the carrier and associates their origins with immunoprecipitated target regions. This is a warranted inference from the stated ChIP-seq measurement target, on-bead chromatin tagging and subsequent DNA recovery/amplification. It records enrichment rather than perfect specificity and does not imply that histone marks or proteins persist on the final DNA reporter.", "evidence": [{"source_id": "primary:paper:26280331", "locator": "b00005, introduction: measurement target", "basis": "text", "support": "reported", "quote": "ChIP-seq combines chromatin immunoprecipitation with next generation sequencing in order to measure the genome-wide distribution of chromatin proteins and their posttranslational modifications1.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00006, ChIPmentation implementation", "basis": "text", "support": "reported", "quote": "Here, we demonstrate tagmentation of immunoprecipitated chromatin in a robust one-step reaction performed directly on bead-bound chromatin.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00022, Online Methods / ChIPmentation: recovery following on-bead tagmentation", "basis": "text", "support": "reported", "quote": "Afterward, the chosen ChIP protocol was resumed with the final bead wash, elution from beads, reverse-crosslinking, and DNA purification.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00008, downstream purification/amplification interface", "basis": "text", "support": "reported", "quote": "Furthermore, the ChIPmentation protocol is fast and convenient, does not give rise to sequencing adapter dimers, and requires only a single DNA purification step prior to library amplification.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26280331", "locator": "b00010, antibody-dependent applicability", "basis": "text", "support": "reported", "quote": "Nevertheless, as with every ChIP approach, low-input ChIPmentation depends on antibody quality and may not be feasible for all histone marks and transcription factors.", "bbox": null, "rationale": null}]}]}, "sources": {"chipmentation::card:chipmentation": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/chipmentation.html", "title": "ChIPmentation", "text_characters": 1971, "text_sha256": "b1492365cb7b8328b3d343eb36a2dcb9f8d78a351e15b1421d06d8b93d03fcf3"}, "chipmentation::collection:dna:page:124": {"kind": "text", "content_level": "catalogue", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102/sources_03/collection_pages/dna_124.txt", "sha256": "6f9232564a9e80243e049b63635ab2566f9aabe15f3a16b05d6aa315c48e3d1a", "title": "Illumina DNA collection, PDF page 124", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/products/research_reviews/dna-sequencing-methods-review-web.pdf", "association_status": "candidate_secondary_catalogue_page; verify target and scope before use", "original": {"source_id": "collection:dna:page:124", "content_level": "catalogue", "title": "Illumina DNA collection, PDF page 124", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/products/research_reviews/dna-sequencing-methods-review-web.pdf", "text_path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102/sources_03/collection_pages/dna_124.txt", "text_sha256": "6f9232564a9e80243e049b63635ab2566f9aabe15f3a16b05d6aa315c48e3d1a", "original_pdf": {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/da/daba474a8c1d7283e9158e6635fe4d404737f518a0e5de1dae1ff35fb9d92084.pdf", "sha256": "daba474a8c1d7283e9158e6635fe4d404737f518a0e5de1dae1ff35fb9d92084"}, "page": 124, "conversion": ["pdftotext", "-layout", "/scratch/groups/x const $ = id => document.getElementById(id);

const batchLabel = b => ({initial_two:'Catalogue card', catalogue:'Catalogue card', posters:'Main poster row', footer_panels:'Footer / product / readout panel', scoped_method:'Scoped workflow'})[b] || b;
let inventory = [], selected = '', request = 0;
function link(text, url) { const a = el('a',text); if (/^https?:\/\//.test(url || '')) { a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; } return a; }
function section(parent, title) { const d = el('details',null,'section'); d.append(el('summary',title)); parent.append(d); return d; }
function raw(parent, title, value) { const d = section(parent,title); d.append(el('pre',JSON.stringify(value,null,2))); }
function fields(parent, rows) { const d = el('div',null,'fields'); for (const [name,value] of rows) { if (value == null || value === '' || (Array.isArray(value) && !value.length)) continue; d.append(el('b',name),el('span',Array.isArray(value) ? value.join('; ') : String(value))); } parent.append(d); }
function assertions(parent,title,items,record) {
  if(!items?.length)return;
  const box=section(parent,title);
  for(const item of items){
    fields(box,Object.entries(item).filter(([k])=>k!=='evidence').map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):v]));
    evidence(box,item.evidence,record);
  }
}
function evidence(parent, items, record) {
  for (const e of items || []) {
    const box = el('div',null,'evidence'), s = record.sources[e.source_id] || {};
    box.append(link(s.title || e.source_id,s.url),el('p',`${e.support} · ${s.content_level || e.basis} · ${e.locator}`,'muted'));
    if (e.quote) box.append(el('blockquote',e.quote));
    if (e.bbox) box.append(el('p','Image region [left, top, right, bottom]: '+e.bbox.join(', '),'muted'));
    if (e.rationale) box.append(el('p',e.rationale));

}
function filterRecords() {

function inspect(parent, item, kind, record) {

  parent.replaceChildren(el('span',kind,'badge'),el('h3',item.label || item.id));
  const states = new Map(c.states.map(s => [s.id,s]));
  const names = ids => (ids || []).map(id => (states.get(id)?.label || id)+' ['+id+']');
  if (kind === 'Operation') fields(parent,[['Description',item.description],['Input States',names(item.inputs)],['Output States',names(item.outputs)],['Mechanism',item.mechanism || 'Not specified'],['Information effect',item.information_effect || 'Not specified']]);

  if (kind === 'Operation') { assertions(parent,'Input roles',item.input_roles,record); assertions(parent,'Effects on input/output States',item.effects,record); }
  if (kind === 'Flow') {
    const nodes = [...c.states,...c.operations], name = id => nodes.find(n => n.id === id)?.label || id;

function drawGraph(parent, inspector, record) {
  const c = record.candidate, nodes = [...c.states.map(x=>({...x,type:'State'})),...c.operations.map(x=>({...x,type:'Operation'}))];

  for (const f of c.flows) { if (!ids.has(f.source)||!ids.has(f.target)) { parent.append(el('p','Cannot draw: a Flow endpoint is missing. Inspect the raw record.','warning')); return; } incoming.set(f.target,incoming.get(f.target)+1);next.get(f.source).push(f.target); }
  const rank = new Map(nodes.map(x=>[x.id,0])), ready = nodes.filter(x=>incoming.get(x.id)===0).map(x=>x.id); let processed=0;
  while (ready.length) { const id = ready.shift(); processed++;for (const target of next.get(id)) { rank.set(target,Math.max(rank.get(target),rank.get(id)+1)); incoming.set(target,incoming.get(target)-1);if (!incoming.get(target)) ready.push(target); } }
  if (processed !== nodes.length) { parent.append(el('p','A cycle prevents a left-to-right layout. Use the exact Flow records below.','warning'));return; }
  const NS='http://www.w3.org/2000/svg', svg=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};
  const pos = new Map(), lanes = new Map();
  for (const n of nodes) { const col=rank.get(n.id),row=lanes.get(col)||0;lanes.set(col,row+1);pos.set(n.id,{x:25+col*224,y:25+row*112}); }
  const canvas=svg('svg',{width:Math.max(680,Math.max(...rank.values())*224+240),height:Math.max(150,Math.max(...lanes.values())*112+30),role:'img','aria-label':'Directed State and Operation workflow'});
  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
