aper."}]}], "corrections": [{"id": "c1_scope_caption", "target_id": "scope:Div-Seq", "diagram_observation": "In the single-cell poster middle row, the Div-Seq heading is followed at left by the descriptor Single-cell RNA barcoding and sequencing (SCRB-Seq). The rest of that same row depicts EdU-labeled tissue, nuclei isolation, Click-IT tagging, FACS and the Div-Seq cDNA library route. The primary diagram and the RNA poster instead describe Nuc-Seq with EdU-mediated labeling of proliferating cells.", "primary_statement": "Habib 2016 defines Div-Seq as sNuc-Seq combined with EdU pulse labeling and specifies fluorescent tagging and FACS capture of EdU-labeled nuclei. The SCRB-Seq descriptor is therefore resolved as a misplaced description in the additional poster; this record implements the Div-Seq route and does not add a SCRB-Seq barcode/pooling workflow.", "disposition": "use_primary", "evidence": [{"source_id": "poster_3dbf62c170b8a9d347274c8c::diagram:poster_crop_06ed1a06931fbe4d2eac4bae", "locator": "Middle Div-Seq row, left descriptor literally reads Single-cell RNA barcoding and sequencing (SCRB-Seq)", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.015, 0.4, 0.205, 0.7], "rationale": null}, {"source_id": "poster_8ac38f95cfd653f9f8712f4a::diagram:poster_crop_bd70d58238a3a912fa6d5b37", "locator": "Div-Seq left descriptor: Nuc-Seq with EdU-mediated labeling of proliferating cells", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.45, 0.21, 0.76], "rationale": null}, {"source_id": "primary:paper:27471252", "locator": "b00005, Div-Seq definition", "basis": "text", "support": "reported", "quote": "Div-Seq combines sNuc-Seq with pulse labeling of dividing cells by 5-ethynyl-2′-deoxyuridine (EdU) (5, 6).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27471252", "locator": "b00081, Fig. 3A caption", "basis": "text", "support": "reported", "quote": "EdU is injected into adult mice and incorporates into dividin  from dense adult tissue is challenging, and markers for each phase are limited. Here, we developed Div-Seq, which combines Nuc-Seq, a scalable single nucleus RNA-Seq method, with EdU-mediated labeling of proliferating cells. We first show that Nuc-Seq can sensitively identify closely related cell types within the adult hippocampus. We apply Div-Seq to track transcriptional dynamics of newborn neurons in an adult neurogenic region in the hippocampus. Finally, we find rare adult newborn GABAergic neurons in the spinal cord, a non-canonical neurogenic region. Taken together, Nuc-Seq and Div-Seq open the way for unbiased analysis of any complex tissue.", "published": "NA", "server": "bioRxiv"}, "fulltext_status": "source_XML_request_429_not_retried", "failed_fulltext_receipt": {"status": "failed", "error": "curl exit 56: curl: (56) The requested URL returned error: 429\n"}, "doi": "10.1101/045989", "title": "Div-Seq: A single nucleus RNA-Seq method reveals dynamics of rare adult newborn neurons in the CNS", "abstract": "Transcriptomes of individual neurons provide rich information about cell types and dynamic states. However, it is difficult to capture rare dynamic processes, such as adult neurogenesis, because isolation from dense adult tissue is challenging, and markers for each phase are limited. Here, we developed Div-Seq, which combines Nuc-Seq, a scalable single nucleus RNA-Seq method, with EdU-mediated labeling of proliferating cells. We first show that Nuc-Seq can sensitively identify closely related cell types within the adult hippocampus. We apply Div-Seq to track transcriptional dynamics of newborn neurons in an adult neurogenic region in the hippocampus. Finally, we find rare adult newborn GABAergic neurons in the spinal cord, a non-canonical neurogenic region. Taken together, Nuc-Seq and Div-Seq open the way for unbiased analysis of any complex tissue.", "kind": "text", "identity_status": "primary_api_collection_own_doi_title_abstract_verified", "text_path , "div-seq::reference:pilot_selected_primary": {"kind": "text", "content_level": "metadata", "pmid": "27471252", "association_status": "unverified_selected_primary_candidate", "text_characters": 134, "text_sha256": "1d1a6449d595f33d45687756868782c3c52c99a43f05643d3cf9e61e7e6f7d99"}}, "card": {"record_id": "div_seq", "source_title": "Div-Seq", "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/div-seq.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/div-seq.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": null, "source_category_path": [], "description_verbatim": "Div-Seq is a single-nucleus RNA sequencing technique that improves upon Nuc-Seq by incorporating 5-ethynyl-2’-deoxyuridine (EdU) labeling to identify dividing cells during their different cell stages. EdU labeling also enables identification of different cell types in complex tissue samples and rare cell populationsduring FACS. Briefly, samples are labeled in vivo with EdU, dissected, and fixed before isolation into single nuclei. Individual nuclei are tagged fluorescently and sorted by FACS. From this step, the procedure follows the Nuc-Seq method: cDNA synthesis is performed using the Smart-seq2 protocol, while the cDNA library is prepared with Tn5 transposase–mediated tagmentation.", "advantages_verbatim": ["Tracks transcriptome dynamics in single nuclei", "Detects rare cell populations", "Compatible with fresh, frozen, or fixed sample types", "EdU labeling gives unbiased identification of different types of dividing cells and their current stage in the cell cycle", "Mild nuclear dissociation technique minimizes gene expression changes commonly seen in protease-mediated dissociation"], "limitations_verbatim": ["Excludes any information from cytoplasmic RNA"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "Div-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "Div-Seq is a single-nucleus RNA sequencing technique that improves upon Nuc-Seq by incorporating 5-ethynyl-2’-deoxyuridine (EdU) labeling to identify dividing cells during their different cell stages. EdU labeling also enables identification of different cell types in complex tissue samples and rare cell populationsduring FACS. Briefly, samples are labeled in vivo with EdU, dissected, and fixed before isolation into single nuclei. Individual nuclei are tagged fluorescently and sorted by FACS. From this step, the procedure follows the Nuc-Seq method: cDNA synthesis is performed using the Smart-seq2 protocol, while the cDNA library is prepared with Tn5 transposase–mediated tagmentation.\nSimilar methods: Nuc-seq, snRNA-seq\nPros:\nTracks transcriptome dynamics in single nuclei\nDetects rare cell populations\nCompatible with fresh, frozen, or fixed sample types\nEdU labeling gives unbiased identification of different types of dividing cells and their current stage in the cell cycle\nMild nuclear dissociation technique minimizes gene expression changes commonly seen in protease-mediated dissociation\nCons:\nExcludes any information from cytoplasmic RNA"}, {"source_locator": "jcr:content/par/text_2/text", "text": "Div-Seq: Habib N., Li Y., Heidenreich M., et al. Div-Seq: Single-nucleus RNA-Seq reveals dynamics of rare adult newborn neurons. Science. 2016;353:925-928"}, {"source_locator": "jcr:content/par/text_3/text", "text": "Nextera XT DNA Library Preparation Kit"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Wagner A., Regev A. and Yosef N. Revealing the vectors of cellular identity with single-cell genomics. Nat Biotechnol. 2016;34:1145-1160\nGoncalves J. T., Schafer S. T. and Gage F. H
