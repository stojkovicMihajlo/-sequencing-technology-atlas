"224e8ee5958e4525649a17052c7e1319644981f5cf7f8303f9b5abc1c35b927e", "bytes": 53689, "imported_path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/22/224e8ee5958e4525649a17052c7e1319644981f5cf7f8303f9b5abc1c35b927e.json"}}}, "custody_files": [{"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/22/224e8ee5958e4525649a17052c7e1319644981f5cf7f8303f9b5abc1c35b927e.json", "sha256": "224e8ee5958e4525649a17052c7e1319644981f5cf7f8303f9b5abc1c35b927e"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/23/2367ae21546234068b93d26557892634547b6bb6a0b73108a7b14a469900fcc4.xml", "sha256": "2367ae21546234068b93d26557892634547b6bb6a0b73108a7b14a469900fcc4"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/5c/5cfdd245f0da9813ac31a6d284fd2e25f4295629f46e80edb7af480b2685c7ed.txt", "sha256": "5cfdd245f0da9813ac31a6d284fd2e25f4295629f46e80edb7af480b2685c7ed"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/c0/c00a701e416564aef2600f94f33622a8089e223908de61d35c50a5eaa90dbf34.xml", "sha256": "c00a701e416564aef2600f94f33622a8089e223908de61d35c50a5eaa90dbf34"}], "association_status": "selected_primary_candidate; extraction reviewer must confirm method/version scope", "text_characters": 44790, "text_sha256": "5cfdd245f0da9813ac31a6d284fd2e25f4295629f46e80edb7af480b2685c7ed"}, "dr-seq::reference:pilot_selected_primary": {"kind": "text", "content_level": "metadata", "pmid": "25599178", "association_status": "unverified_selected_primary_candidate", "text_characters": 133, "text_sha256": "5978ef8db5dcdb84b04b20f6f43b0204add9a8c51153eb241dd81c04488f4dbf"}}, "card": {"record_id": "dr_seq", "source_title": "DR-Seq", "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/dr-seq.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/dr-seq.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Genome > DNA Low-Level Detection", "source_category_path": ["Genome", "DNA Low-Level Detection"], "description_verbatim": "gDNA-mRNA sequencing (DR-Seq) studies the genomic and transcriptomic relationship of single-cells via sequencing. Nucleic acid amplification prior to physical separation reduces sample loss and risk of contamination. DR-Seq involves multiple amplification steps, including a quasilinear amplification technique similar to MALBAC.\nFirst, mRNA are reverse-transcribed from lysed single-cells using poly-dT primers with Ad-1x adaptors, producing single-stranded cDNA (sscDNA). Ad-1x adaptor sequence contain cell-identifying barcodes, 5' Illumina adaptors, and a T7 promoter. Then, both gDNA and sscDNA are simultaneously amplified via quasilinear whole-genome amplification with Ad-2 primers. These primers are similar to MALBAC adaptors, containing 8 random nucleotide sequence for random priming followed by a constant 27 nucleotide tag at the 5' end. Products of this amplification step are split in 2. One half is prepared for genome sequencing, in which gDNA are PCR amplified and liberated of their Ad-2 adaptors before DNA library prep and sequencing. The other half is used for transcriptome sequencing, where cDNAs are synthesized and amplified by in-vitro transcription. Resulting RNA products are produced only from cDNA fragments flanked with Ad-1x and Ad-2, suppressing amplification of the gDNA fragments. RNA library is prepared for sequencing following the Illumina small RNA protocol. Sequencing gDNA and mRNA from the same cell preserves information between the genome and its expression levels.", "advantages_verbatim": ["Interrogates genomic and transcriptomic behavior from a single-cell", "Amplification prior to separation reduces sample loss and contamination", "Length-based identifier used to remove duplicate reads", "Quasilinear amplification reduces PCR bias"], "limitations_verbatim": ["Manual single-cell isolation prevents high-throughput adaptation", "Quasilinear amplification is temperature-sensitive", "RNA reads are 3' end biased1"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "DR-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_bfda/text", "text": "gDNA-mRNA sequencing (DR-Seq) studies the genomic and transcriptomic relationship of single-cells via sequencing. Nucleic acid amplification prior to physical separation reduces sample loss and risk of contamination. DR-Seq involves multiple amplification steps, including a quasilinear amplification technique similar to MALBAC.\nFirst, mRNA are reverse-transcribed from lysed single-cells using poly-dT primers with Ad-1x adaptors, producing single-stranded cDNA (sscDNA). Ad-1x adaptor sequence contain cell-identifying barcodes, 5' Illumina adaptors, and a T7 promoter. Then, both gDNA and sscDNA are simultaneously amplified via quasilinear whole-genome amplification with Ad-2 primers. These primers are similar to MALBAC adaptors, containing 8 random nucleotide sequence for random priming followed by a constant 27 nucleotide tag at the 5' end. Products of this amplification step are split in 2. One half is prepared for genome sequencing, in which gDNA are PCR amplified and liberated of their Ad-2 adaptors before DNA library prep and sequencing. The other half is used for transcriptome sequencing, where cDNAs are synthesized and amplified by in-vitro transcription. Resulting RNA products are produced only from cDNA fragments flanked with Ad-1x and Ad-2, suppressing amplification of the gDNA fragments. RNA library is prepared for sequencing following the Illumina small RNA protocol. Sequencing gDNA and mRNA from the same cell preserves information between the genome and its expression levels.\nPros:\nInterrogates genomic and transcriptomic behavior from a single-cell\nAmplification prior to separation reduces sample loss and contamination\nLength-based identifier used to remove duplicate reads\nQuasilinear amplification reduces PCR bias\nCons:\nManual single-cell isolation prevents high-throughput adaptation\nQuasilinear amplification is temperature-sensitive\nRNA reads are 3' end biased1"}, {"source_locator": "jcr:content/par/text_2/text", "text": "DR-Seq: Dey S. S., Kester L., Spanjaard B., Bienko M. and van Oudenaarden A. (2015) Integrated genome and transcriptome sequencing of the same cell. Nat Biotechnol\n1. Macaulay I. C., Haerty W., Kumar P., Li Y. I., Hu T. X., et al. (2015) G&T-seq: parallel sequencing of single-cell genomes and transcriptomes. Nat Methods"}, {"source_locator": "jcr:content/par/text_3/text", "text": "TruSeq Small RNA Library Preparation Kits\nTruSeq Nano DNA Library Preparation Kit"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Dey S. S., Kester L., Spanjaard B., Bienko M. and van Oudenaarden A. (2015) Integrated genome and transcriptome sequencing of the same cell. Nat Biotechnol"}], "cms_modified_at_not_invention_date": "Thu Jan 30 2020 17:50:23 GMT+0000", "curation_status": "source_extracted_only", "missing_evidence": ["Canonical method disambiguation", "Verified origin and priority", "Primary protocol and materials", "Supported bottleneck and lineage claims"], "diagram_asset_ids": ["asset_c613bff0f8afe2cdf36e3c73"], "source_id": "dr-seq::card:dr-seq", "references": [{"reference_id": "dr-seq:references:0", "role": "references", "listed_by": "illumina", "source_reference": {"url": "http://www.ncbi.nlm.nih.gov/pubmed/25599178", "text": "DR-Seq: Dey S
