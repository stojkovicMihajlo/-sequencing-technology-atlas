ionale": "The recovery route takes the capture beads into the RNA-to-cDNA block. Retention of their captured RNA and capture oligos is needed to interpret that connected route; no purity, quantitative recovery, or separate free-RNA output is inferred."}]}, {"target": "state_property:recovered_rna_beads:organization", "verdict": "supported", "action": "accept", "rationale": "The self physical context correctly removes intact droplets while retaining a common bead preparation. The diagram is compatible with breaking before RT; primary pooling of STAMPs across collections occurs later and is not assigned to this recovery state.", "evidence": [{"source_id": "poster_5bdabfe8dde0c18b68e6dc6e::diagram:poster_crop_247fc1df04a435876d7c24eb", "locator": "DroNC-Seq row: rightward arrow from enlarged lysed droplet to vessel containing multiple beads; caption Pool all beads from droplets. The next vessel is captioned cDNA synthesis and amplification.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.615, 0.4, 0.775, 0.65], "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "ONLINE METHODS, Droplet breaking, washes, and reverse transcription (RT), b00035-b00036", "basis": "text", "support": "reported", "quote": "Microfluidic emulsion was collected into 50 ml Falcon tubes for ~22 min each, and left at room temperature for up to 45 min before breaking drops7 and performing RT7.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "ONLINE METHODS, Post RT wash, exonuclease I treatment, PCR, and library preparation, b00038", "basis": "text", "support": "reported", "quote": "Post RT, each barcoded bead had cDNA barcoded with the bead’s unique barcode (BC) bound onto it, also referred to as a STAMP7. STAMPs from multiple collections of a given sample were pooled at this point,", "bbox": null, "rationale": null}]}, {"target": "state_property:recovered_rna_beads:rna_attachment", "verdict": "supported", "action": "accept", "rationale": "The subject captured_rna and partner capture_oligos preserve the hybridization association through bead recovery. This is the candidate's explicit route-based inference needed for the following RT template, not an unsupported assertion of recovery purity.", "evidence": [{"source_id": "poster_5bdabfe8dde0c18b68e6dc6e::diagram:poster_crop_247fc1df04a435876d7c24eb", "locator": "DroNC-Seq row: bead legend identifies Oligo(dT); enlarged lysed droplet shows A-bearing RNA ends meeting bead oligos.", "basis": "image", "support": "inferred", "quote": null, "bbox": [0.35, 0.34, 0.617, 0.61], "rationale": "The complementary poly(A) and oligo(dT) segments and their drawn contact support hybridization as the capture association. The drawing does not show covalent barcoding of native RNA."}, {"source_id": "poster_5bdabfe8dde0c18b68e6dc6e::diagram:poster_crop_247fc1df04a435876d7c24eb", "locator": "DroNC-Seq row: connected route from bead-associated RNA in lysed droplet through Pool all beads from droplets to cDNA synthesis and amplification.", "basis": "image", "support": "inferred", "quote": null, "bbox": [0.535, 0.34, 0.775, 0.65], "rationale": "The recovery route takes the capture beads into the RNA-to-cDNA block. Retention of their captured RNA and capture oligos is needed to interpret that connected route; no purity, quantitative recovery, or separate free-RNA output is inferred."}, {"source_id": "primary:paper:28846088", "locator": "ONLINE METHODS, Droplet breaking, washes, and reverse transcription (RT), b00035-b00036", "basis": "text", "support": "reported", "quote": "Microfluidic emulsion was collected into 50 ml Falcon tubes for ~22 min each, and left at room temperature for up to 45 min before breaking drops7 and performing RT7.", "bbox": null, "rationale": null}]}, {"target": "state_property:sequence_reads:biological_scope", "verdict": "supported", "action": "accept", "rationale": "The self data-content assertion distinguishes represented captured nuclear RNA from the data carrier and whole-cell RNA. Primary nuclear reads include substantial intronic mapping explicitly linked to nascent transcripts; this is a supported library/read-content qualification, not an added intronic-counting workflow.", "evidence": [{"source_id": "poster_5bdabfe8dde0c18b68e6dc6e::diagram:poster_crop_247fc1df04a435876d7c24eb", "locator": "DroNC-Seq row, left analyte inset: Single nuclei arrow toward PolyA RNA ending AA(A)n. The procedural route begins separately at Cell suspension.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.105, 0.385, 0.208, 0.51], "rationale": null}, {"source_id": "poster_5bdabfe8dde0c18b68e6dc6e::diagram:poster_crop_247fc1df04a435876d7c24eb", "locator": "DroNC-Seq row: Lyse arrow from nucleus/bead droplet to enlarged droplet; mRNA strands associate at A-bearing ends with bead oligos, while non-polyA RNA is free inside the same droplet.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.468, 0.34, 0.617, 0.61], "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "Main text b00009, nuclear versus cellular transcript representation", "basis": "text", "support": "reported", "quote": "In both methods over 84% of reads align to the genome (in a representative example), but in cells 75.2% of these genomic reads map to exons and 9.1% map to introns, whereas in nuclei 46.2% of genomic reads map to exons and 41.8% to introns (Supplementary Fig. 2e), reflecting the enrichment of nascent transcripts in the nucleus3,13–16.", "bbox": null, "rationale": null}]}, {"target": "state_property:sequence_reads:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity correctly names paired sequence-read data obtained from cDNA libraries. This placement implements the primary-supported endpoint correction rather than treating the final caption as physical mRNA.", "evidence": [{"source_id": "poster_5bdabfe8dde0c18b68e6dc6e::diagram:poster_crop_247fc1df04a435876d7c24eb", "locator": "DroNC-Seq row: Sequence caption at the rightward arrow from the cDNA-preparation vessel to the black-line endpoint captioned Barcoded mRNA from single nuclei.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.777, 0.44, 0.895, 0.655], "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "ONLINE METHODS, library preparation, b00040", "basis": "text", "support": "reported", "quote": "Purified cDNA was quantified7 and 550 pg of each sample was fragmented, tagged, and amplified in each Nextera reaction7.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "ONLINE METHODS, Sequencing, b00042", "basis": "text", "support": "reported", "quote": "We used NextSeq 75 cycle v3 kits to sequence 20bp and 64bp paired-end reads, with Custom Read1 primer7.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "COMPUTATIONAL DATA ANALYSIS, Read filtering and alignment, b00046", "basis": "text", "support": "reported", "quote": "Briefly, the left read was used to infer both the cell of origin, based on the first 12 bases (the Nucleus Barcode or NB), and the molecule of origin, based on the next 8 bases (Unique Molecular Index or UMI).", "bbox": null, "rationale": null}]}, {"target": "state_property:sequence_reads:molecule_attribution", "verdict": "supported", "action": "accept", "rationale": "The self attribution names UMI bases in sequence data as the molecule carrier. Primary UMI-based within-gene/nucleus counting supports the described ability to account for amplification copies.", "evidence": [{"source_id": "primary:paper:28846088", "locator": "COMPUTATIONAL DATA ANALYSIS, Read filtering and alignment, b00046", "basis": "text", "support": "reported", "quote": "Briefly, the left read was used to infer both the cell of origin, based on the first 12 bases (the Nucleus Barcode or NB), and the molecule of origin, based on the next 8 bases (Unique Molecular Index or UMI).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "COMPUTATIONAL DATA ANALYSIS, Digital gene expression, b00048", "basis": "text", "support": "reported", "quote": "To account for amplification bias, gene counts were collapsed within each sample, using UMI sequences (within an edit distance of 1, substitutions only), as previously described7,11. The expression count (or number of transcripts) for a given gene in a given nucleus was determined by counting unique UMIs, and compiled into a digital gene expression (DGE) matrix.", "bbox": null, "rationale": null}]}, {"target": "state_property:sequence_reads:nucleus_attribution", "verdict": "supported", "action": "accept", "rationale": "The self attribution names barcode bases in the data as the carrier for nucleus grouping. Primary nucleus-barcode interpretation and multiplet evidence support both the association and its limitation.", "evidence": [{"source_id": "primary:paper:28846088", "locator": "COMPUTATIONAL DATA ANALYSIS, Read filtering and alignment, b00046", "basis": "text", "support": "reported", "quote": "Briefly, the left read was used to infer both the cell of origin, based on the first 12 bases (the Nucleus Barcode or NB), and the molecule of origin, based on the next 8 bases (Unique Molecular Index or UMI).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "ONLINE METHODS, Co-encapsulation of nuclei and barcode beads, b00033", "basis": "text", "support": "reported", "quote": "In practice, nuclei that stick together or cellular debris could also contribute to doublets or doublet-like phenomena. Empirical doublet rates in experiments ranged from ~1% (mouse tissue; clustering analysis) to ~5% (species-mixing).", "bbox": null, "rationale": null}]}, {"target": "state_property:sequence_reads:read_contents", "verdict": "supported", "action": "accept", "rationale": "The self data-content assertion correctly assigns nucleus barcode/UMI to the left read and transcript-derived sequence to the right mate. The library and sequencing passages establish that RNA is represented through DNA, not sequenced here as physical barcoded mRNA.", "evidence": [{"source_id": "primary:paper:28846088", "locator": "ONLINE METHODS, Post RT wash, exonuclease I treatment, PCR, and library preparation, b00038", "basis": "text", "support": "reported", "quote": "Post RT, each barcoded bead had cDNA barcoded with the bead’s unique barcode (BC) bound onto it, also referred to as a STAMP7. STAMPs from multiple collections of a given sample were pooled at this point,", "bbox": null, "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "ONLINE METHODS, library preparation, b00040", "basis": "text", "support": "reported", "quote": "Purified cDNA was quantified7 and 550 pg of each sample was fragmented, tagged, and amplified in each Nextera reaction7.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "ONLINE METHODS, Sequencing, b00042", "basis": "text", "support": "reported", "quote": "We used NextSeq 75 cycle v3 kits to sequence 20bp and 64bp paired-end reads, with Custom Read1 primer7.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "COMPUTATIONAL DATA ANALYSIS, Read filtering and alignment, b00046", "basis": "text", "support": "reported", "quote": "Briefly, the left read was used to infer both the cell of origin, based on the first 12 bases (the Nucleus Barcode or NB), and the molecule of origin, based on the next 8 bases (Unique Molecular Index or UMI).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "COMPUTATIONAL DATA ANALYSIS, Read filtering and alignment, b00046", "basis": "text", "support": "reported", "quote": "Reads were first filtered by quality score, and the right mate of each read pair was trimmed and aligned to the genome (mouse mm10 UCSC, human hg19 UCSC) using STAR v2.4.0a24.", "bbox": null, "rationale": null}]}, {"target": "state_property:sequence_reads:type", "verdict": "supported", "action": "accept", "rationale": "data_type sequence_reads applies to the self data State and is directly supported by primary paired-end sequencing and read-processing passages.", "evidence": [{"source_id": "primary:paper:28846088", "locator": "ONLINE METHODS, Sequencing, b00042", "basis": "text", "support": "reported", "quote": "We used NextSeq 75 cycle v3 kits to sequence 20bp and 64bp paired-end reads, with Custom Read1 primer7.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:28846088", "locator": "COMPUTATIONAL DATA ANALYSIS, Read filtering and alignment, b00046", "basis": "text", "support": "reported", "quote": "Briefly, the left read was used to infer both the cell of origin, based on the first 12 bases (the Nucleus Barcode or NB), and the molecule of origin, based on the next 8 bases (Unique Molecular Index or UMI).", "bbox": null, "rationale": null}]}]}, "sources": {"poster_5bdabfe8dde0c18b68e6dc6e::card:poster_5bdabfe8dde0c18b68e6dc6e": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/applications/ngs-library-prep/for-all-you-seq-single-cell.pdf", "title": "DroNC-Seq", "text_characters": 20, "text_sha256": "d965aab11630656c6d1a024dc3167d4c9566dd91e141d7e35fcb40cef3efd148"}, "poster_5bdabfe8dde0c18b68e6dc6e::diagram:poster_crop_247fc1df04a435876d7c24eb": {"kind": "image", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/poster_sources_06/imports/5e/5e0ab3dc70eaccdf2fb9642b062239c6c40baa332518801a656ed9829b22ac05.png", "sha256": "5e0ab3dc70eaccdf2fb9642b062239c6c40baa332518801a656ed9829b22ac05", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/applications/ngs-library-prep/for-all-you-seq-single-cell.pdf", "content_level": "diagram", "original": {"asset_id": "poster_crop_247   const checks = record.review?.checks?.filter(x=>x.target===target || x.target===labelTarget) || [];

  if (checks.length) raw(parent,'Recorded review of this target',checks);
  raw(parent,'Exact JSON record',item);
}
function drawGraph(parent, inspector, record) {
  const c = record.candidate, nodes = [...c.states.map(x=>({...x,type:'State'})),...c.operations.map(x=>({...x,type:'Operation'}))];
  const ids = new Set(nodes.map(x=>x.id)), incoming = new Map(nodes.map(x=>[x.id,0])), next = new Map(nodes.map(x=>[x.id,[]]));
  for (const f of c.flows) { if (!ids.has(f.source)||!ids.has(f.target)) { parent.append(el('p','Cannot draw: a Flow endpoint is missing. Inspect the raw record.','warning')); return; } incoming.set(f.target,incoming.get(f.target)+1);next.get(f.source).push(f.target); }
  const rank = new Map(nodes.map(x=>[x.id,0])), ready = nodes.filter(x=>incoming.get(x.id)===0).map(x=>x.id); let processed=0;
  while (ready.length) { const id = ready.shift(); processed++;for (const target of next.get(id)) { rank.set(target,Math.max(rank.get(target),rank.get(id)+1)); incoming.set(target,incoming.get(target)-1);if (!incoming.get(target)) ready.push(target); } }
  if (processed !== nodes.length) { parent.append(el('p','A cycle prevents a left-to-right layout. Use the exact Flow records below.','warning'));return; }
  const NS='http://www.w3.org/2000/svg', svg=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};
  const pos = new Map(), lanes = new Map();
  for (const n of nodes) { const col=rank.get(n.id),row=lanes.get(col)||0;lanes.set(col,row+1);pos.set(n.id,{x:25+col*224,y:25+row*112}); }
  const canvas=svg('svg',{width:Math.max(680,Math.max(...rank.values())*224+240),height:Math.max(150,Math.max(...lanes.values())*112+30),role:'img','aria-label':'Directed State and Operation workflow'});
  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
