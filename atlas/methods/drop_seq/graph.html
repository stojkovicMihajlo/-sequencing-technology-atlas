 the Macosko 2015 implementation verified in the primary paper. The single-cell/poly(A) inset describes the biological target, and the oligo drawing describes bead primer architecture; neither is a separate extraction or bead-synthesis action block. Yellow highlighting marks the RNA protocol target, not an added reagent. The shared constant sequence, bead-specific cell barcode, primer-specific UMI and oligo(dT) explain what the colored legend conveys. CytoSeq, CLaP and Hi-SCL occupy separate poster rows and are outside this extraction. Recovery includes droplet disruption as established by primary text. The broad cDNA block includes the supported interface to a sequenceable library without splitting unshown routine preparation steps.", "evidence": [{"source_id": "drop-seq::diagram:asset_bc7a95d1843c8278ac25c18b", "locator": "Left: Single cell → poly(A)-tailed RNA inset with yellow-highlighted transcript; caption Analyze mRNA transcripts from individual cells in droplets (Drop-seq); Cell suspension icons", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 0.2, 1.0], "rationale": null}, {"source_id": "drop-seq::diagram:asset_bc7a95d1843c8278ac25c18b", "locator": "Left-center bead-attached oligo legend: Oligo dT, Molecular index, Cell label, Universal; two colored bead examples captioned Each bead with unique oligos", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.215, 0.0, 0.375, 0.92], "rationale": null}, {"source_id": "poster_1fcf501faf1682cf757ab309::diagram:poster_crop_74bf8e691501efe5779d6280", "locator": "Lower Drop-Seq row only: poly(A) target inset, cell suspension, oligo legend and distinct beads, droplet loading, lysis/capture, bead pooling, cDNA synthesis/amplification, Sequence, Barcoded mRNA from single cells; bottom Key states yellow highlights indicate protocol target", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.015, 0.38, 0.899, 0.922], "rationale": null}, {"source_id": "poster_3d6d7a 0.866, 0.13, 1.0, 0.95], "rationale": null}, {"source_id": "primary:paper:26000488", "locator": "Figure 2C caption b00112: paired read identities", "basis": "text", "support": "reported", "quote": "The first read yields the cell barcode and UMI. The second, paired read interrogates sequence from the cDNA (50 bp is typically sequenced); this sequence is then aligned to the genome to determine a transcript’s gene of origin.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26000488", "locator": "Results b00017: molecular attribution and duplicate avoidance", "basis": "text", "support": "reported", "quote": "We digitally count the number of mRNA transcripts of each gene ascertained in each cell, using the UMIs to avoid double-counting sequence reads that arose from the same mRNA transcript.", "bbox": null, "rationale": null}]}, {"target": "state_property:reads:identity", "verdict": "supported", "action": "accept", "rationale": "Self identifies sequence data derived from the barcoded cDNA library. This implements the primary-supported terminal identity correction rather than labeling the readout as mRNA material.", "evidence": [{"source_id": "drop-seq::diagram:asset_bc7a95d1843c8278ac25c18b", "locator": "Arrow labeled Sequence after cDNA synthesis and amplification; terminal black lines captioned Barcoded mRNA from single cells.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.866, 0.13, 1.0, 0.95], "rationale": null}, {"source_id": "primary:paper:26000488", "locator": "Experimental Procedures b00056: cDNA-to-sequencing-library interface", "basis": "text", "support": "reported", "quote": "The cDNA was fragmented and amplified for sequencing with the Nextera XT DNA sample prep kit (Illumina) using custom primers that enabled the specific amplification of only the 3’ ends (Table S6).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26000488", "locator": "Figure 2C caption b00112: paired read identities", "basis": "text", "support": "reported", "quote": "The first read yields the cell barcode and UMI. The second, paired read interrogates sequence from the cDNA (50 bp is typically sequenced); this sequence is then aligned to the genome to determine a transcript’s gene of origin.", "bbox": null, "rationale": null}]}, {"target": "state_property:reads:measurement_limits", "verdict": "supported", "action": "accept", "rationale": "The locally defined data property correctly records incomplete capture and possible ambient-RNA and multiple-cell contributions, all directly documented in the scoped primary. It does not impose unshown analysis settings.", "evidence": [{"source_id": "primary:paper:26000488", "locator": "Results b00026: measured incomplete capture", "basis": "text", "support": "reported", "quote": "Using this approach we calculated a capture rate of 12.8% for Drop-Seq (Figure 3G).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26000488", "locator": "Results b00024: ambient RNA contribution", "basis": "text", "support": "reported", "quote": "The largest source of single-cell impurity appeared to be ambient RNA that is present in the cell suspension (a first step of almost all single-cell methods) and presumably results from cells that are damaged during preparation (Figure S3D).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26000488", "locator": "Results b00022: multiple-cell droplet limitation", "basis": "text", "support": "reported", "quote": "This reflects the greater chance at higher cell concentrations that a droplet could encapsulate multiple cells.", "bbox": null, "rationale": null}]}, {"target": "state_property:reads:molecule_assignment", "verdict": "supported", "action": "accept", "rationale": "Attribution uses UMI with cell barcode and transcript information. The primary explains gene/cell counting and avoidance of duplicate reads from one captured mRNA; the candidate describes supported downstream interpretation without inventing a depicted analysis operation.", "evidence": [{"source_id": "primary:paper:26000488", "locator": "Figure 2C caption b00112: paired read identities", "basis": "text", "support": "reported", "quote": "The first read yields the cell barcode and UMI. The second, paired read interrogates sequence from the cDNA (50 bp is typically sequenced); this sequence is then aligned to the genome to determine a transcript’s gene of origin.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26000488", "locator": "Results b00017: molecular attribution and duplicate avoidance", "basis": "text", "support": "reported", "quote": "We digitally count the number of mRNA transcripts of each gene ascertained in each cell, using the UMIs to avoid double-counting sequence reads that arose from the same mRNA transcript.", "bbox": null, "rationale": null}]}, {"target": "state_property:reads:type", "verdict": "supported", "action": "accept", "rationale": "sequence_reads is the correct data_type for self at the sequencing output; the primary describes first and second paired reads.", "evidence": [{"source_id": "primary:paper:26000488", "locator": "Figure 2C caption b00112: paired read identities", "basis": "text", "support": "reported", "quote": "The first read yields the cell barcode and UMI. The second, paired read interrogates sequence from the cDNA (50 bp is typically sequenced); this sequence is then aligned to the genome to determine a transcript’s gene of origin.", "bbox": null, "rationale": null}]}]}, "sources": {"drop-seq::card:drop-seq": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/drop-seq.html", "title": "Drop-Seq", "text_characters": 4854, "text_sha256": "aedc12bbc76fe2adffdbb9787e3bcf0188cb908fdbf53b448ce44360cf665230"}, "drop-seq::collection:rna:page:110": {"kind": "text", "content_level": "catalogue", "path": "/scratch/groups/xiaojie/mstojkov/agents_sn tojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/49/49ed3d25dbf3a64be69d8616a2b1230709af23d57c9e9acbd814c1519ad23703.xml", "sha256": "49ed3d25dbf3a64be69d8616a2b1230709af23d57c9e9acbd814c1519ad23703"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/54/54105986c6b64b10f9cd2738c362a1416b8d8ac2ab0c5ca9d3629701d1a2c61b.json", "sha256": "54105986c6b64b10f9cd2738c362a1416b8d8ac2ab0c5ca9d3629701d1a2c61b"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/9b/9b688d3e23adc095547de6fa575226d76eef9b6f9d46e79572f8100f8163ba7c.xml", "sha256": "9b688d3e23adc095547de6fa575226d76eef9b6f9d46e79572f8100f8163ba7c"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/f6/f64213ee7f0d6f4964ccbb3e4e54406df91abac2a9b27b86e19dac17e5a9ea0f.txt", "sha256": "f64213ee7f0d6f4964ccbb3e4e54406df91abac2a9b27b86e19dac17e5a9ea0f"}], "association_status": "selected_primary_candidate; extraction reviewer must confirm method/version scope", "text_characters": 57924, "text_sha256": "f64213ee7f0d6f4964ccbb3e4e54406df91abac2a9b27b86e19dac17e5a9ea0f"}, "drop-seq::reference:pilot_selected_primary": {"kind": "text", "content_level": "metadata", "pmid": "26000488", "association_status": "unverified_selected_primary_candidate", "text_characters": 135, "text_sha256": "4d74563d8c93253a25203ce4fdf60bdaa11a856ff4c859e8ac4110265f68e22e"}}, "card": {"record_id": "drop_seq", "source_title": "Drop-seq", "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/drop-seq.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/drop-seq.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA Low-Level Detection", "source_category_path": ["Transcriptome", "RNA Low-Level Detection"], "description_verbatim": "Drop-Seq analyzes mRNA transcripts from droplets of individual cells in a highly parallel fashion. This single-cell sequencing method uses a microfluidic device to compartmentalize droplets containing a single cell, lysis buffer, and a microbead covered with barcoded primers. Each primer contains: 1) a 30 bp oligo(dT) sequence to bind mRNAs; 2) an 8 bp molecular index to identify each mRNA strand uniquely; 3) a 12 bp barcode unique to each cell and 4) a universal sequence identical across all beads. Following compartmentalization, cells in the droplets are lysed and the released mRNA hybridizes to the oligo(dT) tract of the primer beads. Next, all droplets are pooled and broken to release the beads within. After the beads are isolated, they are reverse-transcribed with template switching. This generates the first cDNA strand with a PCR primer sequence in place of the universal sequence. cDNAs are PCR-amplified, and sequencing adapters are added using the Nextera XT Library Preparation Kit. The barcoded mRNA samples are ready for sequencing.\nSimilar methods: CEL-Seq, Quartz-Seq, MARS-Seq, CytoSeq, inDrop, Hi-SCL.", "advantages_verbatim": ["Analyze sequences of single-cells in a highly parallel manner", "Unique molecular and cell barcodes enables cell and gene specific identification of mRNA strands", "Reverse transcription with template-switching PCR produce high-yield reads from single cells", "Low cost - $0.07 per cell ($653 per 10,000 cells) and fast library prep (10,000 cells per day)"], "limitations_verbatim": ["Requires custom microfluidics device to perform droplet separation", "Low gene-per-cell sensitivity compared to other scRNA-Seq methods1", "Limited to mRNA transcripts"], "source_sections": [{"source_locator": "jcr:content/par/text_2/text", "text": "Drop-Seq"}, {"source_locator": "jcr:content/par/text/text", "text": ""}, {"source_locator": "jcr:content/par/text_0/text", "text": "Method Category: Transcriptome > RNA Low-Level Detection\nDescription: Drop-Seq analyzes mRNA transcripts from droplets of individual cells in a highly parallel fashion. This single-cell sequencing method uses a microfluidic device to compartmentalize droplets containing a single cell, lysis buffer, and a microbead covered with barcoded primers. Each primer contains: 1) a 30 bp oligo(dT) sequence to bind mRNAs; 2) an 8 bp molecular index to identify each mRNA strand uniquely; 3) a 12 bp barcode unique to each cell and 4) a universal sequence identical across all beads. Following compartmentalization, cells in the droplets are lysed and the released mRNA hybridizes to the oligo(dT) tract of the primer beads. Next, all droplets are pooled and broken to release the beads within. After the beads are isolated, they are reverse-transcribed with template switching. This generates the first cDNA strand with a PCR primer sequence in place of the universal sequence. cDNAs are PCR-amplified, and sequencing adapters are added using the Nextera XT Library Preparation Kit. The barcoded mRNA samples are ready for sequencing.\nSimilar methods: CEL-Seq, Quartz-Seq, MARS-Seq, CytoSeq, inDrop, Hi-SCL.\nPros:\nAnalyze sequences of single-cells in a highly parallel manner\nUnique molecular and cell barcodes enables cell and gene specific identification of mRNA strands\nReverse transcription with template-switching PCR produce high-yield reads from single cells\nLow cost - $0.07 per cell ($653 per 10,000 cells) and fast library prep (10,000 cells per day)\nCons:\nRequires custom microfluidics device to perform droplet separation\nLow gene-per-cell sensitivity compared to other scRNA-Seq methods1\nLimited to mRNA transcripts"}, {"source_locator": "jcr:content/par/text_1/text", "text": "Drop-Seq: Macosko E. Z., Basu A., Satija R., Nemesh J., Shekhar K., et al. (2015) Highly Parallel Genome-wide Expression Profiling of Individual Cells Using Nanoliter Droplets. Cell 161: 1202-1214\n1. Ziegenhain C., Parekh S., Vieth B., Smets M., Leonhardt H., et al. (2016) Comparative analysis of single-cell RNA-sequencing methods. bioRxiv"}, {"source_locator": "jcr:content/par/text_3/text", "text": "Featured Products:\nNextera XT DNA Library Preparation Kit"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Related Content:\nLibrary Preparation\nGene Expression Transcriptome Analysis\nRelated Publications:\nBowen J. R., Ferris M. T. and Suthar M. S. Systems biology: A tool for charting the antiviral landscape. Virus Res. 2016;\nChaitankar V., Karakulah G., Ratnapriya R., Giuste F. O., Brooks M. J. and Swaroop A. Next generation sequencing technology and genomewide data analysis: Perspectives for retinal research. Prog Retin Eye Res. 2016;\nZhao Q.-Y., Gratten J., Restuadi R. and Li X. Mapping and differential expression analysis from short-read RNA-Seq data in model organisms. Quantitative Biology. 2016;4:22-35\nConesa A., Madrigal P., Tarazona S., Gomez-Cabrero D., Cervera A., et al. A survey of best practices for RNA-seq data analysis. Genome Biol. 2016;17:13\nFriedensohn S., Khan T. A. and Reddy S. T. Advanced Methodologies in High-Throughput Sequencing of Immune Repertoires. Trends in Biotechnology. 2017;35:203-214\nPoulin J. F., Tasic B., Hjerling-Leffler J., Trimarchi J. M. and Awatramani R. Disentangling neural cell diversity using single-cell transcriptomics. Nat Neurosci. 2016;19:1131-1141\nGrun D. and van Oudenaarden A. Design and Analysis of Single-Cell Sequencing Experiments. Cell. 2015;163:799-810\nSaadatpour A., Lai S., Guo G. and Yuan G. C. Single-Cell Analysis in Cancer Genomics. Trends Genet. 2015;31:576-586\nAlizadeh A. A., Aranda V., Bardelli A., et al. Toward understanding and exploiting tumor heterogeneity. Nat Med. 2015;21:846-853\nZiegenhain C., Parekh S., Vieth const $ = id => document.getElementById(id);
const el = (tag, text, cls) => { const n = document.createElement(tag); if (text != null) n.textContent = text; if (cls) n.className = cls; return n; };
const labels = {supported:'Supported', research_needed:'Further research', failed:'Failed', integrity_error:'Rejected on revalidation'};
const batchLabel = b => ({initial_two:'Catalogue card', catalogue:'Catalogue card', posters:'Main poster row', footer_panels:'Footer / product / readout panel', scoped_method:'Scoped workflow'})[b] || b;
let inventory = [], selected = '', request = 0;
function link(text, url) { const a = el('a',text); if (/^https?:\/\//.test(url || '')) { a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; } return a; }
function section(parent, title) { const d = el('details',null,'section'); d.append(el('summary',title)); parent.append(d); return d; }
function raw(parent, title, value) { const d = section(parent,title); d.append(el('pre',JSON.stringify(value,null,2))); }
function fields(parent, rows) { const d = el('div',null,'fields'); for (const [name,value] of rows) { if (value == null || value === '' || (Array.isArray(value) && !value.length)) continue; d.append(el('b',name),el('span',Array.isArray(value) ? value.join('; ') : String(value))); } parent.append(d); }
function assertions(parent,title,items,record) {
  if(!items?.length)return;
  const box=section(parent,title);
  for(const item of items){
    fields(box,Object.entries(item).filter(([k])=>k!=='evidence').map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):v]));
    evidence(box,item.evidence,record);
  }
}
function evidence(parent, items, record) {
  for (const e of items || []) {
    const box = el('div',null,'evidence'), s = record.sources[e.source_id] || {};
    box.append(link(s.title || e.source_id,s.url),el('p',`${e.support} · ${s.content_level || e.basis} · ${e.locator}`,'muted'));
    if (e.quote) box.append(el('blockquote',e.quote));
    if (e.bbox) box.append(el('p','Image region [left, top, right, bottom]: '+e.bbox.join(', '),'muted'));
    if (e.rationale) box.append(el('p',e.rationale));
    parent.append(box);
  }
}
function filterRecords() {
  const q = $('search').value.toLowerCase(), status = $('status').value, batch = $('batch').value;
  const found = inventory.filter(r => (status === 'all' || r.status === status) &&
    (batch === 'all' || (batch === 'catalogue' ? ['initial_two','catalogue'].includes(r.batch) : r.batch === batch)) &&
    [r.title,r.record_id,...r.method_names,...r.category].join(' ').toLowerCase().includes(q));
  $('count').textContent = found.length+' source depictions'; $('records').replaceChildren();
  for (const r of found) {
    const b = el('button',r.title,r.record_id === selected ? 'active' : '');
    b.append(el('small',batchLabel(r.batch)+' · '+labels[r.status]));
    b.type = 'button';
    b.setAttribute('aria-controls', 'detail');
    b.setAttribute('aria-pressed', String(r.record_id === selected));
    b.onclick = () => {
      // Load directly, including a second click on the current record. A hash
      // change alone neither retries that record nor reveals an offscreen panel.
      const hash = '#' + encodeURIComponent(r.record_id);
      try { if (location.hash !== hash) window.history.pushState(null, '', hash); } catch (_) { /* Navigation still works without URL access. */ }
      return openRecord(r.record_id, {reveal: true});
    };
    $('records').append(b);
  }
}
function inspect(parent, item, kind, record) {
  const c = record.candidate;
  item = (kind === 'Flow' ? c.flows : kind === 'State' ? c.states : c.operations).find(x => x.id === item.id) || item;
  parent.replaceChildren(el('span',kind,'badge'),el('h3',item.label || item.id));
  const states = new Map(c.states.map(s => [s.id,s]));
  const names = ids => (ids || []).map(id => (states.get(id)?.label || id)+' ['+id+']');
  if (kind === 'Operation') fields(parent,[['Description',item.description],['Input States',names(item.inputs)],['Output States',names(item.outputs)],['Mechanism',item.mechanism || 'Not specified'],['Information effect',item.information_effect || 'Not specified']]);
  if (kind === 'State') fields(parent,[['Kind',item.kind],['Features',item.features]]);
  if (kind === 'State') { assertions(parent,'State properties',item.properties,record); if(item.constituents?.length)raw(parent,'Named constituents',item.constituents); }
  if (kind === 'Operation') { assertions(parent,'Input roles',item.input_roles,record); assertions(parent,'Effects on input/output States',item.effects,record); }
  if (kind === 'Flow') {
    const nodes = [...c.states,...c.operations], name = id => nodes.find(n => n.id === id)?.label || id;
    fields(parent,[['Type',item.kind],['From',name(item.source)+' ['+item.source+']'],['To',name(item.target)+' ['+item.target+']']]);
  }
  fields(parent,[['Local ID',item.id]]);
  const target = kind.toLowerCase()+':'+item.id;
  const affected = c.corrections.filter(x=>x.target_id===target), unknowns = c.unknowns.filter(x=>x.affected_ids.includes(target));
  for (const x of affected) parent.append(el('p','Correction: '+x.primary_statement,'warning'));
  for (const x of unknowns) parent.append(el('p','Unknown: '+x.question,'warning'));
  parent.append(el('h3','Evidence for this record')); evidence(parent,item.evidence,record);
  const labelTarget = kind.toLowerCase()+'_label:'+item.id;
  const checks = record.review?.checks?.filter(x=>x.target===target || x.target===labelTarget) || [];
  if (kind !== 'Flow' && !checks.some(x=>x.target===labelTarget)) parent.append(el('p','This archived review did not separately assess the label. Corrections and features remain part of its interpretation.','muted'));
  if (checks.length) raw(parent,'Recorded review of this target',checks);
  raw(parent,'Exact JSON record',item);
}
function drawGraph(parent, inspector, record) {
  const c = record.candidate, nodes = [...c.states.map(x=>({...x,type:'State'})),...c.operations.map(x=>({...x,type:'Operation'}))];
  const ids = new Set(nodes.map(x=>x.id)), incoming = new Map(nodes.map(x=>[x.id,0])), next = new Map(nodes.map(x=>[x.id,[]]));
  for (const f of c.flows) { if (!ids.has(f.source)||!ids.has(f.target)) { parent.append(el('p','Cannot draw: a Flow endpoint is missing. Inspect the raw record.','warning')); return; } incoming.set(f.target,incoming.get(f.target)+1);next.get(f.source).push(f.target); }
  const rank = new Map(nodes.map(x=>[x.id,0])), ready = nodes.filter(x=>incoming.get(x.id)===0).map(x=>x.id); let processed=0;
  while (ready.length) { const id = ready.shift(); processed++;for (const target of next.get(id)) { rank.set(target,Math.max(rank.get(target),rank.get(id)+1)); incoming.set(target,incoming.get(target)-1);if (!incoming.get(target)) ready.push(target); } }
  if (processed !== nodes.length) { parent.append(el('p','A cycle prevents a left-to-right layout. Use the exact Flow records below.','warning'));return; }
  const NS='http://www.w3.org/2000/svg', svg=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};
  const pos = new Map(), lanes = new Map();
  for (const n of nodes) { const col=rank.get(n.id),row=lanes.get(col)||0;lanes.set(col,row+1);pos.set(n.id,{x:25+col*224,y:25+row*112}); }
  const canvas=svg('svg',{width:Math.max(680,Math.max(...rank.values())*224+240),height:Math.max(150,Math.max(...lanes.values())*112+30),role:'img','aria-label':'Directed State and Operation workflow'});
  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
