 miR-CLIP/irCLIP workflows, their adapter legends and right-side chemical structures do not belong to this route. Primary evidence resolves two distinct ligations around reverse transcription. The graph ends at physical cDNA, without asserting that sequencing has occurred. The primary implementation subsequently amplifies and sequences this material; paired-end RNA-derived sequences locate selected RBP-associated RNA and crosslink-associated cDNA ends, while the random-mer helps distinguish PCR duplicates. This does not establish perfect specificity or crosslink coverage. SMInput is a separately prepared background-normalization control; IgG was a tested control poorly suited to normalization. Neither control is a branch in these supplied depictions. ASO perturbations, knockdown/microarray assays and RNase-dose comparisons are validation experiments, not required operations in the depicted route. The broad purification block includes the primary paper-supported gel/membrane interface without adding its routine execution details.", "evidence": [{"source_id": "eclip::diagram:asset_7d79f8f9611d3b4082d8cc17", "locator": "Left title icon: Enhanced crosslinking and immunoprecipitation (e CLIP); an overview icon, not an extra operation", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 0.13, 1.0], "rationale": null}, {"source_id": "poster_e58c11f6011fb3b0ae4969da::diagram:poster_crop_23da43cee249283e1131e658", "locator": "Middle row labelled eCLIP: Left title icon: Enhanced crosslinking and immunoprecipitation (e CLIP); an overview icon, not an extra operation", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.1, 0.39, 0.20400000000000001, 0.65], "rationale": null}, {"source_id": "eclip::collection:rna:page:54", "locator": "Heading and figure caption", "basis": "text", "support": "reported", "quote": "eCLIP: Enhanced Cross-linking Immunoprecipitation", "bbox": null, "rationale": null}, {"source_id": "eclip::collection:rna:page:54  "eclip::paper:27068461", "locator": "Registered abstract; eCLIP application rather than full protocol evidence", "basis": "text", "support": "reported", "quote": "Using enhanced UV crosslinking and immunoprecipitation (eCLIP), we identify RNA targets of the IMP/IGF2BP family of RNA-binding proteins in hPSCs.", "bbox": null, "rationale": "An explicitly named eCLIP application; the registered abstract does not verify adapter chemistry or broaden this assigned implementation to RNA Bind-N-seq."}]}], "corrections": [{"id": "resolve_final_panel", "target_id": "operation:cdna_adapter_ligate", "diagram_observation": "Both depictions place P5, P7 and Random oligo labels together above a panel captioned Reverse transcription, followed by a cDNA endpoint. They do not draw a separate post-reverse-transcription DNA adapter-ligation block.", "primary_statement": "The scoped eCLIP implementation ligates an indexed RNA adapter to captured RNA first, reverse transcribes the recovered RNA, and then ligates a second ssDNA adapter to the cDNA 3′ end. N5/N10 is in that second DNA adapter, not evidence of a random reverse-transcription primer. The actual graph therefore represents reverse_transcribe followed by cdna_adapter_ligate, with an intervening cDNA State.", "disposition": "use_primary", "evidence": [{"source_id": "eclip::diagram:asset_7d79f8f9611d3b4082d8cc17", "locator": "Reverse transcription panel labelled P5, P7 and Random oligo, followed by arrow to blue cDNA line", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.81, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "poster_e58c11f6011fb3b0ae4969da::diagram:poster_crop_23da43cee249283e1131e658", "locator": "Middle row labelled eCLIP: Reverse transcription panel labelled P5, P7 and Random oligo, followed by arrow to blue cDNA line", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.7480000000000001, 0.39, 0.9, 0.65], "rationale": null}, {"source_id": "primary:paper:27018577", "locator": " eeded for that additional claim; no random-priming mechanism or exact P5/P7 placement is asserted here.", "blocking": false, "affected_ids": ["operation:reverse_transcribe", "state:adapter_ligated_cdna"]}]}, "review": {"format_version": "illumina_diagram_review/1.2", "record_id": "eclip", "candidate_sha256": "805e7dee7b6d25d5f589a24db835de8b764857b6161b595ad1a3f8ce0557c69a", "inspected_sources": ["eclip::diagram:asset_7d79f8f9611d3b4082d8cc17", "poster_e58c11f6011fb3b0ae4969da::diagram:poster_crop_23da43cee249283e1131e658", "eclip::card:eclip", "eclip::collection:rna:page:54", "primary:paper:27018577", "eclip::paper:27018577", "eclip::metadata:27243472", "eclip::paper:27503141", "eclip::paper:27909578", "eclip::paper:27847391", "eclip::paper:26990993", "eclip::paper:27068461", "poster_e58c11f6011fb3b0ae4969da::reference:poster_e58c11f6011fb3b0ae4969da:references:0"], "checks": [{"target": "record", "verdict": "supported", "action": "accept", "rationale": "The sole target is eCLIP in the Van Nostrand implementation. All depicted transformations are represented with physical-material interfaces, including RNA recovery and the primary-resolved post-RT DNA adapter step. The RNA analyte, cDNA carrier, frequent crosslink-associated termination and random-mer attribution remain distinct. Source levels and specificity limits are retained. Controls and validation experiments are explained without being invented as diagram branches. The remaining P5/P7 geometry question does not affect the asserted architecture.", "evidence": [{"source_id": "eclip::diagram:asset_7d79f8f9611d3b4082d8cc17", "locator": "Complete eCLIP strip: title icon, RNA-protein complex, UV 254 nm, RNase I, immunoprecipitation, 3′ adapter ligation, purification/proteinase K, RNA extraction, reverse transcription and cDNA", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "poster_e58c11f6011fb3b0ae4969da::diagram:poster_crop_23da43cee249283e1131e658", "locator": "Complete middle row labelled eCLIP; separate miR-CLIP and irCLIP rows and right-side chemical drawings lie outside it", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Results b00007, opening sentence", "basis": "text", "support": "reported", "quote": "Here we describe enhanced CLIP (eCLIP), which modifies the iCLIP method to include improvements in library preparation of RNA fragments as described by Shishkin, et al.7.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Results b00007, eCLIP ligations on opposite sides of reverse transcription", "basis": "text", "support": "reported", "quote": "We observed that circular ligation as used in iCLIP is often inefficient, and modified this step to add adapters as two separate steps: an indexed 3′ RNA adapter is ligated to the crosslinked RNA fragment while on the immunoprecipitation beads, and a 3′ ssDNA adapter is ligated after reverse transcription (see Methods).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Figure 1 caption b00089, paired-end library barcode and RNA-sequence interpretation", "basis": "text", "support": "reported", "quote": "RNA is further prepared into paired-end high-throughput sequencing libraries, where read 1 begins with the inline barcode and read 2 begins with a random-mer sequence (added during the 3′ DNA adapter ligation) followed by sequence corresponding to the 5′ end of the original RNA fragment (which often marks reverse transcriptase termination at the crosslink site (red X)).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Results b00014, paired size-matched input purpose", "basis": "text", "support": "reported", "quote": "This “size-matched input control (SMInput)” serves as a crucial control for non-specific background signal in the identical size range on the membrane as well as any inherent biases in ligations, RT-PCR, gel migration and transfer steps.", "bbox": null, "rationale": null}]}, {"target": "construction", "verdict": "supported", "action": "accept", "rationale": "Tracing both images gives one eCLIP route, with no independently routed fractions or joint multi-input operation. The left named overview icon is not a second preparation step. The UV/lysis and separately captioned RNase I blocks produce successive supported interfaces, not duplicate digestions. Purification, proteolysis and RNA recovery can remain one composite block because no distinct intermediate preparation is routed between them. The additional cDNA boundary and ligation resolve the compressed terminal drawing using the scoped primary implementation. No pooling, waste stream, sequence-data node or neighboring-method branch is invented.", "evidence": [{"source_id": "eclip::diagram:asset_7d79f8f9611d3b4082d8cc17", "locator": "Complete eCLIP strip: title icon, RNA-protein complex, UV 254 nm, RNase I, immunoprecipitation, 3′ adapter ligation, purification/proteinase K, RNA extraction, reverse transcription and cDNA", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "poster_e58c11f6011fb3b0ae4969da::diagram:poster_crop_23da43cee249283e1131e658", "locator": "Complete middle row labelled eCLIP; separate miR-CLIP and irCLIP rows and right-side chemical drawings lie outside it", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Methods b00033, crosslinking, lysis, RNase I and capture order", "basis": "text", "support": "reported", "quote": "RNA binding protein (RBP)-RNA interactions were stabilized with UV crosslinking (254 nm, 400 mJ/cm2), followed by lysis in iCLIP lysis buffer, limited digestion with RNase I (Ambion), immunoprecipitation of RBP-RNA complexes with a specific primary antibody of interest using magnetic beads with pre-coupled secondary antibody (typically M-280 Sheep Anti-Rabbit IgG Dynabeads, ThermoFisher Scientific 11204D), and stringent washes.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Methods b00033, protein-gel/membrane purification before proteinase K and RNA isolation", "basis": "text", "support": "reported", "quote": "Samples were then run on standard protein gels and transferred to nitrocellulose membranes, and a region 75 kDa (~150 nt of RNA) above the protein size was isolated and proteinase K (NEB) treated to isolate RNA.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Results b00007, eCLIP ligations on opposite sides of reverse transcription", "basis": "text", "support": "reported", "quote": "We observed that circular ligation as used in iCLIP is often inefficient, and modified this step to add adapters as two separate steps: an indexed 3′ RNA adapter is ligated to the crosslinked RNA fragment while on the immunoprecipitation beads, and a 3′ ssDNA adapter is ligated after reverse transcription (see Methods).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Methods b00033, second adapter identity, random-mer placement and cDNA attachment end", "basis": "text", "support": "reported", "quote": "A second DNA adapter (containing a random-mer of 5 (N5) or 10 (N10) random bases at the 5′ end) was then ligated to the cDNA fragment 3′ end (T4 RNA Ligase, NEB)", "bbox": null, "rationale": null}]}, {"target": "scope:eCLIP", "verdict": "supported", "action": "accept", "rationale": "The card title, verified collection heading/caption and poster middle-row label identify eCLIP alone. All seven operations have input histories compatible with this 2016 implementation. iCLIP in the paper explains method context; miR-CLIP, irCLIP and chemical legends in neighboring image regions do not become target methods. SMInput is a separate background-nor l, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Methods b00033, protein-gel/membrane purification before proteinase K and RNA isolation", "basis": "text", "support": "reported", "quote": "Samples were then run on standard protein gels and transferred to nitrocellulose membranes, and a region 75 kDa (~150 nt of RNA) above the protein size was isolated and proteinase K (NEB) treated to isolate RNA.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Results b00007, eCLIP ligations on opposite sides of reverse transcription", "basis": "text", "support": "reported", "quote": "We observed that circular ligation as used in iCLIP is often inefficient, and modified this step to add adapters as two separate steps: an indexed 3′ RNA adapter is ligated to the crosslinked RNA fragment while on the immunoprecipitation beads, and a 3′ ssDNA adapter is ligated after reverse transcription (see Methods).", "bbox": null, "rationale": null}]}, {"target": "flow:purify_proteolyze_to_extracted_rna", "verdict": "supported", "action": "accept", "rationale": "The outgoing route yields the extracted RNA line retaining its red adapter after protein digestion. The RNA output has no asserted intact bead/protein attachment, and it is correctly the following RT template.", "evidence": [{"source_id": "eclip::diagram:asset_7d79f8f9611d3b4082d8cc17", "locator": "Purify and proteinase K digest caption, protease icon and arrow from adapter-bearing complex toward extracted RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "eclip::diagram:asset_7d79f8f9611d3b4082d8cc17", "locator": "RNA extraction boundary: purple RNA line retains red terminal adapter; intact protein/support no longer depicted", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Methods b00033, protein-gel/membrane purification before proteinase K and RNA isolation", "basis": "text", "support": "reported", "quote": "Samples were then run on standard protein gels and transferred to nitrocellulose membranes, and a region 75 kDa (~150 nt of RNA) above the protein size was isolated and proteinase K (NEB) treated to isolate RNA.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Methods b00033, RNA-to-cDNA interface before second adapter", "basis": "text", "support": "reported", "quote": "RNA was reverse transcribed with AffinityScript (Agilent), and treated with ExoSAP-IT (Affymetrix) to remove excess oligonucleotides.", "bbox": null, "rationale": null}]}, {"target": "flow:extracted_rna_to_reverse_transcribe", "verdict": "supported", "action": "accept", "rationale": "The extracted adapter-bearing RNA is the physical template input to RT. Diagram and primary Methods agree; this is not DNA-adapter ligation or direct sequencing of RNA.", "evidence": [{"source_id": "eclip::diagram:asset_7d79f8f9611d3b4082d8cc17", "locator": "RNA extraction boundary: purple RNA line retains red terminal adapter; intact protein/support no longer depicted", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "eclip::diagram:asset_7d79f8f9611d3b4082d8cc17", "locator": "Terminal Reverse transcription panel: P5, P7 and Random oligo labels on the strand drawing; arrow to blue cDNA endpoint", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Methods b00033, RNA-to-cDNA interface before second adapter", "basis": "text", "support": "reported", "quote": "RNA was reverse transcribed with AffinityScript (Agilent), and treated with ExoSAP-IT (Affymetrix) to remove excess oligonucleotides.", "bbox": null, "rationale": null}]}, {"target": "flow:reverse_transcribe_to_first_strand_cdna", "verdict": "supported", "action": "accept", "rationale": "Under the primary-supported correction, RT first produces RNA-derived cDNA without the second adapter. This material boundary explicitly precedes the DNA-adapter operation and carries possible crosslink-associated end information.", "evidence": [{"source_id": "primary:paper:27018577", "locator": "Methods b00033, RNA-to-cDNA interface before second adapter", "basis": "text", "support": "reported", "quote": "RNA was reverse transcribed with AffinityScript (Agilent), and treated with ExoSAP-IT (Affymetrix) to remove excess oligonucleotides.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Results b00007, frequent RT termination and preservation of positional information", "basis": "text", "support": "reported", "quote": "As reverse transcription often terminates at the RBP:RNA crosslink site, the ligation of the ssDNA adapter to the cDNA fragments at their 3′ end maintains the single-nucleotide resolution of iCLIP.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Methods b00033, second adapter identity, random-mer placement and cDNA attachment end", "basis": "text", "support": "reported", "quote": "A second DNA adapter (containing a random-mer of 5 (N5) or 10 (N10) random bases at the 5′ end) was then ligated to the cDNA fragment 3′ end (T4 RNA Ligase, NEB)", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Results b00007, eCLIP ligations on opposite sides of reverse transcription", "basis": "text", "support": "reported", "quote": "We observed that circular ligation as used in iCLIP is often inefficient, and modified this step to add adapters as two separate steps: an indexed 3′ RNA adapter is ligated to the crosslinked RNA fragment while on the immunoprecipitation beads, and a 3′ ssDNA adapter is ligated after reverse transcription (see Methods).", "bbox": null, "rationale": null}]}, {"target": "flow:first_strand_cdna_to_cdna_adapter_ligate", "verdict": "supported", "action": "accept", "rationale": "Already synthesized cDNA is the substrate of the second ligation. This edge implements the use_primary RT-before-ligation order; it does not preserve a contradictory direct RNA-to-second-adapter path from the compressed drawing.", "evidence": [{"source_id": "primary:paper:27018577", "locator": "Methods b00033, RNA-to-cDNA interface before second adapter", "basis": "text", "support": "reported", "quote": "RNA was reverse transcribed with AffinityScript (Agilent), and treated with ExoSAP-IT (Affymetrix) to remove excess oligonucleotides.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Methods b00033, second adapter identity, random-mer placement and cDNA attachment end", "basis": "text", "support": "reported", "quote": "A second DNA adapter (containing a random-mer of 5 (N5) or 10 (N10) random bases at the 5′ end) was then ligated to the cDNA fragment 3′ end (T4 RNA Ligase, NEB)", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Results b00007, eCLIP ligations on opposite sides of reverse transcription", "basis": "text", "support": "reported", "quote": "We observed that circular ligation as used in iCLIP is often inefficient, and modified this step to add adapters as two separate steps: an indexed 3′ RNA adapter is ligated to the crosslinked RNA fragment while on the immunoprecipitation beads, and a 3′ ssDNA adapter is ligated after reverse transcription (see Methods).", "bbox": null, "rationale": null}]}, {"target": "flow:cdna_adapter_ligate_to_adapter_ligated_cdna", "verdict": "supported", "action": "accept", "rationale": "The ligation produces cDNA with the random-mer DNA adapter attached at the cDNA 3′ end. The final physical preparation and its sequence-based attribution agree with the primary correction and are not mislabeled as sequencing data.", "evidence": [{"source_id": "primary:paper:27018577", "locator": "Methods b00033, second adapter identity, random-mer placement and cDNA attachment end", "basis": "text", "support": "reported", "quote": "A second DNA adapter (containing a random-mer of 5 (N5) or 10 (N10) random bases at the 5′ end) was then ligated to the cDNA fragment 3′ end (T4 RNA Ligase, NEB)", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Results b00007, inline random-mer interpretation", "basis": "text", "support": "reported", "quote": "Furthermore, the ssDNA adapter (rand3Tr3) contains an inline random-mer (either N5 or N10) to distinguish whether two identical sequenced reads indicate two unique RNA fragments or PCR duplicates of the same RNA fragment.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Figure 1 caption b00089, paired-end library barcode and RNA-sequence interpretation", "basis": "text", "support": "reported", "quote": "RNA is further prepared into paired-end high-throughput sequencing libraries, where read 1 begins with the inline barcode and read 2 begins with a random-mer sequence (added during the 3′ DNA adapter ligation) followed by sequence corresponding to the 5′ end of the original RNA fragment (which often marks reverse transcriptase termination at the crosslink site (red X)).", "bbox": null, "rationale": null}, {"source_id": "eclip::diagram:asset_7d79f8f9611d3b4082d8cc17", "locator": "Rightmost cDNA label and blue line; no sequencing-data output or control branch", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}]}, {"target": "paper:van_nostrand_2016", "verdict": "supported", "action": "accept", "rationale": "The explicit card citation and incomplete poster fragment are resolved against the identified full-text paper. The paper itself describes eCLIP and the exact two-ligation implementation, so methods=[eCLIP], content_checked and supports_architecture are justified. Scientific order is supported by the inspected primary passages, not inferred from title, PMID, catalogue citation or date. No invention-date claim is made.", "evidence": [{"source_id": "eclip::card:eclip", "locator": "Method reference entry for eCLIP", "basis": "text", "support": "reported", "quote": "eCLIP: Van Nostrand E. L., Pratt G. A., Shishkin A. A., Gelboin-Burkhart C., Fang M. Y., et al. (2016) Robust transcriptome-wide discovery of RNA-binding protein binding sites with enhanced CLIP (eCLIP). Nat Methods", "bbox": null, "rationale": null}, {"source_id": "poster_e58c11f6011fb3b0ae4969da::reference:poster_e58c11f6011fb3b0ae4969da:references:0", "locator": "Registered eCLIP citation fragment; Poppler layout.txt line879, separated cells7-8", "basis": "text", "support": "reported", "quote": "Van Nostrand EL et al. (2016) Nat Methods advance online", "bbox": null, "rationale": null}, {"source_id": "eclip::paper:27018577", "locator": "Article heading b00001", "basis": "text", "support": "reported", "quote": "Robust transcriptome-wide discovery of RNA binding protein binding sites with enhanced CLIP (eCLIP)", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Results b00007, opening sentence", "basis": "text", "support": "reported", "quote": "Here we describe enhanced CLIP (eCLIP), which modifies the iCLIP method to include improvements in library preparation of RNA fragments as described by Shishkin, et al.7.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", "locator": "Results b00007, eCLIP ligations on opposite sides of reverse transcription", "basis": "text", "support": "reported", "quote": "We observed that circular ligation as used in iCLIP is often inefficient, and modified this step to add adapters as two separate steps: an indexed 3′ RNA adapter is ligated to the crosslinked RNA fragment while on the immunoprecipitation beads, and a 3′ ssDNA adapter is ligated after reverse transcription (see Methods).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27018577", plicing and polyadenylation, and on the stability, translation and structure of mRNAs as mechanisms that produce phenotypic traits.", "bbox": null, "rationale": null}, {"source_id": "eclip::collection:rna:page:54", "locator": "Reviews list on the verified eCLIP page", "basis": "text", "support": "reported", "quote": "The roles of RNA processing in translating genotype to phenotype.", "bbox": null, "rationale": null}]}, {"target": "paper:background_26990993", "verdict": "supported", "action": "accept", "rationale": "The title and registered abstract match the listed antibody-resource article. It describes IP-quality antibody validation resources, not this adapter workflow. Its background relationship and methods=[] are justified despite its presence as a source-row candidate; content_checked is expressly abstract-only.", "evidence": [{"source_id": "eclip::paper:26990993", "locator": "Registered article title and complete abstract; abstract-only scientific evidence", "basis": "text", "support": "reported", "quote": "Using IP followed by immunoblot assays, we have developed a validated repository of 438 commercially available antibodies that interrogate 365 unique RBPs.", "bbox": null, "rationale": null}, {"source_id": "eclip::collection:rna:page:54", "locator": "Reviews list on the verified eCLIP page", "basis": "text", "support": "reported", "quote": "Resources for the Comprehensive Discovery of Functional RNA Elements.", "bbox": null, "rationale": null}]}, {"target": "paper:conway_2016", "verdict": "supported", "action": "accept", "rationale": "The registered abstract identifies an application of eCLIP to IMP/IGF2BP targets in hPSCs, supporting the explicit eCLIP association. The background relationship and abstract-only content_checked limit are appropriate for this Van Nostrand implementation extraction: this abstract does not verify its adapter chemistry. RNA Bind-N-seq is a separately named application in the same paper and does not expand the assigned schematic "6135a2ae9bf99bb169464f53a2b7e435fe13660fcb1ca3be1c0c1477566e2ce5"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/9a/9ae134a11d8fbc380670df5a9296978b45b0850f10a701af8103fc2566590caa.xml", "sha256": "9ae134a11d8fbc380670df5a9296978b45b0850f10a701af8103fc2566590caa"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/fe/fe86b9ed1e837ed9e617a72137e90dcf06feba48d706b3eb7d70b172f55d10cf.txt", "sha256": "fe86b9ed1e837ed9e617a72137e90dcf06feba48d706b3eb7d70b172f55d10cf"}], "association_status": "selected_primary_candidate; extraction reviewer must confirm method/version scope", "text_characters": 50676, "text_sha256": "fe86b9ed1e837ed9e617a72137e90dcf06feba48d706b3eb7d70b172f55d10cf"}, "eclip::reference:pilot_selected_primary": {"kind": "text", "content_level": "metadata", "pmid": "27018577", "association_status": "unverified_selected_primary_candidate", "text_characters": 132, "text_sha256": "80d307629ce56eeef05de894be31b16c87dee201278eff48362ce471b8df1d7d"}}, "card": {"record_id": "eclip", "source_title": "eCLIP", "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/eclip.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/eclip.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA-Protein Interactions", "source_category_path": ["Transcriptome", "RNA-Protein Interactions"], "description_verbatim": "eCLIP maps the binding sites of RBPs on their target RNAs using a modified individual nucleotide resolution CLIP (iCLIP) protocol, improving efficiency and decreasing execution complexity. The hallmark of this method is the ligation of barcoded single-stranded DNA adapters, which reduce amplification bias significantly.\nFirst, RNA and the protein of interest are UV-crosslinked, followed by cell lysis and RNase I digestion. Next, the protein-RNA complexes are immunoprecipitated and ligated to an RNA adapter on the 3' end of the target RNA. The bound protein is removed by proteinase K digestion, and the RNA is reverse-transcribed. The resulting cDNA is ligated to single-stranded DNA adapters on the 3' end that contain either an N5 or N10 sequence to serve as unique identifiers against PCR duplicates. Finally, the paired-end cDNA fragments are amplified and sequenced.\nSimilar methods: iCLIP, irCLIP, HITS-CLIP.", "advantages_verbatim": ["High-throughput mapping of protein-RNA binding sites", "Barcoded adapters significantly reduce PCR duplicate reads and improves throughput", "Improved ligation efficiency by ~1000 fold", "Avoids usage of radioactive markers"], "limitations_verbatim": ["Antibodies not specific to target will precipitate nonspecific complexes", "Cross-linking does not cover all RNA-binding domains1"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "eCLIP"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_bfda/text", "text": "Method Category: Transcriptome > RNA-Protein Interactions\nDescription: eCLIP maps the binding sites of RBPs on their target RNAs using a modified individual nucleotide resolution CLIP (iCLIP) protocol, improving efficiency and decreasing execution complexity. The hallmark of this method is the ligation of barcoded single-stranded DNA adapters, which reduce amplification bias significantly.\nFirst, RNA and the protein of interest are UV-crosslinked, followed by cell lysis and RNase I digestion. Next, the protein-RNA complexes are immunoprecipitated and ligated to an RNA adapter on the 3' end of the target RNA. The bound protein is removed by proteinase K digestion, and the RNA is reverse-transcribed. The resulting cDNA is ligated to single-stranded DNA adapters on the 3' end that contain either an N5 or N10 sequence to serve as unique identifiers against PCR duplicates. Finally, the paired-end cDNA fragments are amplified and sequenced.\nSimilar methods: iCLIP, irCLIP, HITS-CLIP.\nPros:\nHigh-throughput mapping of protein-RNA binding sites\nBarcoded adapters significantly reduce PCR duplicate reads and improves throughput\nImproved ligation efficiency by ~1000 fold\nAvoids usage of radioactive markers\nCons:\nAntibodies not specific to target will precipitate nonspecific complexes\nCross-linking does not cover all RNA-binding domains1"}, {"source_locator": "jcr:content/par/text_2/text", "text": "eCLIP: Van Nostrand E. L., Pratt G. A., Shishkin A. A., Gelboin-Burkhart C., Fang M. Y., et al. (2016) Robust transcriptome-wide discovery of RNA-binding protein binding sites with enhanced CLIP (eCLIP). Nat Methods\n1. Martin G. and Zavolan M. (2016) Redesigning CLIP for efficiency, accuracy and speed. Nat Methods 13: 482-483"}, {"source_locator": "jcr:content/par/text_3/text", "text": "Featured Products\nIllumina Stranded Total RNA Prep\nIllumina Stranded mRNA Prep\nTruSeq Small RNA Library Preparation Kits\nRelated Content\nRNA-Seq\nLibrary Preparation"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Related Publications\nMarchese D., de Groot N. S., Lorenzo Gotor N., Livi C. M. and Tartaglia G. G. Advances in the characterization of RNA-binding proteins. Wiley Interdiscip Rev RNA. 2016;7:793-810\nBangru S. and Kalsotra A. Advances in analyzing RNA diversity in eukaryotic transcriptomes: peering through the Omics lens. F1000Research. 2016;5:2668\nManning K. S. and Cooper T. A. The roles of RNA processing in translating genotype to phenotype. Nat Rev Mol Cell Biol. 2017;18:102-114\nSundararaman B., Zhan L., Blue S. M., et al. Resources for the Comprehensive Discovery of Functional RNA Elements. Mol Cell. 2016;61   for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
