8c::paper:27412011": {"kind": "text", "content_level": "abstract", "pmid": "27412011", "title": "Genetics and immunity in the era of single-cell genomics.", "url": "https://pubmed.ncbi.nlm.nih.gov/27412011/", "fulltext_status": "not_acquired", "association_status": "candidate_for_this_source_row; not_a_verified_paper_association", "text_characters": 1153, "text_sha256": "cf5ccd05275838c5325d49d72fd448d7238cdf6a3a5f53dd0b16b21fbbd3cbb1"}, "poster_81e4998e97372dcd3d1ca18c::reference:poster_81e4998e97372dcd3d1ca18c:references:0": {"kind": "text", "content_level": "metadata", "identity_status": "unverified_catalogue_reference", "text_characters": 534, "text_sha256": "b74432b07361f21498db3409063e4ea80cdc7651d2bc7d6c968ab6b4dc1bdd8e"}, "g-t-seq::reference:pilot_selected_primary": {"kind": "text", "content_level": "metadata", "pmid": "25915121", "association_status": "unverified_selected_primary_candidate", "text_characters": 134, "text_sha256": "85faec38212a47de029ec185d438a25fca9aceceaa5cf17310e0fcd58dd8122c"}}, "card": {"record_id": "g_t_seq", "source_title": "G&T-seq", "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/g-t-seq.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/g-t-seq.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA Low-level Detection", "source_category_path": ["Transcriptome", "RNA Low-level Detection"], "description_verbatim": "G&T-Seq can separate and sequence genomic DNA and full-length mRNA from single cells. In this method, single cells are isolated and lysed. RNA is captured using biotinylated oligo(dT) capture primers and separated from DNA using streptavidin-coated magnetic beads. Smart-seq2 is used to amplify captured RNA on the bead, while multiple displacement amplification (MDA) is used to amplify DNA. After sequencing, integrating the DNA and RNA sequences provides insights into the gene expression profiles of single cells.", "advantages_verbatim": ["Compatible with any whole-genome amplification method", "No 3'-end bias in sequence reads because full-length transcripts are captured", "Because DNA and RNA are physically separated and amplified independently, there is no need to mask coding sequences during analysis"], "limitations_verbatim": ["Physical separation of DNA and RNA can increase the risk of sample loss or contamination", "Physical separation of DNA and RNA increases handling time"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "G&T-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "G&T-Seq can separate and sequence genomic DNA and full-length mRNA from single cells. In this method, single cells are isolated and lysed. RNA is captured using biotinylated oligo(dT) capture primers and separated from DNA using streptavidin-coated magnetic beads. Smart-seq2 is used to amplify captured RNA on the bead, while multiple displacement amplification (MDA) is used to amplify DNA. After sequencing, integrating the DNA and RNA sequences provides insights into the gene expression profiles of single cells.\nPros:\nCompatible with any whole-genome amplification method\nNo 3'-end bias in sequence reads because full-length transcripts are captured\nBecause DNA and RNA are physically separated and amplified independently, there is no need to mask coding sequences during analysis\nCons:\nPhysical separation of DNA and RNA can increase the risk of sample loss or contamination\nPhysical separation of DNA and RNA increases handling time"}, {"source_locator": "jcr:content/par/text_2/text", "text": "G&T-Seq: Macaulay I. C., Haerty W., Kumar P., Li Y. I., Hu T. X., et al. (2015) G&T-seq: parallel sequencing of single-cell genomes and transcriptomes. Nat Methods 12: 519-522"}, {"source_locator": "jcr:content/par/text_3/text", "text": "Nextera XT DNA Library Prep Kit\nTruSeq RNA Library Prep Kit v2\nTruSeq Small RNA Library Prep Kit\nTruSeq Nano DNA Library Prep Kit\nTruSeq DNA PCR-Free Library Prep Kit"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Bock C., Farlik M. and Sheffield N. C. Multi-Omics of Single Cells: Strategies and Applications. Trends Biotechnol. 2016;34:605-608\nClark S. J., Lee H. J., Smallwood S. A., Kelsey G. and Reik W. Single-cell epigenomics: powerful new methods for understanding gene regulation and cell identity. Genome Biol. 2016;17:72\nZhang X., Marjani S. L., Hu Z., Weissman S. M., Pan X., et al. Single-Cell Sequencing for Precise Cancer Research: Progress and Prospects. Cancer Res. 2016;76:1305-1312\nVieira Braga F. A., Teichmann S. A. and Chen X. Genetics and immunity in the era of single-cell genomics. Hum Mol Genet. 2016;25:R141-R148\nLu L., Lv B., Huang K., Xue Z., Zhu X. and Fan G. Recent advances in preimplantation genetic diagnosis and screening. J Assist Reprod Genet. 2016;33:1129-1134\nAngermueller C., Clark S. J., Lee H. J., et al. Parallel single-cell sequencing links transcriptional and epigenetic heterogeneity. Nat Methods. 2016;13:229-232"}], "cms_modified_at_not_invention_date": "Thu Jan 30 2020 18:03:10 GMT+0000", "curation_status": "source_extracted_only", "missing_evidence": ["Canonical method disambiguation", "Verified origin and priority", "Primary protocol and materials", "Supported bottleneck and lineage claims"], "diagram_asset_ids": ["asset_03536d63fdafc80d0529c268"], "source_id": "g-t-seq::card:g-t-seq", "references": [{"reference_id": "g-t-seq:references:0", "role": "references", "listed_by": "illumina", "source_reference": {"url": "http://www.ncbi.nlm.nih.gov/pubmed/25915121", "text": "G&T-Seq: Macaulay I. C., Haerty W., Kumar P., Li Y. I., Hu T. X., et al. (2015) G&T-seq: pa function drawGraph(parent, inspector, record) {

function renderRecord(r) {

  root.append(el('p',r.record_id,'muted'));

  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);

async function openRecord(id, {reveal = false} = {}) {

async function start(){
