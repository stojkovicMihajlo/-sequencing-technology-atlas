box": [0.554, 0.09, 0.708, 0.88], "rationale": "Faint unretained segments do not establish a separately routed output fraction."}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, BrUTP incorporation", "basis": "text", "support": "reported", "quote": "To specifically isolate NRO-RNA, we added a ribonucleotide analog [5-bromouridine 5′-triphosphate (BrUTP)] to BrU-tag nascent RNA during the run-on step (fig. S1).", "bbox": null, "rationale": null}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, BrU RNA immunopurification", "basis": "text", "support": "reported", "quote": "BrU-containing NRO-RNA was triple-selected through immunopurification with an antibody that is specific for this nucleotide analog, resulting in a 10,000-fold enrichment of the NRO-RNA pool that was determined to be >98% pure (8).", "bbox": null, "rationale": null}]}, {"target": "flow:antibody_beads_to_immunocapture", "verdict": "supported", "action": "accept", "rationale": "The bead icon establishes a physical support jointly participating with RNA in capture. Primary immunopurification supports corrected BrU-RNA recognition. material_input does not imply antibody consumption or an unshown bead-production reaction.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Bead coated with α-BrdUTP antibody; pink Y-shaped antibodies bind star-bearing purple segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.554, 0.09, 0.708, 0.88], "rationale": "Faint unretained segments do not establish a separately routed output fraction."}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, BrU RNA immunopurification", "basis": "text", "support": "reported", "quote": "BrU-containing NRO-RNA was triple-selected through immunopurification with an antibody that is specific for this nucleotide analog, resulting in a 10,000-fold enrichment of the NRO-RNA pool that was determined to be >98% pure (8).", "bbox": null, "rationale": null}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, interpretation of BrU-based selection", "basis": "text", "support": "inferred", "quote": "BrU-containing NRO-RNA was triple-selected through immunopurification with an antibody that is specific for this nucleotide analog, resulting in a 10,000-fold enrichment of the NRO-RNA pool that was determined to be >98% pure (8).", "bbox": null, "rationale": "Recognition of an incorporated nucleotide analog establishes the chemical basis of enrichment. It does not by itself establish exclusive RNA-polymerase-class specificity; the reported greater-than-98-percent purity also describes enrichment rather than an absolute exclusion of background."}]}, {"target": "flow:brutp_to_run_on", "verdict": "supported", "action": "accept", "rationale": "The explicitly supplied Br-UTP is a run-on reagent input. Primary b00006 states addition during run-on; it is neither an unrelated standalone legend nor a downstream free-nucleotide output.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Run-on with analog; red stars labelled Br-UTP appear along the emerging RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.205, 0.0, 0.388, 0.83], "rationale": null}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, nuclear run-on starting material and extension", "basis": "text", "support": "reported", "quote": "We used nuclear run-on assays (NRO) to extend nascent RNAs that are associated with transcriptionally engaged polymerases under conditions where new initiation is prohibited.", "bbox": null, "rationale": null}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, BrUTP incorporation", "basis": "text", "supp  "verdict": "supported", "action": "accept", "rationale": "The attribution names cDNA sequence and reported orientation as carriers. Core explicitly states fragmented BrU-RNA 5′-end origin and later mapping of RNA/polymerase origin and orientation. This is an origin association, without a unique-molecule barcode, attached polymerase or completed-readout claim.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, NRO-cDNA library origin", "basis": "text", "support": "reported", "quote": "A NRO-cDNA library was then prepared for sequencing from what represents the 5′ end of the fragmented, BrU-incorporated RNA molecule by using the Illumina high-throughput sequencing platform.", "bbox": null, "rationale": null}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, origin and orientation interpretation", "basis": "text", "support": "reported", "quote": "The origin and the orientation of the RNAs and therefore the associated transcriptionally engaged polymerases were documented genome-wide by mapping the reads to the reference human genome (8).", "bbox": null, "rationale": null}]}, {"target": "state_property:nuclei:identity", "verdict": "supported", "action": "accept", "rationale": "subject=self correctly identifies the whole nuclear starting preparation. Engaged polymerases and nascent RNA are reported; the chromatin DNA component is an explicit, supported interpretation of the template strand through nucleosome icons, not an isolated DNA fraction.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Leftmost chromatin/polymerase drawing; label Nascent RNA; grouped GRO-seq/BRIC-seq caption", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 0.193, 1.0], "rationale": "Gray chromatin, a blue polymerase and an emerging RNA strand are contextual materials, not separate preparation steps. A small dark terminal block is drawn but has no chemical legend."}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, nuclear run-on starting material and extension", "basis": "text", "support": "reported", "quote": "We used nuclear run-on assays (NRO) to extend nascent RNAs that are associated with transcriptionally engaged polymerases under conditions where new initiation is prohibited.", "bbox": null, "rationale": null}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00007, experimental starting preparation", "basis": "text", "support": "reported", "quote": "prepared from primary human lung fibroblast (IMR90) nuclei", "bbox": null, "rationale": null}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Leftmost chromatin/polymerase drawing; label Nascent RNA; grouped GRO-seq/BRIC-seq caption", "basis": "image", "support": "inferred", "quote": null, "bbox": [0.0, 0.0, 0.193, 1.0], "rationale": "The black strand running through the chromatin icons is interpreted as the DNA template for the depicted run-on transcription. The RNA emerging from the blue polymerase is the extension substrate; no DNA sequence or polarity is assigned."}]}, {"target": "state_property:nuclei:nuclear_context", "verdict": "supported", "action": "accept", "rationale": "physical_context belongs on the whole preparation. Core b00007 establishes nuclei and the image supplies chromatin/transcription context. No unreported cell or droplet compartment is introduced.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Leftmost chromatin/polymerase drawing; label Nascent RNA; grouped GRO-seq/BRIC-seq caption", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 0.193, 1.0], "rationale": "Gray chromatin, a blue polymerase and an emerging RNA strand are contextual materials, not separate preparation steps. A small dark terminal block is drawn but has no chemical legend."}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00007, experimental starting preparation", "basis": "text", "support": "reported", "quote": "prepared from primary human lung fibroblast (IMR90) nuclei", "bbox": null, "rationale": null}]}, {"target": "state_property:nuclei:rna_polymerase", "verdict": "supported", "action": "accept", "rationale": "The association is correctly placed on local component rna with local partner polymerases. Core explicitly reports polymerase-associated nascent RNA and the image shows RNA emerging from polymerase. No covalent linkage is asserted.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, nuclear run-on starting material and extension", "basis": "text", "support": "reported", "quote": "We used nuclear run-on assays (NRO) to extend nascent RNAs that are associated with transcriptionally engaged polymerases under conditions where new initiation is prohibited.", "bbox": null, "rationale": null}]}, {"target": "state_property:prepared_rna:brutag", "verdict": "supported", "action": "accept", "rationale": "The selected RNA preparation is explicitly drawn with retained stars after elution. Placing the modification on self is appropriate for this RNA boundary without separately modeled components; it does not place BrU on the later DNA product.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Arrow from bead to free star-bearing purple fragments; Elute / Cap removal / End Repair", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.754, 0.08, 0.867, 1.0], "rationale": "The output RNA retains star marks; the dark terminal block drawn upstream is absent here. The figure gives no explicit terminal chemical structure."}]}, {"target": "state_property:prepared_rna:eluted_context", "verdict": "supported", "action": "accept", "rationale": "Preparation-level physical_context correctly records RNA released from the support. The explicit Elute caption and downstream free purple fragments establish this transfer.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Arrow from bead to free star-bearing purple fragments; Elute / Cap removal / End Repair", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.754, 0.08, 0.867, 1.0], "rationale": "The output RNA retains star marks; the dark terminal block drawn upstream is absent here. The figure gives no explicit terminal chemical structure."}]}, {"target": "state_property:prepared_rna:identity", "verdict": "supported", "action": "accept", "rationale": "subject=self describes selected RNA after the captioned elution/cap-removal/end-repair composite. That preparation is established, while exact resulting phosphate/hydroxyl chemistry is not specified or invented.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Arrow from bead to free star-bearing purple fragments; Elute / Cap removal / End Repair", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.754, 0.08, 0.867, 1.0], "rationale": "The output RNA retains star marks; the dark terminal block drawn upstream is absent here. The figure gives no explicit terminal chemical structure."}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::card:gro-seq-bric-seq-bru-seq-bruchase-seq", "locator": "Opening GRO-Seq description, RNA preparation to cDNA", "basis": "text", "support": "reported", "quote": "After cap removal and end repair, the eluted RNA is reverse-transcribed to cDNA.", "bbox": null, "rationale": null}]}, {"target": "state_property:rna_fragments:brutag", "verdict": "supported", "action": "accept", "rationale": "The BrU modification is assigned to labelled_rna only, the actual star-bearing subset. It is neither assigned to unstarred_rna nor incorrectly represented as free BrUTP.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Arrow from run-on complex to short purple segments; Isolate and hydrolyze", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.39, 0.08, 0.541, 0.83], "rationale": "Red stars occur on some segments; unstarred segments coexist in the same preparation. One segment has a dark terminal block."}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, BrUTP incorporation", "basis": "text", "support": "reported", "quote": "To specifically isolate NRO-RNA, we added a ribonucleotide analog [5-bromouridine 5′-triphosphate (BrUTP)] to BrU-tag nascent RNA during the run-on step (fig. S1).", "bbox": null, "rationale": null}]}, {"target": "state_property:rna_fragments:identity", "verdict": "supported", "action": "accept", "rationale": "subject=self is one fragmented RNA preparation with starred and unstarred components, as shown together under isolation/hydrolysis. No separate output fraction or perfect labeling is invented.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Arrow from run-on complex to short purple segments; Isolate and hydrolyze", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.39, 0.08, 0.541, 0.83], "rationale": "Red stars occur on some segments; unstarred segments coexist in the same preparation. One segment has a dark terminal block."}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, chemical hydrolysis and mapping purpose", "basis": "text", "support": "reported", "quote": "The length of the polynucleotide was kept short, and the NRO-RNA was chemically hydrolyzed into short fragments (∼100 bases) to facilitate high-resolution mapping of the polymerase origin at the time of assay (8).", "bbox": null, "rationale": null}]}, {"target": "state_property:runon_rna:identity", "verdict": "supported", "action": "accept", "rationale": "subject=self correctly describes the post-run-on nuclear preparation; its RNA constituent acquires the BrU residues. The boundary is compatible with subsequent isolation from the transcription complexes.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Run-on with analog; red stars labelled Br-UTP appear along the emerging RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.205, 0.0, 0.388, 0.83], "rationale": null}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, nuclear run-on starting material and extension", "basis": "text", "support": "reported", "quote": "We used nuclear run-on assays (NRO) to extend nascent RNAs that are associated with transcriptionally engaged polymerases under conditions where new initiation is prohibited.", "bbox": null, "rationale": null}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, BrUTP incorporation", "basis": "text", "support": "reported", "quote": "To specifically isolate NRO-RNA, we added a ribonucleotide analog [5-bromouridine 5′-triphosphate (BrUTP)] to BrU-tag nascent RNA during the run-on step (fig. S1).", "bbox": null, "rationale": null}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Leftmost chromatin/polymerase drawing; label Nascent RNA; grouped GRO-seq/BRIC-seq caption", "basis": "image", "support": "inferred", "quote": null, "bbox": [0.0, 0.0, 0.193, 1.0], "rationale": "The black strand running through the chromatin icons is interpreted as the DNA template for the depicted run-on transcription. The RNA emerging from the blue polymerase is the extension substrate; no DNA sequence or polarity is assigned."}]}, {"target": "state_property:runon_rna:nuclear_context", "verdict": "supported", "action": "accept", "rationale": "Preparation-level context correctly records RNA within the depicted chromatin-associated transcription complex before isolation. This does not assert that the later free fragments remain polymerase-bound.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Run-on with analog; red stars labelled Br-UTP appear along the emerging RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.205, 0.0, 0.388, 0.83], "rationale": null}]}, {"target": "state_property:runon_rna:rna_polymerase", "verdict": "supported", "action": "accept", "rationale": "The RNA remains associated with its engaged-polymerase partner at the depicted boundary before isolation. The primary description of extending polymerase-associated RNA and the retained complex icon support this local association.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Run-on with analog; red stars labelled Br-UTP appear along the emerging RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.205, 0.0, 0.388, 0.83], "rationale": null}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, nuclear run-on starting material and extension", "basis": "text", "support": "reported", "quote": "We used nuclear run-on assays (NRO) to extend nascent RNAs that are associated with transcriptionally engaged polymerases under conditions where new initiation is prohibited.", "bbox": null, "rationale": null}]}, {"target": "state_property:runon_rna:rna_tag", "verdict": "supported", "action": "accept", "rationale": "The modification belongs on component rna and is localized to its run-on-extended segment. The primary passage reports tagging during run-on and the stars appear on the extended RNA. The modification is not incorrectly assigned to DNA or the whole nucleus.", "evidence": [{"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::diagram:asset_ca092c2f6ecb1cc62bf99d36", "locator": "Run-on with analog; red stars labelled Br-UTP appear along the emerging RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.205, 0.0, 0.388, 0.83], "rationale": null}, {"source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::paper:19056941", "locator": "b00006, BrUTP incorporation", "basis": "text", "support": "reported", "quote": "To specifically isolate NRO-RNA, we added a ribonucleotide analog [5-bromouridine 5′-triphosphate (BrUTP)] to BrU-tag nascent RNA during the run-on step (fig. S1).", "bbox": null, "rationale": null}]}]}, "sources": {"gro-seq-bric-seq-bru-seq-bruchase-seq::card:gro-seq-bric-seq-bru-seq-bruchase-seq": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/gro-seq-bric-seq-bru-seq-bruchase-seq.html", "title": "GRO-Seq/BRIC-Seq/Bru-Seq/BruChase-Seq", "text_characters": 5583, "text_sha256": "8952936d1ae2be2674821aa2c1c32ba8f7975759cf23ae0cd65d4ccf53493c42"}, "gro-seq-bric-seq-bru-seq-bruchase-seq::collection:rna:page:30": {"kind": "text", "content_level": "catalogue", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102/sources_03/collection_pages/rna_030.txt", "sha256": "4ac1e4862956d744824d280d947b40685d8ac13bb421dc4210512f1eb0445ef5", "title": "Illumina RNA collection, PDF page 30", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/products/research_reviews/rna-sequencing-methods-review-web.pdf", "association_status": "candidate_secondary_catalogue_page; verify target and scope before use", "original": {"source_id": "collection:rna:page:30", "content_level": "catalogue", "title": "Illumina RNA collection, PDF page 30", "url": "https://www.illumina.com/content/dam/ill "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/gro-seq-bric-seq-bru-seq-bruchase-seq.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/gro-seq-bric-seq-bru-seq-bruchase-seq.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA Transcription", "source_category_path": ["Transcriptome", "RNA Transcription"], "description_verbatim": "GRO-Seq maps the binding sites of transcriptionally active RNA polymerase II (RNAPII). In this method, active RNAPII is allowed to run on in the presence of 5-bromouridine 5'-triphosphate (Br-UTP). RNAs are hydrolyzed and purified using beads coated with antibodies to 5-bromo-2-deoxyuridine (BrdU). After cap removal and end repair, the eluted RNA is reverse-transcribed to cDNA. Deep sequencing of the cDNA identifies RNAs that are actively transcribed by RNAPII.", "advantages_verbatim": ["Maps position of transcriptionally engaged RNA polymerases", "Determines relative activity of transcription sites", "Detects sense and antisense transcription", "Detects transcription anywhere on the genome", "No prior knowledge of transcription sites is needed", "Provides robust coverage of enhancer- and promoter-associated RNAs1"], "limitations_verbatim": ["Limited to cell cultures and other artificial systems, due to the requirement for incubation in the presence of labeled nucleotides", "Artifacts may be introduced during the preparation of the nucle2i .", "New initiation events may occur during the run-on step", "Physical impediments may block the polymerases", "Resolution is only 30–100 nt3", "Requires nascent RNAs of at least 18 nt4"], "source_sections": [{"source_locator": "jcr:content/par/text_2/text", "text": "GRO-Seq/BRIC-Seq/Bru-Seq/BruChase-Seq"}, {"source_locator": "jcr:content/par/text/text", "text": ""}, {"source_locator": "jcr:content/par/text_0/text", "text": "GRO-Seq maps the binding sites of transcriptionally active RNA polymerase II (RNAPII). In this method, active RNAPII is allowed to run on in the presence of 5-bromouridine 5'-triphosphate (Br-UTP). RNAs are hydrolyzed and purified using beads coated with antibodies to 5-bromo-2-deoxyuridine (BrdU). After cap removal and end repair, the eluted RNA is reverse-transcribed to cDNA. Deep sequencing of the cDNA identifies RNAs that are actively transcribed by RNAPII.\nPros:\nMaps position of transcriptionally engaged RNA polymerases\nDetermines relative activity of transcription sites\nDetects sense and antisense transcription\nDetects transcription anywhere on the genome\nNo prior knowledge of transcription sites is needed\nProvides robust coverage of enhancer- and promoter-associated RNAs1\nCons:\nLimited to cell cultures and other artificial systems, due to the requirement for incubation in the presence of labeled nucleotides\nArtifacts may be introduced during the preparation of the nucle2i .\nNew initiation events may occur during the run-on step\nPhysical impediments may block the polymerases\nResolution is only 30–100 nt3\nRequires nascent RNAs of at least 18 nt4"}, {"source_locator": "jcr:content/par/text_1/text", "text": "GRO-Seq: Core L. J., Waterfall J. J. and Lis J. T. (2008) Nascent RNA sequencing reveals widespread pausing and divergent initiation at human promoters. Science 322: 1845-1848\nBRIC-Seq: Tani H., Mizutani R., Salam K. A., Tano K., Ijiri K., et al. (2012) Genome-wide determination of RNA stability reveals hundreds of short-lived noncoding transcripts in mammals. Genome Res 22: 947-956\nBru-Seq / BruChase-Seq: Paulsen M. T., Veloso A., Prasad J., Bedi K., Ljungman E. A., et al. (2013) Coordinated regulation of synthesis and stability of RNA during the acute TNF-induced proinflammatory response. Proc Natl Acad Sci U S A 110: 2240-2245\n1. Melnik S., Caudron-Herger M., Brant L., et al. Isolation of the protein and RNA content of active sites of transcription from mammalian cells. Nat Protoc. 2016;11:553-565\n2. Adelman K. and Lis J. T. Promoter-proximal pausing of RNA polymerase II: emerging roles in metazoans. Nat Rev Genet. 2012;13:720-731\n3. Nojima T., Gomes T., Carmo-Fonseca M. and Proudfoot N. J. Mammalian NET-seq analysis defines nascent RNA profiles and associated RNA processing genome-wide. Nat Protoc. 2016;11:413-428\n4. Mayer A. and Churchman L. S. Genome-wide profiling of RNA polymerase transcription at nucleotide resolution in human cells with native elongating transcript sequencing. Nat Protoc. 2016;11:813-833"}, {"source_locator": "jcr:content/par/text_3/text", "text": "TruSeq Small RNA Library Preparation Kits\nTruSeq Stranded total RNA Library prep kit\nTruSeq Nano DNA Library Prep Kit\nTruSeq DNA PCR-Free Library Prep Kit"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Murakawa Y., Yoshihara M., Kawaji H., Nishikawa M., Zayed H., et al. Enhanced Identification of Transcriptional Enhancers Provides Mechanistic Insights into Diseases. Trends Genet. 2016;32:76-88\nLi Y., Chen C. Y., Kaye A. M. and Wasserman W. W. The identification of cis-regulatory elements: A review from a machine learning perspective. Biosystems. 2015;138:6-17\nJonkers I. and Lis J. T. Getting up to speed with transcription elongation by RNA polymerase II. Nat Rev Mol Cell Biol. 2015;16:167-177\nSchwer B., Wei P. C., Chang A. N., et al. Transcription-associated processes cause DNA double-strand breaks and translocations in neural stem/progenitor cells. Proc Natl Acad Sci U S A. 2016;113:2258-2263\nChen Y. C., Stuwe E., Luo Y., et al. Cutoff Suppresses RNA Polymerase II Termination to Ensure Expression of piRNA Precursors. Mol Cell. 2016;63:97-109\nCzimmerer Z., Varga T., Kiss M., et al. The IL-4/STAT6 signaling axis establishes a conserved microRNA signature in human and mouse macrophages regulating cell survival via miR-342-3p. Genome Med. 2016;8:63\nDay D. S., Zhang B., Stevens S. M., et al. Comprehensive analysis of promoter-proximal RNA polymerase II pausing across mammalian cell types. Genome Biol. 2016;17:120\nde Dieuleveult M., Yen K., Hmitou I., et al. Genome-wide nucleosome specificity and function of chromatin remodellers in ES cells. Nature. 2016;530:113-116\nFlynn R. A., Do B. T., Rubin A. J., Calo E., Lee B., et al. 7SK-BAF axis controls pervasive transcription at enhancers. Nat Struct Mol Biol. 2016;23:231-238\nKorkmaz G., Lopes R., Ugalde A. P., et al. Functional genetic screens for enhancer elements in the human genome using CRISPR-Cas9. Nat Biotechnol. 2016;34:192-198\nMelnik S., Caudron-Herger M., Brant L., et al. Isolation of the protein and RNA content of active sites of transcription from mammalian cells. Nat Protoc. 2016;11:553-565\nNojima T., Gomes T., Carmo-Fonseca M. and Proudfoot N. J. Mammalian NET-seq analysis defines nascent RNA profiles and associated RNA processing genome-wide. Nat Protoc. 2016;11:413-428\nPetryk N., Kahli M., d'Aubenton-Carafa Y., et al. Replication landscape of the human genome. Nat Commun. 2016;7:10208\nWoolnough J. L., Atwood B. L., Liu Z., Zhao R. and Giles K. E. The Regulation of rRNA Gene Transcription during Directed Differentiation of Human Embryonic Stem Cells. PLoS One. 2016;11:e0157276"}], "cms_modified_at_not_invention_date": "Thu Jan 30 2020 18:31:21 GMT+0000", "curation_status": "source_extracted_only", "missing_evidence": ["Canonical method disambiguation", "Verified origin and priority", "Primary protocol and materials", "Supported bottleneck and lineage claims"], "diagram_asset_ids": ["asset_ca092c2f6ecb1cc62bf99d36"], "source_id": "gro-seq-bric-seq-bru-seq-bruchase-seq::card:gro-seq-bric-seq-bru-seq-bruchase-seq", "references": [{"reference_id": "gro-seq-bric-seq-bru-seq-bruchase-seq:references:0", "role": "references", "listed_by": "illumina", "source_reference const $ = id => document.getElementById(id);

const labels = {supported:'Supported', research_needed:'Further research', failed:'Failed', integrity_error:'Rejected on revalidation'};
const batchLabel = b => ({initial_two:'Catalogue card', catalogue:'Catalogue card', posters:'Main poster row', footer_panels:'Footer / product / readout panel', scoped_method:'Scoped workflow'})[b] || b;
let inventory = [], selected = '', request = 0;
function link(text, url) { const a = el('a',text); if (/^https?:\/\//.test(url || '')) { a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; } return a; }
function section(parent, title) { const d = el('details',null,'section'); d.append(el('summary',title)); parent.append(d); return d; }
function raw(parent, title, value) { const d = section(parent,title); d.append(el('pre',JSON.stringify(value,null,2))); }
function fields(parent, rows) { const d = el('div',null,'fields'); for (const [name,value] of rows) { if (value == null || value === '' || (Array.isArray(value) && !value.length)) continue; d.append(el('b',name),el('span',Array.isArray(value) ? value.join('; ') : String(value))); } parent.append(d); }
function assertions(parent,title,items,record) {
  if(!items?.length)return;
  const box=section(parent,title);
  for(const item of items){
    fields(box,Object.entries(item).filter(([k])=>k!=='evidence').map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):v]));
    evidence(box,item.evidence,record);
  }
}
function evidence(parent, items, record) {
  for (const e of items || []) {
    const box = el('div',null,'evidence'), s = record.sources[e.source_id] || {};
    box.append(link(s.title || e.source_id,s.url),el('p',`${e.support} · ${s.content_level || e.basis} · ${e.locator}`,'muted'));
    if (e.quote) box.append(el('blockquote',e.quote));
    if (e.bbox) box.append(el('p','Image region [left, top, right, bottom]: '+e.bbox.join(', '),'muted'));
    if (e.rationale) box.append(el('p',e.rationale));

}
function filterRecords() {
  const q = $('search').value.toLowerCase(), status = $('status').value, batch = $('batch').value;
  const found = inventory.filter(r => (status === 'all' || r.status === status) &&

    [r.title,r.record_id,...r.method_names,...r.category].join(' ').toLowerCase().includes(q));
  $('count').textContent = found.length+' source depictions'; $('records').replaceChildren();
  for (const r of found) {

    b.type = 'button';

    b.setAttribute('aria-pressed', String(r.record_id === selected));
    b.onclick = () => {
      // Load directly, including a second click on the current record. A hash

      const hash = '#' + encodeURIComponent(r.record_id);

}

  parent.replaceChildren(el('span',kind,'badge'),el('h3',item.label || item.id));
  const states = new Map(c.states.map(s => [s.id,s]));
  const names = ids => (ids || []).map(id => (states.get(id)?.label || id)+' ['+id+']');
  if (kind === 'Operation') fields(parent,[['Description',item.description],['Input States',names(item.inputs)],['Output States',names(item.outputs)],['Mechanism',item.mechanism || 'Not specified'],['Information effect',item.information_effect || 'Not specified']]);
  if (kind === 'State') fields(parent,[['Kind',item.kind],['Features',item.features]]);
  if (kind === 'State') { assertions(parent,'State properties',item.properties,record); if(item.constituents?.length)raw(parent,'Named constituents',item.constituents); }

  const ids = new Set(nodes.map(x=>x.id)), incoming = new Map(nodes.map(x=>[x.id,0])), next = new Map(nodes.map(x=>[x.id,[]]));
  for (const f of c.flows) { if (!ids.has(f.source)||!ids.has(f.target)) { parent.append(el('p','Cannot draw: a Flow endpoint is missing. Inspect the raw record.','warning')); return; } incoming.set(f.target,incoming.get(f.target)+1);next.get(f.source).push(f.target); }
  const rank = new Map(nodes.map(x=>[x.id,0])), ready = nodes.filter(x=>incoming.get(x.id)===0).map(x=>x.id); let processed=0;
  while (ready.length) { const id = ready.shift(); processed++;for (const target of next.get(id)) { rank.set(target,Math.max(rank.get(target),rank.get(id)+1)); incoming.set(target,incoming.get(target)-1);if (!incoming.get(target)) ready.push(target); } }
  if (processed !== nodes.length) { parent.append(el('p','A cycle prevents a left-to-right layout. Use the exact Flow records below.','warning'));return; }
  const NS='http://www.w3.org/2000/svg', svg=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};
  const pos = new Map(), lanes = new Map();
  for (const n of nodes) { const col=rank.get(n.id),row=lanes.get(col)||0;lanes.set(col,row+1);pos.set(n.id,{x:25+col*224,y:25+row*112}); }
  const canvas=svg('svg',{width:Math.max(680,Math.max(...rank.values())*224+240),height:Math.max(150,Math.max(...lanes.values())*112+30),role:'img','aria-label':'Directed State and Operation workflow'});
  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
