 STAU1, separately from RNA-arm hybridization. Later self-level wording appropriately avoids assigning the cross-link to a particular arm. The link persists through the captured ligation stages before proteolysis.", "evidence": [{"source_id": "primary:paper:25799984", "locator": "[b00165], Extended Data Figure 1a, steps 1-2", "basis": "text", "support": "reported", "quote": "(1) Cells are irradiated with UV-C light. (2) After lysis, the unprotected sections of RNAs are digested by RNase I, and the RBP is co-immunoprecipitated with the cross-linked RNA duplex.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:25799984", "locator": "[b00035], hiCLIP (UV cross-linking)", "basis": "text", "support": "reported", "quote": "Cells were subjected to 150 mJ/cm2 of UV-C (254 nm) irradiations with Stratlinker 2400 on ice, and scraped off.", "bbox": null, "rationale": null}, {"source_id": "hiclip::paper:25799984", "locator": "[b00165], Extended Data Figure 1a, steps 3-5", "basis": "text", "support": "reported", "quote": "(3) Two designated adaptors are ligated to both strands of the RNA duplex. Adaptor A (cloning adaptor) has a permanent 3′ block whilst adaptor B (linker adaptor) has a removable 3′ block. (4) 3′ block of adaptor B is removed. (5) The two strands of the RNA duplex are ligated via adaptor B.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:25799984", "locator": "[b00062], RNA templates for hybrid cDNAs and cross-link truncation", "basis": "text", "support": "reported", "quote": "The RNA duplexes that contain Adaptor A ligated to one arm, and Adaptor B to the other arm, are the template for producing hybrid reads by hiCLIP (Extended Data Fig. 1a). Most cDNAs usually truncate at the position of protein-RNA cross-link site.", "bbox": null, "rationale": null}]}]}, "sources": {"hiclip::card:hiclip": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-metho _verbatim": "hiCLIP sequences RNA duplexes bound to RBPs in vivo. The unique cloning and linker-adapter system in hiCLIP identifies whether the RBP-bound duplex originates from the same RNA or different RNAs.\nSimilar to CLIP library preparation techniques, RNA and RBPs are UV-crosslinked, partially digested, and immunoprecipitated. The signature hiCLIP cloning and linker-adapters are ligated to both strands of the duplex. The 3' end of the linker-adapter is dephosphorylated and ligated to the 5' end of the other strand. The bound proteins are removed with proteinase K. The cDNA library is prepared in a similar dashion to iCLIP for high-throughput sequencing. The cloning and linker-adapters enable the mapping of the hybrid reads to the transcriptome and distinguish whether the duplex is formed by the same RNAs or different RNAs.", "advantages_verbatim": ["Maps RBP-bound RNA duplexes in vivo", "Linker-adapter remediates physical and computational challenges seen in crosslinking, ligation, and sequencing of hybrids (CLASH)", "Detects long-range RNA duplex interactions 1"], "limitations_verbatim": ["Does not identify non-RBP-bound RNA duplexes", "Technically complex procedure", "Uses radioactive labeling", "Artifacts may be introduced in the circularization step"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "hiCLIP"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_bfda/text", "text": "hiCLIP sequences RNA duplexes bound to RBPs in vivo. The unique cloning and linker-adapter system in hiCLIP identifies whether the RBP-bound duplex originates from the same RNA or different RNAs.\nSimilar to CLIP library preparation techniques, RNA and RBPs are UV-crosslinked, partially digested, and immunoprecipitated. The signature hiCLIP cloning and linker-adapters are ligated to both strands of the duplex. The 3' end of the linker-adapter is dephosphorylated and ligated to the 5' end of the other strand. The bound proteins are removed with proteinase K. The cDNA library is prepared in a similar dashion to iCLIP for high-throughput sequencing. The cloning and linker-adapters enable the mapping of the hybrid reads to the transcriptome and distinguish whether the duplex is formed by the same RNAs or different RNAs.\nPros:\nMaps RBP-bound RNA duplexes in vivo\nLinker-adapter remediates physical and computational challenges seen in crosslinking, ligation, and sequencing of hybrids (CLASH)\nDetects long-range RNA duplex interactions 1\nCons:\nDoes not identify non-RBP-bound RNA duplexes\nTechnically complex procedure\nUses radioactive labeling\nArtifacts may be introduced in the circularization step"}, {"source_locator": "jcr:content/par/text_2/text", "text": "hiCLIP: HiClip: Sugimoto Y., Vigilante A., Darbo E., Zirra A., Militti C., et al. (2015) hiCLIP reveals the in vivo atlas of mRNA secondary structures recognized by Staufen 1. Nature 519: 491-494\n1. Lu Z. and Chang H. Y. (2016) Decoding the RNA structurome. Curr Opin Struct Biol 36: 142-148"}, {"source_locator": "jcr:content/par/text_3/text", "text": "TruSeq RNA Library Preparation Kit v2\nTruSeq Small RNA Library Preparation Kits\nTruSeq Stranded total RNA Library Prep Kit\nTruSeq Stranded mRNA Library Prep Kit\nTruSeq Targeted RNA Expression Kits"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Lu Z. and Chang H. Y. Decoding the RNA structurome. Curr Opin Struct Biol. 2016;36:142-148\nWeidmann C. A., Mustoe A. M. and Weeks K. M. Direct Duplex Detection: An Emerging Tool in the RNA Structure Analysis Toolbox. Trends Biochem Sci. 2016;41:734-736\nNawy T. Structural biology: RNA structure served in vivo. Nature Methods. 2015;12:383-383\nBurgess D. J. RNA. Detailed probing of RNA structure in vivo. Nat Rev Genet. 2015;16:255\nSugimoto Y., Vigilante A., Darbo E., et al. hiCLIP reveals the in vivo atlas of mRNA secondary structures recognized by Staufen 1. Nature. 2015;519:491-494"}], "cms_modifie
