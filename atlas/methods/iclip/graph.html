end chemistry.", "evidence": [{"source_id": "primary:paper:20601959", "locator": "[b00033] Methods, iCLIP analyses: adapter attachment", "basis": "text", "support": "reported", "quote": "RNAs were ligated at their 3′ends to an RNA adapter and radioactively labelled to allow visualization.", "bbox": null, "rationale": null}]}, {"target": "state_property:rna_protein:identity", "verdict": "supported", "action": "accept", "rationale": "Self identity matches the initial RNA-protein complex caption; it is not a free RNA fraction or an already amplified library.", "evidence": [{"source_id": "iclip::diagram:asset_4517d94aee6197e62f4ae8c9", "locator": "Starting RNA-protein complex to the right of the left method emblem", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.11, 0.0, 0.23, 1.0], "rationale": null}]}, {"target": "state_property:rna_protein:rna_protein_binding", "verdict": "supported", "action": "accept", "rationale": "The RNA component is bound to the local RBP within the starting complex. The generic bound_to association is supported by the complex icon and caption before covalent cross-linking.", "evidence": [{"source_id": "iclip::diagram:asset_4517d94aee6197e62f4ae8c9", "locator": "Starting RNA-protein complex to the right of the left method emblem", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.11, 0.0, 0.23, 1.0], "rationale": null}, {"source_id": "poster_d031055f028a71573b3861c1::diagram:poster_crop_366111075f2a1dd1a96ecfac", "locator": "iCLIP row: RNA-protein complex, Crosslink and cross-link marks", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.19, 0.48, 0.33, 0.72], "rationale": null}]}, {"target": "state_property:rt_primer:experiment_barcode", "verdict": "supported", "action": "accept", "rationale": "The two-nucleotide experiment marker is a sequence segment in the RT oligonucleotide 5′ barcode region, as explicitly reported in the original Methods.", "evidence": [{"source_id": "primary:paper:20601959", "locator": "[b00033] Methods, iCLIP analyses: original RT oligonucleotide", "basis": "text", "support": "reported", "quote": "The oligonucleotides for reverse transcription contained two inversely oriented adapter regions separated by a BamHI restriction site as well as a barcode region at their 5′ end containing a two nucleotide barcode to mark the experiment and a three nucleotide random barcode to mark individual cDNA molecules.", "bbox": null, "rationale": null}]}, {"target": "state_property:rt_primer:identity", "verdict": "supported", "action": "accept", "rationale": "The barcoded DNA oligonucleotide is the RT primer with BamHI-separated inverse adapter regions. The primary DNA-adapter statement and RT-primer Methods support its identity rather than identifying it as the ligated RNA-side adapter.", "evidence": [{"source_id": "primary:paper:20601959", "locator": "[b00033] Methods, iCLIP analyses: original RT oligonucleotide", "basis": "text", "support": "reported", "quote": "The oligonucleotides for reverse transcription contained two inversely oriented adapter regions separated by a BamHI restriction site as well as a barcode region at their 5′ end containing a two nucleotide barcode to mark the experiment and a three nucleotide random barcode to mark individual cDNA molecules.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:20601959", "locator": "[b00007] Introduction: DNA adapter and molecule distinction", "basis": "text", "support": "reported", "quote": "In order to quantify cDNA molecules that truncate at the same nucleotide, we added a random barcode to the DNA adapter.", "bbox": null, "rationale": null}]}, {"target": "state_property:rt_primer:inverse_adapter_regions", "verdict": "supported", "action": "accept", "rationale": "The two inverse adapter regions and their intervening BamHI restriction site are placed within this RT oligonucleotide, matching the original implementation.", "evidence": [{"source_id": "primary:paper:20601959", "locator": "[b00033] Methods, iCLIP analyses: original RT oligonucleotide", "basis": "text", "support": "reported", "quote": "The oligonucleotides for reverse transcription contained two inversely oriented adapter regions separated by a BamHI restriction site as well as a barcode region at their 5′ end containing a two nucleotide barcode to mark the experiment and a three nucleotide random barcode to mark individual cDNA molecules.", "bbox": null, "rationale": null}]}, {"target": "state_property:rt_primer:random_barcode", "verdict": "supported", "action": "accept", "rationale": "The three-nucleotide random molecule marker belongs to the RT primer 5′ barcode region. It marks individual cDNAs and is distinct from the two-nucleotide experiment code.", "evidence": [{"source_id": "primary:paper:20601959", "locator": "[b00033] Methods, iCLIP analyses: original RT oligonucleotide", "basis": "text", "support": "reported", "quote": "The oligonucleotides for reverse transcription contained two inversely oriented adapter regions separated by a BamHI restriction site as well as a barcode region at their 5′ end containing a two nucleotide barcode to mark the experiment and a three nucleotide random barcode to mark individual cDNA molecules.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:20601959", "locator": "[b00035] Methods, sequencing and mapping: molecular barcode", "basis": "text", "support": "reported", "quote": "The 3-nt random barcode enabled us to discriminate PCR duplicates from sequences, which start at the same nucleotide, but derived from individual cDNA molecules.", "bbox": null, "rationale": null}]}, {"target": "state_property:truncated_cdna:adapter_and_barcodes", "verdict": "supported", "action": "accept", "rationale": "These sequence segments originate in the RT primer and are incorporated into its extended DNA product: inverse adapter regions, BamHI site and both barcode classes. Their location is the primer-derived part of cDNA, not native RNA.", "evidence": [{"source_id": "primary:paper:20601959", "locator": "[b00033] Methods, iCLIP analyses: original RT oligonucleotide", "basis": "text", "support": "reported", "quote": "The oligonucleotides for reverse transcription contained two inversely oriented adapter regions separated by a BamHI restriction site as well as a barcode region at their 5′ end containing a two nucleotide barcode to mark the experiment and a three nucleotide random barcode to mark individual cDNA molecules.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:20601959", "locator": "[b00088] Figure 1a caption: sequence arrangement", "basis": "text", "support": "reported", "quote": "The first nucleotides of each sequence contain the barcode followed by the nucleotide where cDNAs truncated during reverse transcription.", "bbox": null, "rationale": null}]}, {"target": "state_property:truncated_cdna:contact_information", "verdict": "supported", "action": "accept", "rationale": "The copied RNA sequence and cDNA termination boundary carry contact-associated information. Proteinase-associated arrest and the downstream coordinate convention support mapping a candidate cross-link position, rather than equating the DNA with the protein contact itself.", "evidence": [{"source_id": "primary:paper:20601959", "locator": "[b00088] Figure 1a caption: proteinase K and RT", "basis": "text", "support": "reported", "quote": "Proteinase K digestion leaves a covalently bound polypeptide fragment on the RNA that causes premature truncation of reverse transcription (RT) at the cross-link site.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:20601959", "locator": "[b00035] Methods, sequencing and mapping: coordinate definition", "basis": "text", "support": "reported", "quote": "Last, the first nucleotide in the genome upstream of a mapping cDNA sequence was defined as ‘cross-link nucleotide’ and the total of corresponding cDNA sequences assigned as ‘cDNA count’ at this position.", "bbox": null, "rationale": null}]}, {"target": "state_property:truncated_cdna:identity", "verdict": "supported", "action": "accept", "rationale": "Self identity names the linear RT-truncated cDNA product, supported by the drawn extension and primary caption.", "evidence": [{"source_id": "iclip::diagram:asset_4517d94aee6197e62f4ae8c9", "locator": "Purple peptide-bearing RNA and extended cDNA; cDNA truncates at binding site", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.6, 0.0, 0.74, 1.0], "rationale": null}, {"source_id": "primary:paper:20601959", "locator": "[b00088] Figure 1a caption: proteinase K and RT", "basis": "text", "support": "reported", "quote": "Proteinase K digestion leaves a covalently bound polypeptide fragment on the RNA that causes premature truncation of reverse transcription (RT) at the cross-link site.", "bbox": null, "rationale": null}]}, {"target": "state_property:truncated_cdna:localization_limit", "verdict": "supported", "action": "accept", "rationale": "The limit is attached to interpretation of the cDNA boundary, and the primary Results explicitly report possible steric termination offsets. It prevents overclaiming exact contact chemistry from every endpoint.", "evidence": [{"source_id": "primary:paper:20601959", "locator": "[b00011] Results: positional precision and steric hindrance", "basis": "text", "support": "reported", "quote": "In addition, the steric hindrance of the peptide fragment remaining on RNA may cause reverse transcription to terminate more than one nucleotide upstream of the cross-link site.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:20601959", "locator": "[b00035] Methods, sequencing and mapping: coordinate definition", "basis": "text", "support": "reported", "quote": "Last, the first nucleotide in the genome upstream of a mapping cDNA sequence was defined as ‘cross-link nucleotide’ and the total of corresponding cDNA sequences assigned as ‘cDNA count’ at this position.", "bbox": null, "rationale": null}]}, {"target": "state_property:truncated_cdna:molecule_information", "verdict": "supported", "action": "accept", "rationale": "The actual carrier is the RT-primer-derived random barcode in cDNA. Combined with mapped position it supports discrimination of recovered molecules from PCR copies; no single-cell or perfect molecular uniqueness assertion is made.", "evidence": [{"source_id": "primary:paper:20601959", "locator": "[b00033] Methods, iCLIP analyses: original RT oligonucleotide", "basis": "text", "support": "reported", "quote": "The oligonucleotides for reverse transcription contained two inversely oriented adapter regions separated by a BamHI restriction site as well as a barcode region at their 5′ end containing a two nucleotide barcode to mark the experiment and a three nucleotide random barcode to mark individual cDNA molecules.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:20601959", "locator": "[b00035] Methods, sequencing and mapping: molecular barcode", "basis": "text", "support": "reported", "quote": "The 3-nt random barcode enabled us to discriminate PCR duplicates from sequences, which start at the same nucleotide, but derived from individual cDNA molecules.", "bbox": null, "rationale": null}]}, {"target": "state_property:truncated_cdna:topology", "verdict": "supported", "action": "accept", "rationale": "The cDNA is linear at this RT output boundary before the separately drawn circularization operation. The property does not conflate the RNA template with a DNA circle.", "evidence": [{"source_id": "iclip::diagram:asset_4517d94aee6197e62f4ae8c9", "locator": "Purple peptide-bearing RNA and extended cDNA; cDNA truncates at binding site", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.6, 0.0, 0.74, 1.0], "rationale": null}, {"source_id": "primary:paper:20601959", "locator": "[b00033] Methods, iCLIP analyses: circularization and BamHI cleavage", "basis": "text", "support": "reported", "quote": "cDNA molecules were size-purified using denaturing gel electrophoresis, circularized by single-stranded DNA ligase, annealed to an oligonucleotide complementary to the restriction site and cut between the two adapter regions by BamHI.", "bbox": null, "rationale": null}]}]}, "sources": {"iclip::card:iclip": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/iclip.html", "title": "iCLIP", "text_characters": 3579, "text_sha256": "58aa359541336954b4f93d0a05c0bd1c858cb82b1e8ae5ede2a5a1596fa4593b"}, "iclip::collection:rna:page:58": {"kind": "text", "content_level": "catalogue", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102/sources_03/collection_pages/rna_058.txt", "sha256": "9b09a7b21938fb56b8a25ff1260ba6d09bca67ed18992a75989eb070c2da7e59", "title": "Illumina RNA collection, PDF page 58", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/products/research_reviews/rna-sequencing-methods-review-web.pdf", "association_status": "candidate_secondary_catalogue_page; verify target and scope before use", "original": {"source_id": "collection:rna:page:58", "content_level": "catalogue", "title": "Illumina RNA collection, PDF page 58", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/products/research_reviews/rna-sequencing-methods-review-web.pdf", "text_path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102/sources_03/collection_pages/rna_058.txt", "text_sha256": "9b09a7b21938fb56b8a25ff1260ba6d09bca67ed18992a75989eb070c2da7e59", "original_pdf": {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/8a/8a333cee2159153c1dd49bffe3a5ec2e3ee143670f63c903793f2430a793b2ae.pdf", "sha256": "8a333cee2159153c1dd49bffe3a5ec2e3ee143670f63c90379 atlas/v2/work/illumina_full_20261031/sources_06/imports/ca/ca7d7e1e5bf6c0ac7cfc2392019bfa4030ee071f521061f2f4e1928cf3700df0.json", "sha256": "ca7d7e1e5bf6c0ac7cfc2392019bfa4030ee071f521061f2f4e1928cf3700df0"}], "association_status": "selected_primary_candidate; extraction reviewer must confirm method/version scope", "text_characters": 45924, "text_sha256": "9d950ef2cb87e40f862b26b8448702e56953b03905e9ae58aefc8c3894afe1cf"}, "iclip::reference:pilot_selected_primary": {"kind": "text", "content_level": "metadata", "pmid": "20601959", "association_status": "unverified_selected_primary_candidate", "text_characters": 132, "text_sha256": "84e49c5b5541bbe35aec9d62c718909a40ab0832d122708e1e431864f7f0dd59"}}, "card": {"record_id": "iclip", "source_title": "iCLIP", "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/iclip.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/iclip.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA-Protein Interactions", "source_category_path": ["Transcriptome", "RNA-Protein Interactions"], "description_verbatim": "iCLIP maps protein-RNA interactions, in a process similar to HITS-CLIP and PAR-CLIP. This approach includes additional steps to digest the proteins after crosslinking and to map the crosslink sites with reverse transcriptase.\nIn iCLIP, specific crosslinked RNA-protein complexes are immunoprecipitated. The complexes are treated with proteinase K, as the protein crosslinked at the binding site remains undigested. Upon RT, cDNA truncates at the binding site and is circularized. These circularized fragments are linearized and PCR-amplified. Deep sequencing of these amplified fragments provides nucleotide resolution of the protein-binding site eCLIP is an improvement over iCLIP that avoids circularizing the cDNA to reduce artifacts.\nOther versions: HITS-CLIP, PAR-CLIP, eCLIP, irCLIP.", "advantages_verbatim": ["Nucleotide resolution of protein-binding sites", "Avoids the use of nucleases", "Amplification allows the detection of rare events"], "limitations_verbatim": ["Antibodies not specific to target will precipitate nonspecific complexes", "Nonlinear PCR amplification can lead to biases affecting reproducibility", "Artifacts may be introduced in the circularization step", "Radioisotopes required for visualization of UV-crosslinked protein-RNA complexes only label 5' ends", "Circular ligation can be inefficient"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "iCLIP"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "iCLIP maps protein-RNA interactions, in a process similar to HITS-CLIP and PAR-CLIP. This approach includes additional steps to digest the proteins after crosslinking and to map the crosslink sites with reverse transcriptase.\nIn iCLIP, specific crosslinked RNA-protein complexes are immunoprecipitated. The complexes are treated with proteinase K, as the protein crosslinked at the binding site remains undigested. Upon RT, cDNA truncates at the binding site and is circularized. These circularized fragments are linearized and PCR-amplified. Deep sequencing of these amplified fragments provides nucleotide resolution of the protein-binding site eCLIP is an improvement over iCLIP that avoids circularizing the cDNA to reduce artifacts.\nOther versions: HITS-CLIP, PAR-CLIP, eCLIP, irCLIP.\nPros:\nNucleotide resolution of protein-binding sites\nAvoids the use of nucleases\nAmplification allows the detection of rare events\nCons:\nAntibodies not specific to target will precipitate nonspecific complexes\nNonlinear PCR amplification can lead to biases affecting reproducibility\nArtifacts may be introduced in the circularization step\nRadioisotopes required for visualization of UV-crosslinked protein-RNA complexes only label 5' ends\nCircular ligation can be inefficient"}, {"source_locator": "jcr:content/par/text_2/text", "text": "iCLIP: Konig J., Zarnack K., Rot G., Curk T., Kayikci M., et al. (2010) iCLIP reveals the function of hnRNP particles in splicing at individual nucleotide resolution. Nat Struct Mol Biol 17: 909-915"}, {"source_locator": "jcr:content/par/text_3/text", "text": "TruSeq RNA Library Preparation Kit v2\nTruSeq Small RNA Library Preparation Kits\nTruSeq Stranded total RNA Library Prep Kit\nTruSeq Stranded mRNA Library Prep Kit\nTruSeq Targeted RNA Expression Kits"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Cook K. B., Hughes T. R. and Morris Q. D. High-throughput characterization of protein-RNA interactions. Brief Funct Genomics. 2015;14:74-89\nSutandy F. X., Hildebrandt A. and Konig J. Profiling the Binding Sites of RNA-Binding Proteins with Nucleotide Resolution Using iCLIP. Methods Mol Biol. 2016;1358:175-195\nEnnajdaoui H., Howard J. M., Sterne-Weiler T., Jahanbani F., Coyne D. J., et al. IGF2BP3 Modulates the Interaction of Invasion-Associated Transcripts with RISC. Cell Rep. 2016;15:1876-1883\nMisra A., Ou J., Zhu L. J. and Green M. R. Global analysis of CPSF2-mediated alternative splicing: Integration of global iCLIP and transcriptome profiling data. Genom Data. 2015;6:217-221\nWang Q., Taliaferro J. M., Klibaite U., Hilgers V., Shaevitz J. W., et al. The PSI-U1 snRNP interaction regulates male mating behavior in Drosophila. Proc Natl Acad Sci U S A. 2016;113:5269-5274\nGosline S. J., Gurtan A. M., JnBaptiste C. K., Bosson A., Milani P., et al. Elucidating MicroRNA Regulatory Networks Using Transcriptional, Post-transcriptional, and Histone Modification Measurements. Cell Rep. 2016;14:310-319"}], "cms_modified_at_not_invention_date": "Fri Feb 07 2020 17:50:32 GMT+0000", "curation_status": "sour
