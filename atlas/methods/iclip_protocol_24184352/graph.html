salt wash (rotate wash in the cold room for at least 1 min).•Wash twice with PNK buffer.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00066]", "basis": "text", "support": "reported", "quote": "Test: dephosphorylation. The dephosphorylation step is critical to remove the cyclic phosphate that remains at the RNA 3’ end after partial RNase I digestion since it prevents adapter ligation (see below). Current CLIP protocols use either Polynucleotide Kinase (PNK; later also used in the 5′ end labeling reaction) or Shrimp Alkaline Phosphatase (SAP) for this purpose. We compared the efficiency of both enzymes in the iCLIP protocol by measuring the amount of amplified cDNA after library preparation (Fig. 3C). PTB–RNA complexes treated with PNK for 20 min showed the highest library concentration, indicating efficient removal of the inhibitory cyclic phosphate from 3′ ends. Prolonged treatment with PNK up to 2 h decreased rather than improve", "bbox": null, "rationale": null}]}, {"id": "dephosphorylate_out_dephosphorylated_complexes", "source": "dephosphorylate", "target": "dephosphorylated_complexes", "kind": "material_output", "evidence": [{"source_id": "primary:paper:24184352", "locator": "[b00065]", "basis": "text", "support": "reported", "quote": "•Discard the supernatant and resuspend the beads in 20 μl of the following mixture: 4 μl5 × PNK pH 6.5 buffer 0.5 μlPNK 0.5 μlRNasin 15 μlH2O•Incubate for 20 min at 37 °C in a thermomixer at 1100 rpm.•Wash with PNK buffer.•Wash with high-salt wash (rotate wash in the cold room for at least 1 min).•Wash twice with PNK buffer.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00066]", "basis": "text", "support": "reported", "quote": "Test: dephosphorylation. The dephosphorylation step is critical to remove the cyclic phosphate that remains at the RNA 3’ end after partial RNase I digestion since it prevents adapter ligation (see below). Current CLIP d as stated in the protocol; the shortest fraction may be omitted for applications not targeting short RNAs. No pooling of fractions is implied before the explicit final combination. The final library permits subsequent nucleotide-resolution interpretation, without depicting sequencing or a data-analysis pipeline. The paper also describes optional entry/purification procedures; they do not expand the assigned single-method schematic scope.", "evidence": [{"source_id": "iclip::diagram:asset_4517d94aee6197e62f4ae8c9", "locator": "Entire horizontal iCLIP schematic: RNA–protein complex → immunoprecipitated crosslinked complex → proteinase K → peptide-bearing RNA / cleavable adapter → truncated cDNA → circle → linearize and PCR → cDNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "poster_d031055f028a71573b3861c1::diagram:poster_crop_366111075f2a1dd1a96ecfac", "locator": "Complete iCLIP row, between separate PAR-CLIP and BrdU-CLIP rows; upper cropped irCLIP labels and right chemical drawing/QR are outside the iCLIP route", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.015, 0.46, 0.895, 0.72], "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00002]", "basis": "text", "support": "reported", "quote": "RNA-binding proteins (RBPs) are key players in the post-transcriptional regulation of gene expression. Precise knowledge about their binding sites is therefore critical to unravel their molecular function and to understand their role in development and disease. Individual-nucleotide resolution UV crosslinking and immunoprecipitation (iCLIP) identifies protein–RNA crosslink sites on a genome-wide scale. The high resolution and specificity of this method are achieved by an intramolecular cDNA circularization step that enables analysis of cDNAs that truncated at the protein–RNA crosslink sites. Here, we describe the improved iCLIP protocol and discuss critical optimization and control experiments that are required when applying the method to n", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00008]", "basis": "text", "support": "reported", "quote": "The iCLIP protocol starts with UV irradiation, which forms covalent bonds at sites of protein–RNA interactions and thereby preserves the in vivo binding pattern (Fig. 1, step 1). Next, the cells are lysed and the RNAs are partially digested to obtain RNA fragments in an optimal size range (Fig. 1, steps 2 and 3). After immunoprecipitation of the protein–RNA complexes, the RNA is dephosphorylated, an adapter is ligated to the 3′ end of the RNA and the 5′ end is radioactively labeled (Fig. 1, steps 4–7). SDS–PAGE and transfer to nitrocellulose membrane enable to remove free RNA and to stringently purify the crosslinked protein–RNA complexes (Fig. 1, step 8). The RNA is recovered from the nitrocellulose membrane by digesting the protein with p", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00035]", "basis": "text", "support": "reported", "quote": "Moreover, we provide protocols for two alternative procedures. In Section 3.1.2, we describe pre-incubation of cells with photo-reactive ribonucleosides, such as 4-thiouridine, which enables crosslinking with UV-A rather than UV-C light [20]. Since pre-incubation of cells with 4-thiouridine enhances crosslinking of some proteins [21], we tested and integrated it as an alternative entry point into the iCLIP protocol (PAR-iCLIP). In Section 3.10, we describe a stringent purification strategy that employs denaturation with urea, which can be used to avoid co-purification of RBPs that strongly interact with the protein of interest.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00083]", "basis": "text", "support": "reported", "quote": "Together with the full L3-App sequence, the primer sequence accounts for 52 nt of the cDNA. Cut three bands, at 70–80 nt, 80–100 nt and 100–150 nt.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00094]", "basis": "text", "support": "reported", "quote": "If the resulting product sizes are correct, mix the PCR reactions from cDNAs that were excised from the different portions of the gel (3.7.3)", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00162]", "basis": "text", "support": "reported", "quote": "The 70–80 nt band is prone to producing primer artifacts in the PCR, and even if containing specific cDNAs, sequences are often too short to map to the genome. Therefore, if binding to miRNAs or other short RNAs is not of interest, it is not necessary to isolate this band.", "bbox": null, "rationale": null}]}], "paper_matches": [{"id": "huppertz_24184352", "source_id": "primary:paper:24184352", "methods": ["iCLIP (Huppertz protocol)"], "assessment": "content_checked", "relationship": "supports_variant", "evidence": [{"source_id": "iclip::reference:pilot_selected_primary", "locator": "Pilot-selected bibliographic candidate", "basis": "text", "support": "reported", "quote": "Pilot-selected primary candidate PMID 24184352 for iCLIP (Huppertz protocol). This selection is not scientific evidence of method identity or mechanism.", "bbox": null, "rationale": "This is the supplied association lead; the inspected full-text title and protocol passages independently support the implementation assignment."}, {"source_id": "primary:paper:24184352", "locator": "[b00001]", "basis": "text", "support": "reported", "quote": "iCLIP: Protein–RNA interactions at nucleotide resolution", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00002]", "basis": "text", "support": "reported", "quote": "RNA-binding proteins (RBPs) are key players in the post-transcriptional regulation of gene expression. Precise knowledge about their binding sites is therefore critical to unravel their molecular function and to understand their role in development and disease. Individual-nucleotide resolution UV crosslinking and immunoprecipitation (iCLIP) identifies protein–RNA crosslink sites on a genome-wide scale. The high resolution and specificity of this method are achieved by an intramolecular cDNA circularization step that enables analysis of cDNAs that truncated at the protein–RNA crosslink sites. Here, we describe the improved iCLIP protocol and discuss critical optimization and control experiments that are required when applying the method to n", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00008]", "basis": "text", "support": "reported", "quote": "The iCLIP protocol starts with UV irradiation, which forms covalent bonds at sites of protein–RNA interactions and thereby preserves the in vivo binding pattern (Fig. 1, step 1). Next, the cells are lysed and the RNAs are partially digested to obtain RNA fragments in an optimal size range (Fig. 1, steps 2 and 3). After immunoprecipitation of the protein–RNA complexes, the RNA is dephosphorylated, an adapter is ligated to the 3′ end of the RNA and the 5′ end is radioactively labeled (Fig. 1, steps 4–7). SDS–PAGE and transfer to nitrocellulose membrane enable to remove free RNA and to stringently purify the crosslinked protein–RNA complexes (Fig. 1, step 8). The RNA is recovered from the nitrocellulose membrane by digesting the protein with p", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00034]", "basis": "text", "support": "reported", "quote": "In this manuscript, we provide a detailed iCLIP protocol with comments, tips and explanations provided in the footnotes. For the most critical steps, we describe the results of example experiments at the end of the subchapters. We also provide a table summarizing the recent improvements and quality assessments, which facilitate an optimal library preparation for your protein of interest (Table 1). We present tests for various critical steps including dephosphorylation, sonication and alkaline hydrolysis. We also describe how to optimize the concentration of RNase I, and test the efficiency of reverse transcription primers. This optimized protocol enables the user to overcome the technical challenges of iCLIP, and ensures the comprehensive i", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00165]", "basis": "text", "support": "reported", "quote": "Fig. 1Schematic representation of the iCLIP procedure identifying RNA–protein interactions in intact cells. Cells are irradiated with UV-C light on ice, leading to formation of a covalent bond between protein and RNA. This is followed by partial RNase digestion and an immunoprecipitation with protein-specific antibodies. For the library preparation and visualization, the RNA is dephosphorylated, a 3′ end adapter is ligated and the 5′ end is radioactively labeled. The complexes are separated by SDS–PAGE and isolated from a nitrocellulose membrane according to the expected size. The protein is then digested by proteinase K, and reverse transcription (RT) is performed truncating at the remaining polypeptide. The RT primer introduces two cleava", "bbox": null, "rationale": null}]}, {"id": "konig_20601959", "source_id": "iclip::paper:20601959", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "iclip::paper:20601959", "locator": "Introduction, [b00007]", "basis": "text", "support": "reported", "quote": "Here, we exploited this apparent limitation to achieve single nucleotide resolution by capturing these truncated cDNAs through the introduction of a second adapter after reverse transcription via self-circularization (Fig. 1).", "bbox": null, "rationale": "Full-text passage supports the original iCLIP principle. It does not identify all details of the Huppertz implementation; the selected p ing and does not show a separate ligation action.", "primary_statement": "Huppertz orders cell lysis and partial RNase digestion, then immunoprecipitation, RNA 3′ dephosphorylation, L3 ligation and RNA 5′ labeling. The graph follows this protocol order; the superseded drawn ligation-before-IP route is not asserted as a Flow.", "disposition": "use_primary", "evidence": [{"source_id": "poster_d031055f028a71573b3861c1::diagram:poster_crop_366111075f2a1dd1a96ecfac", "locator": "iCLIP row: Crosslink → Add 3’ adaptor → Immuno-precipitate complex", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.24, 0.47, 0.4, 0.71], "rationale": null}, {"source_id": "iclip::diagram:asset_4517d94aee6197e62f4ae8c9", "locator": "Entire horizontal iCLIP schematic: RNA–protein complex → immunoprecipitated crosslinked complex → proteinase K → peptide-bearing RNA / cleavable adapter → truncated cDNA → circle → linearize and PCR → cDNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00008]", "basis": "text", "support": "reported", "quote": "The iCLIP protocol starts with UV irradiation, which forms covalent bonds at sites of protein–RNA interactions and thereby preserves the in vivo binding pattern (Fig. 1, step 1). Next, the cells are lysed and the RNAs are partially digested to obtain RNA fragments in an optimal size range (Fig. 1, steps 2 and 3). After immunoprecipitation of the protein–RNA complexes, the RNA is dephosphorylated, an adapter is ligated to the 3′ end of the RNA and the 5′ end is radioactively labeled (Fig. 1, steps 4–7). SDS–PAGE and transfer to nitrocellulose membrane enable to remove free RNA and to stringently purify the crosslinked protein–RNA complexes (Fig. 1, step 8). The RNA is recovered from the nitrocellulose membrane by digesting the protein with p", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b Cleavable adaptor and Barcode", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.455, 0.49, 0.566, 0.71], "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00079]", "basis": "text", "support": "reported", "quote": "All reverse transcription primers are equipped with 5-nt random barcodes to enable removal of PCR artifacts, plus a 4-nt barcode sequences that allow multiplexing. The 4-nt barcodes differ by at least two nucleotides, insuring that a single point mutation is not sufficient to convert one barcode into another. Since the quality of the library depends on the efficiency of the individual primer, it is necessary to test each new primer (Fig. 4A). In order to do so, a full library preparation is needed (a well-established antibody can be used for immunoprecipitation of protein–RNA complexes, which are then used for reverse transcription with different RT primers). It is advisable to include an already optimized primer as a reference for the newl", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00165]", "basis": "text", "support": "reported", "quote": "Fig. 1Schematic representation of the iCLIP procedure identifying RNA–protein interactions in intact cells. Cells are irradiated with UV-C light on ice, leading to formation of a covalent bond between protein and RNA. This is followed by partial RNase digestion and an immunoprecipitation with protein-specific antibodies. For the library preparation and visualization, the RNA is dephosphorylated, a 3′ end adapter is ligated and the 5′ end is radioactively labeled. The complexes are separated by SDS–PAGE and isolated from a nitrocellulose membrane according to the expected size. The protein is then digested by proteinase K, and reverse transcription (RT) is performed truncating at the remaining polypeptide. The RT primer introduces two cleava", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00 tional: load 500 μl of the lysate onto a Proteus C", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00066]", "basis": "text", "support": "reported", "quote": "Test: dephosphorylation. The dephosphorylation step is critical to remove the cyclic phosphate that remains at the RNA 3’ end after partial RNase I digestion since it prevents adapter ligation (see below). Current CLIP protocols use either Polynucleotide Kinase (PNK; later also used in the 5′ end labeling reaction) or Shrimp Alkaline Phosphatase (SAP) for this purpose. We compared the efficiency of both enzymes in the iCLIP protocol by measuring the amount of amplified cDNA after library preparation (Fig. 3C). PTB–RNA complexes treated with PNK for 20 min showed the highest library concentration, indicating efficient removal of the inhibitory cyclic phosphate from 3′ ends. Prolonged treatment with PNK up to 2 h decreased rather than improve", "bbox": null, "rationale": null}]}, {"id": "residual_peptide", "target_id": "state:peptide_rna", "diagram_observation": "The diagram shows small residual peptide marks after Proteinase K, while the catalogue text says the protein crosslinked at the binding site remains undigested.", "primary_statement": "Proteinase K digests the protein but leaves a polypeptide at the crosslink site. The retained entity is peptide-bearing RNA, not RNA bound to an intact undigested protein.", "disposition": "use_primary", "evidence": [{"source_id": "iclip::diagram:asset_4517d94aee6197e62f4ae8c9", "locator": "Proteinase K arrow and Cross-linked peptides remain after proteinase K digestion: small peptide marks persist on purple RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.38, 0.0, 0.6, 1.0], "rationale": null}, {"source_id": "iclip::card:iclip", "locator": "Description", "basis": "text", "support": "reported", "quote": "The complexes are treated with proteinase K, as the protein crosslinked at the binding site remains undig rimers are equipped with 5-nt random barcodes to enable removal of PCR artifacts, plus a 4-nt barcode sequences that allow multiplexing.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00160]", "basis": "text", "support": "reported", "quote": "Use distinct primers (Rt1clip–Rt16clip) for the control and the different experimental replicates. The different primers contain individual 4-nt barcode sequences that allow multiplexing of samples and control for cross-contamination between the samples.", "bbox": null, "rationale": null}]}, {"target": "state_property:rt_products:cdna_segments", "verdict": "supported", "action": "accept", "rationale": "The sequence-segment property is assigned to component cdna, which incorporates the RT-primer handles and barcodes during synthesis. It is not incorrectly assigned to residual RNA.", "evidence": [{"source_id": "primary:paper:24184352", "locator": "[b00165]", "basis": "text", "support": "reported", "quote": "The RT primer introduces two cleavable adapter regions and barcode sequences.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00079]", "basis": "text", "support": "reported", "quote": "All reverse transcription primers are equipped with 5-nt random barcodes to enable removal of PCR artifacts, plus a 4-nt barcode sequences that allow multiplexing.", "bbox": null, "rationale": null}]}, {"target": "state_property:rt_products:five_prime", "verdict": "supported", "action": "accept", "rationale": "The cdna component retains the original RT-primer 5′ phosphate upon extension. This is an explicit inference from the listed phosphorylated primer and its incorporation, not a claimed new phosphorylation step.", "evidence": [{"source_id": "primary:paper:24184352", "locator": "[b00020]", "basis": "text", "support": "inferred", "quote": "Rt1clip/5Phos/NNAACCNNNAGATCGGAAGAGCGTCGTGgatcCTGAACCGC", "bbox": null, "rationale": "Extension preserves the incorporated primer’s original 5′ end; neither RNA hydrolysis nor the intervening size recovery is described as removing that phosphate before circularization."}, {"source_id": "primary:paper:24184352", "locator": "[b00165]", "basis": "text", "support": "reported", "quote": "The RT primer introduces two cleavable adapter regions and barcode sequences.", "bbox": null, "rationale": null}]}, {"target": "state_property:rt_products:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity names the actual preparation at this local boundary. This boundary follows DNA synthesis and precedes RNA hydrolysis: cDNA products coexist with their peptide-bearing RNA templates. The state correctly labels the product as cDNA plus residual template, not a pure RNA or sequence-data product.", "evidence": [{"source_id": "primary:paper:24184352", "locator": "[b00008]", "basis": "text", "support": "reported", "quote": "The RNA is recovered from the nitrocellulose membrane by digesting the protein with proteinase K, which leaves a polypeptide at the crosslink site (Fig. 1, step 9). The RNA is then reverse transcribed into cDNA, which most often truncates at the polypeptide remaining at the crosslink site (Fig. 1, step 10).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00081]", "basis": "text", "support": "reported", "quote": "Alkaline hydrolysis can be used to remove the carry-over of radioactively labeled RNA after reverse transcription. In this test, the counts/s of each sample were measured before and after the alkaline treatment. This confirmed that alkaline hydrolysis degrades the RNA and removes all remaining radioactive signal (Fig. 4B).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00165]", "basis": "text", "support": "reported", "quote": "The RT primer introduces two cleavable adapter regions and barcode sequences.", "bbox": null, "rationale": null}]}, {"target": "state_property:rt_products:stop_origin", "verdict": "supported", "action": "accept", "rationale": "The defined_other property describes cDNA endpoint information rather than a peptide chemical modification on DNA. Most, not all, RT products terminate at the residual polypeptide.", "evidence": [{"source_id": "primary:paper:24184352", "locator": "[b00008]", "basis": "text", "support": "reported", "quote": "The RNA is recovered from the nitrocellulose membrane by digesting the protein with proteinase K, which leaves a polypeptide at the crosslink site (Fig. 1, step 9). The RNA is then reverse transcribed into cDNA, which most often truncates at the polypeptide remaining at the crosslink site (Fig. 1, step 10).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24184352", "locator": "[b00008]", "basis": "text", "support": "reported", "quote": "After high-throughput sequencing, the barcode sequence precedes the cDNA sequence. Truncated cDNAs represent over 80% of the cDNA library, and after mapping their sequence to the genome, the position of the preceding nucleotide corresponds to the crosslinking site [7].", "bbox": null, "rationale": null}]}]}, "sources": {"iclip::card:iclip": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/iclip.html", "title": "iCLIP", "text_characters": 3579, "text_sha256": "58aa359541336954b4f93d0a05c0bd1c858cb82b1e8ae5ede2a5a1596fa4593b"}, "iclip::collection:rna:page:58": {"kind": "text", "content_level": "catalogue", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102/sources_03/collection_pages/rna_058.txt", "sha256": "9b09a7b21938fb56b8a25ff1260ba6d09bca67ed18992a75989eb070c2da7e59", "title": "Illumina RNA collection, PDF page 58", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/products/research_reviews/rna-sequencing-methods-review-web.pdf illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/iclip.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA-Protein Interactions", "source_category_path": ["Transcriptome", "RNA-Protein Interactions"], "description_verbatim": "iCLIP maps protein-RNA interactions, in a process similar to HITS-CLIP and PAR-CLIP. This approach includes additional steps to digest the proteins after crosslinking and to map the crosslink sites with reverse transcriptase.\nIn iCLIP, specific crosslinked RNA-protein complexes are immunoprecipitated. The complexes are treated with proteinase K, as the protein crosslinked at the binding site remains undigested. Upon RT, cDNA truncates at the binding site and is circularized. These circularized fragments are linearized and PCR-amplified. Deep sequencing of these amplified fragments provides nucleotide resolution of the protein-binding site eCLIP is an improvement over iCLIP that avoids circularizing the cDNA to reduce artifacts.\nOther versions: HITS-CLIP, PAR-CLIP, eCLIP, irCLIP.", "advantages_verbatim": ["Nucleotide resolution of protein-binding sites", "Avoids the use of nucleases", "Amplification allows the detection of rare events"], "limitations_verbatim": ["Antibodies not specific to target will precipitate nonspecific complexes", "Nonlinear PCR amplification can lead to biases affecting reproducibility", "Artifacts may be introduced in the circularization step", "Radioisotopes required for visualization of UV-crosslinked protein-RNA complexes only label 5' ends", "Circular ligation can be inefficient"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "iCLIP"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "iCLIP maps protein-RNA interactions, in a process similar to HITS-CLIP and PAR-CLIP. This approach includes additional steps to digest the proteins after crosslinking and to map the crosslink sites with reverse transcriptase.\nIn iCLIP, specific crosslinked RNA-protein complexes are immunoprecipitated. The complexes are treated with proteinase K, as the protein crosslinked at the binding site remains undigested. Upon RT, cDNA truncates at the binding site and is circularized. These circularized fragments are linearized and PCR-amplified. Deep sequencing of these amplified fragments provides nucleotide resolution of the protein-binding site eCLIP is an improvement over iCLIP that avoids circularizing the cDNA to reduce artifacts.\nOther versions: HITS-CLIP, PAR-CLIP, eCLIP, irCLIP.\nPros:\nNucleotide resolution of protein-binding sites\nAvoids the use of nucleases\nAmplification allows the detection of rare events\nCons:\nAntibodies not specific to target will precipitate nonspecific complexes\nNonlinear PCR amplification can lead to biases affecting reproducibility\nArtifacts may be introduced in the circularization step\nRadioisotopes required for visualization of UV-crosslinked protein-RNA complexes only label 5' ends\nCircular ligation can be inefficient"}, {"source_locator": "jcr:content/par/text_2/text", "text": "iCLIP: Konig J., Zarnack K., Rot G., Curk T., Kayikci M., et al. (2010) iCLIP reveals the function of hnRNP particles in splicing at individual nucleotide resolution. Nat Struct Mol Biol 17: 909-915"}, {"source_locator": "jcr:content/par/text_3/text", "text": "TruSeq RNA Library Preparation Kit v2\nTruSeq Small RNA Library Preparation Kits\nTruSeq Stranded total RNA Library Prep Kit\nTruSeq Stranded mRNA Library Prep Kit\nTruSeq Targeted RNA Expression Kits"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Cook K. B., Hughes T. R. and Morris Q. D. High-throughput characterization of protein-RNA interactions. Brief Funct Genomics. 2015;14:74-89\nSutandy F. X., function filterRecords() {

  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
