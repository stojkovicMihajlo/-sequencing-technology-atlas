roduction were checked. PARIS is a distinct primary target; it is not an alternative in the assigned icSHAPE row."}, {"source_id": "icshape::paper:27180905", "locator": "b00008, Introduction: combined application", "basis": "text", "support": "reported", "quote": "The combination of PARIS, icSHAPE (in vivo click SHAPE), phylogenetic analysis and iCLIP reveals the overall architecture of the XIST lncRNA and the mechanism of SPEN binding to XIST A-repeat.", "bbox": null, "rationale": "icSHAPE is used in a combined application; this does not make PARIS part of the scoped schematic or establish an additional icSHAPE implementation to extract."}]}], "corrections": [{"id": "correction_capture_carrier", "target_id": "state:s_rt_preparation", "diagram_observation": "After Reverse transcription, the drawing replaces purple folded RNA with blue linear strands while retaining the pink linker and blue biotin symbols directly on those strands; the same tagged blue strands then appear on streptavidin beads. RNA is not separately shown in this part of either image.", "primary_statement": "Biotin is attached to NAI-N3-modified RNA, not copied onto the cDNA. The 2015 procedure completes RT, preserves non-denaturing conditions, then adds streptavidin beads. The captured species is therefore biotinylated RNA with its hybridized first-strand cDNA; RNase A/T1 plus RNase H and denaturation release cDNA. The post-RT and capture States explicitly retain both partners and place biotin on RNA. The diagram’s RT-before-capture order is retained.", "disposition": "use_primary", "evidence": [{"source_id": "icshape::diagram:asset_c902cf65e9939035b2222841", "locator": "Reverse transcription arrow: purple tagged RNAs become blue horizontal strands still drawn with the pink/blue tag symbols.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.533, 0.0, 0.751, 0.83], "rationale": null}, {"source_id": "icshape::diagram:asset_c902cf65e9939035b2222841", "locator": "Capture on Streptavi- 00063, cDNA elution with RNases followed by heating and magnetic separation", "basis": "text", "support": "reported", "quote": "cDNA is eluted by adding 1μL RNaseA/T1 cocktail (Ambion, Inc) 1μL RNaseH (Enzymatics), 12.5μL 50mM D-Biotin, 5μL 10x Elution Buffer (500mM HEPES, 750mM NaCl, 30mM MgCl2, 1.25% Sarkosyl, 0.25% Na-deoxycholate, 50mM DTT), 30.5μL water and incubating at 37°C for 30min in a Thermomixer at 800 rpm. Samples are mixed with 1μL 100% DMSO, heated to 95°C for 3 minutes, placed on a magnet, and the 50μL cDNA elution moved to a new tube.", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:25799993", "locator": "b00008 and b00062–b00063, interpretation of the captured species", "basis": "text", "support": "inferred", "quote": "After cDNA extension do not raise samples above 37°C to avoid denaturing conditions.", "bbox": null, "rationale": "Biotin is installed on RNA (b00008); RT products are kept non-denatured before streptavidin capture (b00062–b00063), and RNaseH-containing elution releases cDNA (b00063). Together these passages identify the retained RNA:cDNA hybrid and locate the capture handle on its RNA partner."}]}], "unknowns": []}, "review": {"format_version": "illumina_diagram_review/1.2", "record_id": "icshape", "candidate_sha256": "bbd01f3293b83ce75336cb1c47049c6be37529aa5e5e97b1689945b4e83a644b", "inspected_sources": ["icshape::diagram:asset_c902cf65e9939035b2222841", "poster_a07a44789eb17c95627fca13::diagram:poster_crop_11bc4e2b8553046f0ba6d399", "icshape::card:icshape", "icshape::collection:rna:page:79", "poster_a07a44789eb17c95627fca13::reference:poster_a07a44789eb17c95627fca13:references:0", "icshape::metadata:25799993", "icshape::metadata:26766114", "icshape::paper:25799993", "icshape::paper:26766114", "icshape::paper:26878240", "icshape::paper:27180905"], "checks": [{"target": "construction", "verdict": "supported", "action": "accept", "rationale": "All five depicted action blocks and their actual intervening preparations ibrary preparation.", "basis": "text", "support": "reported", "quote": "Sequencing reads generated from the NAI-N3– and mock (DMSO)-treated samples are mapped to a transcriptome annotation, followed by computational identification of RT stops corresponding to SHAPE modifications—and hence reactive nucleotides—across the entire transcriptome (Fig. 1b).", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:26766114", "locator": "b00020, Applications, advantages and limitations of icSHAPE.", "basis": "text", "support": "reported", "quote": "An additional advantage of icSHAPE is the specific enrichment of NAI-N3–modified RNAs; however, it is formally possible that reverse transcriptase does not always fully extend to the nucleotides modified with NAI-N3, thereby possibly generating a false-positive signal.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_eluted_cdna:strand", "verdict": "supported", "action": "accept", "rationale": "single_stranded belongs to the recovered cDNA preparation. The clarification protocol explicitly calls this recovered material single-stranded DNA (cDNA), consistent with first-strand synthesis and RNA removal.", "evidence": [{"source_id": "icshape::paper:25799993", "locator": "b00063, cDNA elution, RNase-containing mixture.", "basis": "text", "support": "reported", "quote": "cDNA is eluted by adding 1μL RNaseA/T1 cocktail (Ambion, Inc) 1μL RNaseH (Enzymatics),", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:26766114", "locator": "b00246, recovered cDNA, critical step.", "basis": "text", "support": "reported", "quote": "Use of the Zymo DNA Clean & Concentrator-5 columns under the conditions detailed in Step 51 will recover single-stranded DNA (cDNA) as small as 20 nt.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_modified_cellular_rna:adduct", "verdict": "supported", "action": "accept", "rationale": "The covalent azide-bearing acyl adduct is assigned to modified_rna, specifically at reactive RNA ribose 2-prime-hydroxyl sites. SHAPE chemistry and the NAI-N3 design support that placement; it is not asserted on all RNA or on a terminal group.", "evidence": [{"source_id": "icshape::paper:25799993", "locator": "b00007, SHAPE substrate and structural interpretation.", "basis": "text", "support": "reported", "quote": "Selective 2’-Hydroxyl Acylation followed by Primer Extension (SHAPE) accurately identifies flexible (single stranded) bases in RNA for all four bases.", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:26766114", "locator": "b00016, Development and overview of icSHAPE, probe design.", "basis": "text", "support": "reported", "quote": "We transformed an existing in vivo SHAPE probe 2-methylnicotinic acid imidazolide (NAI)23 into a dual-function SHAPE probe (RNA structure probe and enrichment), by the addition of an azide to the nicotinic acid ring (at position 2), and we named this molecule NAI-N3.", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:26766114", "locator": "b00016, covalent RNA modification and enrichment.", "basis": "text", "support": "reported", "quote": "By the addition of a biotin moiety to each RNA that was successfully SHAPE modified, we are able to subsequently enrich specifically for RNA fragments that have NAI-N3 covalently attached.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_modified_cellular_rna:context", "verdict": "supported", "action": "accept", "rationale": "The context correctly locates this RNA modification boundary in living cells; RNA recovery is part of the next operation, so compartment continuity is preserved.", "evidence": [{"source_id": "icshape::diagram:asset_c902cf65e9939035b2222841", "locator": "NAI-N3 arrow / Add azide group, leading to red N3 marks on purple RNAs within the cellular oval.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.258, 0.0, 0.465, 0.81], "rationale": null}, {"source_id": "icshape::paper:26766114", "locator": "b00017, overview, first action.", "basis": "text", "support": "reported", "quote": "In brief, the bifunctional NAI-N3 SHAPE reagent is used to label all RNAs inside living cells (or in vitro refolded RNA) to generate covalent modifications on targeted RNAs at single-nucleotide resolution.", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:25799993", "locator": "b00048, Tissue culture and In Vivo SHAPE modification, final sentence.", "basis": "text", "support": "reported", "quote": "Samples were then transferred to 15mL tubes with 2-7mL of pre-aliquoted Trizol and RNA extracted as described above.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_modified_cellular_rna:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity describes a preparation containing modified RNA and allows the unmodified subpopulation supported by single-hit kinetics.", "evidence": [{"source_id": "icshape::diagram:asset_c902cf65e9939035b2222841", "locator": "NAI-N3 arrow / Add azide group, leading to red N3 marks on purple RNAs within the cellular oval.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.258, 0.0, 0.465, 0.81], "rationale": null}, {"source_id": "icshape::paper:26766114", "locator": "b00017, overview, first action.", "basis": "text", "support": "reported", "quote": "In brief, the bifunctional NAI-N3 SHAPE reagent is used to label all RNAs inside living cells (or in vitro refolded RNA) to generate covalent modifications on targeted RNAs at single-nucleotide resolution.", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:25799993", "locator": "b00050, titrated hit kinetics, modified subpopulation.", "basis": "text", "support": "reported", "quote": "After NAI-N3 modification and biotin pulldown, we retrieved approximately 10-20% of the input RNA as modified RNA, consistent with the expected Poisson distribution of single-hit modification.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_nai_n3:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity is the NAI-N3 reagent named on the acylation arrow and identified by the protocol.", "evidence": [{"source_id": "icshape::diagram:asset_c902cf65e9939035b2222841", "locator": "NAI-N3 arrow / Add azide group, leading to red N3 marks on purple RNAs within the cellular oval.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.258, 0.0, 0.465, 0.81], "rationale": null}, {"source_id": "icshape::paper:26766114", "locator": "b00016, Development and overview of icSHAPE, probe design.", "basis": "text", "support": "reported", "quote": "We transformed an existing in vivo SHAPE probe 2-methylnicotinic acid imidazolide (NAI)23 into a dual-function SHAPE probe (RNA structure probe and enrichment), by the addition of an azide to the nicotinic acid ring (at position 2), and we named this molecule NAI-N3.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_nai_n3:probe_design", "verdict": "supported", "action": "accept", "rationale": "The modification belongs to the NAI reagent itself and its site is the nicotinic acid ring at position 2, explicitly reported in b00016. It is not RNA-end chemistry.", "evidence": [{"source_id": "icshape::paper:26766114", "locator": "b00016, Development and overview of icSHAPE, probe design.", "basis": "text", "support": "reported", "quote": "We transformed an existing in vivo SHAPE probe 2-methylnicotinic acid imidazolide (NAI)23 into a dual-function SHAPE probe (RNA structure probe and enrichment), by the addition of an azide to the nicotinic acid ring (at position 2), and we named this molecule NAI-N3.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_rt_preparation:hybrid", "verdict": "supported", "action": "accept", "rationale": "The associated_cdna subject and tagged_rna partner name both local molecules. hybridized_to accurately expresses the noncovalent RNA:cDNA interface needed for the subsequent RNA-mediated capture.", "evidence": [{"source_id": "icshape::paper:25799993", "locator": "b00062, RT before capture; preservation of non-denaturing conditions.", "basis": "text", "support": "reported", "quote": "After cDNA extension do not raise samples above 37°C to avoid denaturing conditions.", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:25799993", "locator": "b00063, bead addition following completed RT.", "basis": "text", "support": "reported", "quote": "After the reverse transcription reaction completes 40μL of pre-washed beads are added to each sample, mixed by flicking, and incubated at room temperature for 45 minutes.", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:25799993", "locator": "b00063, cDNA elution, RNase-containing mixture.", "basis": "text", "support": "reported", "quote": "cDNA is eluted by adding 1μL RNaseA/T1 cocktail (Ambion, Inc) 1μL RNaseH (Enzymatics),", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:25799993", "locator": "b00008 and b00062–b00063, joint interpretation of capture carrier.", "basis": "text", "support": "inferred", "quote": "After cDNA extension do not raise samples above 37°C to avoid denaturing conditions.", "bbox": null, "rationale": "The affinity handle is installed on RNA (b00008). Non-denaturing RT products proceed directly to streptavidin capture, and RNase H-containing elution releases cDNA (b00062–b00063). These linked passages support RNA:cDNA hybrids with RNA-linked biotin, rather than covalent biotin on the copied DNA."}]}, {"target": "state_property:s_rt_preparation:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity is a post-RT preparation containing RNA:cDNA hybrids, as resolved from the registered biotin-on-RNA, non-denaturing RT/capture and RNase-release passages.", "evidence": [{"source_id": "icshape::paper:25799993", "locator": "b00008, bifunctional probe and purification handle.", "basis": "text", "support": "reported", "quote": "By using copper-free click chemistry, a biotin moiety is selectively and efficiently added to NAI-N3-modified RNA, providing a stringent purification handle with streptavidin beads (Fig. 1c, Extended Data Fig. 2).", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:25799993", "locator": "b00062, RT before capture; preservation of non-denaturing conditions.", "basis": "text", "support": "reported", "quote": "After cDNA extension do not raise samples above 37°C to avoid denaturing conditions.", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:25799993", "locator": "b00063, bead addition following completed RT.", "basis": "text", "support": "reported", "quote": "After the reverse transcription reaction completes 40μL of pre-washed beads are added to each sample, mixed by flicking, and incubated at room temperature for 45 minutes.", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:25799993", "locator": "b00008 and b00062–b00063, joint interpretation of capture carrier.", "basis": "text", "support": "inferred", "quote": "After cDNA extension do not raise samples above 37°C to avoid denaturing conditions.", "bbox": null, "rationale": "The affinity handle is installed on RNA (b00008). Non-denaturing RT products proceed directly to streptavidin capture, and RNase H-containing elution releases cDNA (b00062–b00063). These linked passages support RNA:cDNA hybrids with RNA-linked biotin, rather than covalent biotin on the copied DNA."}]}, {"target": "state_property:s_rt_preparation:reporter", "verdict": "supported", "action": "accept", "rationale": "The associated_cdna subject is the actual reporter carrier. Its sequence and extension endpoint link to the template region and support later reactivity inference; this does not assert unique molecular barcoding or perfect adduct specificity.", "evidence": [{"source_id": "icshape::paper:26766114", "locator": "b00017, sequencing-read interpretation after library preparation.", "basis": "text", "support": "reported", "quote": "Sequencing reads generated from the NAI-N3– and mock (DMSO)-treated samples are mapped to a transcriptome annotation, followed by computational identification of RT stops corresponding to SHAPE modifications—and hence reactive nucleotides—across the entire transcriptome (Fig. 1b).", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:26766114", "locator": "b00020, Applications, advantages and limitations of icSHAPE.", "basis": "text", "support": "reported", "quote": "An additional advantage of icSHAPE is the specific enrichment of NAI-N3–modified RNAs; however, it is formally possible that reverse transcriptase does not always fully extend to the nucleotides modified with NAI-N3, thereby possibly generating a false-positive signal.", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:25799993", "locator": "b00008 and b00062–b00063, joint interpretation of capture carrier.", "basis": "text", "support": "inferred", "quote": "After cDNA extension do not raise samples above 37°C to avoid denaturing conditions.", "bbox": null, "rationale": "The affinity handle is installed on RNA (b00008). Non-denaturing RT products proceed directly to streptavidin capture, and RNase H-containing elution releases cDNA (b00062–b00063). These linked passages support RNA:cDNA hybrids with RNA-linked biotin, rather than covalent biotin on the copied DNA."}]}, {"target": "state_property:s_rt_preparation:rna_biotin", "verdict": "supported", "action": "accept", "rationale": "The modification is correctly assigned to tagged_rna. Biotin is installed on the RNA-linked SHAPE adduct and remains with the template during RT; it is not a copied DNA modification.", "evidence": [{"source_id": "icshape::paper:25799993", "locator": "b00008, bifunctional probe and purification handle.", "basis": "text", "support": "reported", "quote": "By using copper-free click chemistry, a biotin moiety is selectively and efficiently added to NAI-N3-modified RNA, providing a stringent purification handle with streptavidin beads (Fig. 1c, Extended Data Fig. 2).", "bbox": null, "rationale": null}, {"source_id": "icshape::paper:25799993", "locator": "b00008 and b00062–b00063, joint interpretation of capture carrier.", "basis": "text", "support": "inferred", "quote": "After cDNA extension do not raise samples above 37°C to avoid denaturing conditions.", "bbox": null, "rationale": "The affinity handle is installed on RNA (b00008). Non-denaturing RT products proceed directly to streptavidin capture, and RNase H-containing elution releases cDNA (b00062–b00063). These linked passages support RNA:cDNA hybrids with RNA-linked biotin, rather than covalent biotin on the copied DNA."}]}, {"target": "state_property:s_streptavidin_beads:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity is streptavidin affinity beads, matching the support caption and primary bead addition after RT.", "evidence": [{"source_id": "icshape::diagram:asset_c902cf65e9939035b2222841", "locator": "Capture on Streptavidin beads arrow from tagged blue strands to the grey bead bearing binding shapes and strands.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.752, 0.0, 0.879, 0.95], "rationale": null}, {"source_id": "icshape::paper:25799993", "locator": "b00063, bead addition following completed RT.", "basis": "text", "support": "reported", "quote": "After the reverse transcription reaction completes 40μL of pre-washed beads are added to each sample, mixed by flicking, and incubated at room temperature for 45 minutes.", "bbox": null, "rationale": null}]}]}, "sources": {"icshape::card:icshape": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/icshape.html", "title": "icSHAPE", "text_characters": 2977, "text_sha256": "6f1979d36a3ff81698cd196edaa27c28 e", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": null, "source_category_path": [], "description_verbatim": "icSHAPE provides accurate predictions of RNA-protein interactions and m6A modification in vivo by combining SHAPE-Seq with click chemistry for enhanced isolation. , Secondary RNA structures are modified by the addition of a custom 2-methylnicotinic acid imidazolide (NAI) probe, termed NAI-N3. The modifed RNA is marked selectively with dibenzocyclooxtyne (DIBO)-biotin through copper-free click chemistry, enabling purification by streptavidin pull-down.\nBriefly, NAI-N3 is added to RNA in vivo to mark it selectively for DIBO-biotin tagging. The cells are lysed, the RNA is poly(A)-selected, tagged with DIBO-biotin, and fragmented. The RNA strands are 3'-end-repaired with T4 PNK and ligated to 3' adapters. After size-selection, the RNA strands are reverse-transcribed, and both the RNA and first-strand cDNA are captured on streptavidin beads. Another cDNA size-selection step is carried out before circularization and PCR amplification. The samples are ready for NGS.", "advantages_verbatim": ["Provides accurate predictions of RNA-protein interactions and m6A modifications in vivo", "Can be applied to ex vivo applications with slight modifications", "Chemical modification is applicable to all nucleotides, unlike DMS which only modifies adenines and cytosines"], "limitations_verbatim": ["Circularization may introduce additional bias"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "icSHAPE"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "icSHAPE provides accurate predictions of RNA-protein interactions and m6A modification in vivo by combining SHAPE-Seq with click chemistry for enhanced isolation. , Secondary RNA structures are modified by the addition of a custom 2-methylnicotinic acid imidazolide (NAI) probe, termed NAI-N3. The modifed RNA is marked selectively with dibenzocyclooxtyne (DIBO)-biotin through copper-free click chemistry, enabling purification by streptavidin pull-down.\nBriefly, NAI-N3 is added to RNA in vivo to mark it selectively for DIBO-biotin tagging. The cells are lysed, the RNA is poly(A)-selected, tagged with DIBO-biotin, and fragmented. The RNA strands are 3'-end-repaired with T4 PNK and ligated to 3' adapters. After size-selection, the RNA strands are reverse-transcribed, and both the RNA and first-strand cDNA are captured on streptavidin beads. Another cDNA size-selection step is carried out before circularization and PCR amplification. The samples are ready for NGS.\nSimilar methods: SHAPE-Seq\nPros:\nProvides accurate predictions of RNA-protein interactions and m6A modifications in vivo\nCan be applied to ex vivo applications with slight modifications\nChemical modification is applicable to all nucleotides, unlike DMS which only modifies adenines and cytosines\nCons:\nCircularization may introduce additional bias"}, {"source_locator": "jcr:content/par/text_2/text", "text": "icSHAPE: Spitale R. C., Flynn R. A., Zhang Q. C., et al. Structural imprints in vivo decode RNA regulatory mechanisms. Nature. 2015;519:486-490\nicSHAPE Protocol: Flynn R. A., Zhang Q. C., Spitale R. C., Lee B., Mumbach M. R. and Chang H. Y. Transcriptome-wide interrogation of RNA secondary structure in living cells with icSHAPE. Nat Protoc. 2016;11:273-290"}, {"source_locator": "jcr:content/par/text_3/text", "text": "TruSeq Small RNA library Prep kit"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Flynn R. A., Do B. T., Rubin A. J., et al. 7SK-BAF axis controls pervasive transcription at enhancers. Nat Struct Mol Biol. 2016;\nLu Z., Zhang Q. C., Lee B., et al. RNA Duplex Map in Living Cells Reveals Higher-Order Transcriptome Structure. Cell. 2016;165:1267-1279"}], "cms_modified_at_not_invention_date":   const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
