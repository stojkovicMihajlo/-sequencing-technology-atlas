in partner is on the ligated RNA-linked adapter.", "disposition": "use_primary", "evidence": [{"source_id": "irclip::diagram:asset_c7d282d55723e94951593396", "locator": "RNA with adapter enters grey processing icon; Reverse-transcribe and Immunopurify", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.789, 0.0, 0.895, 1.0], "rationale": null}, {"source_id": "poster_91e51c9ea4b650037050d777::diagram:poster_crop_1a1442f6b0251f188bf1799b", "locator": "irCLIP row: Reverse-transcribe and Immunopurify, after recovered RNA and before Circularize and PCR", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.728, 0.423, 0.811, 0.692], "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00026] irCLIP library construction, reverse transcription", "basis": "text", "support": "reported", "quote": "0.2 μL of TIGRT-III reverse transcriptase (Ingex, #TGIRT50) was added to the annealed RNA", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00026] capture after reverse transcription", "basis": "text", "support": "reported", "quote": "cDNA-RNA hybrids were captured by addition of 5 μL of MyOne Streptavidin C1 Dynabeads", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00026] cDNA release after hybrid capture", "basis": "text", "support": "reported", "quote": "Beads were resuspended in 10 μL of cDNA elution/RNA degradation buffer", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00026] circularization after cDNA elution/RNA degradation", "basis": "text", "support": "reported", "quote": "cDNA was circularized in a thermocycler for 1.5 h at 60 °C.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00026] capture after reverse transcription", "basis": "text", "support": "inferred", "quote": "cDNA-RNA hybrids were captured by addition of 5 μL of MyOne Streptavidin C1 Dynabeads", "bbox": null, "rationale": "The depicted/primary 3′-biotinylated RNA-linked adapter provides the streptavidin-binding partner. Capture therefore retains the RNA–cDNA hybrid through the template-associated adapter, rather than through an antibody or a biotin copied into cDNA."}]}, {"id": "c_nuclease", "target_id": "operation:o_digest", "diagram_observation": "Both images show one RNase A and RNase I digestion block on immunoprecipitated complexes, with nuclease icons at the flanking RNA. The catalogue describes digestion using RNase A and RNase I.", "primary_statement": "The primary paper compares separate on-bead RNase A, RNase 1 and S1 nuclease treatments and reports on-bead RNase A as the best-performing tested nuclease. Its methods refer separately to RNAse-A- and RNAse-1-digested complexes. The depicted RNase A/RNase I block is retained as one local on-bead trimming block with a nuclease choice; the graph does not assert a simultaneous RNase A plus RNase I cocktail or add the unshown S1 comparison as a target route.", "disposition": "use_primary", "evidence": [{"source_id": "irclip::diagram:asset_c7d282d55723e94951593396", "locator": "Captured complex followed by RNase icons; caption RNase A and RNase I digestion", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.365, 0.0, 0.479, 1.0], "rationale": null}, {"source_id": "poster_91e51c9ea4b650037050d777::diagram:poster_crop_1a1442f6b0251f188bf1799b", "locator": "irCLIP row: RNase A and RNase I digestion, with RNA shortened on capture support", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.411, 0.423, 0.478, 0.692], "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00006] separate comparative nuclease evaluations", "basis": "text", "support": "reported", "quote": "To determine whether a particular nuclease was better at generating optimal RNA fragments, we compared on-bead nuclease digestions across the same panel of RBPs using RNase A, RNase 1, and S1 n ered primary passages resolve the two consequential caption ambiguities; no architecture-changing research question remains.", "evidence": [{"source_id": "primary:paper:27111506", "locator": "[b00002] opening summary", "basis": "text", "support": "reported", "quote": "Here we introduce a UV-C crosslinking and immunoprecipitation platform, irCLIP, which provides an ultraefficient, fast, and nonisotopic method for the detection of protein—RNA interactions using far less material than standard protocols.", "bbox": null, "rationale": null}, {"source_id": "irclip::diagram:asset_c7d282d55723e94951593396", "locator": "Complete irCLIP route: RNA-protein complex, UV 254 nm crosslink lyse and fragment, immunoprecipitation, RNase digestion, adapter/end processing, membrane/PK recovery, reverse transcription, Circularize and PCR, terminal cDNA", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00006] on-bead nuclease recovery result", "basis": "text", "support": "reported", "quote": "on-bead RNase A digestions produced the maximal number of optimal RNA fragments", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00007] reported recovery improvement", "basis": "text", "support": "reported", "quote": "These changes significantly improved precipitation of irCLIP-adaptor-ligated RNA compared to urea-PK digestions and did not impact RNA integrity", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00009] irCLIP reverse-transcriptase comparison", "basis": "text", "support": "reported", "quote": "TGIRT-III produced four- to eight-fold more cDNA than SuperScript III", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00009] library recovery improvement", "basis": "text", "support": "reported", "quote": "we replaced silica-column-based cDNA purification with an AMPure bead-isoprop supported", "action": "accept", "rationale": "The adapter is covalently linked to the RNA partner through the depicted RNA 3′ ligation; it is not merely a free co-present oligonucleotide.", "evidence": [{"source_id": "irclip::diagram:asset_c7d282d55723e94951593396", "locator": "Dephosphorylate and ligate 3′ adaptor: support-bound RNP acquires adapter extension, green star and terminal blue biotin symbol", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00019] dephosphorylation followed by on-bead 3′ ligation", "basis": "text", "support": "reported", "quote": "Dephosphorylation reactions were removed (not applicable to S1 digestions) and immunoprecipitates were 3′-end ligated with T4 RNA Ligase 1", "bbox": null, "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00015] final adapter identity", "basis": "text", "support": "reported", "quote": "The final preA-L3-IR800-biotin DNA adaptor was then column purified using the QIAquick Nucleotide Removal Kit", "bbox": null, "rationale": null}]}, {"target": "state_property:s_ligated:bead_context", "verdict": "supported", "action": "accept", "rationale": "The physical context remains antibody-bead capture at the ligated boundary, as shown by the persistent pink/gray support and primary on-immunoprecipitate ligation.", "evidence": [{"source_id": "irclip::diagram:asset_c7d282d55723e94951593396", "locator": "Dephosphorylate and ligate 3′ adaptor: support-bound RNP acquires adapter extension, green star and terminal blue biotin symbol", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "primary:paper:27111506", "locator": "[b00019] dephosphorylation followed by on-bead 3′ ligation", "basis": "text", "support": "reported", "quote": "Dephosphorylation reactions were removed (not applicable to S1 digestions) and immunoprecipitates were 3′-end ligated with T4 RNA L rized and PCR-amplified to produce cDNA libraries for sequencing.", "advantages_verbatim": ["Nonisotopic detection of protein-RNA interactions with minimal starting material", "On-bead nuclease digestion improves the length of RNA fragments for cDNA library prep", "Able to accommodate small cell samples and reveal novel RBP binding sites", "Uses thermostable reverse transcriptase at 60°C, reducing biases by melting secondary RNA structures1"], "limitations_verbatim": ["Not widely adapted by the scientific community yet", "Circularization step may introduce artifacts"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "irCLIP"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "irCLIP maps protein-RNA interaction sites using less sample material, time, and increased cDNA library quality compared to previous CLIP methods. irCLIP was designed to tackle the issues in both iCLIP and HITS-CLIP, such as reverse-transcriptase halting and short cDNA library fragments, by using on-bead nuclease digestion.\nFirst, RNA-protein complexes are UV-crosslinked and immunoprecipitated. Next, they are digested using RNase A and RNase I to excise both ends of the protein-bound RNA strand. An IR800-biotin adapter is ligated to the 3' end of the RNA fragment. After size selection, nitrocellulose blotting, and proteinase K digestion, the RNA strands of interest are purified. They are reverse-transcribed and immunopurified once again. The cDNA strands are circularized and PCR-amplified to produce cDNA libraries for sequencing.\nPros:\nNonisotopic detection of protein-RNA interactions with minimal starting material\nOn-bead nuclease digestion improves the length of RNA fragments for cDNA library prep\nAble to accommodate small cell samples and reveal novel RBP binding sites\nUses thermostable reverse transcriptase at 60°C, reducing biases by melting secondary RNA structures1\nCons:\nNot widely const $ = id => document.getElementById(id);
const el = (tag, text, cls) => { const n = document.createElement(tag); if (text != null) n.textContent = text; if (cls) n.className = cls; return n; };
const labels = {supported:'Supported', research_needed:'Further research', failed:'Failed', integrity_error:'Rejected on revalidation'};
const batchLabel = b => ({initial_two:'Catalogue card', catalogue:'Catalogue card', posters:'Main poster row', footer_panels:'Footer / product / readout panel', scoped_method:'Scoped workflow'})[b] || b;
let inventory = [], selected = '', request = 0;
function link(text, url) { const a = el('a',text); if (/^https?:\/\//.test(url || '')) { a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; } return a; }
function section(parent, title) { const d = el('details',null,'section'); d.append(el('summary',title)); parent.append(d); return d; }
function raw(parent, title, value) { const d = section(parent,title); d.append(el('pre',JSON.stringify(value,null,2))); }
function fields(parent, rows) { const d = el('div',null,'fields'); for (const [name,value] of rows) { if (value == null || value === '' || (Array.isArray(value) && !value.length)) continue; d.append(el('b',name),el('span',Array.isArray(value) ? value.join('; ') : String(value))); } parent.append(d); }
function assertions(parent,title,items,record) {
  if(!items?.length)return;
  const box=section(parent,title);
  for(const item of items){
    fields(box,Object.entries(item).filter(([k])=>k!=='evidence').map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):v]));
    evidence(box,item.evidence,record);
  }
}
function evidence(parent, items, record) {
  for (const e of items || []) {
    const box = el('div',null,'evidence'), s = record.sources[e.source_id] || {};
    box.append(link(s.title || e.source_id,s.url),el('p',`${e.support} · ${s.content_level || e.basis} · ${e.locator}`,'muted'));
    if (e.quote) box.append(el('blockquote',e.quote));
    if (e.bbox) box.append(el('p','Image region [left, top, right, bottom]: '+e.bbox.join(', '),'muted'));
    if (e.rationale) box.append(el('p',e.rationale));
    parent.append(box);
  }
}
function filterRecords() {
  const q = $('search').value.toLowerCase(), status = $('status').value, batch = $('batch').value;
  const found = inventory.filter(r => (status === 'all' || r.status === status) &&
    (batch === 'all' || (batch === 'catalogue' ? ['initial_two','catalogue'].includes(r.batch) : r.batch === batch)) &&
    [r.title,r.record_id,...r.method_names,...r.category].join(' ').toLowerCase().includes(q));
  $('count').textContent = found.length+' source depictions'; $('records').replaceChildren();
  for (const r of found) {
    const b = el('button',r.title,r.record_id === selected ? 'active' : '');
    b.append(el('small',batchLabel(r.batch)+' · '+labels[r.status]));
    b.type = 'button';
    b.setAttribute('aria-controls', 'detail');
    b.setAttribute('aria-pressed', String(r.record_id === selected));
    b.onclick = () => {
      // Load directly, including a second click on the current record. A hash
      // change alone neither retries that record nor reveals an offscreen panel.
      const hash = '#' + encodeURIComponent(r.record_id);
      try { if (location.hash !== hash) window.history.pushState(null, '', hash); } catch (_) { /* Navigation still works without URL access. */ }
      return openRecord(r.record_id, {reveal: true});
    };
    $('records').append(b);
  }
}
function inspect(parent, item, kind, record) {
  const c = record.candidate;
  item = (kind === 'Flow' ? c.flows : kind === 'State' ? c.states : c.operations).find(x => x.id === item.id) || item;
  parent.replaceChildren(el('span',kind,'badge'),el('h3',item.label || item.id));
  const states = new Map(c.states.map(s => [s.id,s]));
  const names = ids => (ids || []).map(id => (states.get(id)?.label || id)+' ['+id+']');
  if (kind === 'Operation') fields(parent,[['Description',item.description],['Input States',names(item.inputs)],['Output States',names(item.outputs)],['Mechanism',item.mechanism || 'Not specified'],['Information effect',item.information_effect || 'Not specified']]);
  if (kind === 'State') fields(parent,[['Kind',item.kind],['Features',item.features]]);
  if (kind === 'State') { assertions(parent,'State properties',item.properties,record); if(item.constituents?.length)raw(parent,'Named constituents',item.constituents); }
  if (kind === 'Operation') { assertions(parent,'Input roles',item.input_roles,record); assertions(parent,'Effects on input/output States',item.effects,record); }
  if (kind === 'Flow') {
    const nodes = [...c.states,...c.operations], name = id => nodes.find(n => n.id === id)?.label || id;
    fields(parent,[['Type',item.kind],['From',name(item.source)+' ['+item.source+']'],['To',name(item.target)+' ['+item.target+']']]);
  }
  fields(parent,[['Local ID',item.id]]);
  const target = kind.toLowerCase()+':'+item.id;
  const affected = c.corrections.filter(x=>x.target_id===target), unknowns = c.unknowns.filter(x=>x.affected_ids.includes(target));
  for (const x of affected) parent.append(el('p','Correction: '+x.primary_statement,'warning'));
  for (const x of unknowns) parent.append(el('p','Unknown: '+x.question,'warning'));
  parent.append(el('h3','Evidence for this record')); evidence(parent,item.evidence,record);
  const labelTarget = kind.toLowerCase()+'_label:'+item.id;
  const checks = record.review?.checks?.filter(x=>x.target===target || x.target===labelTarget) || [];
  if (kind !== 'Flow' && !checks.some(x=>x.target===labelTarget)) parent.append(el('p','This archived review did not separately assess the label. Corrections and features remain part of its interpretation.','muted'));
  if (checks.length) raw(parent,'Recorded review of this target',checks);
  raw(parent,'Exact JSON record',item);
}
function drawGraph(parent, inspector, record) {
  const c = record.candidate, nodes = [...c.states.map(x=>({...x,type:'State'})),...c.operations.map(x=>({...x,type:'Operation'}))];
  const ids = new Set(nodes.map(x=>x.id)), incoming = new Map(nodes.map(x=>[x.id,0])), next = new Map(nodes.map(x=>[x.id,[]]));
  for (const f of c.flows) { if (!ids.has(f.source)||!ids.has(f.target)) { parent.append(el('p','Cannot draw: a Flow endpoint is missing. Inspect the raw record.','warning')); return; } incoming.set(f.target,incoming.get(f.target)+1);next.get(f.source).push(f.target); }
  const rank = new Map(nodes.map(x=>[x.id,0])), ready = nodes.filter(x=>incoming.get(x.id)===0).map(x=>x.id); let processed=0;
  while (ready.length) { const id = ready.shift(); processed++;for (const target of next.get(id)) { rank.set(target,Math.max(rank.get(target),rank.get(id)+1)); incoming.set(target,incoming.get(target)-1);if (!incoming.get(target)) ready.push(target); } }
  if (processed !== nodes.length) { parent.append(el('p','A cycle prevents a left-to-right layout. Use the exact Flow records below.','warning'));return; }
  const NS='http://www.w3.org/2000/svg', svg=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};
  const pos = new Map(), lanes = new Map();
  for (const n of nodes) { const col=rank.get(n.id),row=lanes.get(col)||0;lanes.set(col,row+1);pos.set(n.id,{x:25+col*224,y:25+row*112}); }
  const canvas=svg('svg',{width:Math.max(680,Math.max(...rank.values())*224+240),height:Math.max(150,Math.max(...lanes.values())*112+30),role:'img','aria-label':'Directed State and Operation workflow'});
  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
