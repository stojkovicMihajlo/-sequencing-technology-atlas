eration", "target_id": "operation:o_rna_interface", "diagram_observation": "In all three MARS-Seq depictions, a second-strand cDNA duplex is followed by DNaseI and then RNA fragmentation. No RNA-producing transcription/amplification action is explicitly drawn between the DNA duplex and RNA fragments. This omitted conversion is preserved here and is not asserted as a DNase-mediated DNA-to-RNA reaction.", "primary_statement": "The registered Jaitin main text [b00006] identifies MARS-Seq and points to figures S1-S6 and Supplementary methods, but supplies no transcription/DNase reaction account. Its [b00007] establishes three indexing levels only. The matched Illumina description reports DNA transcription to RNA followed by DNA-template removal, and the Hrdlickova review reports T7-enabled linear in vitro transcription for MARS-Seq; these secondary accounts do not constitute a registered primary passage establishing the local 2014 reaction sequence.", "disposition": "keep_unresolved", "evidence": [{"source_id": "mars-seq::diagram:asset_c352d22a192610d268a86775", "locator": "Arrow labelled DNaseI between duplex cDNA icon and RNA fragmentation icon; no transcription action or RNA amplification product is explicitly drawn between them", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.29, 0.0, 0.57, 0.96], "rationale": null}, {"source_id": "poster_0968b627d4fb4f2f1ad6c1b9::diagram:poster_crop_72019f389c684107c0777c3c", "locator": "Middle row headed MARS-Seq, from poly(A) RNA through P5/P7 cDNA; neighbouring Digital RNA/HiRes-Seq/FREQ-Seq/RNAtag-Seq, Quartz-Seq and right chemistry panel are separate", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.015, 0.465, 0.895, 0.705], "rationale": null}, {"source_id": "poster_a4c46b68aa6b5db4c3f6c966::diagram:poster_crop_be5b623222f40f8eb6eb5419", "locator": "Middle row headed MARS-Seq, from poly(A) RNA through P5/P7 cDNA; adjacent assay rows and right acylation/DIBO-biotin panel have no connectin UMI: TTTTT primer with red UMI/green T7 next to AAAAA substrate", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.105, 0.0, 0.29, 1.0], "rationale": null}]}, {"target": "state_property:s_rt_primer:umi", "verdict": "supported", "action": "accept", "rationale": "The visibly labeled UMI is a segment of the added primer, not a tag on a separate free molecule or a cell identifier.", "evidence": [{"source_id": "mars-seq::diagram:asset_c352d22a192610d268a86775", "locator": "Add polyA primer with partial T7 promoter and UMI: TTTTT primer with red UMI/green T7 next to AAAAA substrate", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.105, 0.0, 0.29, 1.0], "rationale": null}]}, {"target": "state_property:s_rt_product:adapter_region", "verdict": "supported", "action": "accept", "rationale": "The RT icon retains adapter-associated orange and terminal colored regions. The property does not identify the full set of cellular/plate tags in this exact PCR input.", "evidence": [{"source_id": "mars-seq::diagram:asset_c352d22a192610d268a86775", "locator": "Reverse transcription following ligation; paired-line product retains orange and red/green regions", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.71, 0.0, 0.85, 1.0], "rationale": null}]}, {"target": "state_property:s_rt_product:identity", "verdict": "supported", "action": "accept", "rationale": "The RT product is a cDNA-containing preparation. Avoiding an asserted DNA/DNA duplex respects the diagram's insufficient strand-composition detail.", "evidence": [{"source_id": "mars-seq::diagram:asset_c352d22a192610d268a86775", "locator": "Reverse transcription following ligation; paired-line product retains orange and red/green regions", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.71, 0.0, 0.85, 1.0], "rationale": null}, {"source_id": "mars-seq::card:mars-seq", "locator": "Description, fragmented RNA followed by adapter association and final reverse transcription", "basis": "text", "support": "reported", "quote": "The RNA strands are fragmented and annealed to sequencing adapters, followed by RT to generate barcoded cDNA libraries that are ready for sequencing.", "bbox": null, "rationale": null}]}, {"target": "unknown:u_index_placement", "verdict": "unresolved", "action": "research", "rationale": "This is consequential to the expressly declared indexing organization. Primary three-tag reporting supports the overall readout but does not identify the physical pre-pooling carrier or its local introduction/preservation route. The candidate correctly keeps pooling of contents distinct from intact compartments and avoids guessing barcode placement. Acquire and register the same primary supplement's primer/adapter and workflow passages to establish the cell-label carrier before well contents mix, its continuity through pooled amplification, the plate-label carrier/introduction stage, and the tag complement of the post-ligation RT product. The main text names three tag levels but does not locate them on these local interfaces. Barcode bases, lengths, quantities, and read-cycle settings are unnecessary.", "evidence": [{"source_id": "mars-seq::diagram:asset_c352d22a192610d268a86775", "locator": "Add polyA primer with partial T7 promoter and UMI: TTTTT primer with red UMI/green T7 next to AAAAA substrate", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.105, 0.0, 0.29, 1.0], "rationale": null}, {"source_id": "mars-seq::card:mars-seq", "locator": "Description, pooling before double-strand conversion", "basis": "text", "support": "reported", "quote": "Next, the cellular lysates are pooled together and converted to double-stranded cDNA.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24531970", "locator": "[b00006], primary main text: plate organization and pooled labeled material", "basis": "text", "support": "reported", "quote": "The method is based on FACS sorting of single cells into 384-well plates and subsequent automated processing that is done mostly on pooled and labeled material, leading to a dramatic increase in throughput and reproducibility.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24531970", "locator": "[b00007], three levels of barcoding and molecule-counting purpose", "basis": "text", "support": "reported", "quote": "Our methodology employs three levels of barcoding (molecular, cellular, and plate level tags) to facilitate molecule counting with high degree of multiplexing.", "bbox": null, "rationale": null}, {"source_id": "mars-seq::diagram:asset_c352d22a192610d268a86775", "locator": "Reverse transcription following ligation; paired-line product retains orange and red/green regions", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.71, 0.0, 0.85, 1.0], "rationale": null}, {"source_id": "poster_a4c46b68aa6b5db4c3f6c966::diagram:poster_crop_be5b623222f40f8eb6eb5419", "locator": "MARS-Seq row right end: Reverse transcription product, PCR and purification arrow, and cDNA output with P5 and P7 ends", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.68, 0.51, 0.9, 0.72], "rationale": null}]}, {"target": "unknown:u_rna_interface_primary", "verdict": "unresolved", "action": "research", "rationale": "This is a consequential, correctly bounded unresolved question, not an assertion that DNase generates RNA. I independently checked the registered full text and its XML SD1 pointer, and the registry has no supplementary source. Acquire and register the Jaitin 2014 supplementary methods/figures S1-S6 (PMC4412462, SD1, NIHMS666898-supplement-Sup_Figures.pdf), then establish RNA-producing amplification from duplex cDNA and the order of RNA production, DNase digestion, and fragmentation. The registered main text only points to that evidence; the catalogue and review are secondary.", "evidence": [{"source_id": "mars-seq::diagram:asset_c352d22a192610d268a86775", "locator": "DNaseI arrow between second-strand product and RNA fragmentation; no transcription or amplification action is drawn", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.29, 0.0, 0.57, 1.0], "rationale": null}, {"source_id": "primary:paper:24531970", "locator": "[b00006], MARS-Seq method identity and pointer to figures S1-S6 and supplementary methods", "basis": "text", "support": "reported", "quote": "We developed an automated massively parallel RNA single-cell sequencing framework (MARS-Seq, figures S1 to S6 and Supplementary methods (21)) that is designed for in vivo sampling of thousands of cells by multiplexing RNA sequencing while maintaining tight control over amplification biases and labeling errors.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:24531970", "locator": "[b00037], reference 21, supplementary-method pointer; no local reaction chemistry", "basis": "text", "support": "reported", "quote": "See supplementary materials on Science Online.", "bbox": null, "rationale": null}, {"source_id": "mars-seq::card:mars-seq", "locator": "Description, transcription followed by removal of DNA templates; secondary catalogue evidence", "basis": "text", "support": "reported", "quote": "The DNA strands are transcribed to RNA and treated with DNase to remove leftover DNA templates in the mixture.", "bbox": null, "rationale": null}, {"source_id": "mars-seq::paper:27198714", "locator": "[b00042], single-cell library preparation; a review account, not primary Jaitin methods", "basis": "text", "support": "reported", "quote": "Some methods, such as CEL-Seq and MARS-Seq, introduce a T7 promoter sequence with oligo(dT) during RT, which enables linear amplification of input RNA by in vitro transcription.87,88", "bbox": null, "rationale": null}]}, {"target": "unknown:u_strand_limit", "verdict": "supported", "action": "accept", "rationale": "Retaining this as a nonblocking uncertainty is appropriate. The catalogue asserts loss of strand-specific information, while the cited review sentence follows SMART/poly(A)-tailed cDNA discussion and does not independently resolve the asymmetrically tagged MARS-Seq RNA-fragment route. The candidate asserts neither preservation nor loss. If that limitation is later stated as fact, require registered Jaitin supplementary library/read-orientation evidence; no read-cycle settings are needed.", "evidence": [{"source_id": "mars-seq::card:mars-seq", "locator": "Cons, secondary claim whose applicability remains unverified", "basis": "text", "support": "reported", "quote": "Fragmentation step eliminates strand-specific information2", "bbox": null, "rationale": null}, {"source_id": "mars-seq::paper:27198714", "locator": "[b00042], strand-information sentence follows discussion of SMART-Seq and poly(A) tailing of cDNA", "basis": "text", "support": "reported", "quote": "These methods, however, do not provide strand-specific information, because the cDNA is subsequently fragmented and ligated to a second set of adapters.", "bbox": null, "rationale": null}, {"source_id": "mars-seq::diagram:asset_c352d22a192610d268a86775", "locator": "RNA fragmentation: three shorter purple pieces, one retaining red/green terminal region; no separation or fraction-specific arrow", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.47, 0.0, 0.57, 0.98], "rationale": null}, {"source_id": "mars-seq::diagram:asset_c352d22a192610d268a86775", "locator": "RNA to ssDNA ligation: standalone orange partial rd1rev adapter above incoming arrow; product has orange joined to purple RNA opposite red/green region", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.57, 0.0, 0.72, 1.0], "rationale": null}]}]}, "sources": {"mars-seq::card:mars-seq": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/mars-seq.html", "title": "MARS-Seq", "text_characters": 3533, "text_sha256": "ed97fee2fe654cf3f163d4c101 hnology_atlas/v2/work/illumina_full_20261031/sources_06/imports/7b/7b546b771c29cd7352fc1cecc325e4cc7bb808b5a73f2adf758bd6a7f34ac332.xml", "sha256": "7b546b771c29cd7352fc1cecc325e4cc7bb808b5a73f2adf758bd6a7f34ac332"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/9f/9f251573d3a4e8ee681a520f02cbd31e0afbdda37fe46767fde08bc6f9fd469f.txt", "sha256": "9f251573d3a4e8ee681a520f02cbd31e0afbdda37fe46767fde08bc6f9fd469f"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/d6/d6ca75ab42d5cdf8074c5c3be1db1c265f1c0a7d87e3574ca54bb63e67f30edf.json", "sha256": "d6ca75ab42d5cdf8074c5c3be1db1c265f1c0a7d87e3574ca54bb63e67f30edf"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/e1/e132de98d184ee4363ed913a6e781e98f45f159062ce960ad7a748c488a0a9ef.xml", "sha256": "e132de98d184ee4363ed913a6e781e98f45f159062ce960ad7a748c488a0a9ef"}], "association_status": "selected_primary_candidate; extraction reviewer must confirm method/version scope", "text_characters": 17748, "text_sha256": "9f251573d3a4e8ee681a520f02cbd31e0afbdda37fe46767fde08bc6f9fd469f"}, "mars-seq::reference:pilot_selected_primary": {"kind": "text", "content_level": "metadata", "pmid": "24531970", "association_status": "unverified_selected_primary_candidate", "text_characters": 135, "text_sha256": "89bc2384c5f5d229c0348f9a01c6f5c6531e0b5c8d146ba8c0a83b81d082d0d5"}}, "card": {"record_id": "mars_seq", "source_title": "MARS-Seq", "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/mars-seq.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/mars-seq.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": null, "source_category_path": [], "description_verbatim": "MARS-Seq profiles the transcriptional dynamics of single cells in an automated and massively parallel workflow with high resolution. MARS-Seq can be used with in vivo samples containing a wide variety of different cell subpopulations. Single cells are first isolated into individual wells using FACS. Each cell is lysed, and the 3' ends of mRNAs are annealed to unique molecular identifiers containing a T7 promoter. The mRNA is reverse-transcribed to generate the first cDNA strand and treated with exonuclease I to remove leftover RT primers. Next, the cellular lysates are pooled together and converted to double-stranded cDNA. The DNA strands are transcribed to RNA and treated with DNase to remove leftover DNA templates in the mixture. The RNA strands are fragmented and annealed to sequencing adapters, followed by RT to generate barcoded cDNA libraries that are ready for sequencing.", "advantages_verbatim": ["High-throughput transcriptional profiling of single cells", "In vivo sampling of thousands of cells", "Three barcode levels (molecular, cellular, and plate-level tags) facilitate robust multiplexing capabilities", "Processes 100 to 1000 single cells", "Pooling all single cells into 1 flow cell reduces the cost to less than 50 cents per cell1"], "limitations_verbatim": ["3' bias can occur during the purification step", "Fragmentation step eliminates strand-specific information2"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "MARS-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "MARS-Seq profiles the transcriptional dynamics of single cells in an automated and massively parallel workflow with high resolution. MARS-Seq can be used with in vivo samples containing a wide variety of different cell subpopulations. Single cells are first isolated into individual wells using FACS. Each cell is lysed, and the 3' ends of mRNAs are annealed to unique molecular identifiers containing a T7 promoter. The mRNA is reverse-transcribed to generate the first cDNA strand and treated with exonuclease I to remove leftover RT primers. Next, the cellular lysates are pooled together and converted to double-stranded cDNA. The DNA strands are transcribed to RNA and treated with DNase to remove leftover DNA templates in the mixture. The RNA strands are fragmented and annealed to sequencing adapters, followed by RT to generate barcoded cDNA libraries that are ready for sequencing.\nSimilar methods: CEL-Seq, Quartz-Seq, Drop-seq, CytoSeq, inDrop.\nPros:\nHigh-throughput transcriptional profiling of single cells\nIn vivo sampling of thousands of cells\nThree barcode levels (molecular, cellular, and plate-level tags) facilitate robust multiplexing capabilities\nProcesses 100 to 1000 single cells\nPooling all single cells into 1 flow cell reduces the cost to less than 50 cents per cell1\nCons:\n3' bias can occur during the purification step\nFragmentation step eliminates strand-specific information2"}, {"source_locator": "jcr:content/par/text_2/text", "text": "MARS-Seq: Jaitin D. A., Kenigsberg E., Keren-Shaul H., et al. Massively parallel single-cell RNA-seq for marker-free decomposition of tissues into cell types. Science. 2014;343:776-779\n1. Jaitin D. A., Keren-Shaul H., Elefant N. and Amit I. Each cell counts: Hematopoiesis and immunity research in the era of single cell genomics. Semin Immunol. 2015;27:67-71\n2. Hrdlickova R., Toloue M. and Tian B. RNA-Seq methods for transcriptome analysis. Wiley Interdiscip Rev RNA. 2016;"}, {"source_locator": "jcr:content/par/text_3/text", "text": "TruSeq RNA Library Preparation Kit v2"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Hrdlickova R., Toloue M. and Tian B. RNA-Seq methods for transcriptome analysis. Wiley Interdiscip Rev RNA. 2016;\nWen async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
