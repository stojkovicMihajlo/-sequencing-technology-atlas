PNK on the captured complex, then Purify and size select, then Reverse transcription to cDNA; neither explicitly draws adapter ligation. The companion catalogue prose says that next 3′ linkers are ligated while the RNA is still embedded within RNAPII, before its subsequent size-selection sentence.", "primary_statement": "The 2015 primary paper specifies RNA extraction and gel size purification after the on-bead kinase reaction and states that Illumina adapters were then ligated onto gel-purified RNA. The 2016 protocol confirms size selection before subsequent adapter ligation. The graph therefore uses extracted, size-selected RNA as input to the terminal adapter/cDNA block; it does not assert on-bead adapter ligation or transfer a ligated RNA product into the size-selection operation.", "disposition": "use_primary", "evidence": [{"source_id": "mnet-seq::diagram:asset_730f702031ba13fa6d551189", "locator": "After PNK: arrow and caption Purify and size select, before Reverse transcription.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.76, 0.0, 0.93, 1.0], "rationale": null}, {"source_id": "mnet-seq::diagram:asset_730f702031ba13fa6d551189", "locator": "Terminal Reverse transcription arrow followed by blue cDNA line (right-edge caption partially clipped).", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.9, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "poster_3b4b46018e3f272bc06bf9bb::diagram:poster_crop_b500faed24f36057472e7bb2", "locator": "mNET-seq row, right side: Purify and size select → Reverse transcription → cDNA, with final blue line.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.77, 0.47, 0.9, 0.7], "rationale": null}, {"source_id": "mnet-seq::card:mnet-seq", "locator": "Description, linker ligation assigned before size selection", "basis": "text", "support": "reported", "quote": "Next, 3' linkers are ligated to the 3' hydroxyl end of the RNA strand still embedded within RNAPII.", "bbox": nul  carried out a kinase reaction on the IP beads to phosphorylate all nascent RNA 5′ ends but leave the Pol II-embedded 3′OH intact (Figure S1A).", "bbox": null, "rationale": null}, {"source_id": "mnet-seq::diagram:asset_730f702031ba13fa6d551189", "locator": "Immunoprecipitate → 5′ phosphorylation with PNK: same captured complex and gray support, with the exposed RNA end changing OH to P.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.6, 0.0, 0.85, 1.0], "rationale": null}]}, {"target": "state_property:pol_ii_immunoprecipitate:rna_three_prime", "verdict": "supported", "action": "accept", "rationale": "The RNA three_prime hydroxyl remains associated with nascent or captured processing-derived ends. The primary sources support both classes, so the property does not imply perfect active-site specificity.", "evidence": [{"source_id": "mnet-seq::paper:25910207", "locator": "[b00016] Results, mNET-Seq Strategy: protected 3′OH, cleaved 5′OH and on-bead kinase", "basis": "text", "support": "reported", "quote": "In this method, the Pol II complex will protect nascent RNA from MNase digestion. The hydroxylated 3′ end (3′OH) of the nascent RNA corresponds to the terminal nucleotide synthesized by Pol II (Figure 1A, asterisk). The 5′ end of the cleaved Pol II-associated RNA is also hydroxylated after MNase digestion. To achieve strand-specific RNA sequencing, we carried out a kinase reaction on the IP beads to phosphorylate all nascent RNA 5′ ends but leave the Pol II-embedded 3′OH intact (Figure S1A).", "bbox": null, "rationale": null}, {"source_id": "mnet-seq::paper:25910207", "locator": "[b00023] Results, Exon Tethering to Pol II with CTD S5P: co-precipitated processing-derived 3′OH RNA", "basis": "text", "support": "reported", "quote": "However, as previously noted (Churchman and Weissman, 2011), co-precipitated spliceosomes contain 3′OH RNA derived from splicing intermediates that also yield NET-seq signal.", "bbox": null, "rationale": null}]}, {"target": "state_property:selected_rna:free_rna_context", "verdict": "supported", "action": "accept", "rationale": "subject=self physical_context correctly locates extracted gel-purified RNA after PNK and before adapter ligation. This is the primary-supported resolution of the catalogue’s on-complex ligation implication.", "evidence": [{"source_id": "mnet-seq::paper:25910207", "locator": "Extended Experimental Procedures, mNET-Seq Method and RNA Library Preparation: extraction and gel purification after the PNK reaction", "basis": "text", "support": "reported", "quote": "After, the reaction beads were washed with 1 ml of NET-2 buffer once and RNA was extracted with Trizol reagent. RNA was resolved on 8% denaturing acrylamide 7 M urea gels for size purification. 35–100 nt fragments were eluted from the gel using RNA elution buffer (1 M NaOAc and 1 mM EDTA) and RNA was precipitated in 75% Ethanol. RNA libraries were prepared according to the manual of Truseq small RNA library prep kit (Illumina).", "bbox": null, "rationale": null}, {"source_id": "mnet-seq::paper:25910207", "locator": "[b00016] Results, mNET-Seq Strategy: adapter ligation onto gel-purified RNA", "basis": "text", "support": "reported", "quote": "Illumina adapters were then ligated onto gel-purified RNA, and Illumina high-throughput paired-end sequencing was carried out and generated ∼108 reads for each mNET-seq sample.", "bbox": null, "rationale": null}, {"source_id": "mnet-seq::paper:26844429", "locator": "[b00010] Overview of the procedure: size selection precedes adapter ligation and cDNA library preparation", "basis": "text", "support": "reported", "quote": "Radioactive ATP (γ-32P ATP) is also used in the PNK reaction to facilitate size selection on denaturing polyacrylamide gels of 35- to 100-nt RNA before subsequent adapter ligation, PCR-based preparation of the cDNA sequencing library and multiplexed Illumina sequencing.", "bbox": null, "rationale": null}]}, {"target": "state_property:selected_rna:identity", "verdict": "supported", "action": "accept", "rationale": "subject=self identifies the extracted 35–100-nt RNA fraction selected from the Pol II-associated preparation. Both the selected interval and its RNA identity are directly reported; no captured protein/support identity is propagated.", "evidence": [{"source_id": "mnet-seq::paper:25910207", "locator": "[b00016] Results, mNET-Seq Strategy: soluble fraction capture and selected RNA lengths", "basis": "text", "support": "reported", "quote": "This supernatant fraction was then IPed using Pol II 8WG16 antibody, which efficiently precipitated this shorter RNA. Although the predominant size of the IPed RNA was 20–45 nt, we selected a longer RNA fraction (35–100 nt) to obtain unique alignment with the human genome after deep sequencing.", "bbox": null, "rationale": null}, {"source_id": "mnet-seq::paper:25910207", "locator": "Extended Experimental Procedures, mNET-Seq Method and RNA Library Preparation: extraction and gel purification after the PNK reaction", "basis": "text", "support": "reported", "quote": "After, the reaction beads were washed with 1 ml of NET-2 buffer once and RNA was extracted with Trizol reagent. RNA was resolved on 8% denaturing acrylamide 7 M urea gels for size purification. 35–100 nt fragments were eluted from the gel using RNA elution buffer (1 M NaOAc and 1 mM EDTA) and RNA was precipitated in 75% Ethanol. RNA libraries were prepared according to the manual of Truseq small RNA library prep kit (Illumina).", "bbox": null, "rationale": null}]}, {"target": "state_property:selected_rna:selected_five_prime", "verdict": "supported", "action": "accept", "rationale": "The self RNA preparation carries the PNK-generated five_prime phosphate on the processed fragments. The protocol identifies this phosphate as the substrate for downstream 5′ linker ligation, which occurs after the selected-RNA boundary.", "evidence": [{"source_id": "mnet-seq::paper:25910207", "locator": "[b00016] Results, mNET-Seq Strategy: protected 3′OH, cleaved 5′OH and on-bead kinase", "basis": "text", "support": "reported", "quote": "In this method, the Pol II complex will protect nascent RNA from MNase digestion. The hydroxylated 3′ end (3′OH) of the nascent RNA corresponds to the terminal nucleotide synthesized by Pol II (Figure 1A, asterisk). The 5′ end of the cleaved Pol II-associated RNA is also hydroxylated after MNase digestion. To achieve strand-specific RNA sequencing, we carried out a kinase reaction on the IP beads to phosphorylate all nascent RNA 5′ ends but leave the Pol II-embedded 3′OH intact (Figure S1A).", "bbox": null, "rationale": null}, {"source_id": "mnet-seq::paper:26844429", "locator": "[b00010] Overview of the procedure: which RNA ends support the directional library", "basis": "text", "support": "reported", "quote": "The 5′ hydroxyl (OH) generated by MNase digestion of RNA is converted to a 5′ phosphate by T4 polynucleotide kinase (PNK) treatment to allow 5′ linker ligation, whereas the 3′ linker is ligated to the 3′ OH end of the RNA present within the Pol II active site, thus enabling directional sequencing.", "bbox": null, "rationale": null}, {"source_id": "mnet-seq::paper:26844429", "locator": "[b00010] Overview of the procedure: size selection precedes adapter ligation and cDNA library preparation", "basis": "text", "support": "reported", "quote": "Radioactive ATP (γ-32P ATP) is also used in the PNK reaction to facilitate size selection on denaturing polyacrylamide gels of 35- to 100-nt RNA before subsequent adapter ligation, PCR-based preparation of the cDNA sequencing library and multiplexed Illumina sequencing.", "bbox": null, "rationale": null}]}, {"target": "state_property:selected_rna:selected_three_prime", "verdict": "supported", "action": "accept", "rationale": "The self RNA preparation retains the three_prime hydroxyl used for subsequent 3′ linker ligation. Primary end preservation and the post-selection library interface support this property without putting an adapter on this pre-ligation State.", "evidence": [{"source_id": "mnet-seq::paper:25910207", "locator": "[b00016] Results, mNET-Seq Strategy: protected 3′OH, cleaved 5′OH and on-bead kinase", "basis": "text", "support": "reported", "quote": "In this method, the Pol II complex will protect nascent RNA from MNase digestion. The hydroxylated 3′ end (3′OH) of the nascent RNA corresponds to the terminal nucleotide synthesized by Pol II (Figure 1A, asterisk). The 5′ end of the cleaved Pol II-associated RNA is also hydroxylated after MNase digestion. To achieve strand-specific RNA sequencing, we carried out a kinase reaction on the IP beads to phosphorylate all nascent RNA 5′ ends but leave the Pol II-embedded 3′OH intact (Figure S1A).", "bbox": null, "rationale": null}, {"source_id": "mnet-seq::paper:26844429", "locator": "[b00010] Overview of the procedure: which RNA ends support the directional library", "basis": "text", "support": "reported", "quote": "The 5′ hydroxyl (OH) generated by MNase digestion of RNA is converted to a 5′ phosphate by T4 polynucleotide kinase (PNK) treatment to allow 5′ linker ligation, whereas the 3′ linker is ligated to the 3′ OH end of the RNA present within the Pol II active site, thus enabling directional sequencing.", "bbox": null, "rationale": null}, {"source_id": "mnet-seq::paper:26844429", "locator": "[b00010] Overview of the procedure: size selection precedes adapter ligation and cDNA library preparation", "basis": "text", "support": "reported", "quote": "Radioactive ATP (γ-32P ATP) is also used in the PNK reaction to facilitate size selection on denaturing polyacrylamide gels of 35- to 100-nt RNA before subsequent adapter ligation, PCR-based preparation of the cDNA sequencing library and multiplexed Illumina sequencing.", "bbox": null, "rationale": null}]}, {"target": "state_property:soluble_chromatin:cleaved_five_prime", "verdict": "supported", "action": "accept", "rationale": "subject=rna and end=five_prime correctly place hydroxyl on the MNase-generated RNA terminus. The primary papers explicitly state 5′OH generation; this is not confused with the preserved 3′OH or detached original cap.", "evidence": [{"source_id": "mnet-seq::paper:25910207", "locator": "[b00016] Results, mNET-Seq Strategy: protected 3′OH, cleaved 5′OH and on-bead kinase", "basis": "text", "support": "reported", "quote": "In this method, the Pol II complex will protect nascent RNA from MNase digestion. The hydroxylated 3′ end (3′OH) of the nascent RNA corresponds to the terminal nucleotide synthesized by Pol II (Figure 1A, asterisk). The 5′ end of the cleaved Pol II-associated RNA is also hydroxylated after MNase digestion. To achieve strand-specific RNA sequencing, we carried out a kinase reaction on the IP beads to phosphorylate all nascent RNA 5′ ends but leave the Pol II-embedded 3′OH intact (Figure S1A).", "bbox": null, "rationale": null}, {"source_id": "mnet-seq::paper:26844429", "locator": "[b00010] Overview of the procedure: which RNA ends support the directional library", "basis": "text", "support": "reported", "quote": "The 5′ hydroxyl (OH) generated by MNase digestion of RNA is converted to a 5′ phosphate by T4 polynucleotide kinase (PNK) treatment to allow 5′ linker ligation, whereas the 3′ linker is ligated to the 3′ OH end of the RNA present within the Pol II active site, thus enabling directional sequencing.", "bbox": null, "rationale": null}]}, {"target": "state_property:soluble_chromatin:identity", "verdict": "supported", "action": "accept", "rationale": "subject=self correctly identifies the MNase-digested soluble chromatin preparation retaining protected Pol II-associated RNA, rather than isolated RNA or undigested chromatin.", "evidence": [{"source_id": "mnet-seq::diagram:asset_730f702031ba13fa6d551189", "locator": "MNase digestion and arrow to Soluble chromatin: orange nuclease symbols, shortened blue chromatin pieces, detached cap-bearing purple fragment and retained RNA ending in OH.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.28, 0.0, 0.58, 1.0], "rationale": null}, {"source_id": "mnet-seq::paper:25910207", "locator": "[b00016] Results, mNET-Seq Strategy: MNase solubilization", "basis": "text", "support": "reported", "quote": "For mNET-seq, chromatin was digested with micrococcal nuclease (MNase) to release Pol II from insoluble chromatin. Note that accessible RNA will also be digested (Figure S1A, bottom; Experimental Procedures).", "bbox": null, "rationale": null}, {"source_id": "mnet-seq::paper:26844429", "locator": "[b00010] Overview of the procedure: exposed nucleic acids and protected RNA", "basis": "text", "support": "reported", "quote": "This efficient nuclease digests all exposed DNA and RNA, effectively releasing the Pol II elongation complex from chromatin into a soluble fraction. Only RNA protected by protein complexes such as Pol II or the spliceosome will be resistant to MNase digestion.", "bbox": null, "rationale": null}]}, {"target": "state_property:soluble_chromatin:protected_three_prime", "verdict": "supported", "action": "accept", "rationale": "subject=rna and end=three_prime correctly retain hydroxyl on nascent or co-associated processing ends. Both Pol II-protected terminal RNA and spliceosome-derived 3′OH RNA are supported.", "evidence": [{"source_id": "mnet-seq::paper:25910207", "locator": "[b00016] Results, mNET-Seq Strategy: protected 3′OH, cleaved 5′OH and on-bead kinase", "basis": "text", "support": "reported", "quote": "In this method, the Pol II complex will protect nascent RNA from MNase digestion. The hydroxylated 3′ end (3′OH) of the nascent RNA corresponds to the terminal nucleotide synthesized by Pol II (Figure 1A, asterisk). The 5′ end of the cleaved Pol II-associated RNA is also hydroxylated after MNase digestion. To achieve strand-specific RNA sequencing, we carried out a kinase reaction on the IP beads to phosphorylate all nascent RNA 5′ ends but leave the Pol II-embedded 3′OH intact (Figure S1A).", "bbox": null, "rationale": null}, {"source_id": "mnet-seq::paper:25910207", "locator": "[b00023] Results, Exon Tethering to Pol II with CTD S5P: co-precipitated processing-derived 3′OH RNA", "basis": "text", "support": "reported", "quote": "However, as previously noted (Churchman and Weissman, 2011), co-precipitated spliceosomes contain 3′OH RNA derived from splicing intermediates that also yield NET-seq signal.", "bbox": null, "rationale": null}]}, {"target": "state_property:soluble_chromatin:soluble_context", "verdict": "supported", "action": "accept", "rationale": "The physical_context describes the whole soluble fraction used for Pol II IP. Both the soluble-chromatin caption and the primary supernatant-to-IP passage support this boundary.", "evidence": [{"source_id": "mnet-seq::diagram:asset_730f702031ba13fa6d551189", "locator": "MNase digestion and arrow to Soluble chromatin: orange nuclease symbols, shortened blue chromatin pieces, detached cap-bearing purple fragment and retained RNA ending in OH.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.28, 0.0, 0.58, 1.0], "rationale": null}, {"source_id": "mnet-seq::paper:25910207", "locator": "[b00016] Results, mNET-Seq Strategy: soluble fraction capture and selected RNA lengths", "basis": "text", "support": "reported", "quote": "This supernatant fraction was then IPed using Pol II 8WG16 antibody, which efficiently precipitated this shorter RNA. Although the predominant size of the IPed RNA was 20–45 nt, we selected a longer RNA fraction (35–100 nt) to obtain unique alignment with the human genome after deep sequencing.", "bbox": null, "rationale": null}]}]}, "sources": {"mnet-seq::card:mnet-seq": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/mnet-seq.html", "title": "mNET-Seq", "text_characters": 3514, "text_sha256": "a32300a2c4e3f20ec15684c861bdfe48f63f880a9 026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA Transcription", "source_category_path": ["Transcriptome", "RNA Transcription"], "description_verbatim": "mNET-Seq generates profiles of nascent RNA and cotranscriptional RNA processing associated with different C-terminal domain (CTD) phosphorylation states throughout the whole genome. mNET-Seq is able to provide precise sequence reads of RNAPII active sites during transcript elongation and also RNA processing intermediates. First, elongating RNAPII complexes are isolated through chromatin fractionation. They are digested with MNase, breaking down all exposed DNA while leaving RNA strands protected by RNAPII or spliceosomes intact. The RNAPII complexes are immunoprecipitated using RNAPII antibodies and 5' phosphorylated by T4 PNK. Next, 3' linkers are ligated to the 3' hydroxyl end of the RNA strand still embedded within RNAPII. They are also incubated with radioactive ATP to facilitate size selection. Nascent RNA strands are size-selected for 35–100 nt, processed into cDNA sequencing libraries, and sequenced. The use of various RNAPII antibodies during purification raises the versatility and specificity of the technique in targeting CTDs of RNAPII.", "advantages_verbatim": ["Maps nascent RNA strands and cotranscriptional RNA processing during RNAPII elongation with phosphorylated CTDs", "Able to detect sense and antisense transcripts at TSS1", "No crosslinking—eliminates introduction of artifactual interactions", "MNase digestion is specific and efficient", "Various RNAPII-specific antibodies can be used to increase targeting accuracy"], "limitations_verbatim": ["Nascent RNAs shorter than 35 nt cannot be detected reliably", "RNA can degrade during RNAPII immunoprecipitation", "mNET-Seq peaks might be obscured by peaks from cotranscriptional RNA cleavage", "PCR amplification may give rise to peaks from amplification bias."], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "mNET-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "mNET-Seq generates profiles of nascent RNA and cotranscriptional RNA processing associated with different C-terminal domain (CTD) phosphorylation states throughout the whole genome. mNET-Seq is able to provide precise sequence reads of RNAPII active sites during transcript elongation and also RNA processing intermediates. First, elongating RNAPII complexes are isolated through chromatin fractionation. They are digested with MNase, breaking down all exposed DNA while leaving RNA strands protected by RNAPII or spliceosomes intact. The RNAPII complexes are immunoprecipitated using RNAPII antibodies and 5' phosphorylated by T4 PNK. Next, 3' linkers are ligated to the 3' hydroxyl end of the RNA strand still embedded within RNAPII. They are also incubated with radioactive ATP to facilitate size selection. Nascent RNA strands are size-selected for 35–100 nt, processed into cDNA sequencing libraries, and sequenced. The use of various RNAPII antibodies during purification raises the versatility and specificity of the technique in targeting CTDs of RNAPII.\nPros:\nMaps nascent RNA strands and cotranscriptional RNA processing during RNAPII elongation with phosphorylated CTDs\nAble to detect sense and antisense transcripts at TSS1\nNo crosslinking—eliminates introduction of artifactual interactions\nMNase digestion is specific and efficient\nVarious RNAPII-specific antibodies can be used to increase targeting accuracy\nCons:\nNascent RNAs shorter than 35 nt cannot be detected reliably\nRNA can degrade during RNAPII immunoprecipitation\nmNET-Seq peaks might be obscured by peaks from cotranscriptional RNA cleavage\nPCR amplification may give rise to peaks from amplification bias."}, {"source_locator": "jcr:content/par/text_2/text", "text": "mNET-Seq: Nojima T., Gomes T., Grosso A. R., et al. Mammalian NET-Seq Reveals Genome-wide Nascent Tra const $ = id => document.getElementById(id);

function link(text, url) { const a = el('a',text); if (/^https?:\/\//.test(url || '')) { a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; } return a; }

function filterRecords() {

  for (const r of found) {

  const states = new Map(c.states.map(s => [s.id,s]));
  const names = ids => (ids || []).map(id => (states.get(id)?.label || id)+' ['+id+']');
  if (kind === 'Operation') fields(parent,[['Description',item.description],['Input States',names(item.inputs)],['Output States',names(item.outputs)],['Mechanism',item.mechanism || 'Not specified'],['Information effect',item.information_effect || 'Not specified']]);
  if (kind === 'State') fields(parent,[['Kind',item.kind],['Features',item.features]]);

function drawGraph(parent, inspector, record) {

  const rank = new Map(nodes.map(x=>[x.id,0])), ready = nodes.filter(x=>incoming.get(x.id)===0).map(x=>x.id); let processed=0;
  while (ready.length) { const id = ready.shift(); processed++;for (const target of next.get(id)) { rank.set(target,Math.max(rank.get(target),rank.get(id)+1)); incoming.set(target,incoming.get(target)-1);if (!incoming.get(target)) ready.push(target); } }
  if (processed !== nodes.length) { parent.append(el('p','A cycle prevents a left-to-right layout. Use the exact Flow records below.','warning'));return; }
  const NS='http://www.w3.org/2000/svg', svg=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};
  const pos = new Map(), lanes = new Map();

  const canvas=svg('svg',{width:Math.max(680,Math.max(...rank.values())*224+240),height:Math.max(150,Math.max(...lanes.values())*112+30),role:'img','aria-label':'Directed State and Operation workflow'});
  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
