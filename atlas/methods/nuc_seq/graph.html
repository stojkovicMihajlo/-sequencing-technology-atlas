Seq, part no. 100–7168 available at https://www.fluidigm.com/documents; select ‘C1 System for mRNA Seq’ to download the PDF automatically). We use the Illumina Nextera XT library preparation kit and perform multiplexed paired-end sequencing of barcoded libraries using an Illumina MiSeq system. Figure 4 shows an example of the quality of the cDNA and sequencing library. Supplementary Table 1 shows a summary of a typical sequencing experiment. The cDNA insert size of the sequencing library is 250–500 bp, and the read-length of paired-end sequences is 150 bases. A read-depth of 1.5–2.0 × 106 has been previously shown to be adequate for", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00026", "basis": "text", "support": "reported", "quote": "Illumina sequences obtained from each sample (nucleus) are analyzed by fastQC tool (http://www.bioinformatics.babraham.ac.uk/projects/fastqc/) to evaluate sequence yield, base quality, GC profile, k-mer distribution and primer contamination. A computer grid environment or a multiprocessor (CPU) Unix workstation is required for processing large numbers of samples simultaneously.", "bbox": null, "rationale": null}], "property": "attribution", "value": {"unit": "other", "carrier": "Library index sequences retained on cDNA-derived fragments", "association": "Indexed library identity associates fragments with the separately prepared single-nucleus sample."}}, {"id": "readout", "subject": "self", "evidence": [{"source_id": "primary:paper:26890679", "locator": "b00021", "basis": "text", "support": "reported", "quote": "For procedural details for preparing sequencing libraries, we refer users to the Fluidigm C1 manual (C1 System for mRNA-Seq, part no. 100–7168 available at https://www.fluidigm.com/documents; select ‘C1 System for mRNA Seq’ to download the PDF automatically). We use the Illumina Nextera XT library preparation kit and perform multiplexed paired-end sequencing of barcoded libraries using an Illumina MiSeq system. Figure 4 shows an example of the quality of the cDNA and sequencing library. Supplementary Table 1 shows a summary of a typical sequencing experiment. The cDNA insert size of the sequencing library is 250–500 bp, and the read-length of paired-end sequences is 150 bases. A read-depth of 1.5–2.0 × 106 has been previously shown to be adequate for", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00031", "basis": "text", "support": "reported", "quote": "The sequencing depth observed for a given transcript quantitatively reflects the number of mRNA template molecules obtained from the lysed nucleus.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00045", "basis": "text", "support": "reported", "quote": "The technical and biological variation is similar for whole cells and nuclei13. For most transcripts, the nuclear and whole-cell expression profiles were similar, and therefore nuclei can generally be substituted for whole cells to define cell lineage, state or type populations, for example, by principal component analysis.", "bbox": null, "rationale": null}], "property": "defined_other", "name": "represented_target", "definition": "Biological information carried by the material for later sequencing", "applicable_to": "material", "value": "The physical reporter is DNA copied from poly(A)-containing nuclear RNA. Later sequencing can support nuclear transcript-expression profiles and cell-type/state comparisons; the diagram ends at library material."}, {"id": "limitations", "subject": "self", "evidence": [{"source_id": "primary:paper:26890679", "locator": "b00050", "basis": "text", "support": "reported", "quote": "The small amounts of mRNA present in nuclei may necessitate optimization of the number of PCR cycles required to obtain sufficient cDNA for use in sequencing depending on the experimental needs. We amplified the nuclear cDNA with 21 cycles because of low amou  nuclei. The detergent can also permeabilize and lyse the nuclear envelope, but only under harsh conditions for an extended period of time22. Sufficient Triton X-100 is included in the homogenization step to facilitate the release of nuclei, allowing them to remain intact, and to permit optimal antibody18 staining and isolation by FACS without forming aggregates. Hoechst stain is added to the homogenization lysis buffer to identify nuclei during FACS.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00008", "basis": "text", "support": "reported", "quote": "Many methods are available for the isolation of nuclei; however, the literature spans decades, and it typically lacks detailed information on the quality of RNA obtained, focusing instead on accessing intact DNA for chromatin preparation or for assaying the nuclear protein content18. We therefore developed an approach to meet the need for isolating individual nuclei for use in RNA analysis, which we have successfully applied to cultured neuroprogenitor cells and fresh mouse brain tissue13. The protocol detailed here includes two main modifications to the published method. First, we now consider cleanup by sucrose-iodixanol gradient centrifugation18 to be necessary only if cell debris is likely to interfere with immunostaining; it is therefore include", "bbox": null, "rationale": null}]}, {"id": "isolate_to_nuclei", "source": "isolate", "target": "nuclei", "kind": "material_output", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Second tissue icon, Lyse and centrifuge arrow and tube labelled Nuclei", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.24, 0.0, 0.36, 1.0], "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00013", "basis": "text", "support": "reported", "quote": "We chose Dounce homogenization to handle the very small tissue dissections often required to investigate various brain regions. Dounce homogenization21 with a nonionic surfactant, Triton X-100, is used to lyse the cell membrane and release nuclei. The detergent can also permeabilize and lyse the nuclear envelope, but only under harsh conditions for an extended period of time22. Sufficient Triton X-100 is included in the homogenization step to facilitate the release of nuclei, allowing them to remain intact, and to permit optimal antibody18 staining and isolation by FACS without forming aggregates. Hoechst stain is added to the homogenization lysis buffer to identify nuclei during FACS.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00008", "basis": "text", "support": "reported", "quote": "Many methods are available for the isolation of nuclei; however, the literature spans decades, and it typically lacks detailed information on the quality of RNA obtained, focusing instead on accessing intact DNA for chromatin preparation or for assaying the nuclear protein content18. We therefore developed an approach to meet the need for isolating individual nuclei for use in RNA analysis, which we have successfully applied to cultured neuroprogenitor cells and fresh mouse brain tissue13. The protocol detailed here includes two main modifications to the published method. First, we now consider cleanup by sucrose-iodixanol gradient centrifugation18 to be necessary only if cell debris is likely to interfere with immunostaining; it is therefore include", "bbox": null, "rationale": null}]}, {"id": "nuclei_to_sort", "source": "nuclei", "target": "sort", "kind": "material_input", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Nuclei tube, Sort nuclei caption, dispersed dots and downstream mRNA fragment", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.33, 0.0, 0.51, 1.0], "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00016", "basis": "text", "support": "reported", "quote": "T cording to the manufacturer’s recommendations.", "bbox": null, "rationale": null}]}, {"id": "amplified_cdna_to_tagment", "source": "amplified_cdna", "target": "tagment", "kind": "material_input", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Tagmentation: two blue protein icons on double strands with coloured inserted/end segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.73, 0.0, 0.86, 1.0], "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00262", "basis": "text", "support": "reported", "quote": "Use cDNA preparations (from Step 19) that pass quality control (Step 23) to prepare a sequencing library; we use the Illumina Nextera XT library prep kit and follow the instructions in the Fluidigm C1 manual (see INTRODUCTION and MATERIALS). We start at page 35 of the manual with dilution of the cDNA and proceed through tagmentation, PCR amplification and AMPure XP bead cleanup, with the modifications for nuclei indicated in the table below. Determine the quality of the final pooled Nextera XT libraries, for example, by using the high-sensitivity DNA kit for Agilent Bioanalyzer according to the manufacturer’s recommendations.", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::card:nuc-seq", "locator": "Description: final library preparation", "basis": "text", "support": "reported", "quote": "Finally, the sequencing library is prepared using Tn5 transposase tagmentation.", "bbox": null, "rationale": null}]}, {"id": "tagment_to_tagmented_cdna", "source": "tagment", "target": "tagmented_cdna", "kind": "material_output", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Tagmentation: two blue protein icons on double strands with coloured inserted/end segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.73, 0.0, 0.86, 1.0], "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00262", "basis": mentary Table 1 shows a summary of a typical sequencing experiment. The cDNA insert size of the sequencing library is 250–500 bp, and the read-length of paired-end sequences is 150 bases. A read-depth of 1.5–2.0 × 106 has been previously shown to be adequate for", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00262", "basis": "text", "support": "reported", "quote": "Use cDNA preparations (from Step 19) that pass quality control (Step 23) to prepare a sequencing library; we use the Illumina Nextera XT library prep kit and follow the instructions in the Fluidigm C1 manual (see INTRODUCTION and MATERIALS). We start at page 35 of the manual with dilution of the cDNA and proceed through tagmentation, PCR amplification and AMPure XP bead cleanup, with the modifications for nuclei indicated in the table below. Determine the quality of the final pooled Nextera XT libraries, for example, by using the high-sensitivity DNA kit for Agilent Bioanalyzer according to the manufacturer’s recommendations.", "bbox": null, "rationale": null}]}, {"id": "complete_library_to_library", "source": "complete_library", "target": "library", "kind": "material_output", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Gap repair and PCR arrow to Enrichment-ready fragment bearing Index 2, Index 1, P5 and P7", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.85, 0.08, 1.0, 1.0], "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00021", "basis": "text", "support": "reported", "quote": "For procedural details for preparing sequencing libraries, we refer users to the Fluidigm C1 manual (C1 System for mRNA-Seq, part no. 100–7168 available at https://www.fluidigm.com/documents; select ‘C1 System for mRNA Seq’ to download the PDF automatically). We use the Illumina Nextera XT library preparation kit and perform multiplexed paired-end sequencing of barcoded libraries using an Illumina MiSeq system. Figure 4 shows an example of the quality of the cDNA and sequencing library. Supplementary Table 1 shows a summary of a typical sequencing experiment. The cDNA insert size of the sequencing library is 250–500 bp, and the read-length of paired-end sequences is 150 bases. A read-depth of 1.5–2.0 × 106 has been previously shown to be adequate for", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00262", "basis": "text", "support": "reported", "quote": "Use cDNA preparations (from Step 19) that pass quality control (Step 23) to prepare a sequencing library; we use the Illumina Nextera XT library prep kit and follow the instructions in the Fluidigm C1 manual (see INTRODUCTION and MATERIALS). We start at page 35 of the manual with dilution of the cDNA and proceed through tagmentation, PCR amplification and AMPure XP bead cleanup, with the modifications for nuclei indicated in the table below. Determine the quality of the final pooled Nextera XT libraries, for example, by using the high-sensitivity DNA kit for Agilent Bioanalyzer according to the manufacturer’s recommendations.", "bbox": null, "rationale": null}]}], "method_scopes": [{"method": "Nuc-Seq", "operation_ids": ["freeze", "isolate", "sort", "synthesize_cdna", "amplify_cdna", "tagment", "complete_library"], "status": "resolved", "rationale": "All seven operations apply to the frozen-tissue route of the declared PMID26890679 implementation. The Illumina card and the independently checked RNA-collection page explicitly associate this target with that protocol. The protocol is a single-nucleus RNA-seq implementation using Smart-seq2 and Nextera XT, not a declaration that every method called snRNA-seq or Nuc-Seq is interchangeable. Primary text resolves fixation wording, conditional centrifugation and the uncaptioned nuclear-lysis interface. Poster reference fragments are separately assessed; they do not override the declared implementation or add the adjacent Div-Seq route.", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Complete Nuc-Seq strip: left single-cell/poly(A) RNA explanatory icon; Tissue; Fixation and freeze; Lyse and centrifuge; Nuclei; Sort nuclei; mRNA fragment; cDNA synthesis with GGG/CCC, poly(A)/T and Locked nucleic acid (LNA); PCR; Tagmentation; Gap repair and PCR; final Index 2/Index 1 and P5/P7 fragment", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "poster_06869234e814e10509a62546::diagram:poster_crop_d2ed60819862ca27eb97f772", "locator": "Middle row labelled Nuc-Seq, from Tissue to Enrichment-ready fragment; inDrop above and Div-Seq below are separate rows", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.015, 0.42, 0.9, 0.7], "rationale": null}, {"source_id": "poster_70d77f2642b92f199e1d3e87::diagram:poster_crop_2e233e5aa063c21bada45cb1", "locator": "Nuc-Seq row, from Tissue to indexed P5/P7 product; adjacent DR-Seq/inDrop/Div-Seq rows are independent catalogue entries", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.018, 0.49, 0.92, 0.73], "rationale": null}, {"source_id": "nuc-seq::card:nuc-seq", "locator": "Description and similar-method comparison", "basis": "text", "support": "reported", "quote": "Nuc-Seq avoids proteolytic treatment during nuclei dissociation from cells, minimizing gene expression changes resulting from common protease dissociation procedures; this step is similar to the one used in snRNA-seq.", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::collection:rna:page:115", "locator": "Heading and Nuc-Seq-specific reference annotation", "basis": "text", "support": "reported", "quote": "Nuc-Seq: A Single-Nucleus RNA-Seq from Frozen Tissues", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::collection:rna:page:115", "locator": "References: Krishnaswami et al. protocol annotation", "basis": "text", "support": "reported", "quote": "This study provides an in-depth protocol for Nuc-seq, a sensitive approach for isolating and deep sequencing of nuclei from frozen tissue samples.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00003", "basis": "text", "support": "reported", "quote": "A protocol is described for sequencing the transcriptome of a cell nucleus. Nuclei are isolated from specimens and sorted by FACS, cDNA libraries are constructed and RNA-seq is performed, followed by data analysis. Some steps follow published methods (Smart-seq2 for cDNA synthesis and Nextera XT barcoded library preparation) and are not described in detail here. Previous single-cell approaches for RNA-seq from tissues include cell dissociation using protease treatment at 30 °C, which is known to alter the transcriptome. We isolate nuclei at 4 °C from tissue homogenates, which cause minimal damage. Nuclear transcriptomes can be obtained from postmortem human brain tissue stored at −80 °C, making brain archives accessible for RNA-seq from individual ne", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00008", "basis": "text", "support": "reported", "quote": "Many methods are available for the isolation of nuclei; however, the literature spans decades, and it typically lacks detailed information on the quality of RNA obtained, focusing instead on accessing intact DNA for chromatin preparation or for assaying the nuclear protein content18. We therefore developed an approach to meet the need for isolating individual nuclei for use in RNA analysis, which we have successfully applied to cultured neuroprogenitor cells and fresh mouse brain tissue13. The protocol detailed here includes two main modifications to the published method. First, we now consider cleanup by sucrose-iodixanol gradient centrifugation18 to be necessary only if cell debris is likely to interfere with immunostaining; it is therefore include", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00262", "basis": "text", "support": "reported", "quote": "Use cDNA preparations (from Step 19) that pass quality control (Step 23) to prepare a sequencing library; we use the Illumina Nextera XT library prep kit and follow the instructions in the Fluidigm C1 manual (see INTRODUCTION and MATERIALS). We start at page 35 of the manual with dilution of the cDNA and proceed through tagmentation, PCR amplification and AMPure XP bead cleanup, with the modifications for nuclei indicated in the table below. Determine the quality of the final pooled Nextera XT libraries, for example, by using the high-sensitivity DNA kit for Agilent Bioanalyzer according to the manufacturer’s recommendations.", "bbox": null, "rationale": null}]}], "paper_matches": [{"id": "nuc-seq:references:0", "source_id": "nuc-seq::paper:26890679", "methods": ["Nuc-Seq"], "assessment": "content_checked", "relationship": "supports_architecture", "evidence": [{"source_id": "nuc-seq::card:nuc-seq", "locator": "Nuc-Seq method reference", "basis": "text", "support": "reported", "quote": "Nuc-Seq: Krishnaswami S. R., Grindberg R. V., Novotny M., et al. Using single nuclei for RNA-seq to capture the transcriptome of postmortem neurons. Nat Protoc. 2016;11:499-524", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::metadata:26890679", "locator": "PubMed title and identifiers; PMID 26890679, DOI 10.1038/nprot.2016.015", "basis": "text", "support": "reported", "quote": "Using single nuclei for RNA-seq to capture the transcriptome of postmortem neurons.", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::paper:26890679", "locator": "b00003", "basis": "text", "support": "reported", "quote": "A protocol is described for sequencing the transcriptome of a cell nucleus. Nuclei are isolated from specimens and sorted by FACS, cDNA libraries are constructed and RNA-seq is performed, followed by data analysis. Some steps follow published methods (Smart-seq2 for cDNA synthesis and Nextera XT barcoded library preparation) and are not described in detail here. Previous single-cell approaches for RNA-seq from tissues include cell dissociation using protease treatment at 30 °C, which is known to alter the transcriptome. We isolate nuclei at 4 °C from tissue homogenates, which cause minimal damage. Nuclear transcriptomes can be obtained from postmortem human brain tissue stored at −80 °C, making brain archives accessible for RNA-seq from individual ne", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00008", "basis": "text", "support": "reported", "quote": "Many methods are available for the isolation of nuclei; however, the literature spans decades, and it typically lacks detailed information on the quality of RNA obtained, focusing instead on accessing intact DNA for chromatin preparation or for assaying the nuclear protein content18. We therefore developed an approach to meet the need for isolating individual nuclei for use in RNA analysis, which we have successfully applied to cultured neuroprogenitor cells and fresh mouse brain tissue13. The protocol detailed here includes two main modifications to the published method. First, we now consider cleanup by sucrose-iodixanol gradient centrifugation18 to be necessary only if cell debris is likely to interfere with immunostaining; it is therefore include", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00251", "basis": "text", "support": "reported", "quote": "Perform lysis and cDNA synthesis, starting from Step 5 of the Smart-seq2 protocol3 (addition of oligo-dT primer and dNTPs to the FACS-sorted single nuclei from Step 18) and proceeding through to Step 24, implementing the modifications in the table below. Analyze the quality of the cDNA library, for example, by using the high-sensitivity DNA kit for Agilent Bioanalyzer according to the manufacturer’s recommendations. Accurately quantify the cDNA, for example, with a PicoGreen assay or a similar method.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00262", "basis": "text", "support": "reported", "quote": "Use cDNA preparations (from Step 19) that pass quality control (Step 23) to prepare a sequencing library; we use the Illumina Nextera XT library prep kit and follow the instructions in the Fluidigm C1 manual (see INTRODUCTION and MATERIALS). We start at page 35 of the manual with dilution of the cDNA and proceed through tagmentation, PCR amplification and AMPure XP bead cleanup, with the modifications for nuclei indicated in the table below. Determine the quality of the final pooled Nextera XT libraries, for example, by using the high-sensitivity DNA kit for Agilent Bioanalyzer according to the manufacturer’s recommendations.", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::reference:pilot_selected_primary", "locator": "Pilot-selected candidate association; independently checked against registered full text", "basis": "text", "support": "reported", "quote": "Pilot-selected primary candidate PMID 26890679 for Nuc-Seq. This selection is not scientific evidence of method identity or mechanism.", "bbox": null, "rationale": null}]}, {"id": "jennings_27571191", "source_id": "nuc-seq::paper:27571191", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "nuc-seq::card:nuc-seq", "locator": "Related publications: Jennings et al.", "basis": "text", "support": "reported", "quote": "Jennings C. G., Landman R., Zhou Y., et al. Opportunities and challenges in modeling human brain disorders in transgenic primates. Nat Neurosci. 2016;19:1123-1130", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::paper:27571191", "locator": "Registered abstract only", "basis": "text", "support": "reported", "quote": "Our main focus is on the creation of new primate disease models for understanding the pathological mechanisms of brain disorders and for developing new approaches to effective treatment.", "bbox": null, "rationale": "Only the supplied abstract was checked. It establishes background on primate disease models, not the in-scope library chemistry or equivalence of nuclear RNA protocols."}]}, {"id": "wang_25079324_dna_homonym", "source_id": "poster_06869234e814e10509a62546::paper:25079324", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_06869234e814e10509a62546::reference:poster_06869234e814e10509a62546:references:0", "locator": "Literal poster reference fragment, Poppler layout.txt line1381", "basis": "text", "support": "reported", "quote": "Wang Y. et al. (2014) Nature 512: 155-160", "bbox": null, "rationale": null}, {"source_id": "poster_06869234e814e10509a62546::metadata:25079324", "locator": "PubMed record title and authors; PMID 25079324 / DOI 10.1038/nature13600", "basis": "text", "support": "reported", "quote": "Clonal evolution in breast cancer revealed by single nucleus genome sequencing.", "bbox": null, "rationale": null}, {"source_id": "poster_06869234e814e10509a62546::paper:25079324", "locator": "b00003", "basis": "text", "support": "reported", "quote": "Here, we developed a whole-genome and exome single cell sequencing approach called Nuc-Seq that utilizes G2/M nuclei to achieve 91% mean coverage breadth.", "bbox": null, "rationale": "This explicitly describes a DNA-sequencing homonym. The poster-listed Wang fragment cannot support the depicted RNA-to-cDNA architecture of the selected PMID26890679 implementation."}]}, {"id": "snes_25853327", "source_id": "poster_06869234e814e10509a62546::paper:25853327", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_06869234e814e10509a62546::paper:25853327", "locator": "b00002", "basis": "text", "support": "reported", "quote": "Single-cell genome sequencing methods are challenged by poor physical coverage and high error rates, making it difficult to distinguish real biological variants from technical artifacts. To address this problem, we developed a method called SNES that combines flow-sorting of single G1/0 or G2/M nuclei, time-limited multiple-displacement-amplification, exome capture, and next-generation sequencing to generate high coverage (96%) data from single human cells. We validated our method in a fibroblast cell line, and show low allelic dropout and false-positive error rates, resulting in high detection efficiencies for single nucleotide variants (92%) and indels (85%) in single cells.", "bbox": null, "rationale": null}, {"source_id": "poster_06869234e814e10509a62546::paper:25853327", "locator": "b00007", "basis": "text", "support": "reported", "quote": "To mitigate technical errors, we recently developed a method called Nuc-Seq, which utilizes G2/M cells to perform single-cell genome sequencing [11].", "bbox": null, "rationale": "SNES is a genomic DNA/exome workflow related to the DNA Nuc-Seq homonym, outside this assigned nuclear RNA implementation."}]}, {"id": "targeted_dna_26741407", "source_id": "poster_06869234e814e10509a62546::paper:26741407", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_06869234e814e10509a62546::paper:26741407", "locator": "Registered abstract only", "basis": "text", "support": "reported", "quote": "To address these issues, we developed a single-cell DNA sequencing protocol that combines flow-sorting of single nuclei, time-limited multiple-displacement amplification (MDA), low-input library preparation, DNA barcoding, targeted capture and next-generation sequencing (NGS).", "bbox": null, "rationale": "The available abstract supports exclusion as a DNA workflow; its full protocol was not available in this registered source."}]}, {"id": "habib_27471252_related_implementation", "source_id": "poster_70d77f2642b92f199e1d3e87::paper:27471252", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_70d77f2642b92f199e1d3e87::paper:27471252", "locator": "b00003", "basis": "text", "support": "reported", "quote": "Single cell RNA-Seq provides rich information about cell types and states. However, it is difficult to capture rare dynamic processes, such as adult neurogenesis, because isolation of rare neurons from adult tissue is challenging and markers for each phase are limited. Here, we develop Div-Seq, which combines scalable single nucleus RNA-Seq (sNuc-Seq) with pulse labeling of proliferating cells by EdU to profile individual dividing cells. sNuc-Seq and Div-Seq can sensitively identify closely related hippocampal cell types and track transcriptional dynamics of newborn neurons within the adult hippocampal neurogenic niche, respectively. We also apply Div-Seq to identify and profile rare newborn GABAergic neurons in the adult spinal cord, a non-canonical", "bbox": null, "rationale": null}, {"source_id": "poster_70d77f2642b92f199e1d3e87::paper:27471252", "locator": "b00005", "basis": "text", "support": "reported", "quote": "We therefore developed Div-Seq, a method for RNA-seq of individual, recently-divided cells. Div-Seq relies on sNuc-Seq, a single-nucleus isolation and RNA-Seq method compatible with frozen or fixed tissue (Fig. 1A), which enables enrichment of rare labeled cell populations by fluorescence-activated cell sorting (FACS) (fig. S1). Div-Seq combines sNuc-Seq with pulse labeling of dividing cells by 5-ethynyl-2′-deoxyuridine (EdU) (5, 6).", "bbox": null, "rationale": "The inspected published paper describes sNuc-Seq and its EdU-based Div-Seq adaptation, which is a separate neighbouring row. It does not establish that this implementation is identical to the selected Krishnaswami protocol."}]}, {"id": "habib_2016_preprint", "source_id": "poster_70d77f2642b92f199e1d3e87::reference:poster_70d77f2642b92f199e1d3e87:recovery-document:60a1188a24449f00", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "poster_70d77f2642b92f199e1d3e87::reference:poster_70d77f2642b92f199e1d3e87:references:0", "locator": "Literal poster reference fragment, Poppler layout.txt line888", "basis": "text", "support": "reported", "quote": "Habib N et al. (2016) bioRxiv", "bbox": null, "rationale": null}, {"source_id": "poster_70d77f2642b92f199e1d3e87::reference:poster_70d77f2642b92f199e1d3e87:recovery-document:60a1188a24449f00", "locator": "Registered preprint title/DOI and abstract, version 1", "basis": "text", "support": "reported", "quote": "DOI: 10.1101/045989", "bbox": null, "rationale": null}, {"source_id": "poster_70d77f2642b92f199e1d3e87::reference:poster_70d77f2642b92f199e1d3e87:recovery-document:60a1188a24449f00", "locator": "Registered preprint abstract only", "basis": "text", "support": "reported", "quote": "Here, we developed Div-Seq, which combines Nuc-Seq, a scalable single nucleus RNA-Seq method, with EdU-mediated labeling of proliferating cells.", "bbox": null, "rationale": "This is a relevant nuclear-RNA nomenclature lead, not proof that its Nuc-Seq preparation and the selected PMID26890679 implementation have identical steps. No preprint full-text protocol was supplied."}]}], "corrections": [{"id": "fixation_scope", "target_id": "operation:freeze", "diagram_observation": "All three Nuc-Seq rows label the pre-isolation tissue operation Fixation and freeze, without identifying fixation chemistry.", "primary_statement": "The scoped protocol uses fresh or frozen brain tissue and reports successful full-length cDNA from frozen specimens; it warns that mRNA crosslinking, such as paraformaldehyde fixation, severely limits full-length cDNA. The graph therefore retains freezing for the frozen-tissue implementation and does not assert crosslink fixation as part of it.", "disposition": "use_primary", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Tissue icon and arrow labelled Fixation and freeze, leading to a second tissue icon", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.13, 0.12, 0.27, 1.0], "rationale": null}, {"source_id": "poster_06869234e814e10509a62546::diagram:poster_crop_d2ed60819862ca27eb97f772", "locator": "Middle row labelled Nuc-Seq, from Tissue to Enrichment-ready fragment; inDrop above and Div-Seq below are separate rows", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.015, 0.42, 0.9, 0.7], "rationale": null}, {"source_id": "poster_70d77f2642b92f199e1d3e87::diagram:poster_crop_2e233e5aa063c21bada45cb1", "locator": "Nuc-Seq row, from Tissue to indexed P5/P7 product; adjacent DR-Seq/inDrop/Div-Seq rows are independent catalogue entries", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.018, 0.49, 0.92, 0.73], "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00058", "basis": "text", "support": "reported", "quote": "However, frozen brain tissue performed well, by producing full-length cDNAs and informative transcriptomes (ANTICIPATED RESULTS). Methods that cross-link mRNA, such as paraformaldehyde fixation of tissues, will severely limit the ability to produce full-length cDNA.", "bbox": null, "rationale": null}]}, {"id": "centrifugation_optionality", "target_id": "operation:isolate", "diagram_observation": "Lyse and centrifuge is a single linear action block between tissue and nuclei, followed by Sort nuclei; no optionality is indicated.", "primary_statement": "The selected protocol releases nuclei by detergent-assisted homogenization and makes sucrose–iodixanol gradient cleanup optional when debris would interfere with immunostaining. Filtered crude homogenate can go directly to FACS. The graph retains the source block while treating its centrifugation component as conditional.", "disposition": "use_primary", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Second tissue icon, Lyse and centrifuge arrow and tube labelled Nuclei", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.24, 0.0, 0.36, 1.0], "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00008", "basis": "text", "support": "reported", "quote": "Many methods are available for the isolation of nuclei; however, the literature spans decades, and it typically lacks detailed information on the quality of RNA obtained, focusing instead on accessing intact DNA for chromatin preparation or for assaying the nuclear protein content18. We therefore developed an approach to meet the need for isolating individual nuclei for use in RNA analysis, which we have successfully applied to cultured neuroprogenitor cells and fresh mouse brain tissue13. The protocol detailed here includes two main modifications to the published method. First, we now consider cleanup by sucrose-iodixanol gradient centrifugation18 to be necessary only if cell debris is likely to interfere with immunostaining; it is therefore include", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00013", "basis": "text", "support": "reported", "quote": "We chose Dounce homogenization to handle the very small tissue dissections often required to investigate various brain regions. Dounce homogenization21 with a nonionic surfactant, Triton X-100, is used to lyse the cell membrane and release nuclei. The detergent can also permeabilize and lyse the nuclear envelope, but only under harsh conditions for an extended period of time22. Sufficient Triton X-100 is included in the homogenization step to facilitate the release of nuclei, allowing them to remain intact, and to permit optimal antibody18 staining and isolation by FACS without forming aggregates. Hoechst stain is added to the homogenization lysis buffer to identify nuclei during FACS.", "bbox": null, "rationale": null}]}, {"id": "nuclear_lysis_interface", "target_id": "operation:synthesize_cdna", "diagram_observation": "After Sort nuclei, the drawing shows a purple poly(A)-bearing strand labelled mRNA fragment entering cDNA synthesis, without a nuclear-lysis action caption or an explicit purified-RNA separation.", "primary_statement": "The protocol sorts nuclei into lysis buffer and then performs nuclear lysis and cDNA synthesis using Smart-seq2. The actual input interface is sorted nuclei, whose RNA is released inside the cDNA-synthesis block. No isolated RNA fraction or intentional RNA-fragmentation operation is asserted; partial transcript recovery is possible.", "disposition": "use_primary", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Nuclei tube, Sort nuclei caption, dispersed dots and downstream mRNA fragment", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.33, 0.0, 0.51, 1.0], "rationale": null}, {"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Poly(A)-labelled purple mRNA fragment enters cDNA synthesis; GGG/CCC and AAAAAA/TTTTTT pairing, with Locked nucleic acid (LNA) label", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.435, 0.07, 0.7, 1.0], "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00016", "basis": "text", "support": "reported", "quote": "To enable sorting of nuclei derived from neurons, nuclei can be immunostained with an antibody specific to NeuN, a nuclear membrane protein (Supplementary Fig. 1), before filtering the homogenate to remove large aggregated debris and subjecting it to FACS. Software gating on the FACS (Fig. 3) uses a series of doublet discrimination gates (Fig. 3a–c) to isolate single nuclei from any remaining aggregated nuclei, followed by a nuclear staining gate using Hoescht and NeuN labeling to isolate single neuronal nuclei (Fig. 3d,e). Alternatively, nuclei from all cell types can be sorted by using nuclear staining with either Hoechst or propidium iodide (PI) (Fig. 3d,f). Single nuclei are sorted into lysis buffer containing ERCC (External RNA Consortium Contro", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00251", "basis": "text", "support": "reported", "quote": "Perform lysis and cDNA synthesis, starting from Step 5 of the Smart-seq2 protocol3 (addition of oligo-dT primer and dNTPs to the FACS-sorted single nuclei from Step 18) and proceeding through to Step 24, implementing the modifications in the table below. Analyze the quality of the cDNA library, for example, by using the high-sensitivity DNA kit for Agilent Bioanalyzer according to the manufacturer’s recommendations. Accurately quantify the cDNA, for example, with a PicoGreen assay or a similar method.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00031", "basis": "text", "support": "reported", "quote": "Partially degraded RNA will result in deeper sequence coverage for the 3′ end of transcripts, as only those degradation products that contain the 3′ polyA tail will be converted to cDNA (Fig. 8a).", "bbox": null, "rationale": null}]}], "unknowns": []}, "review": {"format_version": "illumina_diagram_review/1.2", "record_id": "nuc_seq", "candidate_sha256": "386a9c150d4fbe4f73556d688740e3fe1836ec378ea7ba670c986530f13bafca", "inspected_sources": ["nuc-seq::card:nuc-seq", "nuc-seq::collection:rna:page:115", "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "nuc-seq::metadata:26890679", "nuc-seq::paper:26890679", "nuc-seq::paper:27571191", "poster_06869234e814e10509a62546::diagram:poster_crop_d2ed60819862ca27eb97f772", "poster_06869234e814e10509a62546::metadata:25079324", "poster_06869234e814e10509a62546::paper:25079324", "poster_06869234e814e10509a62546::paper:25853327", "poster_06869234e814e10509a62546::paper:26741407", "poster_06869234e814e10509a62546::reference:poster_06869234e814e10509a62546:references:0", "poster_70d77f2642b92f199e1d3e87::diagram:poster_crop_2e233e5aa063c21bada45cb1", "poster_70d77f2642b92f199e1d3e87::paper:27471252", "poster_70d77f2642b92f199e1d3e87::reference:poster_70d77f2642b92f199e1d3e87:recovery-document:60a1188a24449f00", "poster_70d77f2642b92f199e1d3e87::reference:poster_70d77f2642b92f199e1d3e87:references:0", "primary:paper:26890679"], "checks": [{"target": "construction", "verdict": "supported", "action": "accept", "rationale": "The graph follows every in-scope action: freezing; release with conditional cleanup; singlet sorting; nuclear lysis/cDNA synthesis; cDNA PCR; tagmentation; gap repair/PCR. Interfaces are preparations, not invented isolated RNA fractions. Reagent States supply the supported modified oligos, rather than extra sample branches. The two-input copying and amplification operations are joint sample/reagent transformations with one preparation output. No independent poster rows are collapsed, and no pooling, sequencing, enrichment reaction or data product is invented at the drawn endpoint.", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Complete assigned Nuc-Seq strip: Tissue through indexed Enrichment-ready fragment; introductory single-cell/poly(A) icon at left", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "poster_06869234e814e10509a62546::diagram:poster_crop_d2ed60819862ca27eb97f772", "locator": "Middle Nuc-Seq row; inDrop above, Div-Seq below; standalone N6-methyladenosine drawing at right", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.015, 0.42, 0.9, 0.7], "rationale": null}, {"source_id": "poster_70d77f2642b92f199e1d3e87::diagram:poster_crop_2e233e5aa063c21bada45cb1", "locator": "Nuc-Seq row between inDrop and Div-Seq; DR-Seq is another row above", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.018, 0.49, 0.92, 0.73], "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00010", "basis": "text", "support": "reported", "quote": "The nuclei are lysed and cDNA is synthesized, amplified (Step 19) and tested in quantitative PCR (qPCR) quality control assays to indicate successful capture of the transcriptome by assaying several housekeeping and tissue-specific genes (Steps 20–23).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00251", "basis": "text", "support": "reported", "quote": "Perform lysis and cDNA synthesis, starting from Step 5 of the Smart-seq2 protocol3 (addition of oligo-dT primer and dNTPs to the FACS-sorted single nuclei from Step 18) and proceeding through to Step 24, implementing the modifications in the table below.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00262", "basis": "text", "support": "reported", "quote": "Use cDNA preparations (from Step 19) that pass quality control (Step 23) to prepare a sequencing library; we use the Illumina Nextera XT library prep kit and follow the instructions in the Fluidigm C1 manual (see INTRODUCTION and MATERIALS). We start at page 35 of the manual with dilution of the cDNA and proceed through tagmentation, PCR amplification and AMPure XP bead cleanup, with the modifications for nuclei indicated in the table below.", "bbox": null, "rationale": null}]}, {"target": "record", "verdict": "supported", "action": "accept", "rationale": "Independent image and registered-content review supports the scoped architecture and its complete retained route. The DNA reporter, source-nucleus association, poly(A) selection and limitations are distinguished from the biological nuclear transcriptome. The three primary-supported corrections are implemented in connected States and Operations. All supplied targets are assessed below; no consequential unsupported claim, missing depicted branch or unresolved implementation question remains at this schematic scope.", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Complete assigned Nuc-Seq strip: Tissue through indexed Enrichment-ready fragment; introductory single-cell/poly(A) icon at left", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "nuc-seq::collection:rna:page:115", "locator": "Heading", "basis": "text", "support": "reported", "quote": "Nuc-Seq: A Single-Nucleus RNA-Seq from Frozen Tissues", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::card:nuc-seq", "locator": "Nuc-Seq method reference", "basis": "text", "support": "reported", "quote": "Nuc-Seq: Krishnaswami S. R., Grindberg R. V., Novotny M., et al. Using single nuclei for RNA-seq to capture the transcriptome of postmortem neurons. Nat Protoc. 2016;11:499-524", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00251", "basis": "text", "support": "reported", "quote": "Perform lysis and cDNA synthesis, starting from Step 5 of the Smart-seq2 protocol3 (addition of oligo-dT primer and dNTPs to the FACS-sorted single nuclei from Step 18) and proceeding through to Step 24, implementing the modifications in the table below.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00262", "basis": "text", "support": "reported", "quote": "Use cDNA preparations (from Step 19) that pass quality control (Step 23) to prepare a sequencing library; we use the Illumina Nextera XT library prep kit and follow the instructions in the Fluidigm C1 manual (see INTRODUCTION and MATERIALS). We start at page 35 of the manual with dilution of the cDNA and proceed through tagmentation, PCR amplification and AMPure XP bead cleanup, with the modifications for nuclei indicated in the table below.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00051", "basis": "text", "support": "reported", "quote": "Cytoplasmic transcripts are not detectable, nor are small noncoding RNAs (ncRNAs) and other short sequence mRNAs lacking polyA tails. The low amounts of RNA contained in a nucleus may also prevent the detection of some ncRNAs.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00031", "basis": "text", "support": "reported", "quote": "Sequence coverage of introns and exons is used to ensure that the sequences are derived from mRNA rather than from genomic DNA (Fig. 9), which is not removed from the nuclear extracts.", "bbox": null, "rationale": null}]}, {"target": "scope:Nuc-Seq", "verdict": "supported", "action": "accept", "rationale": "The card and checked collection heading identify Nuc-Seq nuclear RNA sequencing and associate it with PMID26890679. All seven assigned operations have the compatible frozen-brain preparation history of that implementation. Smart-seq2 is an embedded component. The separate inDrop/Div-Seq/DR-Seq rows, standalone methyladenosine structure and DNA homonym do not create target methods. The catalogue compares dissociation to snRNA-seq without establishing complete-protocol equivalence or priority.", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Complete assigned Nuc-Seq strip: Tissue through indexed Enrichment-ready fragment; introductory single-cell/poly(A) icon at left", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "poster_06869234e814e10509a62546::diagram:poster_crop_d2ed60819862ca27eb97f772", "locator": "Middle Nuc-Seq row; inDrop above, Div-Seq below; standalone N6-methyladenosine drawing at right", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.015, 0.42, 0.9, 0.7], "rationale": null}, {"source_id": "poster_70d77f2642b92f199e1d3e87::diagram:poster_crop_2e233e5aa063c21bada45cb1", "locator": "Nuc-Seq row between inDrop and Div-Seq; DR-Seq is another row above", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.018, 0.49, 0.92, 0.73], "rationale": null}, {"source_id": "nuc-seq::card:nuc-seq", "locator": "Nuc-Seq method reference", "basis": "text", "support": "reported", "quote": "Nuc-Seq: Krishnaswami S. R., Grindberg R. V., Novotny M., et al. Using single nuclei for RNA-seq to capture the transcriptome of postmortem neurons. Nat Protoc. 2016;11:499-524", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::card:nuc-seq", "locator": "Description: comparison with snRNA-seq", "basis": "text", "support": "reported", "quote": "Nuc-Seq avoids proteolytic treatment during nuclei dissociation from cells, minimizing gene expression changes resulting from common protease dissociation procedures; this step is similar to the one used in snRNA-seq.", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::collection:rna:page:115", "locator": "Heading", "basis": "text", "support": "reported", "quote": "Nuc-Seq: A Single-Nucleus RNA-Seq from Frozen Tissues", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::paper:26890679", "locator": "b00003, abstract within registered full text", "basis": "text", "support": "reported", "quote": "Some steps follow published methods (Smart-seq2 for cDNA synthesis and Nextera XT barcoded library preparation) and are not described in detail here.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00058", "basis": "text", "support": "reported", "quote": "We have used cultured neuroprogenitor cells and fresh mouse brain tissue13, and we include an example using frozen human brain (ANTICIPATED RESULTS), as the source for nuclei.", "bbox": null, "rationale": null}]}, {"target": "correction:fixation_scope", "verdict": "supported", "action": "accept", "rationale": "The retained diagram observation accurately records Fixation and freeze on all three Nuc-Seq rows. The selected protocol supports frozen brain and warns against mRNA-crosslinking fixation. use_primary is justified: freeze produces frozen_tissue, whose label/properties and isolate input do not assert fixed tissue. No fixation operation or contradictory fixed-history edge remains.", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Tissue icons linked by Fixation and freeze arrow", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.13, 0.1, 0.27, 1.0], "rationale": null}, {"source_id": "poster_06869234e814e10509a62546::diagram:poster_crop_d2ed60819862ca27eb97f772", "locator": "Middle Nuc-Seq row; inDrop above, Div-Seq below; standalone N6-methyladenosine drawing at right", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.015, 0.42, 0.9, 0.7], "rationale": null}, {"source_id": "poster_70d77f2642b92f199e1d3e87::diagram:poster_crop_2e233e5aa063c21bada45cb1", "locator": "Nuc-Seq row between inDrop and Div-Seq; DR-Seq is another row above", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.018, 0.49, 0.92, 0.73], "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00058", "basis": "text", "support": "reported", "quote": "However, frozen brain tissue performed well, by producing full-length cDNAs and informative transcriptomes (ANTICIPATED RESULTS). Methods that cross-link mRNA, such as paraformaldehyde fixation of tissues, will severely limit the ability to produce full-length cDNA.", "bbox": null, "rationale": null}]}, {"target": "correction:centrifugation_optionality", "verdict": "supported", "action": "accept", "rationale": "The strip depicts obligatory-looking Lyse and centrifuge before sorting. The primary passage explicitly makes density-gradient cleanup optional and permits filtered crude homogenate directly to FACS. The composite isolate action, conditional selection effect, generic released-nuclei boundary and next sorting edge implement that resolution without forcing centrifugation into every input history.", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Lyse and centrifuge arrow from second tissue ": "primary:paper:26890679", "locator": "b00045", "basis": "text", "support": "reported", "quote": "For most transcripts, the nuclear and whole-cell expression profiles were similar, and therefore nuclei can generally be substituted for whole cells to define cell lineage, state or type populations, for example, by principal component analysis.", "bbox": null, "rationale": null}]}, {"target": "state_property:library:limitations", "verdict": "supported", "action": "accept", "rationale": "The assertion preserves the selected nuclear/poly(A) scope, difficult low-copy detection, incomplete RT/3′ bias and genomic DNA not removed from extracts. These are primary-supported representation limits on this library, not claims of perfect selection or absent contamination.", "evidence": [{"source_id": "primary:paper:26890679", "locator": "b00051", "basis": "text", "support": "reported", "quote": "Cytoplasmic transcripts are not detectable, nor are small noncoding RNAs (ncRNAs) and other short sequence mRNAs lacking polyA tails. The low amounts of RNA contained in a nucleus may also prevent the detection of some ncRNAs.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00050", "basis": "text", "support": "reported", "quote": "However, some low-copy transcripts may still be more difficult to detect in nuclei. Furthermore, increasing the cycle number could introduce some amplification bias in the library by compressing expression values for high-copy transcripts.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00031", "basis": "text", "support": "reported", "quote": "All sequencing data—even from high-quality RNA—will show some level of 3′ bias in the coverage, because the reverse transcriptase (RT) will fail to produce full-length cDNA for some proportion of the transcripts, resulting in little or no coverage for the 5′ end of these RNAs. Even though the Smart-seq2 method disfavors incomplete cDNA strand synthesis, some cDNA that is only partially extended is still generated.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00031", "basis": "text", "support": "reported", "quote": "Sequence coverage of introns and exons is used to ensure that the sequences are derived from mRNA rather than from genomic DNA (Fig. 9), which is not removed from the nuclear extracts.", "bbox": null, "rationale": null}]}, {"target": "operation:freeze", "verdict": "supported", "action": "accept", "rationale": "The action transforms tissue into the frozen preparation consumed by isolate. Removing unspecified fixation under use_primary is supported by the scoped specimen handling.", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Tissue icons linked by Fixation and freeze arrow", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.13, 0.1, 0.27, 1.0], "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00058", "basis": "text", "support": "reported", "quote": "However, frozen brain tissue performed well, by producing full-length cDNAs and informative transcriptomes (ANTICIPATED RESULTS). Methods that cross-link mRNA, such as paraformaldehyde fixation of tissues, will severely limit the ability to produce full-length cDNA.", "bbox": null, "rationale": null}]}, {"target": "operation_label:freeze", "verdict": "supported", "action": "accept", "rationale": "Freeze tissue accurately names the primary-resolved action. It agrees with frozen_tissue and does not retain a misleading fixed-tissue interface.", "evidence": [{"source_id": "nuc-seq::diagram:asset_3439be9b3733a29c83890598", "locator": "Tissue icons linked by Fixation and freeze arrow", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.13, 0.1, 0.27, 1.0], "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00058", "basis": "text", "support": "reported", "quote": "However, frozen brain ti  "rationale": null}]}, {"target": "paper:nuc-seq:references:0", "verdict": "supported", "action": "accept", "rationale": "The literal card citation and PubMed identity resolve PMID26890679. Independently inspected registered full-text passages establish the selected single-nucleus RNA implementation using Smart-seq2 and Nextera XT. content_checked/supports_architecture with methods=[Nuc-Seq] is justified and does not depend merely on the pilot association or bibliographic identity.", "evidence": [{"source_id": "nuc-seq::card:nuc-seq", "locator": "Nuc-Seq method reference", "basis": "text", "support": "reported", "quote": "Nuc-Seq: Krishnaswami S. R., Grindberg R. V., Novotny M., et al. Using single nuclei for RNA-seq to capture the transcriptome of postmortem neurons. Nat Protoc. 2016;11:499-524", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::metadata:26890679", "locator": "PubMed title and identifiers: PMID26890679, DOI10.1038/nprot.2016.015", "basis": "text", "support": "reported", "quote": "Using single nuclei for RNA-seq to capture the transcriptome of postmortem neurons.", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::paper:26890679", "locator": "b00003, abstract within registered full text", "basis": "text", "support": "reported", "quote": "Some steps follow published methods (Smart-seq2 for cDNA synthesis and Nextera XT barcoded library preparation) and are not described in detail here.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00251", "basis": "text", "support": "reported", "quote": "Perform lysis and cDNA synthesis, starting from Step 5 of the Smart-seq2 protocol3 (addition of oligo-dT primer and dNTPs to the FACS-sorted single nuclei from Step 18) and proceeding through to Step 24, implementing the modifications in the table below.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26890679", "locator": "b00262", "basis": "text", "support": "reported", "quote": "Use cDNA preparations (from Step 19) that pass quality control (Step 23) to prepare a sequencing library; we use the Illumina Nextera XT library prep kit and follow the instructions in the Fluidigm C1 manual (see INTRODUCTION and MATERIALS). We start at page 35 of the manual with dilution of the cDNA and proceed through tagmentation, PCR amplification and AMPure XP bead cleanup, with the modifications for nuclei indicated in the table below.", "bbox": null, "rationale": null}]}, {"target": "paper:jennings_27571191", "verdict": "supported", "action": "accept", "rationale": "The card lists this review, and the inspected registered abstract concerns transgenic-primate disease models. The candidate explicitly limits its content check to that abstract and assigns background with methods=[]; it does not claim verification of full-text chemistry or method association.", "evidence": [{"source_id": "nuc-seq::card:nuc-seq", "locator": "Related publication entry", "basis": "text", "support": "reported", "quote": "Jennings C. G., Landman R., Zhou Y., et al. Opportunities and challenges in modeling human brain disorders in transgenic primates. Nat Neurosci. 2016;19:1123-1130", "bbox": null, "rationale": null}, {"source_id": "nuc-seq::paper:27571191", "locator": "Registered abstract only", "basis": "text", "support": "reported", "quote": "Our main focus is on the creation of new primate disease models for understanding the pathological mechanisms of brain disorders and for developing new approaches to effective treatment.", "bbox": null, "rationale": null}]}, {"target": "paper:wang_25079324_dna_homonym", "verdict": "supported", "action": "accept", "rationale": "The listed Wang2014/Nature fragment is resolved by metadata and primary content as a DNA whole-genome/exome Nuc-Seq homonym. Its G2/M genomic workflow does not support the assigned RNA-to-cDNA implementation. content_checked/background with methods=[] is appropriate; the citation does not expand schematic scope.", "evidence": [{"source_id": "poster_06869234e814e10509a62546::reference:poster_06869234e814e10509a62546:references:0", "locator": "citation_fragment_as_listed; original locator Poppler layout.txt line1381", "basis": "text", "support": "reported", "quote": "Wang Y. et al. (2014) Nature 512: 155-160", "bbox": null, "rationale": null}, {"source_id": "poster_06869234e814e10509a62546::metadata:25079324", "locator": "PubMed title, Wang authorship, Nature 2014 and DOI10.1038/nature13600", "basis": "text", "support": "reported", "quote": "Clonal evolution in breast cancer revealed by single nucleus genome sequencing.", "bbox": null, "rationale": null}, {"source_id": "poster_06869234e814e10509a62546::paper:25079324", "locator": "b00003", "basis": "text", "support": "reported", "quote": "Here, we developed a whole-genome and exome single cell sequencing approach called Nuc-Seq that utilizes G2/M nuclei to achieve 91% mean coverage breadth.", "bbox": null, "rationale": null}]}, {"target": "paper:snes_25853327", "verdict": "supported", "action": "accept", "rationale": "The inspected registered full-text abstract and introduction describe genomic MDA/exome capture and explicitly relate SNES to the DNA Nuc-Seq homonym. This is background to the selected RNA implementation; methods=[] and no added SNES operations are justified.", "evidence": [{"source_id": "poster_06869234e814e10509a62546::paper:25853327", "locator": "b00002", "basis": "text", "support": "reported", "quote": "To address this problem, we developed a method called SNES that combines flow-sorting of single G1/0 or G2/M nuclei, time-limited multiple-displacement-amplification, exome capture, and next-generation sequencing to generate high coverage (96%) data from single human cells.", "bbox": null, "rationale": null}, {"source_id": "poster_06869234e814e10509a62546::paper:25853327", "locator": "b00007", "basis": "text", "support": "reported", "quote": "To mitigate technical errors, we recently developed a method called Nuc-Seq, which utilizes G2/M cells to perform single-cell genome sequencing [11].", "bbox": null, "rationale": null}]}, {"target": "paper:targeted_dna_26741407", "verdict": "supported", "action": "accept", "rationale": "The registered abstract explicitly describes a single-cell DNA/MDA/targeted-capture workflow. The candidate honestly identifies abstract-only inspection; background with methods=[] does not claim full-protocol verification or support for nuclear RNA copying.", "evidence": [{"source_id": "poster_06869234e814e10509a62546::paper:26741407", "locator": "Registered abstract only", "basis": "text", "support": "reported", "quote": "To address these issues, we developed a single-cell DNA sequencing protocol that combines flow-sorting of single nuclei, time-limited multiple-displacement amplification (MDA), low-input library preparation, DNA barcoding, targeted capture and next-generation sequencing (NGS).", "bbox": null, "rationale": null}]}, {"target": "paper:habib_27471252_related_implementation", "verdict": "supported", "action": "accept", "rationale": "The registered published full-text passage describes sNuc-Seq and its EdU Div-Seq extension, a distinct neighbouring poster route. It supports related nuclear-RNA context but does not establish identity with the caller-selected Krishnaswami implementation. The candidate bounds this as background with methods=[] and does not import its fixed-tissue/EdU history.", "evidence": [{"source_id": "poster_70d77f2642b92f199e1d3e87::paper:27471252", "locator": "b00005", "basis": "text", "support": "reported", "quote": "Div-Seq relies on sNuc-Seq, a single-nucleus isolation and RNA-Seq method compatible with frozen or fixed tissue (Fig. 1A), which enables enrichment of rare labeled cell populations by fluorescence-activated cell sorting (FACS) (fig. S1). Div-Seq combines sNuc-Seq with pulse labeling of dividing cells by 5-ethynyl-2′-deoxyuridine (EdU) (5, 6).", "bbox": null, "rationale": null}, {"source_id": "poster_70d77f2642b92f199e1d echnology_atlas/v2/work/illumina_full_20261031/poster_sources_06/imports/25/255fd39a05b292f32d47d9c1a4b96180ceb1a177e250cedb62b90b23e0f3896e.json"}}}, "primary_api_record": {"title": "Div-Seq: A single nucleus RNA-Seq method reveals dynamics of rare adult newborn neurons in the CNS", "authors": "Naomi Habib;Yinqing Li;Matthias Heidenreich;Lukasz Swiech;John J Trombetta;Feng Zhang;Aviv Regev;", "author_corresponding": "Aviv  Regev", "author_corresponding_institution": "Broad Institute", "doi": "10.1101/045989", "date": "2016-03-27", "version": "1", "type": "New Results", "license": "cc_no", "category": "Neuroscience ", "jatsxml": "https://www.biorxiv.org/content/early/2016/03/27/045989.source.xml", "abstract": "Transcriptomes of individual neurons provide rich information about cell types and dynamic states. However, it is difficult to capture rare dynamic processes, such as adult neurogenesis, because isolation from dense adult tissue is challenging, and markers for each phase are limited. Here, we developed Div-Seq, which combines Nuc-Seq, a scalable single nucleus RNA-Seq method, with EdU-mediated labeling of proliferating cells. We first show that Nuc-Seq can sensitively identify closely related cell types within the adult hippocampus. We apply Div-Seq to track transcriptional dynamics of newborn neurons in an adult neurogenic region in the hippocampus. Finally, we find rare adult newborn GABAergic neurons in the spinal cord, a non-canonical neurogenic region. Taken together, Nuc-Seq and Div-Seq open the way for unbiased analysis of any complex tissue.", "published": "NA", "server": "bioRxiv"}, "fulltext_status": "source_XML_request_429_not_retried", "failed_fulltext_receipt": {"status": "failed", "error": "curl exit 56: curl: (56) The requested URL returned error: 429\n"}, "doi": "10.1101/045989", "title": "Div-Seq: A single nucleus RNA-Seq method reveals dynamics of rare adult newborn neurons in the CNS", "abstract": "Transcriptomes of individual neurons provide rich information about cell types and dynamic states. However, it is difficult to capture rare dynamic processes, such as adult neurogenesis, because isolation from dense adult tissue is challenging, and markers for each phase are limited. Here, we developed Div-Seq, which combines Nuc-Seq, a scalable single nucleus RNA-Seq method, with EdU-mediated labeling of proliferating cells. We first show that Nuc-Seq can sensitively identify closely related cell types within the adult hippocampus. We apply Div-Seq to track transcriptional dynamics of newborn neurons in an adult neurogenic region in the hippocampus. Finally, we find rare adult newborn GABAergic neurons in the spinal cord, a non-canonical neurogenic region. Taken together, Nuc-Seq and Div-Seq open the way for unbiased analysis of any complex tissue.", "kind": "text", "identity_status": "primary_api_collection_own_doi_title_abstract_verified", "text_path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/poster_sources_06/imports/fb/fbcf3796333cb730f572002135eb96e41e2b4313130987a5409a390bbc1171ff.txt", "text_sha256": "fbcf3796333cb730f572002135eb96e41e2b4313130987a5409a390bbc1171ff", "metadata_source": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/poster_sources_06/imports/25/255fd39a05b292f32d47d9c1a4b96180ceb1a177e250cedb62b90b23e0f3896e.json", "metadata_source_sha256": "255fd39a05b292f32d47d9c1a4b96180ceb1a177e250cedb62b90b23e0f3896e", "derivation": {"kind": "deterministic_title_abstract_rendition", "input_path": "/Users/mihajlostojkovic/Documents/qiu_lab/agents_snRNA/sequencing-technology-atlas/provenance/experiments/illumina_full_20261031/sources/poster_citation_review_02/habib_preprint_api.json", "input_sha256": "255fd39a05b292f32d47d9c1a4b96180ceb1a177e250cedb62b90b23e0f3896e", "collection_record_index": 0, "primary_api_record_sha256": "9f13c307ca66357d98a1f9cc2acedcb86cb047bbe27c4c097808621a09093b03"}, "snap nges resulting from common protease dissociation procedures; this step is similar to the one used in snRNA-seq. Next, Smart-seq2 is used for cDNA synthesis, increasing the full-length cDNA yield due to its template-switching mechanism. Finally, the sequencing library is prepared using Tn5 transposase tagmentation.", "advantages_verbatim": ["Nonproteolytic nuclear dissociation minimizes gene expression changes during isolation of nuclei", "Template-switching mechanism of Smart-seq2 during cDNA synthesis increases the yield of full-length cDNA strands", "FACS isolation increases throughput", "RNA from frozen nuclei gives better cDNA quality than cytoplasmic RNA", "Can be used on frozen tissues"], "limitations_verbatim": ["Excludes any information from cytoplasmic RNA", "Low-copy transcripts are hard to detect due to low amounts of isolated nucleolar RNA", "ncRNAs and other short non-poly(A) RNA species are challenging to detect"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "Nuc-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "Nuc-Seq is an RNA sequencing technique optimized for isolating and sequencing nuclear RNA from frozen tissue samples. Nuc-Seq avoids proteolytic treatment during nuclei dissociation from cells, minimizing gene expression changes resulting from common protease dissociation procedures; this step is similar to the one used in snRNA-seq. Next, Smart-seq2 is used for cDNA synthesis, increasing the full-length cDNA yield due to its template-switching mechanism. Finally, the sequencing library is prepared using Tn5 transposase tagmentation.\nSimilar methods: snRNA-seq, Div-Seq.\nPros:\nNonproteolytic nuclear dissociation minimizes gene expression changes during isolation of nuclei\nTemplate-switching mechanism of Smart-seq2 during cDNA synthesis increases the yield of full-length cDNA strands\nFACS isolation increases throughput\nRNA from fro   const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
