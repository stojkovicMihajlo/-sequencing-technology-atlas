LIP application. The splicing and miRNA-biogenesis findings are biological context, not additional target methods or graph branches."}]}, {"id": "pm_25683224", "source_id": "par-clip::paper:25683224", "methods": [], "assessment": "content_checked", "relationship": "background", "evidence": [{"source_id": "par-clip::card:par-clip", "locator": "Literal reference entry on the PAR-CLIP catalogue card", "basis": "text", "support": "reported", "quote": "Chen T., Hao Y. J., Zhang Y., et al. m(6)A RNA Methylation Is Regulated by MicroRNAs and Promotes Reprogramming to Pluripotency. Cell Stem Cell. 2015;16:289-301", "bbox": null, "rationale": "Literal secondary catalogue entry; the accompanying registered publication excerpt supplies the stated level of content assessment."}, {"source_id": "par-clip::paper:25683224", "locator": "Abstract, m6A and pluripotency study", "basis": "text", "support": "reported", "quote": "Here, we report m(6)A modification profiles in the mRNA transcriptomes of four cell types with different degrees of pluripotency.", "bbox": null, "rationale": "Abstract-only biological background. This abstract does not identify a particular PAR-CLIP implementation; no method-member assignment is inferred from the catalogue listing."}]}], "corrections": [{"id": "c_target_isolation", "target_id": "operation:o3", "diagram_observation": "The PAR-CLIP row connects UV 365 nm to an RNase T1 digestion icon and then Proteinase K. Immunoprecipitation occurs in the method title, but there is no local antibody-capture block or drawn separation. The row alone therefore does not establish a complete isolation sequence.", "primary_statement": "Hafner 2010 Methods [b00077] explicitly places RNase T1 treatment of cleared lysate before anti-FLAG immunoprecipitation, further RNase T1 treatment on the immunoprecipitate, and size fractionation/recovery before proteinase K. Figure 1C summarizes RNase digestion, immunopurification and size fractionation. Operation o3 and State s3 implement this order within one composite isolation boundary; no alternative contradictory flow is asserted.", "disposition": "use_primary", "evidence": [{"source_id": "poster_39a3bd1f24a2577c34305214::diagram:poster_crop_5a12490830537c5787374a83", "locator": "Middle row: RNase T1 digestion caption and green enzyme symbols flanking RNA in the crosslinked complex; no antibody-capture action block is drawn.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.529, 0.5, 0.603, 0.73], "rationale": null}, {"source_id": "poster_39a3bd1f24a2577c34305214::diagram:poster_crop_5a12490830537c5787374a83", "locator": "Middle row: Proteinase K caption, pink/teal enzyme symbol and rightward arrow; next material icon is a short purple RNA line without the blue protein.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.612, 0.47, 0.705, 0.73], "rationale": null}, {"source_id": "par-clip::diagram:asset_a49c84e0ab3748f2377c4594", "locator": "Leftmost descriptive complex icon and title: Photoactivatable-Ribonucleoside-Enhanced Crosslinking and Immunoprecipitation (PAR-CLIP). This is a method illustration, not an additional processing branch.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.14, 0.17, 1.0], "rationale": null}, {"source_id": "primary:paper:20371350", "locator": "Methods, PAR-CLIP [b00077]", "basis": "text", "support": "reported", "quote": "The cleared cell lysates were treated with RNase T1. FLAG/HA-tagged proteins were immunoprecipitated with anti-FLAG antibodies bound to Protein G Dynabeads. RNase T1 was added to the immunoprecipitate.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:20371350", "locator": "Methods, PAR-CLIP [b00077]", "basis": "text", "support": "reported", "quote": "The protein-RNA complexes were separated by SDS-PAGE and electroeluted. The electroeluate was proteinase K digested.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:20371350", "locator": "Figure 1C caption [b00084]", "basis": "text", "support": "reported", "quote": "4SU-labeled transcripts were crosslinked to RBPs and partially RNase-digested RNA-protein complexes were immunopurified and size-fractionated. RNA molecules were recovered and converted into a cDNA library and deep sequenced.", "bbox": null, "rationale": null}]}, {"id": "c_catalogue_citation", "target_id": "paper:pm_18158127", "diagram_observation": "The assigned figures explicitly depict PAR-CLIP. The standalone catalogue card labels its main citation Par-CLIP but lists Hafner et al. (2008), Identification of microRNAs and other small regulatory RNAs using cDNA library sequencing. The poster instead lists Hafner et al. (2010), Cell 141:129-141.", "primary_statement": "Registered Hafner 2010 full text names and describes PAR-CLIP and cites Hafner et al. 2008 specifically for conversion of recovered RNA into a cDNA library. The inspected 2008 abstract describes small-RNA library sequencing. The scoped assay association is therefore the 2010 PAR-CLIP paper; the 2008 paper is retained as library-preparation background. No invention date is inferred solely from either bibliographic record.", "disposition": "use_primary", "evidence": [{"source_id": "par-clip::diagram:asset_a49c84e0ab3748f2377c4594", "locator": "Leftmost method title, PAR-CLIP", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.14, 0.17, 1.0], "rationale": null}, {"source_id": "poster_39a3bd1f24a2577c34305214::reference:poster_39a3bd1f24a2577c34305214:references:0", "locator": "citation_fragment_as_listed; Poppler layout.txt line894, separated cells5-6", "basis": "text", "support": "reported", "quote": "Hafner M. et al. (2010) Cell 141: 129-141", "bbox": null, "rationale": null}, {"source_id": "primary:paper:20371350", "locator": "Title [b00001] and Introduction [b00011]", "basis": "text", "support": "reported", "quote": "Here we describe an improved method for isolation of segments of RNA bound by RBPs or RNPs, referred to as PAR-CLIP (Photoactivatable-Ribonucleoside-Enhanced Crosslinking and Immunoprecipitation).", "bbox": null, "rationale": null}, {"source_id": "par-clip::card:par-clip", "locator": "Literal reference entry on the PAR-CLIP catalogue card", "basis": "text", "support": "reported", "quote": "Par-CLIP: Hafner M., Landgraf P., Ludwig J., Rice A., Ojo T., et al. (2008) Identification of microRNAs and other small regulatory RNAs using cDNA library sequencing. Methods 44: 3-12", "bbox": null, "rationale": "Literal secondary catalogue entry; the accompanying registered publication excerpt supplies the stated level of content assessment."}, {"source_id": "par-clip::paper:18158127", "locator": "Abstract, small-RNA cDNA library protocol", "basis": "text", "support": "reported", "quote": "Here we describe methods to prepare cDNA libraries from pools of small RNAs isolated from organisms, tissues or cells.", "bbox": null, "rationale": "Only the registered abstract and bibliographic metadata were inspected for this 2008 paper. It describes small-RNA library sequencing, not the PAR-CLIP demonstration. The 2010 full text cites Hafner et al. 2008 for downstream library conversion; this component relationship does not make it a second target workflow or establish PAR-CLIP invention in 2008."}, {"source_id": "primary:paper:20371350", "locator": "Methods, PAR-CLIP [b00077]", "basis": "text", "support": "reported", "quote": "The recovered RNA was turned into a cDNA library as described (Hafner et al., 2008) and Solexa sequenced.", "bbox": null, "rationale": "Primary 2010 evidence establishes why the 2008 library-conversion protocol is related, without assigning it as the PAR-CLIP demonstration."}]}], "unknowns": []}, "review": {"format_version": "illumina_diagram_review/1.2", "record_id": "par_clip", "candidate_sha256": "64689152788716398444d8fa47c862bef833a69889144afa57d87d07b28b0d73", "inspected_sources": ["poster_39a3bd1f24a2577c34305214::diagram:poster_crop_5a12490830537c5787374a ": "reported", "quote": "The RNA was recovered by acidic phenol/chloroform extraction and ethanol precipitation. The recovered RNA was turned into a cDNA library as described (Hafner et al., 2008) and Solexa sequenced.", "bbox": null, "rationale": null}]}, {"target": "correction:c_target_isolation", "verdict": "supported", "action": "accept", "rationale": "The correction preserves the diagram account, which lacks a separate capture block. Registered primary Methods resolve lysate RNase T1 → anti-FLAG immunoprecipitation → further RNase T1 → size separation/recovery before proteinase K. Actual o3 consumes irradiated cells s2 and outputs isolated trimmed RNPs s3; o4 then digests their protein. Its composite description and graph implement that order, with no contradictory direct proteolysis of the cellular input.", "evidence": [{"source_id": "poster_39a3bd1f24a2577c34305214::diagram:poster_crop_5a12490830537c5787374a83", "locator": "Middle row: RNase T1 digestion with green enzyme icons flanking crosslinked RNA-protein complex, followed by Proteinase K arrow", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.529, 0.47, 0.65, 0.73], "rationale": null}, {"source_id": "par-clip::diagram:asset_a49c84e0ab3748f2377c4594", "locator": "Complete standalone PAR-CLIP schematic, including expanded title, reagent arrow, processing arrows and cDNA endpoint", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "primary:paper:20371350", "locator": "Methods, PAR-CLIP [b00077]", "basis": "text", "support": "reported", "quote": "The cleared cell lysates were treated with RNase T1. FLAG/HA-tagged proteins were immunoprecipitated with anti-FLAG antibodies bound to Protein G Dynabeads. RNase T1 was added to the immunoprecipitate.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:20371350", "locator": "Methods, PAR-CLIP [b00077]", "basis": "text", "support": "reported", "quote": "The protein async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
