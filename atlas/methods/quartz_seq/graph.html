75", "locator": "Figure 1 caption [b00016], RT-primer composition", "basis": "text", "support": "reported", "quote": "The first-strand cDNA was synthesized using the reverse transcription (RT) primer, which contains oligo-dT24, the T7 promoter (T7) and the PCR target region (M) sequences.", "bbox": null, "rationale": null}]}, {"target": "state_property:first_cdna:rna_cdna_pair", "verdict": "supported", "action": "accept", "rationale": "The post-RT purple/blue strands and paired A/T regions depict RNA/cDNA association. The property correctly names cdna and template_rna as hybridization partners at this boundary.", "evidence": [{"source_id": "quartz-seq::diagram:asset_45f6b524a32802345ee20039", "locator": "Reverse transcription and Primer digestion caption; arrow to purple/blue RNA/cDNA pair with AAAAA/TTTTT and T7/PCR segments.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.305, 0.15, 0.49, 1.0], "rationale": null}]}, {"target": "state_property:pcr_preparation:cdna_duplex", "verdict": "supported", "action": "accept", "rationale": "The second-strand product is duplex cDNA, and the next action adds primer rather than changing DNA identity. Retaining that strandedness on the cdna component is consistent with the primary order.", "evidence": [{"source_id": "quartz-seq::diagram:asset_45f6b524a32802345ee20039", "locator": "Generate second strand; two blue strands, terminal PCR targets, T7 and oligo(A/T) regions, followed by rightward arrow.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.525, 0.03, 0.68, 0.96], "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Methods, Whole-transcript amplification for single-cell Quartz-Seq [b00077], suppression-primer addition immediately after second-strand synthesis", "basis": "text", "support": "reported", "quote": "The reaction tubes were then immediately placed into an aluminum PCR rack at 0°C, and 25 µl of PCR buffer (1× MightyAmp Buffer version 2 and 1.9 µmol/l suppression PCR primer (HPLC-purified; Table 1)) was added.", "bbox": null, "rationale": null}]}, {"target": "state_property:pcr_preparation:identity", "verdict": "supported", "action": "accept", "rationale": "The preceding second-strand preparation receives the suppression PCR primer in the original methods. Table 1 supports the amino modification; possible byproduct templates remain supported by the caption.", "evidence": [{"source_id": "primary:paper:23594475", "locator": "Figure 1 caption [b00016], second-strand products and WTA adapters", "basis": "text", "support": "reported", "quote": "After the second-strand synthesis with the tagging primer, the resulting cDNA and the byproducts from the surviving primers contained the whole-transcript amplification (WTA) adaptor sequences, which include the RT primer sequence and the tagging primer sequence.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Methods, Whole-transcript amplification for single-cell Quartz-Seq [b00077], suppression-primer addition immediately after second-strand synthesis", "basis": "text", "support": "reported", "quote": "The reaction tubes were then immediately placed into an aluminum PCR rack at 0°C, and 25 µl of PCR buffer (1× MightyAmp Buffer version 2 and 1.9 µmol/l suppression PCR primer (HPLC-purified; Table 1)) was added.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Table 1 [b00078], suppression-primer entry; amino annotation precedes the sequence in the table headed Sequence 5'→'", "basis": "text", "support": "reported", "quote": "Suppression primer(NH2)-GTATAGAATTCGCGGCCGCTCGCGAT", "bbox": null, "rationale": null}]}, {"target": "state_property:pcr_preparation:primer_amino_end", "verdict": "supported", "action": "accept", "rationale": "Table 1 places (NH2)- before the suppression-primer sequence in its 5′-first sequence column. This supports the five_prime amino modification on suppression_primer; it does not support LNA or a modification of the RNA analyte.", "evidence": [{"source_id": "primary:paper:23594475", "locator": "Table 1 [b00078], suppression-primer entry; amino annotation precedes the sequence in the table headed Sequence 5'→'", "basis": "text", "support": "reported", "quote": "Suppression primer(NH2)-GTATAGAATTCGCGGCCGCTCGCGAT", "bbox": null, "rationale": null}]}, {"target": "state_property:pcr_preparation:suppression_primer_identity", "verdict": "supported", "action": "accept", "rationale": "The primary methods explicitly name the added reagent suppression PCR primer. The identity is correctly assigned to suppression_primer and agrees with the corrected addition action.", "evidence": [{"source_id": "primary:paper:23594475", "locator": "Methods, Whole-transcript amplification for single-cell Quartz-Seq [b00077], suppression-primer addition immediately after second-strand synthesis", "basis": "text", "support": "reported", "quote": "The reaction tubes were then immediately placed into an aluminum PCR rack at 0°C, and 25 µl of PCR buffer (1× MightyAmp Buffer version 2 and 1.9 µmol/l suppression PCR primer (HPLC-purified; Table 1)) was added.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Table 1 [b00078], suppression-primer entry; amino annotation precedes the sequence in the table headed Sequence 5'→'", "basis": "text", "support": "reported", "quote": "Suppression primer(NH2)-GTATAGAATTCGCGGCCGCTCGCGAT", "bbox": null, "rationale": null}]}, {"target": "state_property:pcr_preparation:tube", "verdict": "supported", "action": "accept", "rationale": "The WTA overview explicitly retains all stages in one PCR tube, so the property describes the organization of this entire single-cell reaction.", "evidence": [{"source_id": "primary:paper:23594475", "locator": "Results, WTA overview [b00015], physical organization", "basis": "text", "support": "reported", "quote": "All five steps are completed in a single PCR tube without any purification.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Methods, Single-cell collection using FACS [b00075], independent single-cell preparations", "basis": "text", "support": "reported", "quote": "Subsequently, we performed WTA with each single-cell lysis sample.", "bbox": null, "rationale": null}]}, {"target": "state_property:pcr_preparation:wta_segments", "verdict": "supported", "action": "accept", "rationale": "The primary caption assigns RT/tagging-derived WTA adapters to the second-strand DNA used for suppression PCR. Addition of the PCR primer does not replace those template segments.", "evidence": [{"source_id": "primary:paper:23594475", "locator": "Figure 1 caption [b00016], second-strand products and WTA adapters", "basis": "text", "support": "reported", "quote": "After the second-strand synthesis with the tagging primer, the resulting cDNA and the byproducts from the surviving primers contained the whole-transcript amplification (WTA) adaptor sequences, which include the RT primer sequence and the tagging primer sequence.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Figure 1 caption [b00016], DNA-template use and suppression", "basis": "text", "support": "reported", "quote": "These DNAs were used for the suppression PCR, which used the suppression PCR primer. Enrichment of the short DNA fragments, such as the byproducts, was suppressed.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Methods, Whole-transcript amplification for single-cell Quartz-Seq [b00077], suppression-primer addition immediately after second-strand synthesis", "basis": "text", "support": "reported", "quote": "The reaction tubes were then immediately placed into an aluminum PCR rack at 0°C, and 25 µl of PCR buffer (1× MightyAmp Buffer version 2 and 1.9 µmol/l suppression PCR primer (HPLC-purified; Table 1)) was added.", "bbox": null, "rationale": null}]}, {"target": "state_property:primed_rna:identity", "verdict": "supported", "action": "accept", "rationale": "The complete boundary is RNA plus an oligo(dT) RT primer. This self identity implements the primary-supported primer correction.", "evidence": [{"source_id": "quartz-seq::diagram:asset_45f6b524a32802345ee20039", "locator": "Add polyA primer with T7 promoter and PCR target; TTTTT/T7/PCR primer above arrow and RNA-primer pair at its right.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.095, 0.0, 0.34, 1.0], "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Figure 1 caption [b00016], RT-primer composition", "basis": "text", "support": "reported", "quote": "The first-strand cDNA was synthesized using the reverse transcription (RT) primer, which contains oligo-dT24, the T7 promoter (T7) and the PCR target region (M) sequences.", "bbox": null, "rationale": null}]}, {"target": "state_property:primed_rna:primer_segments", "verdict": "supported", "action": "accept", "rationale": "Oligo-dT24, T7 and PCR region M are explicitly reported parts of the RT primer; subject=rt_primer is correct.", "evidence": [{"source_id": "primary:paper:23594475", "locator": "Figure 1 caption [b00016], RT-primer composition", "basis": "text", "support": "reported", "quote": "The first-strand cDNA was synthesized using the reverse transcription (RT) primer, which contains oligo-dT24, the T7 promoter (T7) and the PCR target region (M) sequences.", "bbox": null, "rationale": null}]}, {"target": "state_property:primed_rna:priming", "verdict": "supported", "action": "accept", "rationale": "The T/A-paired primer icon supports hybridization between rt_primer and rna, not a covalent linkage or RNA-to-DNA conversion at this stage.", "evidence": [{"source_id": "quartz-seq::diagram:asset_45f6b524a32802345ee20039", "locator": "Add polyA primer with T7 promoter and PCR target; TTTTT/T7/PCR primer above arrow and RNA-primer pair at its right.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.095, 0.0, 0.34, 1.0], "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Figure 1 caption [b00016], RT-primer composition", "basis": "text", "support": "reported", "quote": "The first-strand cDNA was synthesized using the reverse transcription (RT) primer, which contains oligo-dT24, the T7 promoter (T7) and the PCR target region (M) sequences.", "bbox": null, "rationale": null}]}, {"target": "state_property:primed_rna:single_tube", "verdict": "supported", "action": "accept", "rationale": "The primary WTA overview places all stages in one PCR tube. This is a preparation-level physical context, correctly assigned to self.", "evidence": [{"source_id": "primary:paper:23594475", "locator": "Results, WTA overview [b00015], physical organization", "basis": "text", "support": "reported", "quote": "All five steps are completed in a single PCR tube without any purification.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Methods, Single-cell collection using FACS [b00075], independent single-cell preparations", "basis": "text", "support": "reported", "quote": "Subsequently, we performed WTA with each single-cell lysis sample.", "bbox": null, "rationale": null}]}, {"target": "state_property:rna:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity names the starting polyadenylated RNA target and correctly begins downstream of unshown cell/RNA preparation.", "evidence": [{"source_id": "quartz-seq::diagram:asset_45f6b524a32802345ee20039", "locator": "Leftmost purple RNA with AA(A)n tail and Whole-transcript amplification for single-cells (Quartz-Seq) caption.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.2, 0.16, 1.0], "rationale": null}, {"source_id": "quartz-seq::card:quartz-seq", "locator": "Illumina card, method-description opening", "basis": "text", "support": "reported", "quote": "In this method, an RT primer with a T7 promoter and PCR target is first added to the extracted mRNA.", "bbox": null, "rationale": null}]}, {"target": "state_property:rna:poly_a", "verdict": "supported", "action": "accept", "rationale": "The A-rich tail is shown on the starting RNA, so the segment belongs to self at the RNA 3′ end, not to a later DNA reporter.", "evidence": [{"source_id": "quartz-seq::diagram:asset_45f6b524a32802345ee20039", "locator": "Leftmost purple RNA with AA(A)n tail and Whole-transcript amplification for single-cells (Quartz-Seq) caption.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.2, 0.16, 1.0], "rationale": null}]}, {"target": "state_property:second_cdna:cdna_duplex", "verdict": "supported", "action": "accept", "rationale": "The two blue product strands follow Generate second strand. Double-stranded status is correctly assigned to cdna rather than every constituent of the preparation.", "evidence": [{"source_id": "quartz-seq::diagram:asset_45f6b524a32802345ee20039", "locator": "Generate second strand; two blue strands, terminal PCR targets, T7 and oligo(A/T) regions, followed by rightward arrow.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.525, 0.03, 0.68, 0.96], "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Figure 1 caption [b00016], second-strand products and WTA adapters", "basis": "text", "support": "reported", "quote": "After the second-strand synthesis with the tagging primer, the resulting cDNA and the byproducts from the surviving primers contained the whole-transcript amplification (WTA) adaptor sequences, which include the RT primer sequence and the tagging primer sequence.", "bbox": null, "rationale": null}]}, {"target": "state_property:second_cdna:identity", "verdict": "supported", "action": "accept", "rationale": "The primary caption explicitly identifies second-strand cDNA and surviving-primer byproducts with WTA adapters. The property places them in one preparation without inventing a separation.", "evidence": [{"source_id": "primary:paper:23594475", "locator": "Figure 1 caption [b00016], second-strand products and WTA adapters", "basis": "text", "support": "reported", "quote": "After the second-strand synthesis with the tagging primer, the resulting cDNA and the byproducts from the surviving primers contained the whole-transcript amplification (WTA) adaptor sequences, which include the RT primer sequence and the tagging primer sequence.", "bbox": null, "rationale": null}]}, {"target": "state_property:second_cdna:wta_segments", "verdict": "supported", "action": "accept", "rationale": "Both the diagram and primary caption support RT/tagging-primer-derived WTA interfaces on the cDNA, including T7/PCR regions. The property does not imply sequencing-adapter ligation.", "evidence": [{"source_id": "quartz-seq::diagram:asset_45f6b524a32802345ee20039", "locator": "Generate second strand; two blue strands, terminal PCR targets, T7 and oligo(A/T) regions, followed by rightward arrow.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.525, 0.03, 0.68, 0.96], "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Figure 1 caption [b00016], second-strand products and WTA adapters", "basis": "text", "support": "reported", "quote": "After the second-strand synthesis with the tagging primer, the resulting cDNA and the byproducts from the surviving primers contained the whole-transcript amplification (WTA) adaptor sequences, which include the RT primer sequence and the tagging primer sequence.", "bbox": null, "rationale": null}]}, {"target": "state_property:tailed_cdna:identity", "verdict": "supported", "action": "accept", "rationale": "The primary tailing account names both first-strand cDNA and surviving primer substrates. The diagram also adds the tagging primer before second-strand synthesis. The self identity matches this co-present preparation.", "evidence": [{"source_id": "quartz-seq::diagram:asset_45f6b524a32802345ee20039", "locator": "Poly A addition and oligo dT primer with PCR target; new AAAAA at left of cDNA and TTTTT/PCR tagging primer.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.45, 0.0, 0.565, 1.0], "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Figure 1 caption [b00016], tailing substrates and affected end", "basis": "text", "support": "reported", "quote": "A poly-A tail was then added to the 3' ends of the first-strand cDNA and to any surviving RT primer.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:23594475", "locator": "Results, WTA overview [b00015], tailing before second-strand synthesis", "basis": "text", "support": "reported", "quote": "The third step is the addition of a poly-A tail to the 3' ends of the first-strand cDNAs, and the fourth step is the second-strand synthesis using a tagging primer, which prepares the substrate for subsequent amplification.", "bbox": null, "rationale": null}]}, {"target": "state_property:tailed_cdna:new_tail", "verdict": "supported", "action": "accept", "rationale": "The primary passage explicitly places newly added poly(A) at the 3′ ends of first-strand cDNA. Subject=cdna and location=cDNA 3′ end are correct.", "evidence": [{"source_id": "primary:paper:23594475", "locator": "Figure 1 caption [b00016], tailing substrates and affected end", "basis": "text", "support": "reported", "quote": "A poly-A tail was then added to the 3' ends of the first-strand cDNA and to any surviving RT primer.", "bbox": null, "rationale": null}]}, {"target": "state_property:tailed_cdna:rt_segments", "verdict": "supported", "action": "accept", "rationale": "Tailing modifies the first-strand 3′ end; the RT-derived oligo(dT), T7 and PCR portions persist on cdna, as the diagram shows.", "evidence": [{"source_id": "quartz-seq::diagram:asset_45f6b524a32802345ee20039", "locator": "Poly A addition and oligo dT primer with PCR target; new AAAAA at left of cDNA and TTTTT/PCR tagging pri a1bb1530b9ab5434a27335c69af56cacb54d63aa43627e594c249.json", "sha256": "cb5c912f12aa1bb1530b9ab5434a27335c69af56cacb54d63aa43627e594c249"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/eb/ebd56b64b46798dfc89f138825517d69be079575b6c30d77381047e5c3943c67.xml", "sha256": "ebd56b64b46798dfc89f138825517d69be079575b6c30d77381047e5c3943c67"}], "association_status": "selected_primary_candidate; extraction reviewer must confirm method/version scope", "text_characters": 78347, "text_sha256": "bae0cd0eb25d059786d47cdff4e31ef8773ca1bef2e36d3ef85db1e4f8eff3c5"}, "quartz-seq::reference:pilot_selected_primary": {"kind": "text", "content_level": "metadata", "pmid": "23594475", "association_status": "unverified_selected_primary_candidate", "text_characters": 137, "text_sha256": "b1b989820b9471c3d6e1fa2a265eced0f2740726fbc4d377f8de6bfed22d246e"}}, "card": {"record_id": "quartz_seq", "source_title": "Quartz-Seq", "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/quartz-seq.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/quartz-seq.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA Low-level Detection", "source_category_path": ["Transcriptome", "RNA Low-level Detection"], "description_verbatim": "The Quartz-Seq method optimizes whole-transcript amplification (WTA) of single cells. In this method, an RT primer with a T7 promoter and PCR target is first added to the extracted mRNA. RT synthesizes first-strand cDNA, after which the RT primer is digested by exonuclease I. Next, a poly(A) tail is added to the 3' ends of first-strand cDNA, along with a poly(dT) primer containing a PCR target. After second-strand generation, a blocking primer is added to ensure PCR enrichment in sufficient quantity for sequencing. Deep sequencing allows for accurate, high-resolution representation of the whole transcriptome of a single cell.", "advantages_verbatim": ["Single-tube reaction suitable for automation", "Digestion of RT primers by exonuclease I eliminates amplification of byproducts", "Short fragments and byproducts are suppressed during enrichment"], "limitations_verbatim": ["PCR biases can underrepresent GC-rich templates", "Amplification errors caused by polymerases will be represented and sequenced incorrectly", "Targets smaller than 500 bp are preferentially amplified by polymerases during PCR"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "Quartz-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "The Quartz-Seq method optimizes whole-transcript amplification (WTA) of single cells. In this method, an RT primer with a T7 promoter and PCR target is first added to the extracted mRNA. RT synthesizes first-strand cDNA, after which the RT primer is digested by exonuclease I. Next, a poly(A) tail is added to the 3' ends of first-strand cDNA, along with a poly(dT) primer containing a PCR target. After second-strand generation, a blocking primer is added to ensure PCR enrichment in sufficient quantity for sequencing. Deep sequencing allows for accurate, high-resolution representation of the whole transcriptome of a single cell.\nSimilar methods: CEL-Seq, Drop-seq, MARS-Seq, CytoSeq, inDrop, Hi-SCL.\nPros:\nSingle-tube reaction suitable for automation\nDigestion of RT primers by exonuclease I eliminates amplification of byproducts\nShort fragments and byproducts are suppressed during enrichment\nCons:\nPCR biases can underrepresent GC-rich templates\nAmplification errors caused by polymerases will be represented and sequenced incorrectly\nTargets smaller than 500 bp are preferentially amplified by polymerases during PCR"}, {"source_locator": "jcr:content/par/text_2/text", "text": "Quartz-Seq: Sasagawa Y., Nikaido I., Hayashi T., Danno H., Uno K. D., et al. (2013) Quartz-Seq: a highly reproducible and sensitive single-cell RNA sequencing method, reveals non-genetic gene-expression heterogeneity. Genome Biol 14: R31"}, {"source_locator": "jcr:content/par/text_3/text", "text": "TruSeq RNA Library Preparation Kit v2\nTruSeq Small RNA Library Preparation Kits\nTruSeq Targeted RNA Expression Kits"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Zhang X., Marjani S. L., Hu Z., Weissman S. M., Pan X. and Wu S. Single-Cell Sequencing for Precise Cancer Research: Progress and Prospects. Cancer Res. 2016;76:1305-1312\nPoulin J. F., Tasic B., Hjerling-Leffler J., Trimarchi J. M. and Awatramani R. Disentangling neural cell diversity using single-cell transcriptomics. Nat Neurosci. 2016;19:1131-1141\nSun H. J., Chen J., Ni B., Yang X. and Wu Y. Z. Recent advances and current issues in single-cell sequencing of tumors. Cancer Lett. 2015;365:1-10\nGrun D. and van Oudenaarden A. Design and Analysis of Single-Cell Sequencing Experiments. Cell. 2015;163:799-810\nNavin N. E. Cancer genomics: one cell at a time. Genome Biol. 2014;15:452\nLiang J., Cai W. and Sun Z. Single-Cell Sequencing Technologies: Current and Future. J Genet Genomics. 2014;41:513-528\nTakeuchi M., Yamaguchi S., Sakakibara Y., Hayashi T., Matsuda K., et al. (2016) Gene expression profiling of granule cells and Purkinje cells in the zebrafish cerebellum. J Comp Neurol;\nArcher N., Walsh M. D., Shahrezaei V. and Hebenstreit D. Modeling Enzyme Processivity Reveals that RNA-Seq Libraries Are Biased in Characteristic and Correctable Ways. Cell Syst. 2016;\nScialdone A., Natarajan K. N., Saraiva L. R., et al. Computational assignment of cell-cycle stage from single-cell transcriptome data. Methods. 2015;"}], "cms_modified_at_not_invention_date": "Thu Jan 30 2   const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
