nce. Read-to-UMI conversion is a distinct metric, reported as 30–50%. Accordingly, the architecture implements improved cDNA tailing and second-strand synthesis without asserting a 3.6-fold increase in read-to-UMI conversion or crediting TdT alone.", "disposition": "use_primary", "evidence": [{"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row explanatory caption beneath TdT/second-strand region: WTA using terminal deoxynucleotidyl transferase (TdT) provides 3.6 fold increase in polyA-tagging to UMI conversion efficiency.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.465, 0.571, 0.641, 0.674], "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00014] Results, Improvement of poly(A) tagging efficiency, explanation of yield assay", "basis": "text", "support": "reported", "quote": "It is known that the DNA yield of amplified cDNA generally reflects the quantitative performance of single-cell RNA-seq methods [3, 13, 14]. Thus, we determined the effects of various buffers for the poly(A) tailing step on the amplified cDNA yield.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00015] Results, Improvement of poly(A) tagging efficiency, yield comparison", "basis": "text", "support": "reported", "quote": "Next, we added an “Increment” temperature condition for the tagging and second-strand synthesis steps (see “Methods”). In this condition, the reaction temperature of these steps was gradually increased. As a result, the amount of cDNA tended to increase, by approximately 1.2-fold (Fig. 2a). Moreover, upon combining T55 buffer and the Increment condition, the amount of cDNA increased approximately 3.6-fold.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00015] Results, Improvement of poly(A) tagging efficiency, selected implementation", "basis": "text", "support": "reported", "quote": "Therefore, we used the combination of T55 buffer and the Increment temperature condition for the poly(A) tagging strategy for Quartz-Seq2.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00008] study summary, read-to-UMI conversion", "basis": "text", "support": "reported", "quote": "By the combination of molecular biological improvements, including major improvement of poly(A) tagging, Quartz-Seq2 resulted in an increase in the effectiveness with which the initial sequence reads were converted to the expression UMI counts (UMI conversion efficiency 30–50%).", "bbox": null, "rationale": null}]}], "unknowns": []}, "review": {"format_version": "illumina_diagram_review/1.2", "record_id": "quartz_seq2", "candidate_sha256": "ba8beceace4de3a96866ce2fcf03545435d2d5b4d64c0dcabd451fd28c066cd1", "inspected_sources": ["poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "poster_33a5d1bff9a9b8ea9080e26c::card:poster_33a5d1bff9a9b8ea9080e26c", "poster_33a5d1bff9a9b8ea9080e26c::reference:poster_33a5d1bff9a9b8ea9080e26c:references:0", "poster_33a5d1bff9a9b8ea9080e26c::reference:pilot_selected_primary", "poster_33a5d1bff9a9b8ea9080e26c::metadata:29523163", "primary:paper:29523163"], "checks": [{"target": "construction", "verdict": "supported", "action": "accept", "rationale": "The six local action blocks and seven boundaries preserve the complete in-scope middle row: cell sorting, coupled lysis/RT, pooling/purification, TdT tailing, poly(dT)-primed second-strand synthesis, and combined amplification/custom library preparation. The PolyA RNA icon denotes the cellular target rather than a separately purified RNA fraction. The pooled first-strand interface is supported by the primary Figure 1a/Methods even though the poster combines it visually with tailing. Separate well reactions persist until actual contents are pooled; RNA and cDNA in the RT preparation are components of one preparation. The last block appro brary DNA.", "evidence": [{"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row Lysis & RT arrow and paired mRNA/cDNA lines; TTTTT, Cell barcode, UMI and PCR primer label successive parts of the cDNA/RT-primer region.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.27, 0.37, 0.44, 0.56], "rationale": null}, {"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row after Pool & purify: PolyA tail synthesized by TdT enzyme points to AAAAA on the left of cDNA; TTTTT and the colored RT-primer-derived segments remain on its right.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.474, 0.36, 0.595, 0.5], "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00011] Results, Outline of Quartz-Seq2 experiment, second step", "basis": "text", "support": "reported", "quote": "Each well contains lysis buffer and reverse-transcription (RT) primer, which includes a cell barcode sequence (14- or 15-mer), a UMI sequence (8-mer), and an oligo-dT sequence (24-mer). Using these RT primers, respective RNA from single cells is converted to cDNA with unique cell barcodes.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00007] Embedded Figure 1a caption, step 5, library construction and enrichment", "basis": "text", "support": "reported", "quote": "For conversion from amplified cDNA to sequence library DNA, we fragment the amplified cDNA using the ultrasonicator Covaris. Such fragmented cDNA is ligated with a truncated Y-shaped sequence adaptor, which has an Illumina flow-cell binding sequence (P7) and a pool barcode sequence (PB). The PB makes it possible to mix different sets of cell barcode-labeled cDNA. Ligated cDNA, which has CB and MB sequences, is enriched by PCR amplification.", "bbox": null, "rationale": null}]}, {"target": "state_property:tailed_cdna:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity is first-strand cDNA modified by TdT with a DNA poly(A) tract. Primary Results explicitly identify cDNA as the modified substrate.", "evidence": [{"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row after Pool & purify: PolyA tail synthesized by TdT enzyme points to AAAAA on the left of cDNA; TTTTT and the colored RT-primer-derived segments remain on its right.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.474, 0.36, 0.595, 0.5], "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00013] Results, Improvement of poly(A) tagging efficiency, two processes and resulting interface", "basis": "text", "support": "reported", "quote": "Poly(A) tagging is composed of two processes: (1) the first-strand cDNA is modified with a poly(A) tail by terminal deoxynucleotidyl transferase; and (2) the poly(A)-tailed cDNA is annealed with a tagging primer, which has a poly(dT) sequence. Then, the second-strand cDNA is extended. The resulting second-strand cDNA is amplifiable cDNA, which has a PCR primer sequence at both ends of it.", "bbox": null, "rationale": null}]}, {"target": "state_property:tailed_cdna:molecule_attribution", "verdict": "supported", "action": "accept", "rationale": "Molecule attribution remains on the original RT-derived UMI. The new poly(A) tail is not substituted as the molecule identifier, and MB retention is confirmed in downstream library products.", "evidence": [{"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row after Pool & purify: PolyA tail synthesized by TdT enzyme points to AAAAA on the left of cDNA; TTTTT and the colored RT-primer-derived segments remain on its right.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.474, 0.36, 0.595, 0.5], "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00007] Embedded Figure 1a caption, step 2, MB and poly(dT)", "basis": "text", "support": "reported", "quote": "The RT primer also has a UMI sequence for reduction of PCR bias (MB) and a poly(dT) sequence for binding to poly(A) RNA.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00007] Embedded Figure 1a caption, step 5, library construction and enrichment", "basis": "text", "support": "reported", "quote": "For conversion from amplified cDNA to sequence library DNA, we fragment the amplified cDNA using the ultrasonicator Covaris. Such fragmented cDNA is ligated with a truncated Y-shaped sequence adaptor, which has an Illumina flow-cell binding sequence (P7) and a pool barcode sequence (PB). The PB makes it possible to mix different sets of cell barcode-labeled cDNA. Ligated cDNA, which has CB and MB sequences, is enriched by PCR amplification.", "bbox": null, "rationale": null}]}, {"target": "state_property:tailed_cdna:rt_handle", "verdict": "supported", "action": "accept", "rationale": "The PCR handle/oligo(dT) tract remains in the RT-derived region while TdT adds poly(A) at the opposite end. Placement preserves the two distinct primer interfaces needed for the next step.", "evidence": [{"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row Lysis & RT arrow and paired mRNA/cDNA lines; TTTTT, Cell barcode, UMI and PCR primer label successive parts of the cDNA/RT-primer region.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.27, 0.37, 0.44, 0.56], "rationale": null}, {"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row after Pool & purify: PolyA tail synthesized by TdT enzyme points to AAAAA on the left of cDNA; TTTTT and the colored RT-primer-derived segments remain on its right.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.474, 0.36, 0.595, 0.5], "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00013] Results, Improvement of poly(A) tagging efficiency, two processes and resulting interface", "basis": "text", "support": "reported", "quote": "Poly(A) tagging is composed of two processes: (1) the first-strand cDNA is modified with a poly(A) tail by terminal deoxynucleotidyl transferase; and (2) the poly(A)-tailed cDNA is annealed with a tagging primer, which has a poly(dT) sequence. Then, the second-strand cDNA is extended. The resulting second-strand cDNA is amplifiable cDNA, which has a PCR primer sequence at both ends of it.", "bbox": null, "rationale": null}]}, {"target": "state_property:tailed_cdna:umi", "verdict": "supported", "action": "accept", "rationale": "The retained UMI/MB sequence_segment remains on the same first-strand cDNA preparation. The drawn colored RT-derived region and primary's later CB/MB products support retention through tail addition.", "evidence": [{"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row Lysis & RT arrow and paired mRNA/cDNA lines; TTTTT, Cell barcode, UMI and PCR primer label successive parts of the cDNA/RT-primer region.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.27, 0.37, 0.44, 0.56], "rationale": null}, {"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row after Pool & purify: PolyA tail synthesized by TdT enzyme points to AAAAA on the left of cDNA; TTTTT and the colored RT-primer-derived segments remain on its right.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.474, 0.36, 0.595, 0.5], "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00007] Embedded Figure 1a caption, step 2, MB and poly(dT)", "basis": "text", "support": "reported", "quote": "The RT primer also has a UMI sequence for reduction of PCR bias (MB) and a poly(dT) sequence for binding to poly(A) RNA.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00007] Embedded Figure 1a caption, step 5, library construction and enrichment", "basis": "text", "support": "reported", "quote": "For conversion from amplified cDNA to sequence library DNA, we fragment the amplified cDNA using the ultrasonicator Covaris. Such fragmented cDNA is ligated with a truncated Y-shaped sequence adaptor, which has an Illumina flow-cell binding sequence (P7) and a pool barcode sequence (PB). The PB makes it possible to mix different sets of cell barcode-labeled cDNA. Ligated cDNA, which has CB and MB sequences, is enriched by PCR amplification.", "bbox": null, "rationale": null}]}, {"target": "state_property:wells:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity belongs to the sorted single-cell/lysis-buffer preparation. Primer co-presence is explicitly reported for each well and is compatible with the input to coupled lysis/RT.", "evidence": [{"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row left: Single cell, PolyA RNA, Single-cell in PCR well plate; lower caption explicitly says single cells are sorted into PCR well plates containing lysis buffer and RT primers.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.1, 0.33, 0.44, 0.67], "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00011] Results, Outline of Quartz-Seq2 experiment, first step", "basis": "text", "support": "reported", "quote": "We selectively sort living single cells into lysis buffer in a 384-well PCR plate without dead cells.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00011] Results, Outline of Quartz-Seq2 experiment, second step", "basis": "text", "support": "reported", "quote": "Each well contains lysis buffer and reverse-transcription (RT) primer, which includes a cell barcode sequence (14- or 15-mer), a UMI sequence (8-mer), and an oligo-dT sequence (24-mer). Using these RT primers, respective RNA from single cells is converted to cDNA with unique cell barcodes.", "bbox": null, "rationale": null}]}, {"target": "state_property:wells:primer_segments", "verdict": "supported", "action": "accept", "rationale": "sequence_segment correctly lists CB, UMI, oligo(dT) and PCR handle on rt_primer. These are primer parts, not independent preparations or modifications already incorporated into cellular RNA.", "evidence": [{"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row Lysis & RT arrow and paired mRNA/cDNA lines; TTTTT, Cell barcode, UMI and PCR primer label successive parts of the cDNA/RT-primer region.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.27, 0.37, 0.44, 0.56], "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00011] Results, Outline of Quartz-Seq2 experiment, second step", "basis": "text", "support": "reported", "quote": "Each well contains lysis buffer and reverse-transcription (RT) primer, which includes a cell barcode sequence (14- or 15-mer), a UMI sequence (8-mer), and an oligo-dT sequence (24-mer). Using these RT primers, respective RNA from single cells is converted to cDNA with unique cell barcodes.", "bbox": null, "rationale": null}]}, {"target": "state_property:wells:rt_primer_identity", "verdict": "supported", "action": "accept", "rationale": "The identity is placed on rt_primer, the actual oligo(dT) primer component. The image labels the PCR handle/CB/UMI region, while primary text places CB, UMI and oligo(dT) in one RT primer.", "evidence": [{"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row Lysis & RT arrow and paired mRNA/cDNA lines; TTTTT, Cell barcode, UMI and PCR primer label successive parts of the cDNA/RT-primer region.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.27, 0.37, 0.44, 0.56], "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00011] Results, Outline of Quartz-Seq2 experiment, second step", "basis": "text", "support": "reported", "quote": "Each well contains lysis buffer and reverse-transcription (RT) primer, which includes a cell barcode sequence (14- or 15-mer), a UMI sequence (8-mer), and an oligo-dT sequence (24-mer). Using these RT primers, respective RNA from single cells is converted to cDNA with unique cell barcodes.", "bbox": null, "rationale": null}]}, {"target": "state_property:wells:well_context", "verdict": "supported", "action": "accept", "rationale": "physical_context correctly records separate PCR wells and a cell assigned to each reaction. This organization persists through RT until the later collection step; it is not an isolation claim about primer or RNA fractions.", "evidence": [{"source_id": "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701", "locator": "Middle row left: Single cell, PolyA RNA, Single-cell in PCR well plate; lower caption explicitly says single cells are sorted into PCR well plates containing lysis buffer and RT primers.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.1, 0.33, 0.44, 0.67], "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00011] Results, Outline of Quartz-Seq2 experiment, first step", "basis": "text", "support": "reported", "quote": "We selectively sort living single cells into lysis buffer in a 384-well PCR plate without dead cells.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:29523163", "locator": "[b00011] Results, Outline of Quartz-Seq2 experiment, third step", "basis": "text", "support": "reported", "quote": "The third step involves the pooling of cell-barcoded cDNA. By cell barcoding, Quartz-Seq2 can pool cDNA of up to 1536 individual cells into one mixture.", "bbox": null, "rationale": null}]}]}, "sources": {"poster_33a5d1bff9a9b8ea9080e26c::card:poster_33a5d1bff9a9b8ea9080e26c": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/applications/ngs-library-prep/for-all-you-seq-single-cell.pdf", "title": "Quartz-seq2", "text_characters": 24, "text_sha256": "55fa8870f1c392eb4035bdc211ba2789134332f1081dab435015d360b2fdd345"}, "poster_33a5d1bff9a9b8ea9080e26c::diagram:poster_crop_490f088b5e6fb1c06d81f701": {"kind": "image", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/poster_sources_06/imports/a5/a51a5cc5e13e5f7899935df27b118c37b9727c6c6d53cf733f4d12483b17b4d8.png", "sha256": "a51a5cc5e13e5f7899935df27b118c37b9727c6c6d53cf733f4d12483b17b4d8", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/applications/ngs-library-prep/for-all-you-seq-single-cell.pdf", "content_level": "diagram", "original": {"asset_id": "poster_crop_490f088b5e6fb1c06d81f701", "source_id": "diagram:poster_crop_490f088b5e6fb1c06d81f701", "kind": "method_diagram", "card_ids": ["poster_33a5d1bff9a9b8ea9080e26c"], "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/applications/ngs-library-prep/for-all-you-seq-single-cell.pdf", "source_urls": ["https://www.illumina.com/content/dam/illumina-marketing/documents/applications/ngs-library-prep/for-all-you-seq-single-cell.pdf"], "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/poster_sources_06/imports/a5/a51a5cc5e13e5f7899935df27b118c37b9727c6c6d53cf733f4d12483b17b4d8.png", "sha256": "a51a5cc5e13e5f7899935df27b118c37b9727c6c6d53cf733f4d12483b17b4d8", "bytes": 182011, "status": "downloaded", "acquisition_basis": "derived_from_hash_verified_poster_pdf", "original": {"format_version": "illumina_poster_crop/1.0", "source_row_id": "asset_cb01d823a5306118dbe13122:p1:c1:r011", "parent_pdf": {"pat function inspect(parent, item, kind, record) {

  parent.replaceChildren(el('span',kind,'badge'),el('h3',item.label || item.id));
  const states = new Map(c.states.map(s => [s.id,s]));
  const names = ids => (ids || []).map(id => (states.get(id)?.label || id)+' ['+id+']');
  if (kind === 'Operation') fields(parent,[['Description',item.description],['Input States',names(item.inputs)],['Output States',names(item.outputs)],['Mechanism',item.mechanism || 'Not specified'],['Information effect',item.information_effect || 'Not specified']]);
  if (kind === 'State') fields(parent,[['Kind',item.kind],['Features',item.features]]);
  if (kind === 'State') { assertions(parent,'State properties',item.properties,record); if(item.constituents?.length)raw(parent,'Named constituents',item.constituents); }
  if (kind === 'Operation') { assertions(parent,'Input roles',item.input_roles,record); assertions(parent,'Effects on input/output States',item.effects,record); }
  if (kind === 'Flow') {
    const nodes = [...c.states,...c.operations], name = id => nodes.find(n => n.id === id)?.label || id;
    fields(parent,[['Type',item.kind],['From',name(item.source)+' ['+item.source+']'],['To',name(item.target)+' ['+item.target+']']]);

  fields(parent,[['Local ID',item.id]]);

  const affected = c.corrections.filter(x=>x.target_id===target), unknowns = c.unknowns.filter(x=>x.affected_ids.includes(target));
  for (const x of affected) parent.append(el('p','Correction: '+x.primary_statement,'warning'));
  for (const x of unknowns) parent.append(el('p','Unknown: '+x.question,'warning'));
  parent.append(el('h3','Evidence for this record')); evidence(parent,item.evidence,record);
  const labelTarget = kind.toLowerCase()+'_label:'+item.id;
  const checks = record.review?.checks?.filter(x=>x.target===target || x.target===labelTarget) || [];
  if (kind !== 'Flow' && !checks.some(x=>x.target===labelTarget)) parent.append(el('p','This archived review did not separately assess the label. Corrections and features remain part of its interpretation.','muted'));
  if (checks.length) raw(parent,'Recorded review of this target',checks);

}
function drawGraph(parent, inspector, record) {
  const c = record.candidate, nodes = [...c.states.map(x=>({...x,type:'State'})),...c.operations.map(x=>({...x,type:'Operation'}))];
  const ids = new Set(nodes.map(x=>x.id)), incoming = new Map(nodes.map(x=>[x.id,0])), next = new Map(nodes.map(x=>[x.id,[]]));
  for (const f of c.flows) { if (!ids.has(f.source)||!ids.has(f.target)) { parent.append(el('p','Cannot draw: a Flow endpoint is missing. Inspect the raw record.','warning')); return; } incoming.set(f.target,incoming.get(f.target)+1);next.get(f.source).push(f.target); }
  const rank = new Map(nodes.map(x=>[x.id,0])), ready = nodes.filter(x=>incoming.get(x.id)===0).map(x=>x.id); let processed=0;
  while (ready.length) { const id = ready.shift(); processed++;for (const target of next.get(id)) { rank.set(target,Math.max(rank.get(target),rank.get(id)+1)); incoming.set(target,incoming.get(target)-1);if (!incoming.get(target)) ready.push(target); } }
  if (processed !== nodes.length) { parent.append(el('p','A cycle prevents a left-to-right layout. Use the exact Flow records below.','warning'));return; }
  const NS='http://www.w3.org/2000/svg', svg=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};
  const pos = new Map(), lanes = new Map();
  for (const n of nodes) { const col=rank.get(n.id),row=lanes.get(col)||0;lanes.set(col,row+1);pos.set(n.id,{x:25+col*224,y:25+row*112}); }
  const canvas=svg('svg',{width:Math.max(680,Math.max(...rank.values())*224+240),height:Math.max(150,Math.max(...lanes.values())*112+30),role:'img','aria-label':'Directed State and Operation workflow'});
  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));

}
const standalone=document.getElementById('record-data');
