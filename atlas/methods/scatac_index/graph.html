brary; this route agrees with the declared output and the next interface. The final pooling arrows and primary pooled-PCR-products passage establish a true DNA mixture after the separate PCR branches. Paired indexes persist; no sequence-data output is asserted.", "evidence": [{"source_id": "scatac-seq-cell-index::diagram:asset_e300585c9dc583f12fb36c98", "locator": "Pool for library prep: arrows from three PCR-barcode wells lead to DNA fragments with colored end segments at the far right.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.82, 0.03, 1.0, 0.99], "rationale": null}, {"source_id": "primary:paper:25953818", "locator": "Full text [b00007], pooled PCR products, cellular attribution, and collisions", "basis": "text", "support": "reported", "quote": "Finally, all PCR products are pooled and sequenced, with the expectation that most sequence reads bearing the same combination of barcodes will be derived from a single cell (estimated collision rate of ~11% for experiments described here; Fig. S1).", "bbox": null, "rationale": null}]}, {"target": "paper:cusanovich_2015", "verdict": "supported", "action": "accept", "rationale": "The literal catalogue citation, PubMed identity and inspected full-text content resolve the Cusanovich 2015 association. The registered primary renditions have identical text. Figure 1A and the main implementation passage describe this exact two-round nuclear indexing architecture, so methods=[scATAC-seq (combinatorial indexing)], content_checked and supports_architecture are justified. Publication metadata identifies the paper and date; it is not used alone for reaction order or historical priority. The pilot-selected lead is expressly not treated as mechanism evidence.", "evidence": [{"source_id": "scatac-seq-cell-index::card:scatac-seq-cell-index", "locator": "Catalogue named-method citation and repeated related-publication citation", "basis": "text", "support": "reported", "quote": "scATAC-Seq (Cell Index): Cusanovich D. A., Daza R., Adey A., Pliner H. A., Christiansen L., et al. (2015) Epigenetics. Multiplex single-cell profiling of chromatin accessibility by combinatorial cellular indexing. Science 348: 910-914", "bbox": null, "rationale": null}, {"source_id": "scatac-seq-cell-index::metadata:25953818", "locator": "PubMed metadata title, PMID 25953818, DOI 10.1126/science.aab1601 and 2015 journal/electronic dates; identity evidence only", "basis": "text", "support": "reported", "quote": "Multiplex single cell profiling of chromatin accessibility by combinatorial cellular indexing.", "bbox": null, "rationale": null}, {"source_id": "scatac-seq-cell-index::paper:25953818", "locator": "Full text [b00005], registered duplicate rendition of the primary article", "basis": "text", "support": "reported", "quote": "We then pool, dilute and redistribute intact nuclei to a second set of wells, introduce a second barcode and complete library construction.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:25953818", "locator": "Full text [b00067], Figure 1A caption", "basis": "text", "support": "reported", "quote": "Nuclei are isolated and molecularly tagged in bulk with barcoded Tn5 transposases in wells (labels A–D). Nuclei are then pooled and a limited number redistributed into a second set of wells. A second barcode (labels 1–4) is introduced during PCR.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:25953818", "locator": "Full text [b00007], lysis followed by indexed PCR", "basis": "text", "support": "reported", "quote": "After lysing nuclei, a second barcode is introduced during PCR with indexed primers complementary to the transposase-introduced adapters.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:25953818", "locator": "Full text [b00007], pooled PCR products, cellular attribution, and collisions", "basis": "text", "support": "reported", "quote": "Finally, all PCR products are pooled and sequenced, with the expectation that most sequence reads bearing the same combination of barcodes will be derived from a single cell (estimated collision rate of ~11% for experiments described here; Fig. S1).", "bbox": null, "rationale": null}]}, {"target": "paper:corces_2016", "verdict": "supported", "action": "accept", "rationale": "The inspected registered title and application/methods passages identify the listed Corces paper and establish related single-cell chromatin-accessibility work. Its main-text methods defer the single-cell implementation to Supplementary Note 1; these passages do not establish the scoped Cusanovich route. Keeping content_checked/background with methods=[] honestly retains the paper without claiming that its implementation matches this schematic or adding its application as another method.", "evidence": [{"source_id": "scatac-seq-cell-index::card:scatac-seq-cell-index", "locator": "Catalogue related publications, Corces entry", "basis": "text", "support": "reported", "quote": "Corces M. R., Buenrostro J. D., Wu B., Greenside P. G., Chan S. M., et al. (2016) Lineage-specific and single-cell chromatin accessibility charts human hematopoiesis and leukemia evolution. Nat Genet", "bbox": null, "rationale": null}, {"source_id": "scatac-seq-cell-index::paper:27526324", "locator": "Full text [b00033], single-cell accessibility application", "basis": "text", "support": "reported", "quote": "To discriminate between these two possibilities, we performed single-cell ATAC-seq (scATAC-seq) on purified LSCs and blast cells from two AML patients and compared these samples to myeloid cells from healthy donors.", "bbox": null, "rationale": null}, {"source_id": "scatac-seq-cell-index::paper:27526324", "locator": "Full text [b00096]–[b00097], single-cell methods section", "basis": "text", "support": "reported", "quote": "Single-cell ATAC-seq and enhancer cytometry analysis were performed as described in Supplementary Note 1.", "bbox": null, "rationale": null}]}, {"target": "paper:liu_trapnell_2016 e Preimplantation Development. Cell 165: 1375-1388", "bbox": null, "rationale": null}, {"source_id": "scatac-seq-cell-index::paper:27259149", "locator": "Full text [b00006], method developed in the paper", "basis": "text", "support": "reported", "quote": "Here we develop a low-input DNase I sequencing (liDNase-seq) method that allows us to generate maps of DNase I-hypersensitive site (DHS) of mouse preimplantation embryos from 1-cell to morula stage.", "bbox": null, "rationale": null}, {"source_id": "scatac-seq-cell-index::paper:27259149", "locator": "Full text [b00011], scATAC-seq as literature context", "basis": "text", "support": "reported", "quote": "Recently, two single-cell ATAC-seq methods have been developed and used in analyzing chromatin heterogeneity among populations of cells (Buenrostro et al., 2015; Cusanovich et al., 2015).", "bbox": null, "rationale": null}]}]}, "sources": {"scatac-seq-cell-index::card:scatac-seq-cell-index": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/scatac-seq-cell-index.html", "title": "scATAC-Seq (Cell Index)", "text_characters": 2374, "text_sha256": "b9fdaa51abcd8f66e4f199df8a057cc75a9a95b7da948bbdb1517dc35750f985"}, "scatac-seq-cell-index::diagram:asset_e300585c9dc583f12fb36c98": {"kind": "image", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/e7/e763608e3118c576ea40b764fe7c53ca3c7db12ca2eaf6d8e48d0b280e9d57c9.png", "sha256": "e763608e3118c576ea40b764fe7c53ca3c7db12ca2eaf6d8e48d0b280e9d57c9", "url": "https://www.illumina.com/content/dam/illumina-marketing/images/tools/sequencing/scatac-seq-cell-index.png", "content_level": "diagram", "original": {"asset_id": "asset_e300585c9dc583f12fb36c98", "url": "https://www.illumina.com/content/dam/illumina-marketing/images/tools/sequencing/scatac-seq-cell-index.png", "kind": "method_diagram", rl": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/scatac-seq-cell-index.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/scatac-seq-cell-index.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Genome > DNA Low-Level Detection", "source_category_path": ["Genome", "DNA Low-Level Detection"], "description_verbatim": "Single-cell ATAC-Seq uses combinatorial cellular indexing to measure chromatin accessibility in thousands of single cells per assay. This avoids the need for compartmentalization of individual cells, which makes the system scalable to analyze thousands of cells at a time.\nIn this method nuclei are isolated and molecularly tagged in bulk with barcoded Tn5 transposases in wells. Nuclei are then pooled and a limited number redistributed into a second set of wells. A second barcode is then introduced during the PCR amplification step. The fragments are then pooled for library prep and sequencing.", "advantages_verbatim": ["High throughput and scalable"], "limitations_verbatim": ["None reported"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "scATAC-Seq (Cell Index)"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "Single-cell ATAC-Seq uses combinatorial cellular indexing to measure chromatin accessibility in thousands of single cells per assay. This avoids the need for compartmentalization of individual cells, which makes the system scalable to analyze thousands of cells at a time.\nIn this method nuclei are isolated and molecularly tagged in bulk with barcoded Tn5 transposases in wells. Nuclei are then pooled and a limited number redistributed into a second set   const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
