quenced on a high-throughput sequencing instrument.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_individual_libraries:physical_separation", "verdict": "supported", "action": "accept", "rationale": "The self physical_context places separately collected and indexed cell libraries immediately before the pooling step. This is consistent with the corrected internal order and the primary statement that single-cell libraries are then pooled.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Device right boundary and Amplify with cell-specific barcodes: short blue primer icon over arrow; single colored-end DNA library product outside device", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Pool libraries from all cells and rightward arrow to multiple DNA lines with distinct colored ends at DNA endpoint", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, IFC PCR then library collection, barcoded-primer PCR and pooling", "basis": "text", "support": "reported", "quote": "After transposition and PCR on the Integrated Fluidics Circuit (IFC), libraries are collected and PCR amplified with cell-identifying barcoded primers. Single-cell libraries are then pooled and sequenced on a high-throughput sequencing instrument.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_isolated:cell_association", "verdict": "supported", "action": "accept", "rationale": "The attribution unit is a cell and the carrier is its separate microfluidic compartment before indexing. Individual capture on the C1 and the per-cell route support this physical association; the property does not claim a molecular barcode is already present.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Left of workflow inside Microfluidics device: multiple orange cells at Cell suspension, rightward arrow, one orange cell at Isolate single cell", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, individual-cell capture on programmable microfluidics", "basis": "text", "support": "reported", "quote": "In scATAC-seq individual cells are captured and assayed using a programmable microfluidics platform (C1 single-cell Auto Prep System, Fluidigm) with methods optimized for this task (Fig. 1a and Extended Data Fig. 1 and Supplemental Discussion).", "bbox": null, "rationale": null}]}, {"target": "state_property:s_isolated:compartment", "verdict": "supported", "action": "accept", "rationale": "physical_context applies to the captured-cell preparation and records separate microfluidic assay compartments. The single representative drawn cell is consistent with individual capture and later pooling of all cell libraries, without asserting mixed contents.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Left of workflow inside Microfluidics device: multiple orange cells at Cell suspension, rightward arrow, one orange cell at Isolate single cell", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, individual-cell capture on programmable microfluidics", "basis": "text", "support": "reported", "quote": "In scATAC-seq individual cells are captured and assayed using a programmable microfluidics platform (C1 single-cell Auto Prep System, Fluidigm) with methods optimized for this task (Fig. 1a and Extended Data Fig. 1 and Supplemental Discussion).", "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Pool libraries from all cells and rightward arrow to multiple DNA lines with distinct colored ends at DNA endpoint", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}]}, {"target": "state_property:s_isolated:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity names individually captured cells before lysis. It matches the single-cell icon after the isolation arrow and the primary C1 capture account.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Left of workflow inside Microfluidics device: multiple orange cells at Cell suspension, rightward arrow, one orange cell at Isolate single cell", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, individual-cell capture on programmable microfluidics", "basis": "text", "support": "reported", "quote": "In scATAC-seq individual cells are captured and assayed using a programmable microfluidics platform (C1 single-cell Auto Prep System, Fluidigm) with methods optimized for this task (Fig. 1a and Extended Data Fig. 1 and Supplemental Discussion).", "bbox": null, "rationale": null}]}, {"target": "state_property:s_lysis:adapter_association", "verdict": "supported", "action": "accept", "rationale": "The subject adapters and partner tn5 are explicit components of the same preparation. bound_to matches the colored stubs attached to the blue transposase icon before insertion, distinguishing noncovalent enzyme loading from downstream insertion into genomic DNA.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Lyse and introduce Tn5 transposase: blue enzyme with yellow/pink DNA stubs, followed by rightward arrow toward chromatin insertion", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Insert in regions of open chromatin: blue Tn5 icons bearing colored stubs contact DNA between grey nucleosomes", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}]}, {"target": "state_property:s_lysis:compartment", "verdict": "supported", "action": "accept", "rationale": "The self physical_context correctly retains individual microfluidic preparations during lysis and subsequent chromatin insertion. The device enclosure and primary individual C1 capture/on-IFC transposition establish this context; there is no intervening pooling arrow.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Lyse and introduce Tn5 transposase: blue enzyme with yellow/pink DNA stubs, followed by rightward arrow toward chromatin insertion", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Insert in regions of open chromatin: blue Tn5 icons bearing colored stubs contact DNA between grey nucleosomes", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, individual-cell capture on programmable microfluidics", "basis": "text", "support": "reported", "quote": "In scATAC-seq individual cells are captured and assayed using a programmable microfluidics platform (C1 single-cell Auto Prep System, Fluidigm) with methods optimized for this task (Fig. 1a and Extended Data Fig. 1 and Supplemental Discussion).", "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, IFC PCR then library collection, barcoded-primer PCR and pooling", "basis": "text", "support": "reported", "quote": "After transposition and PCR on the Integrated Fluidics Circuit (IFC), libraries are collected and PCR amplified with cell-identifying barcoded primers. Single-cell libraries are then pooled and sequenced on a high-throughput sequencing instrument.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_lysis:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity names lysed cell chromatin preparations containing introduced adapter-bearing Tn5, supported by the lysis/introduction caption, following chromatin panel and catalogue description. It does not relabel the material as clean DNA or completed library.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Lyse and introduce Tn5 transposase: blue enzyme with yellow/pink DNA stubs, followed by rightward arrow toward chromatin insertion", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Insert in regions of open chromatin: blue Tn5 icons bearing colored stubs contact DNA between grey nucleosomes", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::card:scatac-seq-microfluidics", "locator": "Method description, paragraph beginning In this protocol", "basis": "text", "support": "reported", "quote": "In this protocol the cells are captured in a fluidics device, lysed and subjected to Tn5 transposases. The Tn5 ends are extended, PCR amplified with dual-index primers, pooled, purified, and sequenced.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_pool:cell_association", "verdict": "supported", "action": "accept", "rationale": "Attribution remains on the pooled material with the cell as linked unit and index sequences on DNA as actual carrier. The primary order of barcode PCR before pooling supports retaining each insert's cell-library origin after mixing; the statement about later maps is explicitly attributed to the paper.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Pool libraries from all cells and rightward arrow to multiple DNA lines with distinct colored ends at DNA endpoint", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, IFC PCR then library collection, barcoded-primer PCR and pooling", "basis": "text", "support": "reported", "quote": "After transposition and PCR on the Integrated Fluidics Circuit (IFC), libraries are collected and PCR amplified with cell-identifying barcoded primers. Single-cell libraries are then pooled and sequenced on a high-throughput sequencing instrument.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_pool:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity is a mixture of amplified indexed cell DNA libraries, precisely the product of the depicted pooling action and the primary sequence. It denotes physical library material rather than cells or data.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Pool libraries from all cells and rightward arrow to multiple DNA lines with distinct colored ends at DNA endpoint", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, IFC PCR then library collection, barcoded-primer PCR and pooling", "basis": "text", "support": "reported", "quote": "After transposition and PCR on the Integrated Fluidics Circuit (IFC), libraries are collected and PCR amplified with cell-identifying barcoded primers. Single-cell libraries are then pooled and sequenced on a high-throughput sequencing instrument.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_pool:pooled_material", "verdict": "supported", "action": "accept", "rationale": "The self physical_context records DNA library molecules from different indexed cells mixed in one pool. The source explicitly pools libraries after barcoding, rather than pooling intact cell compartments or unindexed lysates.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Pool libraries from all cells and rightward arrow to multiple DNA lines with distinct colored ends at DNA endpoint", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, IFC PCR then library collection, barcoded-primer PCR and pooling", "basis": "text", "support": "reported", "quote": "After transposition and PCR on the Integrated Fluidics Circuit (IFC), libraries are collected and PCR amplified with cell-identifying barcoded primers. Single-cell libraries are then pooled and sequenced on a high-throughput sequencing instrument.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_pool:representation", "verdict": "supported", "action": "accept", "rationale": "The locally defined Accessibility representation property is correctly applied to physical library material. Genomic inserts report their accessible-chromatin origin and indexes permit later cell assignment; primary passages support enrichment and sparse sampling. The assertion does not claim all accessible sites are present or that the library is already measurement data.", "evidence": [{"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, Tn5 adapter insertion into accessible genome", "basis": "text", "support": "reported", "quote": "ATAC-seq uses the prokaryotic Tn5 transposase14,15 to tag regulatory regions by inserting sequencing adapters into accessible regions of the genome.", "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, IFC PCR then library collection, barcoded-primer PCR and pooling", "basis": "text", "support": "reported", "quote": "After transposition and PCR on the Integrated Fluidics Circuit (IFC), libraries are collected and PCR amplified with cell-identifying barcoded primers. Single-cell libraries are then pooled and sequenced on a high-throughput sequencing instrument.", "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, representation of recovered DNA fragments", "basis": "text", "support": "reported", "quote": "Data from single cells recapitulate several characteristics of bulk ATAC-seq data, including fragment size periodicity corresponding to integer multiples of nucleosomes, and a strong enrichment of fragments within regions of accessible chromatin (Extended Data Fig. 2b,c).", "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00007], Main, incomplete per-cell sampling of accessible elements", "basis": "text", "support": "reported", "quote": "For example, within a typical single cell we estimate a total of 9.4% of promoters are represented in a typical scATAC-seq library (Extended Data Fig. 3). The sparse nature of scATAC-seq data makes analysis of cellular variation at individual regulatory elements impractical.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_suspension:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity accurately records suspended cells before individual capture, matching the caption and multiple cell icons. No unreported preparation history is embedded.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Left of workflow inside Microfluidics device: multiple orange cells at Cell suspension, rightward arrow, one orange cell at Isolate single cell", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}]}, {"target": "state_property:s_tagmented:adapter_segments", "verdict": "supported", "action": "accept", "rationale": "The preparation-level sequence_segment assertion describes inserted sequencing adapters on the DNA fragments and their priming interface. Colored end segments and Fragmented and primed support this interface; exact end chemistry/strand arrangement is expressly not specified and is not fabricated.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Arrow from chromatin insertion to Fragmented and primed inside device: DNA fragment with colored terminal segments, residual nucleosomal chromatin on either side", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, Tn5 adapter insertion into accessible genome", "basis": "text", "support": "reported", "quote": "ATAC-seq uses the prokaryotic Tn5 transposase14,15 to tag regulatory regions by inserting sequencing adapters into accessible regions of the genome.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_tagmented:compartment", "verdict": "supported", "action": "accept", "rationale": "The self physical_context retains separate single-cell preparations inside the microfluidic device before the receiving amplification composite. Primary transposition and PCR on the IFC followed by collection supports this boundary and agrees with c_amplification_boundary.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Arrow from chromatin insertion to Fragmented and primed inside device: DNA fragment with colored terminal segments, residual nucleosomal chromatin on either side", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, individual-cell capture on programmable microfluidics", "basis": "text", "support": "reported", "quote": "In scATAC-seq individual cells are captured and assayed using a programmable microfluidics platform (C1 single-cell Auto Prep System, Fluidigm) with methods optimized for this task (Fig. 1a and Extended Data Fig. 1 and Supplemental Discussion).", "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, IFC PCR then library collection, barcoded-primer PCR and pooling", "basis": "text", "support": "reported", "quote": "After transposition and PCR on the Integrated Fluidics Circuit (IFC), libraries are collected and PCR amplified with cell-identifying barcoded primers. Single-cell libraries are then pooled and sequenced on a high-throughput sequencing instrument.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_tagmented:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity correctly describes a preparation containing fragmented adapter-tagged DNA plus the residual chromatin drawn in the same region. This avoids inventing a separate isolated accessible fraction while retaining the accessible-DNA origin supported by primary adapter insertion.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Insert in regions of open chromatin: blue Tn5 icons bearing colored stubs contact DNA between grey nucleosomes", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Arrow from chromatin insertion to Fragmented and primed inside device: DNA fragment with colored terminal segments, residual nucleosomal chromatin on either side", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, Tn5 adapter insertion into accessible genome", "basis": "text", "support": "reported", "quote": "ATAC-seq uses the prokaryotic Tn5 transposase14,15 to tag regulatory regions by inserting sequencing adapters into accessible regions of the genome.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_tn5:adapter_association", "verdict": "supported", "action": "accept", "rationale": "The adapters subject and tn5 partner are local explicit components. bound_to is supported by colored DNA stubs attached to the blue enzyme icon before chromatin insertion; it does not assert covalent attachment to Tn5 or genomic DNA at this boundary.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Lyse and introduce Tn5 transposase: blue enzyme with yellow/pink DNA stubs, followed by rightward arrow toward chromatin insertion", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}]}, {"target": "state_property:s_tn5:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity correctly identifies a Tn5/adapter reagent preparation, supported by the labelled enzyme icon with colored stubs and primary sequencing-adapter insertion account. It does not assert that those stubs are cell-specific barcodes.", "evidence": [{"source_id": "scatac-seq-microfluidics::diagram:asset_716747caf734526a272fab33", "locator": "Lyse and introduce Tn5 transposase: blue enzyme with yellow/pink DNA stubs, followed by rightward arrow toward chromatin insertion", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "scatac-seq-microfluidics::paper:26083756", "locator": "[b00006], Main, Tn rays/scatac-seq-microfluidics.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Genome > DNA Low-Level Detection", "source_category_path": ["Genome", "DNA Low-Level Detection"], "description_verbatim": "scATAC-seq is ATAC-seq integrated into a programmable microfluidics platform The method is similar to single cell ATAC-seq, which relies on indexing to identify single cells.\nIn this protocol the cells are captured in a fluidics device, lysed and subjected to Tn5 transposases. The Tn5 ends are extended, PCR amplified with dual-index primers, pooled, purified, and sequenced.", "advantages_verbatim": ["Map the accessible genome of individual cells"], "limitations_verbatim": ["Requires dedicated fluidics"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "scATAC-Seq (Microfluidics)"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "scATAC-seq is ATAC-seq integrated into a programmable microfluidics platform The method is similar to single cell ATAC-seq, which relies on indexing to identify single cells.\nIn this protocol the cells are captured in a fluidics device, lysed and subjected to Tn5 transposases. The Tn5 ends are extended, PCR amplified with dual-index primers, pooled, purified, and sequenced.\nPros:\nMap the accessible genome of individual cells\nCons:\nRequires dedicated fluidics"}, {"source_locator": "jcr:content/par/text_2/text", "text": "scATAC-Seq (Microfluidics): Buenrostro J. D., Wu B., Litzenburger U. M., Ruff D., Gonzales M. L., et al. (2015) Single-cell chromatin accessibility reveals principles of regulatory variation. Nature 523: 486-490"}, {"source_locator": "jcr:content/par/text_3/text", "text": "TruSeq Nano DNA Library Prep Kit\nTruSeq DNA PCR-Free Library Preparation Kit"}, {"source_locator": "jcr:conte function renderRecord(r) {

async function openRecord(id, {reveal = false} = {}) {

async function start(){
