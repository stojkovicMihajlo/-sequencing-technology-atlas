lready established single-cell RRBS dataset association through mapping, rather than introducing a new biological source.", "evidence": [{"source_id": "primary:paper:26902283", "locator": "Results, Development of the scTrio-seq method [b00009]", "basis": "text", "support": "reported", "quote": "The supernatant was subjected to the scRNA-seq method we previously developed29, whereas the precipitate was subjected to DNA methylome sequencing using the scRRBS method we recently developed19.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26902283", "locator": "Results, Development of the scTrio-seq method [b00009]", "basis": "text", "support": "reported", "quote": "This approach simultaneously yielded genomic (in term of CNVs), DNA methylomic, and transcriptomic information from the same cell.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_rrbs_alignment:content", "verdict": "supported", "action": "accept", "rationale": "self data_content retains mapped bisulfite-read sequence evidence for CpGs and coverage for CNV estimation; both downstream uses are reported.", "evidence": [{"source_id": "primary:paper:26902283", "locator": "Materials and Methods, Single-cell RRBS data [b00052]", "basis": "text", "support": "reported", "quote": "We then aligned the trimmed reads to human or mouse C-T (G-A) genomes with the Bismark software58.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26902283", "locator": "Materials and Methods, Single-cell RRBS data [b00052]", "basis": "text", "support": "reported", "quote": "The methylation level of each CpG site was then calculated by counting the methylated reads and unmethylated reads.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26902283", "locator": "Results, CNV deduction using scTrio-seq [b00014]", "basis": "text", "support": "reported", "quote": "Because more than one hundred thousand MspI-digested DNA fragments were recovered in the DNA methylome data of scTrio-  "basis": "text", "support": "reported", "quote": "The supernatant was subjected to the scRNA-seq method we previously developed29, whereas the precipitate was subjected to DNA methylome sequencing using the scRRBS method we recently developed19.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26902283", "locator": "Results, Development of the scTrio-seq method [b00009]", "basis": "text", "support": "reported", "quote": "This approach simultaneously yielded genomic (in term of CNVs), DNA methylomic, and transcriptomic information from the same cell.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_rrbs_reads:content", "verdict": "supported", "action": "accept", "rationale": "self data_content correctly assigns both CpG methylation and CNV support to the same RRBS read source, implementing c_shared_rrbs.", "evidence": [{"source_id": "primary:paper:26902283", "locator": "Materials and Methods, Single-cell RRBS data [b00052]", "basis": "text", "support": "reported", "quote": "The methylation level of each CpG site was then calculated by counting the methylated reads and unmethylated reads.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26902283", "locator": "Results, CNV deduction using scTrio-seq [b00014]", "basis": "text", "support": "reported", "quote": "Because more than one hundred thousand MspI-digested DNA fragments were recovered in the DNA methylome data of scTrio-seq (Table 1), we tested the ability to measure CNVs using the RRBS data of scTrio-seq in an individual cell.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_rrbs_reads:identity", "verdict": "supported", "action": "accept", "rationale": "self identity is the shared scRRBS sequence-read dataset established by the primary-resolved nuclear route.", "evidence": [{"source_id": "primary:paper:26902283", "locator": "Results, Development of the scTrio-seq method [b00009]", "basis": "text", "support": "reported", "quote": "The supernatant was subjected to the scRNA-seq method we previously developed29, whereas the precipitate was subjected to DNA methylome sequencing using the scRRBS method we recently developed19.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26902283", "locator": "Results, CNV deduction using scTrio-seq [b00014]", "basis": "text", "support": "reported", "quote": "Because more than one hundred thousand MspI-digested DNA fragments were recovered in the DNA methylome data of scTrio-seq (Table 1), we tested the ability to measure CNVs using the RRBS data of scTrio-seq in an individual cell.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_rrbs_reads:type", "verdict": "supported", "action": "accept", "rationale": "sequence_reads correctly types the output of DNA-branch PCR/sequencing, prior to genomic alignment.", "evidence": [{"source_id": "sctrio-seq::diagram:asset_c113a800c2eff18f92e66ef0", "locator": "Lower Converted fragments to PCR and sequence, ending in a black sequence line.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.75, 0.54, 1.0, 1.0], "rationale": null}, {"source_id": "primary:paper:26902283", "locator": "Materials and Methods, Single-cell RRBS data [b00052]", "basis": "text", "support": "reported", "quote": "We then aligned the trimmed reads to human or mouse C-T (G-A) genomes with the Bismark software58.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_tailed_cdna:handle", "verdict": "supported", "action": "accept", "rationale": "The retained green sequence segment is on cdna at the end opposite the newly drawn poly(A) tail.", "evidence": [{"source_id": "sctrio-seq::diagram:asset_c113a800c2eff18f92e66ef0", "locator": "Upper Add poly A with TDT boundary: blue/green cDNA receives AA(A)n at the end opposite green.", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.7, 0.0, 0.88, 0.35], "rationale": null}]}, {"target": "state_property:s_tailed_cdna:identity", "verdict": "supporte ource_category_path": ["Transcriptome", "RNA Low-level Detection"], "description_verbatim": "scTrio-Seq can analyze genomic CNVs, the DNA methylome, and the transcriptome of an individual mammalian cell simultaneousl. This approach is an extension of previous methods, such as scMT-seq.", "advantages_verbatim": ["Accurately analyzes the mechanism by which the transcriptome, genome, and DNA methylome regulate each other", "CNVs can be identified reliably using scRRBS data"], "limitations_verbatim": ["Lower transcriptome coverage than scMT-seq1", "Results in 3'-biased transcriptome"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "scTrio-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "scTrio-Seq can analyze genomic CNVs, the DNA methylome, and the transcriptome of an individual mammalian cell simultaneousl. This approach is an extension of previous methods, such as scMT-seq.\nPros:\nAccurately analyzes the mechanism by which the transcriptome, genome, and DNA methylome regulate each other\nCNVs can be identified reliably using scRRBS data\nCons:\nLower transcriptome coverage than scMT-seq1\nResults in 3'-biased transcriptome"}, {"source_locator": "jcr:content/par/text_2/text", "text": "scTrio-Seq: Hou Y., Guo H., Cao C., Li X., Hu B., et al. (2016) Single-cell triple omics sequencing reveals genetic, epigenetic, and transcriptomic heterogeneity in hepatocellular carcinomas. Cell Res\n1. Hu Y., Huang K., An Q., Du G., Hu G., et al. (2016) Simultaneous profiling of transcriptome and DNA methylome from a single cell. Genome Biol 17: 88"}, {"source_locator": "jcr:content/par/text_3/text", "text": "TruSeq DNA PCR-Free Library Preparation Kit\nTruSeq Nano DNA Library Prep Kit\nNextera XT DNA Library Preparation Kit\nNextera DNA Exome"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Bock C., Farlik M. and Sheffield N. C. Multi-Omics of Single Cells: Stra
