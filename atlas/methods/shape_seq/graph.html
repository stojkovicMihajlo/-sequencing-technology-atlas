1M7), which blocks RT. The RNA is reverse-transcribed to cDNA.", "bbox": null, "rationale": null}, {"source_id": "shape-seq::card:shape-seq", "locator": "Method description: cDNA readout and interpretation", "basis": "text", "support": "reported", "quote": "Deep sequencing of the cDNA provides single-nucleotide sequence information for the positions occupied by 1M7. The structural information of the RNA can then be deduced.", "bbox": null, "rationale": null}]}, {"target": "unknown:sequencing_library_interface", "verdict": "supported", "action": "accept", "rationale": "Both drawings stop at cDNA, whereas the primary abstract reports paired-end sequencing of primer-extension products. No supplied primary passage specifies the intervening construction or how barcode identity is recovered in those reads. The targeted Unknown correctly bounds these unshown details and is nonblocking for the declared schematic extraction; it does not conceal a missing depicted action.", "evidence": [{"source_id": "shape-seq::diagram:asset_c9cf3f2987783202b883831f", "locator": "Complete assigned SHAPE-Seq image, including name expansion, all arrows and both cDNA outcomes", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "poster_d645be660b5d5f2b88debe98::diagram:poster_crop_4a12dfbcf1330470f2bd5949", "locator": "RNA Structure heading and SHAPE-Seq row; distinct ICE row above and icSHAPE row below", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.02, 0.28, 0.93, 0.74], "rationale": null}, {"source_id": "shape-seq::paper:21642531", "locator": "Abstract: SHAPE chemistry and paired-end sequencing of primer-extension products", "basis": "text", "support": "reported", "quote": "SHAPE-Seq combines selective 2'-hydroxyl acylation analyzed by primer extension (SHAPE) chemistry with multiplexed paired-end deep sequencing of primer extension products.", "bbox": null, "rationale": "Registered primary content is an abstract; this supports the assay-level chemistry/readout association, not a full library-preparation protocol."}, {"source_id": "shape-seq::card:shape-seq", "locator": "Method description: cDNA readout and interpretation", "basis": "text", "support": "reported", "quote": "Deep sequencing of the cDNA provides single-nucleotide sequence information for the positions occupied by 1M7. The structural information of the RNA can then be deduced.", "bbox": null, "rationale": null}]}, {"target": "unknown:unlabelled_rt_tail", "verdict": "supported", "action": "accept", "rationale": "The magenta distal segments are visible in both RT drawings, but neither supplied image gives them a legend or precise primer/adapter identity. The registered primary abstract does not resolve them. The candidate preserves this real ambiguity without inventing sequence or chemistry; it is nonblocking for an architecture that ends at generic primer-extension cDNA. A registered Lucks full-text legend or methods passage would be the appropriate evidence for a more specific interface.", "evidence": [{"source_id": "shape-seq::diagram:asset_c9cf3f2987783202b883831f", "locator": "Upper arrow into reverse transcription: modified purple RNA and longer complementary extension terminating near its red mark", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.475, 0.0, 0.783, 0.35], "rationale": null}, {"source_id": "shape-seq::diagram:asset_c9cf3f2987783202b883831f", "locator": "Lower arrow into reverse transcription: modified purple RNA and shorter complementary extension terminating near its red mark", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.475, 0.37, 0.783, 0.85], "rationale": null}, {"source_id": "shape-seq::paper:21642531", "locator": "Abstract: SHAPE chemistry and paired-end sequencing of primer-extension products", "basis": "text", "support": "reported", "quote": "SHAPE-Seq combines selective 2'-hydroxyl acylation analyzed by primer extension (SHAPE) chemistry with multiplexed paired-end deep sequencing of primer extension products.", "bbox": null, "rationale": "Registered primary content is an abstract; this supports the assay-level chemistry/readout association, not a full library-preparation protocol."}]}]}, "sources": {"shape-seq::card:shape-seq": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/shape-seq.html", "title": "SHAPE-Seq", "text_characters": 2419, "text_sha256": "2db838c64abdf9cbdbebda4e840f435a7e8f9ba8d9cd4e485bf1a706f9ac6ec7"}, "shape-seq::collection:rna:page:78": {"kind": "text", "content_level": "catalogue", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102/sources_03/collection_pages/rna_078.txt", "sha256": "87dcf5216dc3ea29ae769288648b55f85c37deaba8fc422cb9ce0e15806bf8e8", "title": "Illumina RNA collection, PDF page 78", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/products/research_reviews/rna-sequencing-methods-review-web.pdf", "association_status": "candidate_secondary_catalogue_page; verify target and scope before use", "original": {"source_id": "collection:rna:page:78", "content_level": "catalogue", "title": "Illumina RNA collection, PDF page 78", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/products/research_reviews/rna-sequencing-methods-review-web.pdf", "text_path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102/sources_03/collection_pages/rna_078.txt", "text_sha256": "87dcf5216dc3ea29ae769288648b55f85c37deaba8fc422cb9ce0e15806bf8e8", "original_pdf": {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/8a/8a333cee2159153c1dd49bffe3a5ec2e3ee143670f63c903793f2430a793b2ae.pdf", "sha256": "8a333cee2159153c1dd49bffe3a5ec2e3ee143670f63c9037 erified_paper_association", "text_characters": 1172, "text_sha256": "ce51b2cbf4d34b7010184600cae078ce3994da2a1bfa767d51401d6f8d4f4a9a"}, "poster_d645be660b5d5f2b88debe98::reference:poster_d645be660b5d5f2b88debe98:references:0": {"kind": "text", "content_level": "metadata", "identity_status": "unverified_catalogue_reference", "text_characters": 543, "text_sha256": "1ad6516091c787eea80c18242382e7f009c4b432936056bdd8e30a77475b6252"}, "shape-seq::reference:pilot_selected_primary": {"kind": "text", "content_level": "metadata", "pmid": "21642531", "association_status": "unverified_selected_primary_candidate", "text_characters": 136, "text_sha256": "d024f536b84efcd971c556fb2f50c40195a4ed867d373c5cc18950baa20990b6"}}, "card": {"record_id": "shape_seq", "source_title": "SHAPE-Seq", "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/shape-seq.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/shape-seq.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA Structure", "source_category_path": ["Transcriptome", "RNA Structure"], "description_verbatim": "SHAPE-Seq provides structural information about RNA.\nIn this method, a unique barcode is first added to the 3' end of RNA, and the RNA is allowed to fold under pre-established in vitro conditions. The barcoded and folded RNA is treated with a SHAPE reagent, 1-methyl-7-nitroisatoic anhydride (1M7), which blocks RT. The RNA is reverse-transcribed to cDNA. Deep sequencing of the cDNA provides single-nucleotide sequence information for the positions occupied by 1M7. The structural information of the RNA can then be deduced.", "advantages_verbatim": ["Provides RNA structural information", "Multiplexed analysis of barcoded RNAs provides information for multiple RNAs", "Effect of point mutations on RNA structure can be assessed", "Alternative to mass spectrometry, nuclear magnetic resonance (NMR), and crystallography"], "limitations_verbatim": ["Requires positive and negative controls to account for transcriptase drop-off", "Requires pre-established conditions for RNA folding", "Folding in vitro may not reflect actual folding in vivo"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "SHAPE-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "SHAPE-Seq provides structural information about RNA.\nIn this method, a unique barcode is first added to the 3' end of RNA, and the RNA is allowed to fold under pre-established in vitro conditions. The barcoded and folded RNA is treated with a SHAPE reagent, 1-methyl-7-nitroisatoic anhydride (1M7), which blocks RT. The RNA is reverse-transcribed to cDNA. Deep sequencing of the cDNA provides single-nucleotide sequence information for the positions occupied by 1M7. The structural information of the RNA can then be deduced.\nPros:\nProvides RNA structural information\nMultiplexed analysis of barcoded RNAs provides information for multiple RNAs\nEffect of point mutations on RNA structure can be assessed\nAlternative to mass spectrometry, nuclear magnetic resonance (NMR), and crystallography\nCons:\nRequires positive and negative controls to account for transcriptase drop-off\nRequires pre-established conditions for RNA folding\nFolding in vitro may not reflect actual folding in vivo"}, {"source_locator": "jcr:content/par/text_3/text", "text": "SHAPE-Seq: Lucks J. B., Mortimer S. A., Trapnell C., Luo S., Aviran S., et al. (2011) Multiplexed RNA structure characterization with selective 2'-hydroxyl acylation analyzed by primer extension sequencing (SHAPE-Seq). Proc Natl Acad Sci U S A 108: 11063-11068"}, {"source_locator": "jcr:content/par/tex const $ = id => document.getElementById(id);

function link(text, url) { const a = el('a',text); if (/^https?:\/\//.test(url || '')) { a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; } return a; }

function filterRecords() {

function drawGraph(parent, inspector, record) {

  const NS='http://www.w3.org/2000/svg', svg=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};

  const canvas=svg('svg',{width:Math.max(680,Math.max(...rank.values())*224+240),height:Math.max(150,Math.max(...lanes.values())*112+30),role:'img','aria-label':'Directed State and Operation workflow'});
  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
