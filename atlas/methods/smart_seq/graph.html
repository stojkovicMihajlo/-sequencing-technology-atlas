 DNA from purification of amplified cDNA and keeps subsequent PE/Tn5 library construction outside the extracted route.", "evidence": [{"source_id": "smart-seq-nanocage-cagescan::diagram:asset_e1ed09b7e9dcc56e58f8cf83", "locator": "Purify arrow from PCR product to terminal black line labelled DNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.86, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "smart-seq-nanocage-cagescan::card:smart-seq-nanocage-cagescan", "locator": "Smart-Seq description, post-PCR product", "basis": "text", "support": "reported", "quote": "Full-length cDNAs are PCR-amplified to obtain nanogram amounts of DNA. The PCR products are purified for sequencing.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:22820318", "locator": "Methods, Construction and sequencing of Smart-Seq sequencing libraries [b00033]", "basis": "text", "support": "reported", "quote": "Amplified cDNA (~5ng cDNA) was used to construct Illumina sequencing libraries using either Illumina’s “Ultra Low Input mRNA-Seq Guide” (the “PE” protocol) or a modification of Epicentre’s Nextera DNA sample preparation protocol (the “Tn5” protocol).", "bbox": null, "rationale": null}]}, {"target": "state_property:purified_cdna:library_interface", "verdict": "supported", "action": "accept", "rationale": "This locally defined interface separates amplified-cDNA substrate from the original paper’s subsequent PE or Tn5 sequencing-library construction. The source row ends at DNA without those downstream branches.", "evidence": [{"source_id": "smart-seq-nanocage-cagescan::diagram:asset_e1ed09b7e9dcc56e58f8cf83", "locator": "Purify arrow from PCR product to terminal black line labelled DNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.86, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "primary:paper:22820318", "locator": "Methods, Construction and sequencing of Smart-Seq sequencing libraries [b00033]", "basis": "text", "support": "reported", "quote": "Amplified cDNA (~5ng cDNA) was used to construct Illumina sequencing libraries using either Illumina’s “Ultra Low Input mRNA-Seq Guide” (the “PE” protocol) or a modification of Epicentre’s Nextera DNA sample preparation protocol (the “Tn5” protocol).", "bbox": null, "rationale": null}]}, {"target": "state_property:purified_cdna:representation", "verdict": "supported", "action": "accept", "rationale": "This locally defined material property describes information support after later sequencing, not data already obtained. Primary passages support transcript/5′ coverage, isoform/splicing and expressed-variant analyses with low-abundance dropout; catalogue prose supports poly(A)+ and strand/multiplexing limits. The qualifications avoid perfect full-length-recovery claims.", "evidence": [{"source_id": "primary:paper:22820318", "locator": "Results, Efficient and robust single-cell RNA-Sequencing using Smart-Seq [b00011]", "basis": "text", "support": "reported", "quote": "For Smart-Seq, first we lysed each cell in hypotonic solution and converted poly(A)+ RNA to full-length cDNA using oligo(dT) priming and SMART template switching technology, followed by 12‐18 cycles of PCR preamplification of cDNA.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:22820318", "locator": "Results, Smart-Seq improves coverage across transcripts [b00013]", "basis": "text", "support": "reported", "quote": "From only 10 pg input amounts (the estimated amount of RNA in a small eukaryotic cell, Supplementary Table 2) we achieved close to 40% coverage at the 5′ end.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:22820318", "locator": "Results, Quantitative assessment of single-cell transcriptomics [b00016]", "basis": "text", "support": "reported", "quote": "We conclude that transcript detection sensitivity is affected by limiting starting amounts of RNA that lead to random loss of low abundance transcripts, but still the majority of low abundance and the vast majority of highly expressed transcripts are reliably detected even in single cells.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:22820318", "locator": "Discussion [b00028]", "basis": "text", "support": "reported", "quote": "Importantly, Smart-Seq has significantly improved read coverage across transcripts, which enables detailed analyses of alternative splicing and identification of SNPs and mutations.", "bbox": null, "rationale": null}, {"source_id": "smart-seq-nanocage-cagescan::card:smart-seq-nanocage-cagescan", "locator": "Smart-Seq Cons", "basis": "text", "support": "reported", "quote": "Not strand-specific\nNo early multiplexing\nApplicable only to poly(A)+ RNA", "bbox": null, "rationale": null}]}, {"target": "state_property:rna_input:identity", "verdict": "supported", "action": "accept", "rationale": "Self identity describes total RNA or lysate supplying poly(A)+ templates, as in the original direct-priming methods; it does not imply separate poly(A) isolation.", "evidence": [{"source_id": "primary:paper:22820318", "locator": "Methods, Generation and amplification of Smart-Seq cDNA [b00031]", "basis": "text", "support": "reported", "quote": "Briefly, polyA+ RNA was reverse transcribed through tailed oligo-dT priming directly in total RNA or a whole cell lysate using Moloney Murine Leukemia Virus Reverse Transcriptase (MMLV RT).", "bbox": null, "rationale": null}, {"source_id": "smart-seq-nanocage-cagescan::diagram:asset_e1ed09b7e9dcc56e58f8cf83", "locator": "Left highlighted mRNA and adjacent A-tailed mRNA fragment; no intervening fragmentation arrow", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 0.25, 1.0], "rationale": null}]}, {"target": "state_property:rna_input:mrna_identity", "verdict": "supported", "action": "accept", "rationale": "The mrna component is polyadenylated RNA within the preparation; this identity is correctly scoped to that component rather than the entire lysate.", "evidence": [{"source_id": "primary:paper:22820318", "locator": "Methods, Generation and amplification of Smart-Seq cDNA [b00031]", "basis": "text", "support": "reported", "quote": "Briefly, polyA+ RNA was reverse transcribed through tailed oligo-dT priming directly in total RNA or a whole cell lysate using Moloney Murine Leukemia Virus Reverse Transcriptase (MMLV RT).", "bbox": null, "rationale": null}, {"source_id": "smart-seq-nanocage-cagescan::diagram:asset_e1ed09b7e9dcc56e58f8cf83", "locator": "Left highlighted mRNA and adjacent A-tailed mRNA fragment; no intervening fragmentation arrow", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 0.25, 1.0], "rationale": null}]}, {"target": "state_property:rna_input:poly_a", "verdict": "supported", "action": "accept", "rationale": "The segment belongs to the RNA component at its 3′ end, matching A-tailed RNA and oligo(dT) priming; it is not a final-library tail claim.", "evidence": [{"source_id": "smart-seq-nanocage-cagescan::diagram:asset_e1ed09b7e9dcc56e58f8cf83", "locator": "Left highlighted mRNA and adjacent A-tailed mRNA fragment; no intervening fragmentation arrow", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.0, 0.0, 0.25, 1.0], "rationale": null}, {"source_id": "smart-seq-nanocage-cagescan::diagram:asset_e1ed09b7e9dcc56e58f8cf83", "locator": "First strand synthesis with Moloney murine leukemia virus reverse transcriptase: RNA/cDNA pair, AAA/TTT, left CCC, right green Adaptor", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.27, 0.0, 0.45, 1.0], "rationale": null}, {"source_id": "primary:paper:22820318", "locator": "Methods, Generation and amplification of Smart-Seq cDNA [b00031]", "basis": "text", "support": "reported", "quote": "Briefly, polyA+ RNA was reverse transcribed through tailed oligo-dT priming directly in total RNA or a whole cell lysate using Moloney Murine Leukemia Virus Reverse Transcriptase (MMLV RT).", "bbox": null, "rationale": null}]}, {"target": "state_property:smart_oligo:identity", "verdict": "supported", "action": "accept", "rationale": "The whole oligo base-pairs with added cDNA nucleotides and supplies an extended template. The original full-text methods explicitly identify SMARTer II A and that role, supporting the corrected identity.", "evidence": [{"source_id": "primary:paper:22820318", "locator": "Methods, Generation and amplification of Smart-Seq cDNA [b00031]", "basis": "text", "support": "reported", "quote": "The carefully designed SMARTer II A oligo then base-pairs with these additional nucleotides, creating an extended template. The reverse transcriptase then switches templates and continues transcribing to the end of the oligonucleotide.", "bbox": null, "rationale": null}, {"source_id": "smart-seq-nanocage-cagescan::diagram:asset_e1ed09b7e9dcc56e58f8cf83", "locator": "Second strand synthesis: orange Adaptor, left CCC, paired blue/purple strands, right T tract and green handle", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.49, 0.0, 0.65, 1.0], "rationale": null}]}]}, "sources": {"smart-seq-nanocage-cagescan::card:smart-seq-nanocage-cagescan": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/smart-seq-nanocage-cagescan.html", "title": "Smart-Seq/NanoCAGE/CAGEscan", "text_characters": 3982, "text_sha256": "c6467f24931dcfce39e646c3a1488adf52b574ce9140e8b1984186653e1c147c"}, "smart-seq-nanocage-cagescan::collection:rna:page:97": {"kind": "text", "content_level": "catalogue", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102/sources_03/collection_pages/rna_097.txt", "sha256": "399dd6b0be93c560a113f2204e7e2ddb470df862a597bb95153c0e3fe3337ac9", "title": "Illumina RNA collection, PDF page 97", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/products/research_reviews/rna-sequenc on", "sha256": "6f5bf26d593bfc47e1ddba494f894889779151f74086550880174dd8edc4528d"}, {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/cf/cfbf7532c2436b13e6d4a5411e49b18fd828c351ac8da625e2a67ccb9fd5b89a.xml", "sha256": "cfbf7532c2436b13e6d4a5411e49b18fd828c351ac8da625e2a67ccb9fd5b89a"}], "association_status": "selected_primary_candidate; extraction reviewer must confirm method/version scope", "text_characters": 52474, "text_sha256": "6b41252e132eb83b48fd57de317dc1d4e2ad9ffc6fc8116b2358b924501e0c0a"}, "smart-seq-nanocage-cagescan::reference:pilot_selected_primary": {"kind": "text", "content_level": "metadata", "pmid": "22820318", "association_status": "unverified_selected_primary_candidate", "text_characters": 136, "text_sha256": "aea4e278f80ccf5bad96525464dd092d979774227a63d6f2d15834c11e8d718b"}}, "card": {"record_id": "smart_seq", "source_title": "Smart-seq", "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/smart-seq-nanocage-cagescan.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/smart-seq-nanocage-cagescan.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA Low-level Detection", "source_category_path": ["Transcriptome", "RNA Low-level Detection"], "description_verbatim": "Smart-Seq and Smart-Seq2: Switch Mechanism at the 5' End of RNA Templates Smart-Seq was developed as a single-cell sequencing protocol with improved read coverage across transcripts. Complete coverage across the genome allows the detection of alternative transcript isoforms and SNPs. There are 2 versions of Smart-Seq: Smart-Seq and Smart-seq2. Smart-seq2 includes several improvements over the original Smart-Seq protocol. The new protocol includes a locked nucleic acid (LNA), an increased MgCl2 concentration, betaine, and elimination of the purification step to improve the yield significantly.\nSmart-Seq: Cells are lysed, and the RNA is hybridized to an oligo(dT)-containing primer. The first strand of the cDNA is synthesized with the addition of a few untemplated C nucleotides. This poly(C) overhang is added exclusively to full-length transcripts. An oligonucleotide primer is hybridized to the poly(C) overhang and used to synthesize the second strand. Full-length cDNAs are PCR-amplified to obtain nanogram amounts of DNA. The PCR products are purified for sequencing.", "advantages_verbatim": ["mRNA sequence does not have to be known", "As little as 50 pg of starting material can be used", "Improved coverage across transcripts", "High level of mappable reads"], "limitations_verbatim": ["Not strand-specific", "No early multiplexing", "Applicable only to poly(A)+ RNA"], "source_sections": [{"source_locator": "jcr:content/par/text_2/text", "text": "Smart-Seq/NanoCAGE/CAGEscan"}, {"source_locator": "jcr:content/par/text/text", "text": ""}, {"source_locator": "jcr:content/par/text_0/text", "text": "Smart-Seq and Smart-Seq2: Switch Mechanism at the 5' End of RNA Templates Smart-Seq was developed as a single-cell sequencing protocol with improved read coverage across transcripts. Complete coverage across the genome allows the detection of alternative transcript isoforms and SNPs. There are 2 versions of Smart-Seq: Smart-Seq and Smart-seq2. Smart-seq2 includes several improvements over the original Smart-Seq protocol. The new protocol includes a locked nucleic acid (LNA), an increased MgCl2 concentration, betaine, and elimination of the purification step to improve the yield significantly.\nSmart-Seq: Cells are lysed, and the RNA is hybridized to an oligo(dT)-containing primer. The first strand of the cDNA is synthesized with the addition of a few untemplated C nucleotides. This poly(C) overhang is added exclusively to full-length transcripts. An oligonucleotide primer is hybridized to the poly(C) overhang and used to synthesize the second strand. Full-length cDNAs are PCR-amplified to obtain nanogram amounts of DNA. The PCR products are purified for sequencing.\nPros:\nmRNA sequence does not have to be known\nAs little as 50 pg of starting material can be used\nImproved coverage across transcripts\nHigh level of mappable reads\nCons:\nNot strand-specific\nNo early multiplexing\nApplicable only to poly(A)+ RNA"}, {"source_locator": "jcr:content/par/text_1/text", "text": "Smart-Seq: Ramskold D., Luo S., Wang Y. C., Li R., Deng Q., et al. (2012) Full-length mRNA-Seq from single-cell levels of RNA and individual circulating tumor cells. Nat Biotechnol 30: 777-782\nNanoCAGE/CAGEscan: Plessy C., Bertin N., Takahashi H., Simone R., Salimullah M., et al. (2010) Linking promoters to functional transcripts in small samples with nanoCAGE and CAGEscan. Nat Methods 7: 528-534"}, {"source_locator": "jcr:content/par/text_f2eb/text", "text": "Smart-Seq: Ramskold D., Luo S., Wang Y. C., et al. Full-length mRNA-Seq from single-cell levels of RNA and individual circulating tumor cells. Nat Biotechnol. 2012;30:777-782"}, {"source_locator": "jcr:content/par/text_3/text", "text": "Nextera XT DNA Library Prep kit\nTruSeq RNA Library Prep Kit\nTruSeq Small RNA Sample Prep Kit"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Agarwal S., Macfarlan T. S., Sartor M. A. and Iwase S. (2015) Sequencing of first-strand cDNA library reveals full-length transcriptomes. Nat Commun 6: 6002\nKim D. H., Marinov G. K., Pepke S., Singer Z. S., He P., et al. (2015) Single-cell transcriptome analysis reveals dynamic changes in lncRNA expression during reprogramming. Cell Stem Cell 16: 88-101\nTanaka Y., Hysolli E., Su J., Xiang Y., Kim K. Y., et al. (2015) Transcriptome Signature and Regulation in Human Somatic Cell Reprogramming. Stem Cell Reports 4: 1125-1   const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
