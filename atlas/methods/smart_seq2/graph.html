ed DNA inserts to the original poly(A) targets. Upstream RT and PCR support that origin; tagmentation explains why individual final fragments need not be full-length transcripts. It does not claim actual sequencing data exist.", "evidence": [{"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Left introductory mRNA/AAAAAAA icon and subsequent purple mRNA fragment/AAAAAA input; no intervening transformation arrow or fragmentation caption.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "First strand synthesis with Moloney murine leukemia virus reverse transcriptase: paired RNA/cDNA lines, AAAAAA/TTTTTT, right Adaptor arm and left CCC extension.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Tagmentation panel: two blue enzyme-like icons with coloured arms above double-stranded cDNA; route continues to the gap-repair/enrichment block.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::paper:24056875", "locator": "Abstract, introduction of Smart-seq2", "basis": "text", "support": "reported", "quote": "Here, we introduce Smart-seq2 with improved reverse transcription, template switching and preamplification to increase both yield and length of cDNA libraries generated from individual cells.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_rna:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity names poly(A) mRNA as the RT substrate and explicitly avoids asserting an isolated fraction; both the icon and single-cell primer description support this boundary.", "evidence": [{"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Left introductory mRNA/AAAAAAA icon and subsequent purple mRNA fragment/AAAAAA input; no intervening transformation arrow or fragmentation caption.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::card:smart-seq2", "locator": "Description, opening sentence", "basis": "text", "support": "reported", "quote": "For Smart-Seq2, single cells are lysed in a buffer that contains free dNTPs and oligo(dT)-tailed oligonucleotides with a universal 5'-anchor sequence.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_rna:poly_a", "verdict": "supported", "action": "accept", "rationale": "The AAAAAA tail is on the RNA, and its 3′ location is consistent with the oligo(dT)-primed interface. It is a sequence segment, not a chemical terminal-group assertion.", "evidence": [{"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Left introductory mRNA/AAAAAAA icon and subsequent purple mRNA fragment/AAAAAA input; no intervening transformation arrow or fragmentation caption.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "First strand synthesis with Moloney murine leukemia virus reverse transcriptase: paired RNA/cDNA lines, AAAAAA/TTTTTT, right Adaptor arm and left CCC extension.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::card:smart-seq2", "locator": "Description, opening sentence", "basis": "text", "support": "reported", "quote": "For Smart-Seq2, single cells are lysed in a buffer that contains free dNTPs and oligo(dT)-tailed oligonucleotides with a universal 5'-anchor sequence.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_rt_primer:anchor", "verdict": "supported", "action": "accept", "rationale": "The card explicitly places the universal anchor at the primer's 5′ end. Recording it as a sequence segment on the primer does not confuse it with a final sequencing index.", "evidence": [{"source_id": "smart-seq2::card:smart-seq2", "locator": "Description, opening sentence", "basis": "text", "support": "reported", "quote": "For Smart-Seq2, single cells are lysed in a buffer that contains free dNTPs and oligo(dT)-tailed oligonucleotides with a universal 5'-anchor sequence.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_rt_primer:dt_segment", "verdict": "supported", "action": "accept", "rationale": "The oligo(dT) tract belongs to self, the primer, and supports priming the RNA poly(A) tail; the A/T pairing is drawn at the RT interface.", "evidence": [{"source_id": "smart-seq2::card:smart-seq2", "locator": "Description, opening sentence", "basis": "text", "support": "reported", "quote": "For Smart-Seq2, single cells are lysed in a buffer that contains free dNTPs and oligo(dT)-tailed oligonucleotides with a universal 5'-anchor sequence.", "bbox": null, "rationale": null}, {"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "First strand synthesis with Moloney murine leukemia virus reverse transcriptase: paired RNA/cDNA lines, AAAAAA/TTTTTT, right Adaptor arm and left CCC extension.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}]}, {"target": "state_property:s_rt_primer:identity", "verdict": "supported", "action": "accept", "rationale": "The oligo itself is identified as the universal-anchor oligo(dT) primer described in the card and drawn as TTTTTT plus Adaptor.", "evidence": [{"source_id": "smart-seq2::card:smart-seq2", "locator": "Description, opening sentence", "basis": "text", "support": "reported", "quote": "For Smart-Seq2, single cells are lysed in a buffer that contains free dNTPs and oligo(dT)-tailed oligonucleotides with a universal 5'-anchor sequence.", "bbox": null, "rationale": null}, {"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "First strand synthesis with Moloney murine leukemia virus reverse transcriptase: paired RNA/cDNA lines, AAAAAA/TTTTTT, right Adaptor arm and left CCC extension.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}]}, {"target": "state_property:s_switched:cdna_identity", "verdict": "supported", "action": "accept", "rationale": "The cdna component is the extended first strand. The generic primary mechanism and row-local TSO pairing support this interpretation of cDNA synthesis without importing the neighboring row's second-strand caption.", "evidence": [{"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Arrow from the first-strand panel to cDNA synthesis: Template-switching oligo at left, GGG opposite CCC, and Locked nucleic acid (LNA) annotation above that end.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::paper:23180801", "locator": "Full text [b00004], template-switching mechanism", "basis": "text", "support": "reported", "quote": "Once hybridized, the RT then switches templates and starts polymerizing the oligonucleotide, thereby incorporating the oligonucleotide sequence with the cDNA sequence.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_switched:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity is a cDNA-containing reaction product after the depicted template-switching panel. It asserts no unshown separation, RNA degradation or duplex isolation.", "evidence": [{"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Arrow from the first-strand panel to cDNA synthesis: Template-switching oligo at left, GGG opposite CCC, and Locked nucleic acid (LNA) annotation above that end.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::paper:23180801", "locator": "Full text [b00004], template-switching mechanism", "basis": "text", "support": "reported", "quote": "Once hybridized, the RT then switches templates and starts polymerizing the oligonucleotide, thereby incorporating the oligonucleotide sequence with the cDNA sequence.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_switched:rt_derived_handle", "verdict": "supported", "action": "accept", "rationale": "The original primer-derived anchor/oligo(dT) region remains on cDNA at its 5′ region during extension of the opposite end. The RT-primer description and the successive panels support this retained segment.", "evidence": [{"source_id": "smart-seq2::card:smart-seq2", "locator": "Description, opening sentence", "basis": "text", "support": "reported", "quote": "For Smart-Seq2, single cells are lysed in a buffer that contains free dNTPs and oligo(dT)-tailed oligonucleotides with a universal 5'-anchor sequence.", "bbox": null, "rationale": null}, {"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "First strand synthesis with Moloney murine leukemia virus reverse transcriptase: paired RNA/cDNA lines, AAAAAA/TTTTTT, right Adaptor arm and left CCC extension.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Arrow from the first-strand panel to cDNA synthesis: Template-switching oligo at left, GGG opposite CCC, and Locked nucleic acid (LNA) annotation above that end.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}]}, {"target": "state_property:s_switched:tso_derived_handle", "verdict": "supported", "action": "accept", "rationale": "The copied sequence belongs to the cDNA component's extended 3′ region; the generic primary passage explicitly explains oligo-templated extension and incorporation of downstream priming sites. This is sequence copying, not ligation or inheritance of LNA chemistry.", "evidence": [{"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Arrow from the first-strand panel to cDNA synthesis: Template-switching oligo at left, GGG opposite CCC, and Locked nucleic acid (LNA) annotation above that end.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::paper:23180801", "locator": "Full text [b00004], template-switching mechanism", "basis": "text", "support": "reported", "quote": "Once hybridized, the RT then switches templates and starts polymerizing the oligonucleotide, thereby incorporating the oligonucleotide sequence with the cDNA sequence.", "bbox": null, "rationale": null}, {"source_id": "smart-seq2::paper:23180801", "locator": "Full text [b00005], downstream priming-site role", "basis": "text", "support": "reported", "quote": "The TS oligonucleotide used for the hybridization to the cytosine overhang is further used for incorporating priming sites for downstream steps in the respective protocols.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_tagmented:identity", "verdict": "supported", "action": "accept", "rationale": "The identity is the local action-level product of tagmentation: cDNA fragments carrying adapter tags, prior to the explicitly subsequent repair/enrichment block.", "evidence": [{"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Tagmentation panel: two blue enzyme-like icons with coloured arms above double-stranded cDNA; route continues to the gap-repair/enrichment block.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Right-hand arrow caption Gap repair, enrichment PCR and PCR purification, ending at Enrichment-ready fragment with Index 2/P5 on the left and Index 1/P7 on the right.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}]}, {"target": "state_property:s_tagmented:tag_segments", "verdict": "supported", "action": "accept", "rationale": "Adapter tags at fragment ends follow from the named tagmentation action and adapter-bearing icons. The assertion remains broad and does not specify an unshown exact junction or complete final index structure.", "evidence": [{"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Tagmentation panel: two blue enzyme-like icons with coloured arms above double-stranded cDNA; route continues to the gap-repair/enrichment block.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Right-hand arrow caption Gap repair, enrichment PCR and PCR purification, ending at Enrichment-ready fragment with Index 2/P5 on the left and Index 1/P7 on the right.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}]}, {"target": "state_property:s_tso:g_end", "verdict": "supported", "action": "accept", "rationale": "Two riboguanosines and the final modified guanosine are explicitly reported at the TSO 3′ end. The GGG/CCC pairing supports their local interface; no nucleotide composition is inferred solely from the margin structure.", "evidence": [{"source_id": "smart-seq2::card:smart-seq2", "locator": "Description, template-switching oligo sentence", "basis": "text", "support": "reported", "quote": "A template-switching oligo (TSO) is added, carrying 2 riboguanosines and a modified guanosine to produce a LNA as the last base at the 3′ end.", "bbox": null, "rationale": null}, {"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Arrow from the first-strand panel to cDNA synthesis: Template-switching oligo at left, GGG opposite CCC, and Locked nucleic acid (LNA) annotation above that end.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}]}, {"target": "state_property:s_tso:identity", "verdict": "supported", "action": "accept", "rationale": "The TSO identity is supported by the row-local oligo label and LNA annotation, independently clarified by the card. It is a reagent identity, not the identity of copied cDNA.", "evidence": [{"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Arrow from the first-strand panel to cDNA synthesis: Template-switching oligo at left, GGG opposite CCC, and Locked nucleic acid (LNA) annotation above that end.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}, {"source_id": "smart-seq2::card:smart-seq2", "locator": "Description, template-switching oligo sentence", "basis": "text", "support": "reported", "quote": "A template-switching oligo (TSO) is added, carrying 2 riboguanosines and a modified guanosine to produce a LNA as the last base at the 3′ end.", "bbox": null, "rationale": null}]}, {"target": "state_property:s_tso:lna", "verdict": "supported", "action": "accept", "rationale": "The modification is on the TSO's 3′-terminal guanosine residue, as reported by the card and annotated over the paired end. It does not assert a 3′ blocking group or LNA on the synthesized strand.", "evidence": [{"source_id": "smart-seq2::card:smart-seq2", "locator": "Description, template-switching oligo sentence", "basis": "text", "support": "reported", "quote": "A template-switching oligo (TSO) is added, carrying 2 riboguanosines and a modified guanosine to produce a LNA as the last base at the 3′ end.", "bbox": null, "rationale": null}, {"source_id": "smart-seq2::diagram:asset_da2a32ad3de235fb532f2451", "locator": "Arrow from the first-strand panel to cDNA synthesis: Template-switching oligo at left, GGG opposite CCC, and Locked nucleic acid (LNA) annotation above that end.", "basis": "image", "support": "depicted", "quote": null, "bbox": null, "rationale": null}]}]}, "sources": {"smart-seq2::card:smar 5'-anchor sequence. RT is performed, which adds 2–5 untemplated nucleotides to the cDNA 3′ end. A template-switching oligo (TSO) is added, carrying 2 riboguanosines and a modified guanosine to produce a LNA as the last base at the 3′ end. After the first-strand reaction, the cDNA is amplified using a limited number of cycles. Next, tagmentation is used to construct sequencing libraries quickly and efficiently from the amplified cDNA.", "advantages_verbatim": ["As little as 50 pg of starting material can be used", "mRNA sequence does not have to be known", "Improved coverage across transcripts", "High level of mappable reads"], "limitations_verbatim": ["Not strand-specific", "No early multiplexing1", "Transcript length bias, with inefficient transcription of reads over 4 Kb2", "Preferential amplification of high-abundance transcripts", "Purification step may lead to loss of material", "Could be subject to strand-invasion bias3"], "source_sections": [{"source_locator": "jcr:content/par/text_2/text", "text": "Smart-Seq2"}, {"source_locator": "jcr:content/par/text/text", "text": ""}, {"source_locator": "jcr:content/par/text_0/text", "text": "Method Category: Transcriptome > RNA Low-Level Detection\nDescription: For Smart-Seq2, single cells are lysed in a buffer that contains free dNTPs and oligo(dT)-tailed oligonucleotides with a universal 5'-anchor sequence. RT is performed, which adds 2–5 untemplated nucleotides to the cDNA 3′ end. A template-switching oligo (TSO) is added, carrying 2 riboguanosines and a modified guanosine to produce a LNA as the last base at the 3′ end. After the first-strand reaction, the cDNA is amplified using a limited number of cycles. Next, tagmentation is used to construct sequencing libraries quickly and efficiently from the amplified cDNA.\nPros:\nAs little as 50 pg of starting material can be used\nmRNA sequence does not have to be known\nImproved coverage across transcripts\nHigh level of mappable reads\nCons:\nNot strand-specific\nNo early multiplexing1\nTranscript length bias, with inefficient transcription of reads over 4 Kb2\nPreferential amplification of high-abundance transcripts\nPurification step may lead to loss of material\nCould be subject to strand-invasion bias3"}, {"source_locator": "jcr:content/par/text_1/text", "text": "Smart-Seq2: Picelli S., Bjorklund A. K., Faridani O. R., Sagasser S., Winberg G., et al. (2013) Smart-seq2 for sensitive full-length transcriptome profiling in single cells. Nat Methods 10: 1096-1098\nSmart-Seq2: Picelli S., Faridani O. R., Björklund Å. K., Winberg G., Sagasser S., et al. (2014) Full-length RNA-Seq from single cells using Smart-seq2. Nat. Protocols 9: 171-181\n1. Shapiro E., Biezuner T. and Linnarsson S. Single-cell sequencing-based technologies will revolutionize whole-organism science. Nat Rev Genet. 2013;14:618-630\n2. Bhargava V., Head S. R., Ordoukhanian P., Mercola M. and Subramaniam S. Technical variations in low-input RNA-seq methodologies. Sci Rep. 2014;4:3678\n3. Tang D. T., Plessy C., Salimullah M., et al. Suppression of artifacts and barcode bias in high-throughput transcriptome analyses utilizing template switching. Nucleic Acids Res. 2013;41:e44"}, {"source_locator": "jcr:content/par/text_3/text", "text": "Featured Products\nNextera XT DNA Library Prep kit\nRelated Content\nSingle-Cell RNA Sequencing\nLibrary Preparation"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Related Publications\nMacaulay I. C., Haerty W., Kumar P., Li Y. I., Hu T. X., et al. (2015) G&T-seq: parallel sequencing of single-cell genomes and transcriptomes. Nat Methods 12: 519-522\nMoignard V., Woodhouse S., Haghverdi L., Lilly A. J., Tanaka Y., et al. (2015) Decoding the regulatory network of early blood development from single-cell gene expression measurements. Nat Biotechnol 33: 269-276\nSwiech L., Heidenreich M., Banerjee A., Habib N., Li Y., et al. (2015) In vivo interrogation of gene function in the mammalian brain using CRISPR-Cas9. Nat Biotech const $ = id => document.getElementById(id);
const el = (tag, text, cls) => { const n = document.createElement(tag); if (text != null) n.textContent = text; if (cls) n.className = cls; return n; };
const labels = {supported:'Supported', research_needed:'Further research', failed:'Failed', integrity_error:'Rejected on revalidation'};
const batchLabel = b => ({initial_two:'Catalogue card', catalogue:'Catalogue card', posters:'Main poster row', footer_panels:'Footer / product / readout panel', scoped_method:'Scoped workflow'})[b] || b;
let inventory = [], selected = '', request = 0;
function link(text, url) { const a = el('a',text); if (/^https?:\/\//.test(url || '')) { a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; } return a; }
function section(parent, title) { const d = el('details',null,'section'); d.append(el('summary',title)); parent.append(d); return d; }
function raw(parent, title, value) { const d = section(parent,title); d.append(el('pre',JSON.stringify(value,null,2))); }
function fields(parent, rows) { const d = el('div',null,'fields'); for (const [name,value] of rows) { if (value == null || value === '' || (Array.isArray(value) && !value.length)) continue; d.append(el('b',name),el('span',Array.isArray(value) ? value.join('; ') : String(value))); } parent.append(d); }
function assertions(parent,title,items,record) {
  if(!items?.length)return;
  const box=section(parent,title);
  for(const item of items){
    fields(box,Object.entries(item).filter(([k])=>k!=='evidence').map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):v]));
    evidence(box,item.evidence,record);
  }
}
function evidence(parent, items, record) {
  for (const e of items || []) {
    const box = el('div',null,'evidence'), s = record.sources[e.source_id] || {};
    box.append(link(s.title || e.source_id,s.url),el('p',`${e.support} · ${s.content_level || e.basis} · ${e.locator}`,'muted'));
    if (e.quote) box.append(el('blockquote',e.quote));
    if (e.bbox) box.append(el('p','Image region [left, top, right, bottom]: '+e.bbox.join(', '),'muted'));
    if (e.rationale) box.append(el('p',e.rationale));
    parent.append(box);
  }
}
function filterRecords() {
  const q = $('search').value.toLowerCase(), status = $('status').value, batch = $('batch').value;

function inspect(parent, item, kind, record) {

  parent.replaceChildren(el('span',kind,'badge'),el('h3',item.label || item.id));

  const names = ids => (ids || []).map(id => (states.get(id)?.label || id)+' ['+id+']');

  const checks = record.review?.checks?.filter(x=>x.target===target || x.target===labelTarget) || [];

function drawGraph(parent, inspector, record) {
  const c = record.candidate, nodes = [...c.states.map(x=>({...x,type:'State'})),...c.operations.map(x=>({...x,type:'Operation'}))];

  const rank = new Map(nodes.map(x=>[x.id,0])), ready = nodes.filter(x=>incoming.get(x.id)===0).map(x=>x.id); let processed=0;
  while (ready.length) { const id = ready.shift(); processed++;for (const target of next.get(id)) { rank.set(target,Math.max(rank.get(target),rank.get(id)+1)); incoming.set(target,incoming.get(target)-1);if (!incoming.get(target)) ready.push(target); } }
  if (processed !== nodes.length) { parent.append(el('p','A cycle prevents a left-to-right layout. Use the exact Flow records below.','warning'));return; }
  const NS='http://www.w3.org/2000/svg', svg=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};
  const pos = new Map(), lanes = new Map();
  for (const n of nodes) { const col=rank.get(n.id),row=lanes.get(col)||0;lanes.set(col,row+1);pos.set(n.id,{x:25+col*224,y:25+row*112}); }
  const canvas=svg('svg',{width:Math.max(680,Math.max(...rank.values())*224+240),height:Math.max(150,Math.max(...lanes.values())*112+30),role:'img','aria-label':'Directed State and Operation workflow'});
  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }

function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;

  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
