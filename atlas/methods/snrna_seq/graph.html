"e56efa78b97603ca1af8c0087d362a3c2698adc0d686eb87e41d8df38c2fd7ae"}], "association_status": "selected_primary_candidate; extraction reviewer must confirm method/version scope", "text_characters": 63453, "text_sha256": "134dd08943013a2b554b1616e9ee9c8bf350aaea305110aeb5adbc7abafa2228"}, "snrna-seq::reference:pilot_selected_primary": {"kind": "text", "content_level": "metadata", "pmid": "27090946", "association_status": "unverified_selected_primary_candidate", "text_characters": 136, "text_sha256": "8e286c1c9fd34614d14fbc71ab3e07afdb456fb913c24262fb728bfdb2caa36d"}}, "card": {"record_id": "snrna_seq", "source_title": "snRNA-Seq", "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/snrna-seq.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/snrna-seq.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": null, "source_category_path": [], "description_verbatim": "snRNA-Seq uses a mild and quick nuclear dissociation protocol to isolate and sequence RNA within the nucleus. The method minimizes technical issues that can arise from common dissociation protocols, especially in studying immediate early gene (IEG) behavior.\nIn this method, the cell suspension is lysed gently and the nuclei are separated from cytoplasmic lysates by centrifugation. Single cells/nuclei are sorted into individual wells using FACS. Individual nuclei are amplified using a microfluidics-assisted machinery that performs cell capture and reaction chemistry. The nuclear RNA contents are processed into cDNA libraries using a Nextera XT DNA Library Prep Kit. Pools of 40 samples are collected and purified using magnetic beads. The cDNA library is ready for sequencing.", "advantages_verbatim": ["Rapid dissociation protocol prevents technical issues arising from protease digestion, heating, and spurious gene expression by cytoplasmic ribosomes", "Prevents dendritic loss that commonly occurs during protease dissociation step"], "limitations_verbatim": ["None reported yet"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "snRNA-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "snRNA-Seq uses a mild and quick nuclear dissociation protocol to isolate and sequence RNA within the nucleus. The method minimizes technical issues that can arise from common dissociation protocols, especially in studying immediate early gene (IEG) behavior.\nIn this method, the cell suspension is lysed gently and the nuclei are separated from cytoplasmic lysates by centrifugation. Single cells/nuclei are sorted into individual wells using FACS. Individual nuclei are amplified using a microfluidics-assisted machinery that performs cell capture and reaction chemistry. The nuclear RNA contents are processed into cDNA libraries using a Nextera XT DNA Library Prep Kit. Pools of 40 samples are collected and purified using magnetic beads. The cDNA library is ready for sequencing.\nSimilar methods: Div-Seq, Nuc-seq.\nPros:\nRapid dissociation protocol prevents technical issues arising from protease digestion, heating, and spurious gene expression by cytoplasmic ribosomes\nPrevents dendritic loss that commonly occurs during protease dissociation step\nCons:\nNone reported yet"}, {"source_locator": "jcr:content/par/text_2/text", "text": "snRNA-Seq: Lacar B., Linker S. B., Jaeger B. N., Krishnaswami S., Barron J., et al. (2016) Nuclear RNA-Seq of single neurons reveals molecular signatures of activation. Nat Commun 7: 11022"}, {"source_locator": "jcr:content/par/text_3/text", "text": "Nextera XT DNA Library Preparation Kit"}, {"source_locator": "jcr:content/par/text_4/text", "text": "Poulin J. F., Tasic   const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
