nce of that cDNA; the primary paper names the anchored primer and subsequent AnchorX-directed amplification."}, {"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: DNA amplification after second-strand synthesis", "basis": "text", "support": "reported", "quote": "Then the double-stranded cDNAs are evenly amplified by PCR using AnchorX-T15 and AnchorY-T24 primers.", "bbox": null, "rationale": null}]}, {"target": "state_property:s3:anchorY", "verdict": "supported", "action": "accept", "rationale": "AnchorY-derived sequence is introduced by the reported AnchorY-T24 second-strand primer. It belongs to cdna and supplies the second PCR interface, agreeing with s2→o3→s3 and the receiving o4.", "evidence": [{"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: second-strand synthesis", "basis": "text", "support": "reported", "quote": "Second-strand cDNAs are synthesized using poly(T) primers with a different anchor sequence (AnchorY-T24).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: DNA amplification after second-strand synthesis", "basis": "text", "support": "reported", "quote": "Then the double-stranded cDNAs are evenly amplified by PCR using AnchorX-T15 and AnchorY-T24 primers.", "bbox": null, "rationale": null}]}, {"target": "state_property:s3:ds_identity", "verdict": "supported", "action": "accept", "rationale": "Double-stranded cDNA bearing both amplification-anchor regions is the supported post-second-strand substrate for AnchorX/AnchorY PCR. The property identifies DNA products rather than source RNA and does not require perfectly blunt, fully paired anchor termini.", "evidence": [{"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: second-strand synthesis", "basis": "text", "support": "reported", "quote": "Second-strand cDNAs are synthesized using poly(T) primers with a different anchor sequence (AnchorY-T24).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: DNA amplification after second-strand synthesis", "basis": "text", "support": "reported", "quote": "Then the double-stranded cDNAs are evenly amplified by PCR using AnchorX-T15 and AnchorY-T24 primers.", "bbox": null, "rationale": null}]}, {"target": "state_property:s3:ds_strandedness", "verdict": "supported", "action": "accept", "rationale": "double_stranded belongs to cdna after second-strand synthesis and is explicitly used by the primary figure caption for the ensuing PCR substrate. It is not prematurely applied to s2.", "evidence": [{"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: second-strand synthesis", "basis": "text", "support": "reported", "quote": "Second-strand cDNAs are synthesized using poly(T) primers with a different anchor sequence (AnchorY-T24).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: DNA amplification after second-strand synthesis", "basis": "text", "support": "reported", "quote": "Then the double-stranded cDNAs are evenly amplified by PCR using AnchorX-T15 and AnchorY-T24 primers.", "bbox": null, "rationale": null}]}, {"target": "state_property:s3:identity", "verdict": "supported", "action": "accept", "rationale": "self identifies an anchored double-stranded cDNA preparation at the output of tailing/second-strand synthesis. Its material identity and history match o3 and the input expected by o4.", "evidence": [{"source_id": "primary:paper:26201400", "locator": "b00013, Results and discussion: first-strand cDNA tailing", "basis": "text", "support": "reported", "quote": "Then we added a poly(A) tail to the 3′ end of newly synthesized first-strand cDNA using terminal deoxynucleotidyl transferase (TdT) and dATP doped with 1 % ddATP.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: second-strand synthesis", "basis": "text", "support": "reported", "quote": "Second-strand cDNAs are synthesized using poly(T) primers with a different anchor sequence (AnchorY-T24).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: DNA amplification after second-strand synthesis", "basis": "text", "support": "reported", "quote": "Then the double-stranded cDNAs are evenly amplified by PCR using AnchorX-T15 and AnchorY-T24 primers.", "bbox": null, "rationale": null}]}, {"target": "state_property:s3:synthetic_tail", "verdict": "supported", "action": "accept", "rationale": "The artificial poly(A) tract is correctly assigned to cdna at the 3′ end of its first strand; second-strand poly(T) priming supplies its complementary tract. The property records the DNA amplification interface without attributing that tail to non-polyadenylated source RNA.", "evidence": [{"source_id": "primary:paper:26201400", "locator": "b00013, Results and discussion: first-strand cDNA tailing", "basis": "text", "support": "reported", "quote": "Then we added a poly(A) tail to the 3′ end of newly synthesized first-strand cDNA using terminal deoxynucleotidyl transferase (TdT) and dATP doped with 1 % ddATP.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: second-strand synthesis", "basis": "text", "support": "reported", "quote": "Second-strand cDNAs are synthesized using poly(T) primers with a different anchor sequence (AnchorY-T24).", "bbox": null, "rationale": null}]}, {"target": "state_property:s4:amine_ends", "verdict": "supported", "action": "accept", "rationale": "The terminal_group assertion addresses cdna five_prime ends. C6-amine modification is directly reported on both second-round PCR primers, and its presence on extended amplified strands is a sound, explicitly marked inference rather than a claim about native RNA ends.", "evidence": [{"source_id": "primary:paper:26201400", "locator": "b00044, Methods: Single cell cDNA amplification, second PCR round", "basis": "text", "support": "inferred", "quote": "These purified cDNAs were further amplified by another ten cycles of PCR using poly(T) primers with anchor sequences and C6-amine-blocked 5′ ends (NH2-AnchorX-T15 and NH2-AnchorY-T24).", "bbox": null, "rationale": "The second-round PCR primers are extended into the amplified DNA strands, so their 5′ C6-amine groups remain on the resulting strands. Purification alone supplies no evidence of their removal."}, {"source_id": "primary:paper:26201400", "locator": "b00013, Results and discussion: primer end modification and later library interface", "basis": "text", "support": "reported", "quote": "In the second round of PCR, we used 5′-amine-terminated primers to prevent the primers from ligating with Illumina library adaptors, further reducing the amplification bias while improving the sequencing quality.", "bbox": null, "rationale": null}]}, {"target": "state_property:s4:anchors", "verdict": "supported", "action": "accept", "rationale": "The amplified cDNA component retains anchor-derived terminal amplification regions from the reported AnchorX/AnchorY primers. The claim is limited to these regions and does not turn them into sequencing adapters.", "evidence": [{"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: DNA amplification after second-strand synthesis", "basis": "text", "support": "reported", "quote": "Then the double-stranded cDNAs are evenly amplified by PCR using AnchorX-T15 and AnchorY-T24 primers.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00044, Methods: Single cell cDNA amplification, second PCR round", "basis": "text", "support": "reported", "quote": "These purified cDNAs were further amplified by another ten cycles of PCR using poly(T) primers with anchor sequences and C6-amine-blocked 5′ ends (NH2-AnchorX-T15 and NH2-AnchorY-T24).", "bbox": null, "rationale": null}]}, {"target": "state_property:s4:ds_strandedness", "verdict": "supported", "action": "accept", "rationale": "The PCR product is double-stranded cDNA copied from the primary-described double-stranded anchored template. This property is on cdna and is consistent with the physical amplification output.", "evidence": [{"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: DNA amplification after second-strand synthesis", "basis": "text", "support": "reported", "quote": "Then the double-stranded cDNAs are evenly amplified by PCR using AnchorX-T15 and AnchorY-T24 primers.", "bbox": null, "rationale": null}, {"source_id": "super-seq::diagram:asset_94f49fd28e19d166631e62b3", "locator": "Right-middle: parallel arrows and PCR amplification caption, blue products with orange left and green right segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.63, 0.0, 0.835, 1.0], "rationale": null}]}, {"target": "state_property:s4:identity", "verdict": "supported", "action": "accept", "rationale": "The self property correctly names a PCR-amplified single-cell cDNA preparation at the output of o4. Both the depiction and original two-round amplification description support that identity.", "evidence": [{"source_id": "super-seq::diagram:asset_94f49fd28e19d166631e62b3", "locator": "Right-middle: parallel arrows and PCR amplification caption, blue products with orange left and green right segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.63, 0.0, 0.835, 1.0], "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: DNA amplification after second-strand synthesis", "basis": "text", "support": "reported", "quote": "Then the double-stranded cDNAs are evenly amplified by PCR using AnchorX-T15 and AnchorY-T24 primers.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00044, Methods: Single cell cDNA amplification, second PCR round", "basis": "text", "support": "reported", "quote": "These purified cDNAs were further amplified by another ten cycles of PCR using poly(T) primers with anchor sequences and C6-amine-blocked 5′ ends (NH2-AnchorX-T15 and NH2-AnchorY-T24).", "bbox": null, "rationale": null}]}, {"target": "state_property:s5:amine_ends", "verdict": "supported", "action": "accept", "rationale": "The five_prime C6-amine assertion remains on amplified cdna after purification. Primer incorporation supports the chemical feature; neither the drawing nor primary final purification reports a reaction removing it. This is supported retention, not transfer of an RNA feature to DNA.", "evidence": [{"source_id": "primary:paper:26201400", "locator": "b00044, Methods: Single cell cDNA amplification, second PCR round", "basis": "text", "support": "inferred", "quote": "These purified cDNAs were further amplified by another ten cycles of PCR using poly(T) primers with anchor sequences and C6-amine-blocked 5′ ends (NH2-AnchorX-T15 and NH2-AnchorY-T24).", "bbox": null, "rationale": "The second-round PCR primers are extended into the amplified DNA strands, so their 5′ C6-amine groups remain on the resulting strands. Purification alone supplies no evidence of their removal."}, {"source_id": "primary:paper:26201400", "locator": "b00044, Methods: Single cell cDNA amplification, endpoint", "basis": "text", "support": "reported", "quote": "After purification, the cDNAs were ready for sequencing library preparation.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00013, Results and discussion: primer end modification and later library interface", "basis": "text", "support": "reported", "quote": "In the second round of PCR, we used 5′-amine-terminated primers to prevent the primers from ligating with Illumina library adaptors, further reducing the amplification bias while improving the sequencing quality.", "bbox": null, "rationale": null}]}, {"target": "state_property:s5:anchors", "verdict": "supported", "action": "accept", "rationale": "AnchorX/AnchorY-derived regions remain part of amplified cDNA after purification. The final material remains the PCR product; subsequent fragmenting and adapter ligation for sequencing have not yet occurred at s5.", "evidence": [{"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: DNA amplification after second-strand synthesis", "basis": "text", "support": "reported", "quote": "Then the double-stranded cDNAs are evenly amplified by PCR using AnchorX-T15 and AnchorY-T24 primers.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00044, Methods: Single cell cDNA amplification, second PCR round", "basis": "text", "support": "reported", "quote": "These purified cDNAs were further amplified by another ten cycles of PCR using poly(T) primers with anchor sequences and C6-amine-blocked 5′ ends (NH2-AnchorX-T15 and NH2-AnchorY-T24).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00044, Methods: Single cell cDNA amplification, endpoint", "basis": "text", "support": "reported", "quote": "After purification, the cDNAs were ready for sequencing library preparation.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: endpoint followed by sequencing library preparation", "basis": "text", "support": "reported", "quote": "Finally the purified single cell cDNAs are used to prepare sequencing libraries following Illumina’s TruSeq DNA sample preparation protocols.", "bbox": null, "rationale": null}]}, {"target": "state_property:s5:ds_strandedness", "verdict": "supported", "action": "accept", "rationale": "The purified product is the amplified double-stranded cDNA preparation. The explicit dsDNA amplification substrate and subsequent cDNA purification support this property without reclassifying the endpoint as RNA or data.", "evidence": [{"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: DNA amplification after second-strand synthesis", "basis": "text", "support": "reported", "quote": "Then the double-stranded cDNAs are evenly amplified by PCR using AnchorX-T15 and AnchorY-T24 primers.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00044, Methods: Single cell cDNA amplification, endpoint", "basis": "text", "support": "reported", "quote": "After purification, the cDNAs were ready for sequencing library preparation.", "bbox": null, "rationale": null}]}, {"target": "state_property:s5:identity", "verdict": "supported", "action": "accept", "rationale": "self accurately identifies purified amplified single-cell cDNA, agreeing with material kind, o5 and correction c3. The primary endpoint sentence explicitly places sequencing library preparation afterward.", "evidence": [{"source_id": "super-seq::diagram:asset_94f49fd28e19d166631e62b3", "locator": "Right: Purification arrow followed by parallel blue lines labelled DNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.825, 0.0, 1.0, 1.0], "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00044, Methods: Single cell cDNA amplification, endpoint", "basis": "text", "support": "reported", "quote": "After purification, the cDNAs were ready for sequencing library preparation.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26201400", "locator": "b00013, Fig. 1a caption: endpoint followed by sequencing library preparation", "basis": "text", "support": "reported", "quote": "Finally the purified single cell cDNAs are used to prepare sequencing libraries following Illumina’s TruSeq DNA sample preparation protocols.", "bbox": null, "rationale": null}]}]}, "sources": {"super-seq::card:super-seq": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/super- cted_primary": {"kind": "text", "content_level": "metadata", "pmid": "26201400", "association_status": "unverified_selected_primary_candidate", "text_characters": 136, "text_sha256": "13520c707d4340aae5a786741adf273bc0ea19a6ff74ebff1be15e0ab27cc40e"}}, "card": {"record_id": "super_seq", "source_title": "SUPeR-Seq", "source_page_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/super-seq.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/super-seq.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA Low-level Detection", "source_category_path": ["Transcriptome", "RNA Low-level Detection"], "description_verbatim": "SinSUPeR-Seq sequences non-poly(A) and poly(A) RNAs from single cells. It is designed particularly for mapping circular RNA (circRNA) species.\nRNA samples from lysed single cells are annealed to random primers with universal anchor sequences (AnchorX-T15N6) and reverse-transcribed to generate the first strand of cDNA. Unreacted primers are digested, to avoid primer-dimers. Next, a poly(A) tract is added to the 3' end of the cDNA by introducing dATP and ddATP in a 100:1 ratio, respectively. A second set of random primers, also with a universal anchor sequence (AnchorY-T24), anneals to the newly synthesized poly(A) tract. A second cDNA strand is generated by RT, and the cDNA is purified by gel electrophoresis. The purified cDNA molecules are PCR-amplified using 5'-amine-terminated primers, prepared by the TruSeq DNA library preparation protocol, and sequenced. circRNAs are identified from the dataset by finding 2 exonic reads that are distal in the reference genome, but adjacent to each other in the dataset with 1 inverted, signifying the circularization of the RNA.", "advantages_verbatim": ["Identifies circRNAs from single cells", "Avoids 3' bias by using random primers with anchor sequences", "Able to identify novel circRNAs due to random primers"], "limitations_verbatim": ["Relies on dataset analysis to identify circRNAs"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "SUPeR-Seq"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_bfda/text", "text": "SinSUPeR-Seq sequences non-poly(A) and poly(A) RNAs from single cells. It is designed particularly for mapping circular RNA (circRNA) species.\nRNA samples from lysed single cells are annealed to random primers with universal anchor sequences (AnchorX-T15N6) and reverse-transcribed to generate the first strand of cDNA. Unreacted primers are digested, to avoid primer-dimers. Next, a poly(A) tract is added to the 3' end of the cDNA by introducing dATP and ddATP in a 100:1 ratio, respectively. A second set of random primers, also with a universal anchor sequence (AnchorY-T24), anneals to the newly synthesized poly(A) tract. A second cDNA strand is generated by RT, and the cDNA is purified by gel electrophoresis. The purified cDNA molecules are PCR-amplified using 5'-amine-terminated primers, prepared by the TruSeq DNA library preparation protocol, and sequenced. circRNAs are identified from the dataset by finding 2 exonic reads that are distal in the reference genome, but adjacent to each other in the dataset with 1 inverted, signifying the circularization of the RNA.\nPros:\nIdentifies circRNAs from single cells\nAvoids 3' bias by using random primers with anchor sequences\nAble to identify novel circRNAs due to random primers\nCons:\nRelies on dataset analysis to identify circRNAs"}, {"source_locator": "jcr:content/par/text_2/text", "text": "SUPeR-Seq: Fan X., Zhang X., Wu X., Guo H., Hu Y., et al. (2015) Single-cell RNA-seq transcriptome analysis of linear and circular RNAs in const $ = id => document.getElementById(id);

function drawGraph(parent, inspector, record) {

  const rank = new Map(nodes.map(x=>[x.id,0])), ready = nodes.filter(x=>incoming.get(x.id)===0).map(x=>x.id); let processed=0;
  while (ready.length) { const id = ready.shift(); processed++;for (const target of next.get(id)) { rank.set(target,Math.max(rank.get(target),rank.get(id)+1)); incoming.set(target,incoming.get(target)-1);if (!incoming.get(target)) ready.push(target); } }

  const NS='http://www.w3.org/2000/svg', svg=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};

  for (const n of nodes) { const col=rank.get(n.id),row=lanes.get(col)||0;lanes.set(col,row+1);pos.set(n.id,{x:25+col*224,y:25+row*112}); }
  const canvas=svg('svg',{width:Math.max(680,Math.max(...rank.values())*224+240),height:Math.max(150,Math.max(...lanes.values())*112+30),role:'img','aria-label':'Directed State and Operation workflow'});
  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
