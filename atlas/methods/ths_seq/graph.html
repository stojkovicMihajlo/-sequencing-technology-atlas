d round of transposition to tag 3’-ends of double-stranded cDNA.", "bbox": null, "rationale": null}, {"source_id": "ths-seq::diagram:asset_c6bd448b659c99fbaa6aebeb", "locator": "dsDNA synthesis: arrow from purple strokes to parallel blue strokes with red segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.76, 0.2, 0.87, 1.0], "rationale": null}]}, {"target": "state_property:ivt_rna:identity", "verdict": "supported", "action": "accept", "rationale": "self is amplified RNA produced from transposon-tagged genomic DNA, as explicitly resolved by the primary. RNA purification before cDNA processing is also reported. This is a reporter copied from DNA, not an endogenous RNA measurement.", "evidence": [{"source_id": "primary:paper:26846207", "locator": "[b00010], insertion-end amplification and RNA conversion", "basis": "text", "support": "reported", "quote": "The end sequences of the insertion sites were then linearly amplified with in vitro transcription by roughly 1,000-fold, regardless of the distance between two adjacent Tn5 insertion sites, and the resulting RNA molecules were then converted into sequencing libraries efficiently through seven enzymatic reactions (single-stranded cDNA synthesis, RNase H digestion, double-stranded cDNA synthesis, transposition, protease digestion, end fill-in, and PCR amplification) (Fig. 1).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00034], IVT product purification", "basis": "text", "support": "reported", "quote": "After in vitro transcription, RNA was purified with Zymo RNA Clean and Concentrator and eluted with 10 μL nuclease-free water.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], RNA-to-cDNA conversion before second transposition", "basis": "text", "support": "reported", "quote": "The resulting RNA molecules (Additional file 1: Figure S3a-d) were converted to double-stranded cDNA, followed by a second round of transposition to tag 3’-ends of double-stranded cDNA.", "bbox": null, "rationale": null}]}, {"target": "state_property:library:adaptors", "verdict": "supported", "action": "accept", "rationale": "Illumina sequencing-adaptor segments on final library DNA are directly supported by the final caption and primary PCR statement; no unshown sequence or terminal chemistry is added.", "evidence": [{"source_id": "ths-seq::diagram:asset_c6bd448b659c99fbaa6aebeb", "locator": "Add barcodes and sequencing adaptors: final arrow and blue parallel strokes with retained red segment and new terminal colors", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.86, 0.2, 1.0, 1.0], "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], protease release and library PCR", "basis": "text", "support": "reported", "quote": "Transposase was digested by protease to release DNA fragments and then to generate sequencing libraries, PCR amplification was performed that added sequence containing Illumina adaptors and a sample barcode (Additional file 1: Figure S4a-d).", "bbox": null, "rationale": null}]}, {"target": "state_property:library:duplex", "verdict": "supported", "action": "accept", "rationale": "The final parallel blue strands and DNA amplification support double-stranded library material; this property is not transferred backward to IVT RNA.", "evidence": [{"source_id": "ths-seq::diagram:asset_c6bd448b659c99fbaa6aebeb", "locator": "Add barcodes and sequencing adaptors: final arrow and blue parallel strokes with retained red segment and new terminal colors", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.86, 0.2, 1.0, 1.0], "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], protease release and library PCR", "basis": "text", "support": "reported", "quote": "Transposase was digested by protease to release DNA fragments and then to generate sequencing libraries, PCR amplification was performed that added sequence containing Illumina adaptors and a sample barcode (Additional file 1: Figure S4a-d).", "bbox": null, "rationale": null}]}, {"target": "state_property:library:identity", "verdict": "supported", "action": "accept", "rationale": "The final preparation is a DNA sequencing library from cDNA copied from genomic insertion-end RNA. The material identity is distinct from the accessibility target and from subsequently generated data.", "evidence": [{"source_id": "primary:paper:26846207", "locator": "[b00010], insertion-end amplification and RNA conversion", "basis": "text", "support": "reported", "quote": "The end sequences of the insertion sites were then linearly amplified with in vitro transcription by roughly 1,000-fold, regardless of the distance between two adjacent Tn5 insertion sites, and the resulting RNA molecules were then converted into sequencing libraries efficiently through seven enzymatic reactions (single-stranded cDNA synthesis, RNase H digestion, double-stranded cDNA synthesis, transposition, protease digestion, end fill-in, and PCR amplification) (Fig. 1).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], RNA-to-cDNA conversion before second transposition", "basis": "text", "support": "reported", "quote": "The resulting RNA molecules (Additional file 1: Figure S3a-d) were converted to double-stranded cDNA, followed by a second round of transposition to tag 3’-ends of double-stranded cDNA.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], protease release and library PCR", "basis": "text", "support": "reported", "quote": "Transposase was digested by protease to release DNA fragments and then to generate sequencing libraries, PCR amplification was performed that added sequence containing Illumina adaptors and a sample barcode (Additional file 1: Figure S4a-d).", "bbox": null, "rationale": null}, {"source_id": "ths-seq::diagram:asset_c6bd448b659c99fbaa6aebeb", "locator": "Add barcodes and sequencing adaptors: final arrow and blue parallel strokes with retained red segment and new terminal colors", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.86, 0.2, 1.0, 1.0], "rationale": null}]}, {"target": "state_property:library:sample_index", "verdict": "supported", "action": "accept", "rationale": "The index is a sample-specific DNA sequence in the library. The reported THS-seq readout uses a single 6-base index, explicitly distinct from the ATAC-seq indexing in the same source passage.", "evidence": [{"source_id": "primary:paper:26846207", "locator": "[b00010], protease release and library PCR", "basis": "text", "support": "reported", "quote": "Transposase was digested by protease to release DNA fragments and then to generate sequencing libraries, PCR amplification was performed that added sequence containing Illumina adaptors and a sample barcode (Additional file 1: Figure S4a-d).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], sample barcode assignment", "basis": "text", "support": "reported", "quote": "Multiple samples were tagged with sample-specific DNA barcodes, pooled, and size selected for Illumina sequencing.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00038], THS-seq sequencing format versus ATAC-seq", "basis": "text", "support": "reported", "quote": "Sequencing was performed on HiSeq with 50 × 6 single end reads with single 6 base pair indexing for THS-seq data, and 50 × 8 × 8 single end reads with dual 8 base pair indexing for ATAC-seq data.", "bbox": null, "rationale": null}]}, {"target": "state_property:library:sample_link", "verdict": "supported", "action": "accept", "rationale": "This attribution identifies sample as the linked unit and the DNA sample barcode as the actual carrier. Primary text explicitly describes sample-specific barcodes; there is no cell-level or unique-molecule claim.", "evidence": [{"source_id": "primary:paper:26846207", "locator": "[b00010], protease release and library PCR", "basis": "text", "support": "reported", "quote": "Transposase was digested by protease to release DNA fragments and then to generate sequencing libraries, PCR amplification was performed that added sequence containing Illumina adaptors and a sample barcode (Additional file 1: Figure S4a-d).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], sample barcode assignment", "basis": "text", "support": "reported", "quote": "Multiple samples were tagged with sample-specific DNA barcodes, pooled, and size selected for Illumina sequencing.", "bbox": null, "rationale": null}]}, {"target": "state_property:library:target_link", "verdict": "supported", "action": "accept", "rationale": "The attribution carrier is insertion-adjacent genomic sequence represented through RNA/cDNA, not chromatin physically present in final library DNA. The unique-insertion interpretation is appropriately qualified by alignment and clonal removal and reported as the design interpretation.", "evidence": [{"source_id": "primary:paper:26846207", "locator": "[b00010], insertion-end amplification and RNA conversion", "basis": "text", "support": "reported", "quote": "The end sequences of the insertion sites were then linearly amplified with in vitro transcription by roughly 1,000-fold, regardless of the distance between two adjacent Tn5 insertion sites, and the resulting RNA molecules were then converted into sequencing libraries efficiently through seven enzymatic reactions (single-stranded cDNA synthesis, RNase H digestion, double-stranded cDNA synthesis, transposition, protease digestion, end fill-in, and PCR amplification) (Fig. 1).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], RNA-to-cDNA conversion before second transposition", "basis": "text", "support": "reported", "quote": "The resulting RNA molecules (Additional file 1: Figure S3a-d) were converted to double-stranded cDNA, followed by a second round of transposition to tag 3’-ends of double-stranded cDNA.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00012], validation after alignment and clonal removal", "basis": "text", "support": "reported", "quote": "After sequence alignment and clonal read removal, we obtained roughly 11 million uniquely mapped reads for each library. Each THS-seq unique read by design represents a unique transposon insertion event on a single chromosomal molecule.", "bbox": null, "rationale": null}]}, {"target": "state_property:purified_dna:end_segments", "verdict": "supported", "action": "accept", "rationale": "The recovered DNA retains the custom transposon sequences that supply the downstream T7 transcription interface. The primary joins transposon tagging, protein removal and T7 transcription without indicating loss of those DNA segments.", "evidence": [{"source_id": "primary:paper:26846207", "locator": "[b00010], custom transposon design", "basis": "text", "support": "reported", "quote": "To this end we designed a custom transposon that, in addition to the mosaic end sequences for transposase binding, includes a T7 promoter sequence for in vitro transcription, and an adaptor sequence compatible with constructing Illumina sequencing libraries (Additional file 1: Figure S1).", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], THS-seq design", "basis": "text", "support": "reported", "quote": "We therefore developed the THS-seq method, which uses a customized Tn5 transposome system to attach a T7 promoter [22–25] to the end of every DNA molecule after in vitro transposition.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], protein removal, fill-in and IVT order", "basis": "text", "support": "reported", "quote": "Next, all proteins were removed by treatment with guanidine hydrochloride, followed by end fill-in and linear in vitro transcription amplification by T7 RNA polymerase, which in theory has a lower bias compared with exponential PCR amplification.", "bbox": null, "rationale": null}]}, {"target": "state_property:purified_dna:identity", "verdict": "supported", "action": "accept", "rationale": "self is the tagged DNA recovered after chromatin-associated protein and transposase removal; the primary places this preparation before fill-in and IVT. Protein-depleted is supported at this boundary.", "evidence": [{"source_id": "ths-seq::diagram:asset_c6bd448b659c99fbaa6aebeb", "locator": "Purify arrow leaving the transposed chromatin and leading toward isolated products under End fill-in and IVT amplification", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.61, 0.2, 0.77, 1.0], "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], protein removal, fill-in and IVT order", "basis": "text", "support": "reported", "quote": "Next, all proteins were removed by treatment with guanidine hydrochloride, followed by end fill-in and linear in vitro transcription amplification by T7 RNA polymerase, which in theory has a lower bias compared with exponential PCR amplification.", "bbox": null, "rationale": null}]}, {"target": "state_property:tagged_chromatin:end_segments", "verdict": "supported", "action": "accept", "rationale": "The red/green segments at cut DNA ends are identified by the diagram labels and primary custom-transposon design as read-primer/adaptor and T7 promoter sequence. Placement on the tagged DNA-containing preparation is supported; no unsupported phosphate/hydroxyl chemistry is asserted.", "evidence": [{"source_id": "ths-seq::diagram:asset_c6bd448b659c99fbaa6aebeb", "locator": "Tn5 Transposome icon, Read primer and T7 promoter labels, and rightward arrow toward chromatin insertion", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.35, 0.0, 0.45, 1.0], "rationale": null}, {"source_id": "ths-seq::diagram:asset_c6bd448b659c99fbaa6aebeb", "locator": "Insert in regions of open chromatin: nucleosome-bearing DNA with broken accessible segment and red/green end segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.44, 0.0, 0.64, 1.0], "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], custom transposon design", "basis": "text", "support": "reported", "quote": "To this end we designed a custom transposon that, in addition to the mosaic end sequences for transposase binding, includes a T7 promoter sequence for in vitro transcription, and an adaptor sequence compatible with constructing Illumina sequencing libraries (Additional file 1: Figure S1).", "bbox": null, "rationale": null}]}, {"target": "state_property:tagged_chromatin:identity", "verdict": "supported", "action": "accept", "rationale": "self is the whole transposed chromatin preparation, still containing chromatin and new tagged genomic ends. This matches the insertion product and material entering purification.", "evidence": [{"source_id": "ths-seq::diagram:asset_c6bd448b659c99fbaa6aebeb", "locator": "Insert in regions of open chromatin: nucleosome-bearing DNA with broken accessible segment and red/green end segments", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.44, 0.0, 0.64, 1.0], "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], THS-seq design", "basis": "text", "support": "reported", "quote": "We therefore developed the THS-seq method, which uses a customized Tn5 transposome system to attach a T7 promoter [22–25] to the end of every DNA molecule after in vitro transposition.", "bbox": null, "rationale": null}]}, {"target": "state_property:transposome:cargo_binding", "verdict": "supported", "action": "accept", "rationale": "The association is placed on transposon with exact local partner enzyme. The primary expressly describes one Tn5 molecule bound to one transposon; bound_to does not assert a covalent linkage.", "evidence": [{"source_id": "primary:paper:26846207", "locator": "[b00010], transposome complex and orientation", "basis": "text", "support": "reported", "quote": "Additionally, to address the efficiency loss from incorrect adaptor orientations that is seen with PCR-based methods, the transposome complex dimer that consists of two Tn5 molecules and two transposons, where one Tn5 molecule is bound to one transposon, was designed and generated so that every single insertion yields usable ends regardless of the orientation of the transposon after insertion.", "bbox": null, "rationale": null}]}, {"target": "state_property:transposome:enzyme_identity", "verdict": "supported", "action": "accept", "rationale": "enzyme is the declared enzyme component. Engineered Tn5059 is supported for initial THS-seq tagging, and is not assigned to the later EzTn5 cDNA operation.", "evidence": [{"source_id": "primary:paper:26846207", "locator": "[b00010], engineered initial transposase", "basis": "text", "support": "reported", "quote": "Finally, we replaced the standard EzTn5 transposase with a novel Tn5 super-mutant (Tn5059), which resulted from a semi-rational design and has a higher activity and less sequence-specific bias than EzTn5 on purified DNA.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00036], actual cDNA tagmentation", "basis": "text", "support": "reported", "quote": "Fragmentation and 3’ end tagging of double-stranded cDNA was simultaneously performed by adding 1 μL tagmentation buffer, and 1 μL loaded custom 0.1 μM final in reaction EzTn5 transposomes (ME_BOT, ME_TOP (Additional file 1: Table S5)) to the solution and then incubating at 55 °C for 6 min, followed by cooling on ice.", "bbox": null, "rationale": null}]}, {"target": "state_property:transposome:identity", "verdict": "supported", "action": "accept", "rationale": "The whole complex is correctly identified as a dimeric loaded Tn5 transposome; the scoped initial Tn5059 specificity is supplied by primary text, not inferred from the generic icon.", "evidence": [{"source_id": "ths-seq::diagram:asset_c6bd448b659c99fbaa6aebeb", "locator": "Tn5 Transposome icon, Read primer and T7 promoter labels, and rightward arrow toward chromatin insertion", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.35, 0.0, 0.45, 1.0], "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], transposome complex and orientation", "basis": "text", "support": "reported", "quote": "Additionally, to address the efficiency loss from incorrect adaptor orientations that is seen with PCR-based methods, the transposome complex dimer that consists of two Tn5 molecules and two transposons, where one Tn5 molecule is bound to one transposon, was designed and generated so that every single insertion yields usable ends regardless of the orientation of the transposon after insertion.", "bbox": null, "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], engineered initial transposase", "basis": "text", "support": "reported", "quote": "Finally, we replaced the standard EzTn5 transposase with a novel Tn5 super-mutant (Tn5059), which resulted from a semi-rational design and has a higher activity and less sequence-specific bias than EzTn5 on purified DNA.", "bbox": null, "rationale": null}]}, {"target": "state_property:transposome:transposon_segments", "verdict": "supported", "action": "accept", "rationale": "transposon is the cargo DNA component. Mosaic end, T7 promoter and Illumina-compatible primer/adaptor sequences are explicitly supported; a sequence_segment property is appropriate and does not invent chemical terminal groups.", "evidence": [{"source_id": "ths-seq::diagram:asset_c6bd448b659c99fbaa6aebeb", "locator": "Tn5 Transposome icon, Read primer and T7 promoter labels, and rightward arrow toward chromatin insertion", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.35, 0.0, 0.45, 1.0], "rationale": null}, {"source_id": "primary:paper:26846207", "locator": "[b00010], custom transposon design", "basis": "text", "support": "reported", "quote": "To this end we designed a custom transposon that, in addition to the mosaic end sequences for transposase binding, includes a T7 promoter sequence for in vitro transcription, and an adaptor sequence compatible with constructing Illumina sequencing libraries (Additional file 1: Figure S1).", "bbox": null, "rationale": null}]}]}, "sources": {"ths-seq::card:ths-seq": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/ths-seq.html", "title": "THS-Seq", "text_characters": 1171, "text_sha256": "1245f4dff6bdee8b264febd73c4a59d726fb122e0931fa66708421c3c9b0d85c"}, "ths-seq::diagram:asset_c6bd448b659c99fbaa6aebeb": {"kind": "image", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/36/3667554c66d239ddb2b899e0a0712af2cfad8caab01a99b45fb3237a678ecc0b.png", "sha256": "3667554c66d239ddb2b899e0a0712af2cfad8caab01a99b45fb3237a678ecc0b", "url": "https://www.illumina.com/content/dam/illumina-marketing/images/tools/sequencing/ths-seq.png", "content_level": "diagram", "original": {"asset_id": "asset_c6bd448b659c99fbaa6aebeb", "url": "https://www.illumina.com/content/dam/illumina-marketing/images/tools/sequencing/ths-seq.png", "kind": "method_diagram", "source_id": "diagram:asset_c6bd448b659c99fbaa6aebeb", "card_ids": ["ths-seq"], "source_urls": ["https://www.illumina.com/content/dam/illumina-marketing/images/tools/sequencing/ths-seq.png"], "request_url": "https://www.illumina.com/content/dam/illumina-marketing/images/tools/sequencing/ths-seq.png", "http_status": 200, "final_url": "https://www.illumina.com/content/dam/illumina-marketing/images/tools/sequencing/th     const nodes = [...c.states,...c.operations], name = id => nodes.find(n => n.id === id)?.label || id;
    fields(parent,[['Type',item.kind],['From',name(item.source)+' ['+item.source+']'],['To',name(item.target)+' ['+item.target+']']]);
  }
  fields(parent,[['Local ID',item.id]]);
  const target = kind.toLowerCase()+':'+item.id;
  const affected = c.corrections.filter(x=>x.target_id===target), unknowns = c.unknowns.filter(x=>x.affected_ids.includes(target));
  for (const x of affected) parent.append(el('p','Correction: '+x.primary_statement,'warning'));
  for (const x of unknowns) parent.append(el('p','Unknown: '+x.question,'warning'));
  parent.append(el('h3','Evidence for this record')); evidence(parent,item.evidence,record);
  const labelTarget = kind.toLowerCase()+'_label:'+item.id;
  const checks = record.review?.checks?.filter(x=>x.target===target || x.target===labelTarget) || [];
  if (kind !== 'Flow' && !checks.some(x=>x.target===labelTarget)) parent.append(el('p','This archived review did not separately assess the label. Corrections and features remain part of its interpretation.','muted'));
  if (checks.length) raw(parent,'Recorded review of this target',checks);
  raw(parent,'Exact JSON record',item);
}
function drawGraph(parent, inspector, record) {
  const c = record.candidate, nodes = [...c.states.map(x=>({...x,type:'State'})),...c.operations.map(x=>({...x,type:'Operation'}))];
  const ids = new Set(nodes.map(x=>x.id)), incoming = new Map(nodes.map(x=>[x.id,0])), next = new Map(nodes.map(x=>[x.id,[]]));
  for (const f of c.flows) { if (!ids.has(f.source)||!ids.has(f.target)) { parent.append(el('p','Cannot draw: a Flow endpoint is missing. Inspect the raw record.','warning')); return; } incoming.set(f.target,incoming.get(f.target)+1);next.get(f.source).push(f.target); }
  const rank = new Map(nodes.map(x=>[x.id,0])), ready = nodes.filter(x=>incoming.get(x.id)===0).map(x=>x.id); let processed=0;
  while (ready.length) { const id = ready.shift(); processed++;for (const target of next.get(id)) { rank.set(target,Math.max(rank.get(target),rank.get(id)+1)); incoming.set(target,incoming.get(target)-1);if (!incoming.get(target)) ready.push(target); } }
  if (processed !== nodes.length) { parent.append(el('p','A cycle prevents a left-to-right layout. Use the exact Flow records below.','warning'));return; }
  const NS='http://www.w3.org/2000/svg', svg=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};
  const pos = new Map(), lanes = new Map();
  for (const n of nodes) { const col=rank.get(n.id),row=lanes.get(col)||0;lanes.set(col,row+1);pos.set(n.id,{x:25+col*224,y:25+row*112}); }
  const canvas=svg('svg',{width:Math.max(680,Math.max(...rank.values())*224+240),height:Math.max(150,Math.max(...lanes.values())*112+30),role:'img','aria-label':'Directed State and Operation workflow'});
  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
