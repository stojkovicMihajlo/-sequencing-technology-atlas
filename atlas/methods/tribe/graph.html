ure ends at cDNA and does not show a separate sequencing-data boundary.", "inputs": ["edited_cellular_rna"], "outputs": ["cdna_library"], "mechanism": "RNA is recovered and reverse-transcribed for cDNA library preparation. The RNA A-to-I event is represented as an A-to-G sequence difference in transcript orientation. The diagram does not specify first-strand polarity or internal library-preparation steps; the primary paper uses different preparations for S2 cells and manually sorted neurons.", "information_effect": "Subsequent RNA sequencing can identify source transcripts with novel editing marks. Genomic sequence and non-TRIBE controls distinguish genomic variation and endogenous RNA editing from introduced marks. The panel supports an RNA-derived cDNA carrier, not an RBP-containing sequencing library, exact contact mapping, or exhaustive detection of all targets.", "evidence": [{"source_id": "tribe::diagram:asset_5a95731ef4c3e1b7562777fc", "locator": "Rightmost grey arrow: RNA Binding site marked by I -> cDNA. Binding site marked by G", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.768, 0.05, 1.0, 0.94], "rationale": null}, {"source_id": "poster_ebaf15ad888b27bfff1223f2::diagram:poster_crop_460bc1e39a47efa33b4b646d", "locator": "TRIBE-labelled horizontal row only (between RBNS above and HITS-RAP below): RBP, endogenous ADAR, fusion, RNA, cell-specific expression, I-marked RNA, G-marked cDNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.014, 0.45, 0.895, 0.7], "rationale": null}, {"source_id": "tribe::card:tribe", "locator": "Method description, RNA recovery / reverse transcription / cDNA library paragraph", "basis": "text", "support": "reported", "quote": "mRNAs are reverse-transcribed using poly(dT)-T7 primers and random-T7 primers to reduce 3' bias. The nascent cDNA strands are input into the TruSeq RNA Library Prep Kit to generate the cDNA library for sequencing.", "bbox": null, "rationale": null}, {"source_id": "tri  Molecular biology", "basis": "text", "support": "reported", "quote": "Fluorescently labelled neurons were isolated from dissected, triturated fly brains by manual sorting using a glass micro-pipette, as described in Abruzzi et al. (2015). RNA sequencing libraries from S2 cells were constructed using the standard Illumina Truseq kit protocol. RNA-sequencing libraries from manually sorted neurons were made as described in Abruzzi et al. (2015).", "bbox": null, "rationale": null}, {"source_id": "tribe::reference:pilot_selected_primary", "locator": "Pilot-selected association lead, resolved here with paper identity and full-text content", "basis": "text", "support": "reported", "quote": "Pilot-selected primary candidate PMID 27040499 for TRIBE. This selection is not scientific evidence of method identity or mechanism.", "bbox": null, "rationale": null}]}], "corrections": [{"id": "fusion_expression_interface", "target_id": "operation:create_fusion", "diagram_observation": "The Create TRIBE fusion protein block shows joined RBP and ADAR catalytic-domain protein cartoons; DNA construction is not drawn. The subsequent block is labelled Cell-specific expression of fusion protein.", "primary_statement": "The primary implementation constructs an RBP-ADARcd transgene and uses cell-type-specific expression to produce the fusion protein. The engineering/expression material interface is represented here as an encoding construct; the expressed protein appears in the next RNA–fusion complex State. This clarifies the cartoon rather than treating isolated protein domains as cloning reactants.", "disposition": "use_primary", "evidence": [{"source_id": "tribe::diagram:asset_5a95731ef4c3e1b7562777fc", "locator": "Left domain cartoons and central block: RNA-binding protein; Drosophila endogenous ADAR (dsRNA-binding domain and catalytic domain, A-to-I inset); Create TRIBE fusion protein (RBP plus catalytic domain)", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.12, 0. :diagram:asset_5a95731ef4c3e1b7562777fc", "locator": "Cell-specific expression of fusion protein -> Binding site marked by I; an internal A is replaced by I", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.622, 0.03, 0.862, 0.95], "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00011] Results, fusion architecture and in vivo editing", "basis": "text", "support": "reported", "quote": "Because the double stranded RNA-binding (dsRBD) regions of ADAR are missing from the fusion protein, its editing specificity is determined by the RNA recognition features of the RBP; target transcripts are edited in vivo and then identified by RNA sequencing (Figure 1).", "bbox": null, "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00009] Introduction, permanent editing mark and RNA recovery", "basis": "text", "support": "reported", "quote": "Importantly, the editing event is irreversible, marking the target RNA permanently after the interaction. No biochemistry is required, RNA is simply extracted from cells of interest and sequenced. Novel editing events define RNA targets, namely, transcripts that interacted with the fusion protein.", "bbox": null, "rationale": null}]}, {"target": "state_property:edited_cellular_rna:editing_mark", "verdict": "supported", "action": "accept", "rationale": "The modification is correctly placed on RNA internal bases: adenosine becomes inosine. It does not alter an RNA end or substitute guanosine as the RNA reaction product; G appears only in the subsequent sequence representation.", "evidence": [{"source_id": "tribe::diagram:asset_5a95731ef4c3e1b7562777fc", "locator": "Cell-specific expression of fusion protein -> Binding site marked by I; an internal A is replaced by I", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.622, 0.03, 0.862, 0.95], "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00009] Introduction, ADAR mechanism", "basis": "text", "support": "reported", "quote": "Endogenous Drosophila ADAR is a modular enzyme consisting of two double-stranded RNA-binding domains (dsRBDs) as well as a catalytic domain, which deaminates adenosine to inosine (Bass and Weintraub, 1988, Keegan et al., 2004). Inosine is recognized as guanosine both in vitro and in vivo.", "bbox": null, "rationale": null}]}, {"target": "state_property:edited_cellular_rna:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity describes cellular RNA containing fusion-marked transcripts, consistent with the diagram and primary mechanism. It does not rename the material as a binding-site dataset or assert that the entire cellular RNA population was selectively purified.", "evidence": [{"source_id": "tribe::diagram:asset_5a95731ef4c3e1b7562777fc", "locator": "Cell-specific expression of fusion protein -> Binding site marked by I; an internal A is replaced by I", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.622, 0.03, 0.862, 0.95], "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00009] Introduction, ADAR mechanism", "basis": "text", "support": "reported", "quote": "Endogenous Drosophila ADAR is a modular enzyme consisting of two double-stranded RNA-binding domains (dsRBDs) as well as a catalytic domain, which deaminates adenosine to inosine (Bass and Weintraub, 1988, Keegan et al., 2004). Inosine is recognized as guanosine both in vitro and in vivo.", "bbox": null, "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00009] Introduction, permanent editing mark and RNA recovery", "basis": "text", "support": "reported", "quote": "Importantly, the editing event is irreversible, marking the target RNA permanently after the interaction. No biochemistry is required, RNA is simply extracted from cells of interest and sequenced. Novel editing events define RNA targets, namely, transcripts that interacted with the fusion protein.", "bbox": null, "rationale": null}]}, {"target": "state_property:edited_cellular_rna:interaction_record", "verdict": "supported", "action": "accept", "rationale": "The attribution identifies internal RNA inosine as the physical carrier of evidence of prior fusion interaction. Transcript-level inference and the explicit limitation on exact contact coordinates follow the primary text, so the contact unit does not claim exact nucleotide contact mapping.", "evidence": [{"source_id": "tribe::paper:27040499", "locator": "[b00009] Introduction, permanent editing mark and RNA recovery", "basis": "text", "support": "reported", "quote": "Importantly, the editing event is irreversible, marking the target RNA permanently after the interaction. No biochemistry is required, RNA is simply extracted from cells of interest and sequenced. Novel editing events define RNA targets, namely, transcripts that interacted with the fusion protein.", "bbox": null, "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00019] Results, Hrp48-TRIBE edits compared with CLIP peaks", "basis": "text", "support": "reported", "quote": "This suggests that TRIBE usually edits near but not at the binding site, consistent with fusion of the editing moiety to the C-terminus of Hrp48. However, some more distant editing might be due to RNA flexibility and/or the dsRNA preference of the ADARcd (see Discussion).", "bbox": null, "rationale": null}, {"source_id": "tribe::diagram:asset_5a95731ef4c3e1b7562777fc", "locator": "Cell-specific expression of fusion protein -> Binding site marked by I; an internal A is replaced by I", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.622, 0.03, 0.862, 0.95], "rationale": null}]}, {"target": "state_property:fusion_construct:coding_architecture", "verdict": "supported", "action": "accept", "rationale": "The sequence-segment assertion belongs to the encoding construct: it specifies the RBP-ADAR catalytic-domain coding design and excludes native dsRNA-binding domains. Primary cloning and fusion-domain passages support this design rather than physical ligation of isolated proteins.", "evidence": [{"source_id": "tribe::paper:27040499", "locator": "[b00069] Experimental Procedures / Fly lines, construct generation", "basis": "text", "support": "reported", "quote": "TRIBE flies were generated by cloning the RBP-ADARcd-V5 transgene into a modified pJFRC7-20x UAS construct (RBP in locus of removed mCD8-GFP, Addgene #26220), which was injected by BestGene (Chino Hills, CA).", "bbox": null, "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00011] Results, fusion architecture and in vivo editing", "basis": "text", "support": "reported", "quote": "Because the double stranded RNA-binding (dsRBD) regions of ADAR are missing from the fusion protein, its editing specificity is determined by the RNA recognition features of the RBP; target transcripts are edited in vivo and then identified by RNA sequencing (Figure 1).", "bbox": null, "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00169] Figure 1 caption, panels B-C", "basis": "text", "support": "reported", "quote": "B) Native Drosophila ADAR is composed of two double stranded RNA-binding domains (dsRBDs) that mediates its target specificity, and a deaminase domain that catalyzes adenosine to inosine conversion. C) The dsRBDs of ADAR are replaced with the RBP of interest.", "bbox": null, "rationale": null}]}, {"target": "state_property:fusion_construct:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity correctly names a genetic construct encoding the RBP-Drosophila-ADARcd fusion under the primary-supported correction. The cloning passage establishes the material form; the next operation uses it for expression.", "evidence": [{"source_id": "tribe::paper:27040499", "locator": "[b00069] Experimental Procedures / Fly lines, construct generation", "basis": "text", "support": "reported", "quote": "TRIBE flies were generated by cloning the RBP-ADARcd-V5 transgene into a modified pJFRC7-20x UAS construct (RBP in locus of removed mCD8-GFP, Addgene #26220), which was injected by BestGene (Chino Hills, CA).", "bbox": null, "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00069] Experimental Procedures / Fly lines, cell-specific expression", "basis": "text", "support": "reported", "quote": "UAS-RBP-ADARcd-V5; UAS-eGFP flies (Bloomington stock center #1522) were crossed to a range of driver lines (pdf-Gal4, TH-Gal4, elav-gsg-Gal4, Cha-Gal4, GAD-Gal4) to achieve cell-type specific expression of the fusion protein.", "bbox": null, "rationale": null}]}, {"target": "state_property:rna_fusion_complexes:binding", "verdict": "supported", "action": "accept", "rationale": "The association is placed on the fusion component and names its RNA component partner, matching the protein-on-RNA depiction. bound_to records binding without introducing a covalent linkage, immunoprecipitation or unsupported enrichment.", "evidence": [{"source_id": "tribe::diagram:asset_5a95731ef4c3e1b7562777fc", "locator": "RNA -> Cell-specific expression of fusion protein; blue RBP and purple catalytic domain situated on the RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.495, 0.04, 0.735, 0.94], "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00011] Results, fusion architecture and in vivo editing", "basis": "text", "support": "reported", "quote": "Because the double stranded RNA-binding (dsRBD) regions of ADAR are missing from the fusion protein, its editing specificity is determined by the RNA recognition features of the RBP; target transcripts are edited in vivo and then identified by RNA sequencing (Figure 1).", "bbox": null, "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00169] Figure 1 caption, panels B-C", "basis": "text", "support": "reported", "quote": "B) Native Drosophila ADAR is composed of two double stranded RNA-binding domains (dsRBDs) that mediates its target specificity, and a deaminase domain that catalyzes adenosine to inosine conversion. C) The dsRBDs of ADAR are replaced with the RBP of interest.", "bbox": null, "rationale": null}]}, {"target": "state_property:rna_fusion_complexes:context", "verdict": "supported", "action": "accept", "rationale": "The whole complex-containing boundary remains in the selected living cell population, as supported by cell-specific expression and in vivo target engagement. The property does not claim an isolated complex fraction or a transfer to a capture support.", "evidence": [{"source_id": "tribe::diagram:asset_5a95731ef4c3e1b7562777fc", "locator": "RNA -> Cell-specific expression of fusion protein; blue RBP and purple catalytic domain situated on the RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.495, 0.04, 0.735, 0.94], "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00069] Experimental Procedures / Fly lines, cell-specific expression", "basis": "text", "support": "reported", "quote": "UAS-RBP-ADARcd-V5; UAS-eGFP flies (Bloomington stock center #1522) were crossed to a range of driver lines (pdf-Gal4, TH-Gal4, elav-gsg-Gal4, Cha-Gal4, GAD-Gal4) to achieve cell-type specific expression of the fusion protein.", "bbox": null, "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00011] Results, fusion architecture and in vivo editing", "basis": "text", "support": "reported", "quote": "Because the double stranded RNA-binding (dsRBD) regions of ADAR are missing from the fusion protein, its editing specificity is determined by the RNA recognition features of the RBP; target transcripts are edited in vivo and then identified by RNA sequencing (Figure 1).", "bbox": null, "rationale": null}]}, {"target": "state_property:rna_fusion_complexes:fusion_identity", "verdict": "supported", "action": "accept", "rationale": "The component identity correctly names the expressed RBP-Drosophila-ADAR catalytic-domain protein and omits the native ADAR dsRNA-binding domains. This matches the encoding-construct input history, domain cartoon and primary fusion design.", "evidence": [{"source_id": "tribe::paper:27040499", "locator": "[b00169] Figure 1 caption, panels B-C", "basis": "text", "support": "reported", "quote": "B) Native Drosophila ADAR is composed of two double stranded RNA-binding domains (dsRBDs) that mediates its target specificity, and a deaminase domain that catalyzes adenosine to inosine conversion. C) The dsRBDs of ADAR are replaced with the RBP of interest.", "bbox": null, "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00011] Results, fusion architecture and in vivo editing", "basis": "text", "support": "reported", "quote": "Because the double stranded RNA-binding (dsRBD) regions of ADAR are missing from the fusion protein, its editing specificity is determined by the RNA recognition features of the RBP; target transcripts are edited in vivo and then identified by RNA sequencing (Figure 1).", "bbox": null, "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00069] Experimental Procedures / Fly lines, cell-specific expression", "basis": "text", "support": "reported", "quote": "UAS-RBP-ADARcd-V5; UAS-eGFP flies (Bloomington stock center #1522) were crossed to a range of driver lines (pdf-Gal4, TH-Gal4, elav-gsg-Gal4, Cha-Gal4, GAD-Gal4) to achieve cell-type specific expression of the fusion protein.", "bbox": null, "rationale": null}]}, {"target": "state_property:rna_fusion_complexes:identity", "verdict": "supported", "action": "accept", "rationale": "The self identity correctly describes in vivo RNA engagement by the cell-specifically expressed fusion. Its explicit molecular-boundary wording is consistent with the image and primary implementation, and avoids asserting a purified or enriched RNA fraction.", "evidence": [{"source_id": "tribe::diagram:asset_5a95731ef4c3e1b7562777fc", "locator": "RNA -> Cell-specific expression of fusion protein; blue RBP and purple catalytic domain situated on the RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.495, 0.04, 0.735, 0.94], "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00011] Results, fusion architecture and in vivo editing", "basis": "text", "support": "reported", "quote": "Because the double stranded RNA-binding (dsRBD) regions of ADAR are missing from the fusion protein, its editing specificity is determined by the RNA recognition features of the RBP; target transcripts are edited in vivo and then identified by RNA sequencing (Figure 1).", "bbox": null, "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00069] Experimental Procedures / Fly lines, cell-specific expression", "basis": "text", "support": "reported", "quote": "UAS-RBP-ADARcd-V5; UAS-eGFP flies (Bloomington stock center #1522) were crossed to a range of driver lines (pdf-Gal4, TH-Gal4, elav-gsg-Gal4, Cha-Gal4, GAD-Gal4) to achieve cell-type specific expression of the fusion protein.", "bbox": null, "rationale": null}]}, {"target": "state_property:rna_fusion_complexes:rna_identity", "verdict": "supported", "action": "accept", "rationale": "The RNA component is cellular RNA engaged by the fusion RBP. This agrees with the cellular_rna input and the primary RNA-recognition explanation, and keeps the RNA substrate distinct from the fusion-encoding construct and protein catalyst.", "evidence": [{"source_id": "tribe::diagram:asset_5a95731ef4c3e1b7562777fc", "locator": "RNA -> Cell-specific expression of fusion protein; blue RBP and purple catalytic domain situated on the RNA", "basis": "image", "support": "depicted", "quote": null, "bbox": [0.495, 0.04, 0.735, 0.94], "rationale": null}, {"source_id": "tribe::paper:27040499", "locator": "[b00011] Results, fusion architecture and in vivo editing", "basis": "text", "support": "reported", "quote": "Because the double stranded RNA-binding (dsRBD) regions of ADAR are missing from the fusion protein, its editing specificity is determined by the RNA recognition features of the RBP; target transcripts are edited in vivo and then identified by RNA sequencing (Figure 1).", "bbox": null, "rationale": null}]}]}, "sources": {"tribe::card:tribe": {"kind": "text", "content_level": "catalogue", "url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/tribe.html", "title": "TRIBE", "text_characters": 2453, "text_sha256": "79d3eb5e005d7abcf02ffd098247ff9032b9e746865549e908a34dbed9bdac8a"}, "tribe::collection:rna:page:65": {"kind": "text", "content_level": "catalogue", "path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102/sources_03/collection_pages/rna_065.txt", "sha256": "03702a66bd7750e8b5937623bdc586265982256ee670549110a14b1ba84e3810", "title": "Illumina RNA collection, PDF page 65", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/products/research_reviews/rna-sequencing-methods-review-web.pdf", "association_status": "candidate_secondary_catalogue_page; verify target and scope before use", "original": {"source_id": "collection:rna:page:65", "content_level": "catalogue", "title": "Illumina RNA collection, PDF page 65", "url": "https://www.illumina.com/content/dam/illumina-marketing/documents/products/research_reviews/rna-sequencing-methods-review-web.pdf", "text_path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_extraction_20261102/sources_03/collection_pages/rna_065.txt", "text_sha256": "03702a66bd7750e8b5937623bdc586265982256ee670549110a14b1ba84e3810", "original_pdf": {"path": "/scratch/groups/xiaojie/mstojkov/agents_snRNA/technology_atlas/v2/work/illumina_full_20261031/sources_06/imports/8a/8a333cee2159153c1dd49bffe3a5ec2e3ee143670f63c903793f2430a793b2ae.pdf", "sha256": "8a333cee2159153c1dd49bffe3a5ec2e3ee14 ttps://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/tribe.html", "source_url": "https://www.illumina.com/content/illumina-marketing/amr/en_US/science/sequencing-method-explorer/kits-and-arrays/tribe.1.2.3.4.5..json?getLatest=true", "explorer_url": "https://www.illumina.com/science/sequencing-method-explorer.html", "retrieved_at_utc": "2026-09-30T00:14:28.590212+00:00", "source_category": "Transcriptome > RNA-Protein Interactions", "source_category_path": ["Transcriptome", "RNA-Protein Interactions"], "description_verbatim": "TRIBE identifies the target RNA sequences of RBPs in vivo by modifying the RNA sequence using fusion proteins. The fusion protein consists of the RBP of interest, which binds to the target RNA, and the catalytic domain of adenosine deaminase acting on RNA (ADAR), which irreversibly modifies the proximal adenosine to inosine to serve as a marker during sequence analysis.\nFirst, fusion proteins with the RBP of interest are cloned into the animal model and expressed along with fluorescent marker proteins. After activating the expression of the fusion proteins, mRNA from the cells of interest are isolated using oligo(dT) beads. mRNAs are reverse-transcribed using poly(dT)-T7 primers and random-T7 primers to reduce 3' bias. The nascent cDNA strands are input into the TruSeq RNA Library Prep Kit to generate the cDNA library for sequencing.", "advantages_verbatim": ["In vivo identification of RNA targets of RBPs in specific cell types", "Not restricted to the specificity of antibodies", "Can be performed in a small number of specific cells"], "limitations_verbatim": ["Requires assembly of fusion proteins", "Requires an adenosine proximal to the RBP binding site", "Catalytic domain of ADAR has a strong preference for double-stranded RNA"], "source_sections": [{"source_locator": "jcr:content/par/text/text", "text": "TRIBE"}, {"source_locator": "jcr:content/par/text_0/text", "text": ""}, {"source_locator": "jcr:content/par/text_1/text", "text": "TRIBE identifies the target RNA sequences of RBPs in vivo by modifying the RNA sequence using fusion proteins. The fusion protein consists of the RBP of interest, which binds to the target RNA, and the catalytic domain of adenosine deaminase acting on RNA (ADAR), which irreversibly modifies the proximal adenosine to inosine to serve as a marker during sequence analysis.\nFirst, fusion proteins with the RBP of interest are cloned into the animal model and expressed along with fluorescent marker proteins. After activating the expression of the fusion proteins, mRNA from the cells of interest are isolated using oligo(dT) beads. mRNAs are reverse-transcribed using poly(dT)-T7 primers and random-T7 primers to reduce 3' bias. The nascent cDNA strands are input into the TruSeq RNA Library Prep Kit to generate the cDNA library for sequencing.\nPros:\nIn vivo identification of RNA targets of RBPs in specific cell types\nNot restricted to the specificity of antibodies\nCan be performed in a small number of specific cells\nCons:\nRequires assembly of fusion proteins\nRequires an adenosine proximal to the RBP binding site\nCatalytic domain of ADAR has a strong preference for double-stranded RNA"}, {"source_locator": "jcr:content/par/text_2/text", "text": "TRIBE: McMahon A. C., Rahman R., Jin H., Shen J. L., Fieldsend A., et al. (2016) TRIBE: Hijacking an RNA-Editing Enzyme to Identify Cell-Specific Targets of RNA-Binding Proteins. Cell 165: 742-753"}, {"source_locator": "jcr:content/par/text_3/text", "text": "TruSeq RNA Library Preparation Kit v2"}, {"source_locator": "jcr:content/par/text_4/text", "text": "McMahon A. C., Rahman R., Jin H., et al. TRIBE: Hijacking an RNA-Editing Enzyme to Identify Cell-Specific Targets of RNA-Binding Proteins. Cell. 2016;165:742-753"}], "cms_modified_at_not_invention_date": "Fri Feb 07 2020 16:05:44 GMT+0000", "curation_status": "source_extracted_only", "missing_evidence": ["Canonical method d const labels = {supported:'Supported', research_needed:'Further research', failed:'Failed', integrity_error:'Rejected on revalidation'};
const batchLabel = b => ({initial_two:'Catalogue card', catalogue:'Catalogue card', posters:'Main poster row', footer_panels:'Footer / product / readout panel', scoped_method:'Scoped workflow'})[b] || b;
let inventory = [], selected = '', request = 0;
function link(text, url) { const a = el('a',text); if (/^https?:\/\//.test(url || '')) { a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; } return a; }
function section(parent, title) { const d = el('details',null,'section'); d.append(el('summary',title)); parent.append(d); return d; }
function raw(parent, title, value) { const d = section(parent,title); d.append(el('pre',JSON.stringify(value,null,2))); }
function fields(parent, rows) { const d = el('div',null,'fields'); for (const [name,value] of rows) { if (value == null || value === '' || (Array.isArray(value) && !value.length)) continue; d.append(el('b',name),el('span',Array.isArray(value) ? value.join('; ') : String(value))); } parent.append(d); }
function assertions(parent,title,items,record) {
  if(!items?.length)return;
  const box=section(parent,title);
  for(const item of items){
    fields(box,Object.entries(item).filter(([k])=>k!=='evidence').map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):v]));
    evidence(box,item.evidence,record);
  }
}
function evidence(parent, items, record) {
  for (const e of items || []) {
    const box = el('div',null,'evidence'), s = record.sources[e.source_id] || {};
    box.append(link(s.title || e.source_id,s.url),el('p',`${e.support} · ${s.content_level || e.basis} · ${e.locator}`,'muted'));
    if (e.quote) box.append(el('blockquote',e.quote));
    if (e.bbox) box.append(el('p','Image region [left, top, right, bottom]: '+e.bbox.join(', '),'muted'));
    if (e.rationale) box.append(el('p',e.rationale));
    parent.append(box);
  }
}
function filterRecords() {
  const q = $('search').value.toLowerCase(), status = $('status').value, batch = $('batch').value;
  const found = inventory.filter(r => (status === 'all' || r.status === status) &&
    (batch === 'all' || (batch === 'catalogue' ? ['initial_two','catalogue'].includes(r.batch) : r.batch === batch)) &&
    [r.title,r.record_id,...r.method_names,...r.category].join(' ').toLowerCase().includes(q));
  $('count').textContent = found.length+' source depictions'; $('records').replaceChildren();
  for (const r of found) {
    const b = el('button',r.title,r.record_id === selected ? 'active' : '');
    b.append(el('small',batchLabel(r.batch)+' · '+labels[r.status]));
    b.type = 'button';
    b.setAttribute('aria-controls', 'detail');
    b.setAttribute('aria-pressed', String(r.record_id === selected));
    b.onclick = () => {
      // Load directly, including a second click on the current record. A hash
      // change alone neither retries that record nor reveals an offscreen panel.
      const hash = '#' + encodeURIComponent(r.record_id);
      try { if (location.hash !== hash) window.history.pushState(null, '', hash); } catch (_) { /* Navigation still works without URL access. */ }
      return openRecord(r.record_id, {reveal: true});
    };
    $('records').append(b);
  }
}
function inspect(parent, item, kind, record) {
  const c = record.candidate;
  item = (kind === 'Flow' ? c.flows : kind === 'State' ? c.states : c.operations).find(x => x.id === item.id) || item;
  parent.replaceChildren(el('span',kind,'badge'),el('h3',item.label || item.id));
  const states = new Map(c.states.map(s => [s.id,s]));
  const names = ids => (ids || []).map(id => (states.get(id)?.label || id)+' ['+id+']');
  if (kind === 'Operation') fields(parent,[['Description',item.description],['Input States',names(item.inputs)],['Output States',names(item.outputs)],['Mechanism',item.mechanism || 'Not specified'],['Information effect',item.information_effect || 'Not specified']]);
  if (kind === 'State') fields(parent,[['Kind',item.kind],['Features',item.features]]);
  if (kind === 'State') { assertions(parent,'State properties',item.properties,record); if(item.constituents?.length)raw(parent,'Named constituents',item.constituents); }
  if (kind === 'Operation') { assertions(parent,'Input roles',item.input_roles,record); assertions(parent,'Effects on input/output States',item.effects,record); }
  if (kind === 'Flow') {
    const nodes = [...c.states,...c.operations], name = id => nodes.find(n => n.id === id)?.label || id;
    fields(parent,[['Type',item.kind],['From',name(item.source)+' ['+item.source+']'],['To',name(item.target)+' ['+item.target+']']]);
  }
  fields(parent,[['Local ID',item.id]]);
  const target = kind.toLowerCase()+':'+item.id;
  const affected = c.corrections.filter(x=>x.target_id===target), unknowns = c.unknowns.filter(x=>x.affected_ids.includes(target));
  for (const x of affected) parent.append(el('p','Correction: '+x.primary_statement,'warning'));
  for (const x of unknowns) parent.append(el('p','Unknown: '+x.question,'warning'));
  parent.append(el('h3','Evidence for this record')); evidence(parent,item.evidence,record);
  const labelTarget = kind.toLowerCase()+'_label:'+item.id;
  const checks = record.review?.checks?.filter(x=>x.target===target || x.target===labelTarget) || [];
  if (kind !== 'Flow' && !checks.some(x=>x.target===labelTarget)) parent.append(el('p','This archived review did not separately assess the label. Corrections and features remain part of its interpretation.','muted'));
  if (checks.length) raw(parent,'Recorded review of this target',checks);
  raw(parent,'Exact JSON record',item);
}
function drawGraph(parent, inspector, record) {
  const c = record.candidate, nodes = [...c.states.map(x=>({...x,type:'State'})),...c.operations.map(x=>({...x,type:'Operation'}))];
  const ids = new Set(nodes.map(x=>x.id)), incoming = new Map(nodes.map(x=>[x.id,0])), next = new Map(nodes.map(x=>[x.id,[]]));
  for (const f of c.flows) { if (!ids.has(f.source)||!ids.has(f.target)) { parent.append(el('p','Cannot draw: a Flow endpoint is missing. Inspect the raw record.','warning')); return; } incoming.set(f.target,incoming.get(f.target)+1);next.get(f.source).push(f.target); }
  const rank = new Map(nodes.map(x=>[x.id,0])), ready = nodes.filter(x=>incoming.get(x.id)===0).map(x=>x.id); let processed=0;
  while (ready.length) { const id = ready.shift(); processed++;for (const target of next.get(id)) { rank.set(target,Math.max(rank.get(target),rank.get(id)+1)); incoming.set(target,incoming.get(target)-1);if (!incoming.get(target)) ready.push(target); } }
  if (processed !== nodes.length) { parent.append(el('p','A cycle prevents a left-to-right layout. Use the exact Flow records below.','warning'));return; }
  const NS='http://www.w3.org/2000/svg', svg=(tag,attrs,text)=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};
  const pos = new Map(), lanes = new Map();
  for (const n of nodes) { const col=rank.get(n.id),row=lanes.get(col)||0;lanes.set(col,row+1);pos.set(n.id,{x:25+col*224,y:25+row*112}); }
  const canvas=svg('svg',{width:Math.max(680,Math.max(...rank.values())*224+240),height:Math.max(150,Math.max(...lanes.values())*112+30),role:'img','aria-label':'Directed State and Operation workflow'});
  const defs=svg('defs',{}),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7692ac'}));defs.append(marker);canvas.append(defs);
  for (const f of c.flows) { const a=pos.get(f.source),b=pos.get(f.target),p=svg('path',{d:`M${a.x+180},${a.y+38} C${a.x+205},${a.y+38} ${b.x-25},${b.y+38} ${b.x},${b.y+38}`,stroke:'#7692ac','stroke-width':2,fill:'none','marker-end':'url(#arrow)',class:'flow',tabindex:0,'aria-label':f.kind+' '+f.source+' to '+f.target});p.append(svg('title',{},f.kind+' · click for evidence'));p.onclick=()=>inspect(inspector,f,'Flow',record);p.onkeydown=e=>{if(e.key==='Enter')p.onclick();};canvas.append(p); }
  for (const n of nodes) { const p=pos.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.type+': '+n.label});g.append(svg('rect',{x:p.x,y:p.y,width:180,height:78,rx:n.type==='State'?20:5,fill:n.type==='State'?'#203044':'#183e46',stroke:n.type==='State'?'#55799a':'#53a5ac'}));
    g.append(svg('text',{x:p.x+12,y:p.y+17,'font-size':10},n.type.toUpperCase()));
    const lines=['']; for (const word of n.label.split(/\s+/)) { let i=lines.length-1;if((lines[i]+' '+word).length>25&&lines[i])lines.push(word);else lines[i]+=(lines[i]?' ':'')+word; }
    lines.slice(0,3).forEach((line,i)=>g.append(svg('text',{x:p.x+12,y:p.y+34+i*15,'font-size':12},i===2&&lines.length>3?line+'…':line)));
    g.append(svg('title',{},n.label));g.onclick=()=>inspect(inspector,n,n.type,record);g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};canvas.append(g);
  }
  parent.append(canvas);
}
function renderRecord(r) {
  const root=$('detail');root.replaceChildren(el('span',labels[r.status],'badge'),el('span',batchLabel(r.batch),'badge'),el('h2',r.title));
  root.append(el('p',r.record_id,'muted'));
  if(r.status!=='supported') root.append(el('p','Diagnostic candidate only — excluded from supported retrieval. '+(r.reason||'Inspect the review and research questions for the unresolved outcome.'),'warning'));
  const links=el('div',null,'links'),download=el('a',r.download_label||'Download exact saved candidate + review');download.href=r.file;download.download='';links.append(download);
  if(r.card.source_page_url)links.append(link('Original Illumina page',r.card.source_page_url));root.append(links);
  const c=r.candidate;if(!c){root.append(el('p','No authored candidate was recovered.'));raw(root,'Failure record',r);return;}
  root.append(el('p',c.scope),el('p',`${c.operations.length} Operations · ${c.states.length} States · ${c.flows.length} Flows · ${c.corrections.length} Corrections · ${c.unknowns.length} Unknowns`,'muted'));
  root.append(el('h3','Workflow'),el('p','Rounded nodes are States (material or data). Rectangular nodes are Operations (transformations). Arrows are recorded Flows. Click any node or arrow to inspect its fields and evidence.','muted'));
  const graph=el('div',null,'graph'),inspector=el('div',null,'inspector');root.append(graph,inspector);drawGraph(graph,inspector,r);
  root.append(el('p','Only recorded connections are drawn. A multi-input Operation does not imply that every input molecule becomes every output. Horizontal position displays dependency, not elapsed time.','muted'));
  if(c.operations.length)inspect(inspector,c.operations[0],'Operation',r);
  const ops=section(root,'All Operations — select one to inspect');for(const op of c.operations){const b=el('button',op.label,'operation');b.onclick=()=>{inspect(inspector,op,'Operation',r);inspector.scrollIntoView({behavior:'smooth',block:'start'});};ops.append(b);}
  const scope=section(root,'Which named methods or variants does this depiction cover?');for(const s of c.method_scopes){scope.append(el('h3',s.method+' · '+s.status));fields(scope,[['Applies to Operations',s.operation_ids.map(id=>c.operations.find(o=>o.id===id)?.label||id)],['Reason',s.rationale]]);evidence(scope,s.evidence,r);}
  const corrections=section(root,'Corrections and unknowns');if(!c.corrections.length&&!c.unknowns.length)corrections.append(el('p','None recorded at the schematic level. This does not mean every laboratory execution detail is known.'));
  for(const x of c.corrections){corrections.append(el('h3',x.id+' · '+x.disposition));fields(corrections,[['Target',x.target_id],['Diagram observation',x.diagram_observation],['Primary statement',x.primary_statement]]);evidence(corrections,x.evidence,r);}
  for(const x of c.unknowns){corrections.append(el('h3',(x.blocking?'Blocking':'Nonblocking')+' unknown'));fields(corrections,[['Question',x.question],['Affected records',x.affected_ids]]);}
  const papers=section(root,'Paper associations ('+c.paper_matches.length+')');for(const m of c.paper_matches){const source=r.sources[m.source_id]||{};papers.append(el('h3',m.methods.join(', ')),link(source.title||m.source_id,source.url));fields(papers,[['Assessment',m.assessment],['Relationship',m.relationship],['Source content level',source.content_level]]);evidence(papers,m.evidence,r);}
  const review=section(root,'Independent model review and later admission decision');review.append(el('p','The review below is the original model assessment. Any later rejection shown above takes precedence.'));
  if(r.revalidation_finding)raw(review,'Later rejection',r.revalidation_finding);
  for(const check of r.review?.checks||[]){const d=section(review,check.target+' · '+check.verdict);d.append(el('p',check.rationale));evidence(d,check.evidence,r);}
  raw(root,'All exact State / Operation / Flow records',c);raw(root,'Audit flags and research questions',{flags:r.flags,errors:r.errors,research_questions:r.research_questions,attempt_directory:r.attempt_directory});
}
async function openRecord(id, {reveal = false} = {}) {
  const ticket = ++request;
  const row=inventory.find(r=>r.record_id===id);if(!row){$('detail').replaceChildren(el('p','No source record has this ID.'));return;}
  selected=id;filterRecords();$('detail').replaceChildren(el('p','Loading '+row.title+'…'));
  if (reveal) { $('detail').focus({preventScroll:true}); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  try{const response=await fetch(row.file,{cache:'no-store'});if(!response.ok)throw Error('Record could not be loaded (HTTP '+response.status+')');const r=await response.json();if(ticket===request)renderRecord(r);}catch(e){if(ticket===request)$('detail').replaceChildren(el('p','Could not display '+row.title+': '+e.message+'. Click the card to retry.','warning'));}
}
async function start(){
  const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory could not be loaded');const data=await response.json();inventory=data.records;
  const stats=[['Source depictions',data.manifest.source_occurrences],...Object.entries(data.manifest.counts).map(([k,v])=>[labels[k],v]),['Unique methods','Not consolidated']];
  for(const[label,value]of stats){const d=el('div',null,'stat');d.append(el('strong',value),el('span',label));$('summary').append(d);}
  if(data.manifest.comparison){$('pair').href=data.manifest.comparison.url;$('pair').hidden=false;}
  for(const id of ['search','status','batch'])$(id).addEventListener('input',filterRecords);
  window.addEventListener('hashchange',()=>openRecord(decodeURIComponent(location.hash.slice(1)), {reveal:true}));
  await openRecord(decodeURIComponent(location.hash.slice(1))||'drop-seq');
}
const standalone=document.getElementById('record-data');
if(standalone){renderRecord(JSON.parse(standalone.textContent));}
else start().catch(e=>{$('detail').replaceChildren(el('p','Could not open this review export. Serve its directory with python3 -m http.server. '+e.message,'warning'));});
</script></html>
