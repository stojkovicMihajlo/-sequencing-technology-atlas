[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sequencing-technology-atlas"
version = "0.1.0"
description = "Source-grounded protocol extraction and technology-graph research harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
semantic = [
    "fastembed>=0.9,<0.10",
]

[project.scripts]
atlas-extract = "genomics_discovery.curation.workflow_extraction.__main__:main"
atlas-match = "genomics_discovery.curation.workflow_matching.__main__:main"
atlas-graph = "genomics_discovery.curation.technology_graph.__main__:main"
atlas-concepts = "genomics_discovery.curation.operation_registry.__main__:main"
atlas-batch = "genomics_discovery.curation.extraction_batch.__main__:main"
atlas-sources = "genomics_discovery.curation.atlas_inventory:main"
atlas-publish = "genomics_discovery.curation.batch_graph:main"
atlas-deploy = "genomics_discovery.curation.deployment:main"
atlas-worklist = "genomics_discovery.curation.source_worklist:main"
atlas-progress = "genomics_discovery.curation.batch_report:main"
atlas-acquire = "genomics_discovery.curation.source_acquisition.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genomics_discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "src", "tests"]
