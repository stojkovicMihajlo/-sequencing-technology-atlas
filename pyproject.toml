[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sequencing-technology-atlas"
version = "0.1.0"
description = "Source-grounded protocol extraction and technology-graph research harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
diagrams = ["Pillow==12.0.0"]
semantic = [
    "fastembed>=0.9,<0.10",
]

[project.scripts]
atlas-pipeline = "genomics_discovery.execution.pipeline:main"
atlas-extract = "genomics_discovery.protocols.extraction.__main__:main"
atlas-match = "genomics_discovery.graphs.matching.__main__:main"
atlas-graph = "genomics_discovery.graphs.workflows.__main__:main"
atlas-concepts = "genomics_discovery.graphs.concepts.__main__:main"
atlas-batch = "genomics_discovery.execution.batch.__main__:main"
atlas-sources = "genomics_discovery.sources.inventory:main"
atlas-publish = "genomics_discovery.graphs.publication:main"
atlas-deploy = "genomics_discovery.execution.deployment:main"
atlas-worklist = "genomics_discovery.sources.worklist:main"
atlas-progress = "genomics_discovery.execution.progress:main"
atlas-acquire = "genomics_discovery.sources.acquisition.__main__:main"
atlas-diagrams = "genomics_discovery.illumina.extraction:main"
atlas-diagram-graph = "genomics_discovery.illumina.graph:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genomics_discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "src", "tests"]
